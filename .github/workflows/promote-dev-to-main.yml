name: Promote dev to main

on:
  workflow_run:
    workflows:
      - Quality
    types:
      - completed
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: autocarehub-promote-dev-to-main
  cancel-in-progress: false

jobs:
  promote:
    name: Promote verified dev
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout the CI-tested dev commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify the remote dev branch is unchanged
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          remote_sha="$(git ls-remote origin refs/heads/dev | awk '{print $1}')"
          test -n "$remote_sha"
          test "$remote_sha" = "$SOURCE_SHA"

      - name: Create or reuse the dev to main pull request
        id: promotion-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            pr_number="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head dev \
              --title "chore(release): promote verified dev to main" \
              --body "Automated promotion. The source commit passed the complete Quality workflow, including Application CI, before this pull request was created.")"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "Promoting PR #$pr_number."

      - name: Wait for pull-request CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion-pr.outputs.number }}
        run: gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --fail-fast

      - name: Enable merge after all required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion-pr.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch=false
