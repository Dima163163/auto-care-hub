name: Promote dev to main

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: autocarehub-promote-dev-to-main
  cancel-in-progress: true

jobs:
  promote:
    name: Promote verified dev
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Wait for the complete Quality workflow for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?branch=dev&per_page=100")"
            quality_run="$(printf '%s' "$run_json" | jq -r --arg sha "$SOURCE_SHA" '
              [.workflow_runs[] | select(.name == "Quality" and .head_sha == $sha)]
              | sort_by(.created_at)
              | last // empty
            ')"

            if [ -n "$quality_run" ]; then
              status="$(printf '%s' "$quality_run" | jq -r '.status')"
              conclusion="$(printf '%s' "$quality_run" | jq -r '.conclusion // ""')"
              run_id="$(printf '%s' "$quality_run" | jq -r '.id')"
              echo "Quality run $run_id: status=$status conclusion=${conclusion:-pending}"

              if [ "$status" = "completed" ]; then
                test "$conclusion" = "success"
                exit 0
              fi
            else
              echo "Waiting for Quality to start for $SOURCE_SHA (attempt $attempt/180)."
            fi

            sleep 10
          done

          echo "Timed out waiting for Quality for $SOURCE_SHA."
          exit 1

      - name: Checkout the CI-tested dev commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify the remote dev branch is unchanged
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          remote_sha="$(git ls-remote origin refs/heads/dev | awk '{print $1}')"
          test -n "$remote_sha"
          test "$remote_sha" = "$SOURCE_SHA"

      - name: Create or reuse the dev to main pull request
        id: promotion-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            echo "mode=pull-request" >> "$GITHUB_OUTPUT"
            echo "number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "Reusing promotion PR #$pr_number."
            exit 0
          fi

          if create_output="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head dev \
            --title "chore(release): promote verified dev to main" \
            --body "Automated promotion. The source commit passed the complete Quality workflow, including Application CI, before this pull request was created." 2>&1)"; then
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head dev --state open --json number --jq '.[0].number')"
            test -n "$pr_number"
            echo "mode=pull-request" >> "$GITHUB_OUTPUT"
            echo "number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "Created promotion PR #$pr_number."
            exit 0
          fi

          printf '%s\n' "$create_output"
          {
            echo "### Promotion fallback"
            echo "GitHub did not allow the workflow token to create the promotion PR."
            echo "The verified SHA will use the guarded fast-forward path instead."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "mode=direct" >> "$GITHUB_OUTPUT"

      - name: Fast-forward main after verified application CI
        if: ${{ steps.promotion-pr.outputs.mode == 'direct' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main dev --quiet
          main_sha="$(git rev-parse origin/main)"
          remote_dev_sha="$(git rev-parse origin/dev)"
          test "$remote_dev_sha" = "$SOURCE_SHA"
          test "$(git merge-base "$main_sha" "$SOURCE_SHA")" = "$main_sha"
          git push origin "$SOURCE_SHA:refs/heads/main"
          echo "Fast-forwarded main to the exact Quality-tested SHA $SOURCE_SHA."

      - name: Wait for pull-request CI to pass
        if: ${{ steps.promotion-pr.outputs.mode == 'pull-request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion-pr.outputs.number }}
        run: gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --fail-fast

      - name: Enable merge after all required checks pass
        if: ${{ steps.promotion-pr.outputs.mode == 'pull-request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.promotion-pr.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch=false
