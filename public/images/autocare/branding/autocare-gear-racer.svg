      <path d="m183 86 7 7-42 41-16-5 2-16Z" transform="rotate(135 128 131)"/>
      <path d="m183 86 7 7-42 41-16-5 2-16Z" transform="rotate(180 128 131)"/>
      <path d="m183 86 7 7-42 41-16-5 2-16Z" transform="rotate(225 128 131)"/>
