<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="autocare-racer-title autocare-racer-desc">
  <title id="autocare-racer-title">AutoCare Hub — спортивное купе и кованое колесо</title>
  <desc id="autocare-racer-desc">Техническая эмблема AutoCare Hub с матовой шиной, металлическим диском и силуэтом спортивного автомобиля.</desc>
  <defs>
    <radialGradient id="ground" cx="36%" cy="22%" r="92%">
      <stop stop-color="#18385d"/>
      <stop offset=".58" stop-color="#0a1b31"/>
      <stop offset="1" stop-color="#030914"/>
    </radialGradient>
    <linearGradient id="tire" x1="53" y1="33" x2="211" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a4a5b"/>
      <stop offset=".2" stop-color="#121b27"/>
      <stop offset=".55" stop-color="#02060d"/>
      <stop offset=".84" stop-color="#1a2634"/>
      <stop offset="1" stop-color="#050b14"/>
    </linearGradient>
    <radialGradient id="rim" cx="34%" cy="25%" r="78%">
      <stop stop-color="#dbe8ef"/>
      <stop offset=".28" stop-color="#8fa5b2"/>
      <stop offset=".58" stop-color="#425565"/>
      <stop offset=".83" stop-color="#111b27"/>
      <stop offset="1" stop-color="#050a12"/>
    </radialGradient>
    <linearGradient id="spoke" x1="114" y1="67" x2="145" y2="194" gradientUnits="userSpaceOnUse">
      <stop stop-color="#edf6fa"/>
      <stop offset=".25" stop-color="#9fb2be"/>
      <stop offset=".56" stop-color="#526474"/>
      <stop offset="1" stop-color="#1b2836"/>
    </linearGradient>
    <linearGradient id="paint" x1="60" y1="115" x2="207" y2="185" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8e6ed"/>
      <stop offset=".16" stop-color="#6d91a6"/>
      <stop offset=".42" stop-color="#1c5e91"/>
      <stop offset=".72" stop-color="#0b2949"/>
      <stop offset="1" stop-color="#061324"/>
    </linearGradient>
    <linearGradient id="glass" x1="101" y1="111" x2="170" y2="143" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9f2f5" stop-opacity=".9"/>
      <stop offset=".2" stop-color="#6d9fb5" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#173c5b" stop-opacity=".94"/>
      <stop offset="1" stop-color="#050d1b"/>
    </linearGradient>
    <linearGradient id="light" x1="179" y1="148" x2="208" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#aee9ff"/>
      <stop offset="1" stop-color="#2c99d5" stop-opacity=".1"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#01040a" flood-opacity=".68"/>
    </filter>
    <filter id="rimGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="123" fill="url(#ground)" stroke="#2b82bf" stroke-opacity=".38" stroke-width="2"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="#9bc5da" stroke-opacity=".12" stroke-width="1"/>

