      <path d="m183 86 7 7-42 41-16-5 2-16Z" transform="rotate(315 128 131)"/>
    </g>
    <circle cx="128" cy="131" r="27" fill="#111e2b" stroke="#c2d2da" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="128" cy="131" r="17" fill="url(#rim)" stroke="#e3edf2" stroke-opacity=".6" stroke-width="1.3"/>
    <circle cx="128" cy="131" r="6" fill="#102135" stroke="#d3e5ed" stroke-width="1"/>
    <path d="M128 116v9M128 137v9M113 131h9M134 131h9" stroke="#eef7fa" stroke-opacity=".58" stroke-width="1.5" stroke-linecap="round"/>

