      <path d="M47 169h173" fill="none" stroke="#020a14" stroke-width="3" stroke-linecap="round"/>
      <path d="M51 158h18M195 155h17" stroke="#c8eaf2" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M205 148c7 2 10 5 12 10h-17" fill="url(#light)" stroke="#b7f0ff" stroke-opacity=".8" stroke-width=".8"/>
      <path d="M48 151c5-2 11-3 17-3" stroke="#eef8fa" stroke-opacity=".82" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M69 174c14-4 34-5 52-4M157 170c20-1 36 0 52 3" fill="none" stroke="#5ea1bd" stroke-opacity=".48" stroke-width="1" stroke-linecap="round"/>
      <g>
        <circle cx="82" cy="171" r="17" fill="#03080f" stroke="#aebfc8" stroke-opacity=".85" stroke-width="1.6"/>
        <circle cx="82" cy="171" r="11.5" fill="url(#rim)" stroke="#e4eff2" stroke-opacity=".62" stroke-width="1"/>
        <circle cx="82" cy="171" r="4" fill="#15293c" stroke="#d9ebf1" stroke-width=".8"/>
        <path d="M82 160v22M71 171h22" stroke="#e9f4f5" stroke-opacity=".58" stroke-width=".8"/>
      </g>
      <g>
        <circle cx="190" cy="171" r="17" fill="#03080f" stroke="#aebfc8" stroke-opacity=".85" stroke-width="1.6"/>
        <circle cx="190" cy="171" r="11.5" fill="url(#rim)" stroke="#e4eff2" stroke-opacity=".62" stroke-width="1"/>
        <circle cx="190" cy="171" r="4" fill="#15293c" stroke="#d9ebf1" stroke-width=".8"/>
        <path d="M190 160v22M179 171h22" stroke="#e9f4f5" stroke-opacity=".58" stroke-width=".8"/>
      </g>
      <path d="M106 181h60M117 187h39" stroke="#86c1d5" stroke-opacity=".56" stroke-width="1.2" stroke-linecap="round"/>
    </g>
