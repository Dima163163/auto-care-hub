    <circle cx="128" cy="131" r="99" fill="url(#tire)" stroke="#566878" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="128" cy="131" r="91" fill="none" stroke="#01040a" stroke-width="8"/>
    <circle cx="128" cy="131" r="86" fill="none" stroke="#738696" stroke-opacity=".22" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
    <circle cx="128" cy="131" r="77" fill="url(#rim)" stroke="#d6e4ea" stroke-opacity=".58" stroke-width="1.5"/>

    <g fill="url(#spoke)" stroke="#e2edf1" stroke-opacity=".38" stroke-width=".8">
