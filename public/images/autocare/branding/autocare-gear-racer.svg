      <path d="M58 101a76 76 0 0 1 31-30" fill="none" stroke="#bdeeff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
      <path d="M184 196a77 77 0 0 1 19-24" fill="none" stroke="#328ac0" stroke-opacity=".65" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g>
      <path d="M42 173c4-11 14-18 29-21l26-4 20-28c6-8 15-13 25-14l22 1c12 1 23 7 30 16l14 19 19 5c7 2 12 8 12 16v10H42Z" fill="url(#paint)" stroke="#d7e8ee" stroke-opacity=".72" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M99 144 117 119c5-7 13-11 22-11h18c10 0 19 4 26 11l12 14-23-2h-69Z" fill="url(#glass)" stroke="#c5e4eb" stroke-opacity=".7" stroke-width="1" stroke-linejoin="round"/>
      <path d="M139 109v32M174 116l-12 27" fill="none" stroke="#d8f1f4" stroke-opacity=".42" stroke-width="1"/>
