  <path d="M45 61h30M181 54h24M32 205h40M185 211h26" fill="none" stroke="#6cc8ec" stroke-opacity=".38" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="42" cy="61" r="2" fill="#e4f8ff" opacity=".7"/>
  <circle cx="214" cy="54" r="2" fill="#64c7eb" opacity=".7"/>
</svg>
