    </g>
    <circle cx="128" cy="128" r="31" fill="#091a2b" stroke="#dbe9ed" stroke-opacity=".8" stroke-width="3"/>
    <circle cx="128" cy="128" r="10" fill="#116ed0" stroke="#bcefff" stroke-width="2"/>
    <path d="M128 40a88 88 0 0 1 73 39" fill="none" stroke="#4bbaff" stroke-width="6" stroke-linecap="round"/>
