<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">AutoCare Hub — crest wheel</title>
  <desc id="desc">Строгая круглая эмблема с полированным ободом, пятью спицами и тонким синим акцентом.</desc>
  <defs>
    <radialGradient id="field" cx="30%" cy="18%" r="84%"><stop stop-color="#193d61"/><stop offset=".52" stop-color="#0a2039"/><stop offset="1" stop-color="#020914"/></radialGradient>
    <linearGradient id="rim" x1="51" y1="43" x2="205" y2="214" gradientUnits="userSpaceOnUse"><stop stop-color="#f2f8f9"/><stop offset=".24" stop-color="#9aaeb8"/><stop offset=".62" stop-color="#3d5667"/><stop offset="1" stop-color="#112433"/></linearGradient>
    <filter id="shadow" x="-24%" y="-24%" width="148%" height="158%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".62"/></filter>
  </defs>
  <circle cx="128" cy="128" r="119" fill="url(#field)" stroke="#718995" stroke-opacity=".7" stroke-width="2"/>
