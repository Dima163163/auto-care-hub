<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="2401px" preserveAspectRatio="none" style="width:2090px;height:2401px;background:#FAFBFD;" version="1.1" viewBox="0 0 2090 2401" width="2090px" zoomAndPan="magnify"><title>Access / privacy &#8212; &#1087;&#1088;&#1086;&#1074;&#1077;&#1088;&#1103;&#1077;&#1084;&#1099;&#1077; &#1075;&#1088;&#1072;&#1085;&#1080;&#1094;&#1099; &#1074; &#1090;&#1077;&#1082;&#1091;&#1097;&#1077;&#1084; &#1082;&#1086;&#1076;&#1077;</title><defs/><g><rect fill="#FAFBFD" height="2401" style="stroke:none;stroke-width:1;" width="2090" x="0" y="0"/><g class="title" data-source-line="2"><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="403.6621" x="834.1689" y="23.1318">Access / privacy &#8212; &#1087;&#1088;&#1086;&#1074;&#1077;&#1088;&#1103;&#1077;&#1084;&#1099;&#1077; &#1075;&#1088;&#1072;&#1085;&#1080;&#1094;&#1099; &#1074; &#1090;&#1077;&#1082;&#1091;&#1097;&#1077;&#1084; &#1082;&#1086;&#1076;&#1077;</text></g><!--entity Input--><g class="entity" data-qualified-name="Input" data-source-line="4" id="ent0002"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="246.1416" x="208.3169" y="49.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="99.7217" x="218.3169" y="71.2925">Incoming request</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1416" x="218.3169" y="86.2412">body bounds / Origin / CSRF / rate limit</text></g><!--entity Auth--><g class="entity" data-qualified-name="Auth" data-source-line="5" id="ent0003"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="210.7598" x="225.8169" y="136.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="67.209" x="235.8169" y="158.2925">requireAuth</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="190.7598" x="235.8169" y="173.2412">current active user / bearer token</text></g><!--entity Resource--><g class="entity" data-qualified-name="Resource" data-source-line="6" id="ent0004"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="244.0088" x="209.3169" y="935.5986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159.6689" x="219.3169" y="957.7925">Resource resolved from DB</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="224.0088" x="219.3169" y="972.7412">request / thread / provider / attachment</text></g><!--entity Client--><g class="entity" data-qualified-name="Client" data-source-line="7" id="ent0005"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="176.8062" x="16.8169" y="1742.5986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="77.3081" x="26.8169" y="1764.7925">Client access</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="156.8062" x="26.8169" y="1779.7412">resource.clientId == user.id</text></g><!--entity Provider--><g class="entity" data-qualified-name="Provider" data-source-line="8" id="ent0006"><rect fill="#EAF1FB" height="64.8462" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="238.2324" x="212.3169" y="1735.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="92.479" x="222.3169" y="1757.2925">Provider access</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="186.7671" x="222.3169" y="1772.2412">active membership + permission</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="218.2324" x="222.3169" y="1787.1899">location scope / legacy owner fallback</text></g><!--entity Admin--><g class="entity" data-qualified-name="Admin" data-source-line="9" id="ent0007"><rect fill="#EAF1FB" height="64.8462" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="242.936" x="895.8169" y="1735.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.1563" x="905.8169" y="1757.2925">Privileged access</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.936" x="905.8169" y="1772.2412">role + exceptional reason / assignment</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="200.7637" x="905.8169" y="1787.1899">&#1079;&#1072;&#1074;&#1080;&#1089;&#1080;&#1090; &#1086;&#1090; &#1082;&#1086;&#1085;&#1082;&#1088;&#1077;&#1090;&#1085;&#1086;&#1075;&#1086; entrypoint</text></g><!--entity StepUp--><g class="entity" data-qualified-name="StepUp" data-source-line="10" id="ent0008"><rect fill="#EAF1FB" height="64.8462" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="267.127" x="490.8169" y="1953.5986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="74.4136" x="500.8169" y="1975.7925">MFA step-up</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="164.0298" x="500.8169" y="1990.7412">fresh session proof &lt;= 5 min</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="247.127" x="500.8169" y="2005.6899">privileged mutations + CSV + private reads</text></g><!--entity ChatWrite--><g class="entity" data-qualified-name="ChatWrite" data-source-line="11" id="ent0009"><rect fill="#EAF1FB" height="64.8462" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="228.8252" x="131.8169" y="1953.5986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="138.0107" x="141.8169" y="1975.7925">Shared chat write policy</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="208.8252" x="141.8169" y="1990.7412">private request: client / provider only</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="203.0615" x="141.8169" y="2005.6899">support / escalation: admin allowed</text></g><!--entity Result--><g class="entity" data-qualified-name="Result" data-source-line="12" id="ent0010"><rect fill="#EAF1FB" height="34.9487" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="209.2871" x="212.8169" y="2172.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="189.2871" x="222.8169" y="2194.2925">Use-case mutation / private DTO</text></g><!--entity Object--><g class="entity" data-qualified-name="Object" data-source-line="13" id="ent0011"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="236.0361" x="199.3169" y="2261.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="148.8589" x="209.3169" y="2283.2925">Authorized object delivery</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="216.0361" x="209.3169" y="2298.2412">private object key / short-lived access</text></g><!--entity Audit--><g class="entity" data-qualified-name="Audit" data-source-line="14" id="ent0012"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="279.8096" x="1312.3169" y="1961.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="127.1689" x="1322.3169" y="1983.2925">Audit / security events</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="259.8096" x="1322.3169" y="1998.2412">&#1073;&#1077;&#1079; private message bodies / raw credentials</text></g><g class="entity" data-qualified-name="GMN28" data-source-line="31" id="ent0029"><path d="M776.3169,1858.0986 L776.3169,1982.0986 L757.9721,1986.0986 L776.3169,1990.0986 L776.3169,2114.2271 A4,4 0 0 0 780.3169,2118.2271 L1290.4462,2118.2271 A4,4 0 0 0 1294.4462,2114.2271 L1294.4462,1864.0986 L1284.4462,1854.0986 L780.3169,1854.0986 A4,4 0 0 0 776.3169,1858.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1284.4462,1854.0986 L1284.4462,1862.0986 A2,2 0 0 0 1286.4462,1864.0986 L1294.4462,1864.0986 L1284.4462,1854.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4395" x="782.3169" y="1871.2925">Private admin dashboards, chat reports and privileged chat actions</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="176.3188" x="782.3169" y="1886.2412">plus other privileged mutations</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="107.6436" x="782.3169" y="1901.1899">require fresh MFA.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="497.1294" x="782.3169" y="1916.1387">Chat subject index, history, attachment and WebSocket access for admin/super-admin</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="408.9668" x="782.3169" y="1931.0874">require fresh MFA before content; WebSocket rechecks before delivery</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="237.7451" x="782.3169" y="1946.0361">and every 30 seconds during live access.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="399.5977" x="782.3169" y="1960.9849">Super-admin index lists support/escalation only; private request chats</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="354.085" x="782.3169" y="1975.9336">require per-thread audited access with an emergency reason.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="386.604" x="782.3169" y="1990.8823">Privileged index reads audit actor role and item count, not subjects.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="426.3403" x="782.3169" y="2005.8311">Admin private request chat requires an active assigned moderation report;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="416.9331" x="782.3169" y="2020.7798">provider membership cannot replace it. The request chat-thread shortcut</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="343.9668" x="782.3169" y="2035.7285">rejects admin and super-admin before returning the subject.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.9121" x="782.3169" y="2050.6772">Legacy request conversation, attachment and WebSocket also reject both</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="379.374" x="782.3169" y="2065.626">privileged roles; they use the audited chat route for private review.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.374" x="782.3169" y="2080.5747">Admin and super-admin service-request detail, repair timeline and owner</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1333" x="782.3169" y="2095.5234">request list require fresh MFA before private data.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.4087" x="782.3169" y="2110.4722">Other modules' sensitive reads and staging replay remain open.</text></g><g class="entity" data-qualified-name="GMN31" data-source-line="50" id="ent0032"><path d="M468.8169,1744.0986 L468.8169,1763.5986 L450.5493,1767.5986 L468.8169,1771.5986 L468.8169,1790.9448 A4,4 0 0 0 472.8169,1794.9448 L873.5507,1794.9448 A4,4 0 0 0 877.5507,1790.9448 L877.5507,1750.0986 L867.5507,1740.0986 L472.8169,1740.0986 A4,4 0 0 0 468.8169,1744.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M867.5507,1740.0986 L867.5507,1748.0986 A2,2 0 0 0 869.5507,1750.0986 L877.5507,1750.0986 L867.5507,1740.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="387.7339" x="474.8169" y="1757.2925">Workspace permission scopes &#1080;&#1084;&#1077;&#1102;&#1090; provider/location &#1089;&#1077;&#1084;&#1072;&#1085;&#1090;&#1080;&#1082;&#1091;.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="270.2515" x="474.8169" y="1772.2412">&#1043;&#1083;&#1086;&#1073;&#1072;&#1083;&#1100;&#1085;&#1099;&#1081; owner &#8212; &#1077;&#1097;&#1105; compatibility &#1088;&#1086;&#1083;&#1100;;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="328.7832" x="474.8169" y="1787.1899">&#1086;&#1076;&#1080;&#1085; frontend guard &#1085;&#1077; &#1103;&#1074;&#1083;&#1103;&#1077;&#1090;&#1089;&#1103; backend authorization.</text></g><g class="entity" data-qualified-name="GMN34" data-source-line="55" id="ent0035"><path d="M471.3169,227.0986 L471.3169,956.5986 L453.5971,960.5986 L471.3169,964.5986 L471.3169,1694.0742 A4,4 0 0 0 475.3169,1698.0742 L977.0229,1698.0742 A4,4 0 0 0 981.0229,1694.0742 L981.0229,233.0986 L971.0229,223.0986 L475.3169,223.0986 A4,4 0 0 0 471.3169,227.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M971.0229,223.0986 L971.0229,231.0986 A2,2 0 0 0 973.0229,233.0986 L981.0229,233.0986 L971.0229,223.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="406.0215" x="477.3169" y="240.2925">Privileged TOTP secret stored as row-bound AES-GCM by user UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="427.8066" x="477.3169" y="255.2412">recovery code hashes are one-use. Account deletion removes both tables.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="315.2437" x="477.3169" y="270.1899">&#1053;&#1086;&#1074;&#1099;&#1077; user/invitation email envelopes &#1089;&#1086;&#1076;&#1077;&#1088;&#1078;&#1072;&#1090; MAC</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="236.3677" x="477.3169" y="285.1387">&#1089; row ID, &#1072; invitation &#1090;&#1072;&#1082;&#1078;&#1077; &#1089; provider ID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="306.0649" x="477.3169" y="300.0874">afterLoad &#1089;&#1074;&#1077;&#1088;&#1103;&#1077;&#1090; MAC &#1080; email &#1089; HMAC blind index.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="318.9507" x="477.3169" y="315.0361">&#1041;ounded backfill &#1076;&#1086;&#1087;&#1080;&#1089;&#1099;&#1074;&#1072;&#1077;&#1090; MAC &#1089;&#1090;&#1072;&#1088;&#1099;&#1084; envelopes.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="308.6548" x="477.3169" y="329.9849">Strict flag &#1086;&#1090;&#1074;&#1077;&#1088;&#1075;&#1072;&#1077;&#1090; &#1086;&#1090;&#1089;&#1091;&#1090;&#1089;&#1090;&#1074;&#1080;&#1077; MAC &#1087;&#1086;&#1089;&#1083;&#1077; cutover;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="352.8789" x="477.3169" y="344.9336">&#1076;&#1086; &#1085;&#1077;&#1075;&#1086; downgrade &#1080; &#1080;&#1085;&#1099;&#1077; &#1087;&#1086;&#1083;&#1103; &#1086;&#1089;&#1090;&#1072;&#1074;&#1083;&#1103;&#1102;&#1090; U02 &#1086;&#1090;&#1082;&#1088;&#1099;&#1090;&#1099;&#1084;.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="344.957" x="477.3169" y="359.8823">&#1053;&#1086;&#1074;&#1099;&#1077; OAuth subjects &#1080;&#1084;&#1077;&#1102;&#1090; MAC &#1087;&#1086; identity/user UUID &#1080;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.3638" x="477.3169" y="374.8311">&#1087;&#1088;&#1086;&#1074;&#1072;&#1081;&#1076;&#1077;&#1088;&#1091;; &#1087;&#1086;&#1089;&#1083;&#1077; &#1095;&#1090;&#1077;&#1085;&#1080;&#1103; &#1089;&#1074;&#1077;&#1088;&#1103;&#1102;&#1090;&#1089;&#1103; &#1089; HMAC index.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.5122" x="477.3169" y="389.7798">Bounded backfill &#1076;&#1086;&#1087;&#1080;&#1089;&#1099;&#1074;&#1072;&#1077;&#1090; MAC &#1089;&#1090;&#1072;&#1088;&#1099;&#1084; subjects;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="342.6147" x="477.3169" y="404.7285">opt-in strict flag &#1086;&#1090;&#1074;&#1077;&#1088;&#1075;&#1072;&#1077;&#1090; &#1086;&#1090;&#1089;&#1091;&#1090;&#1089;&#1090;&#1074;&#1080;&#1077; MAC &#1087;&#1086;&#1089;&#1083;&#1077; cutover.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="422.0684" x="477.3169" y="419.6772">User avatar URL, community display name &#1080; preferred city &#1080;&#1084;&#1077;&#1102;&#1090; HMAC</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.0552" x="477.3169" y="434.626">&#1087;&#1086; user UUID; &#1095;&#1072;&#1089;&#1090;&#1080;&#1095;&#1085;&#1099;&#1077; &#1074;&#1099;&#1073;&#1086;&#1088;&#1082;&#1080; &#1074;&#1082;&#1083;&#1102;&#1095;&#1072;&#1102;&#1090; binding. Preferred city</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="s