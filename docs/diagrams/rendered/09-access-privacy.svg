3" textLength="270.251" font-family="Arial">Глобальный owner — ещё compatibility роль;</text><text x="464" y="362.19" fill="#000" font-size="13" textLength="328.783" font-family="Arial">один frontend guard не является backend authorization.</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="29"><path d="M983.5,433.099 L983.5,494.894 A4,4 0 0 0 987.5,498.894 L1385.758,498.894 A4,4 0 0 0 1389.758,494.894 L1389.758,439.099 L1379.758,429.099 L1139.037,429.099 L1054.264,375.309 L1131.037,429.099 L987.5,429.099 A4,4 0 0 0 983.5,433.099" style="stroke:#C8A552;stroke-width:0.5;" fill="#FFF7DE"/><path d="M1379.758,429.099 L1379.758,437.099 A2,2 0 0 0 1381.758,439.099 L1389.758,439.099 L1379.758,429.099" style="stroke:#C8A552;stroke-width:0.5;" fill="#FFF7DE"/><text x="989.5" y="446.292" fill="#000" font-size="13" textLength="365.663" font-family="Arial">Modern chat writer запрещает admin/superadmin private send.</text><text x="989.5" y="461.241" fill="#000" font-size="13" textLength="339.358" font-family="Arial">Legacy request participant guard пропускает SuperAdmin,</text><text x="989.5" y="476.19" fill="#000" font-size="13" textLength="313.987" font-family="Arial">поэтому request message write обходит этот запрет.</text><text x="989.5" y="491.139" fill="#000" font-size="13" textLength="385.258" font-family="Arial">Не переносить правила одного endpoint на другой по аналогии.</text></g><g class="entity" data-qualified-name="GMN26" id="ent0027" data-source-line="35"><path d="M100.5,644.099 L100.5,675.996 A4,4 0 0 0 104.5,679.996 L536.217,679.996 A4,4 0 0 0 540.217,675.996 L540.217,650.099 L530.217,640.099 L324.5,640.099 L320.5,603.101 L316.5,640.099 L104.5,640.099 A4,4 0 0 0 100.5,644.099" style="stroke:#C8A552;stroke-width:0.5;" fill="#FFF7DE"/><path d="M530.217,640.099 L530.217,648.099 A2,2 0 0 0 532.217,650.099 L540.217,650.099 L530.217,640.099" style="stroke:#C8A552;stroke-width:0.5;" fill="#FFF7DE"/><text x="106.5" y="657.292" fill="#0