5,1892.5986 L773.6982,1896.5986 L791.5,1900.5986 L791.5,1934.8423 A4,4 0 0 0 795.5,1938.8423 L1311.3931,1938.8423 A4,4 0 0 0 1315.3931,1934.8423 L1315.3931,1864.0986 L1305.3931,1854.0986 L795.5,1854.0986 A4,4 0 0 0 791.5,1858.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1305.3931,1854.0986 L1305.3931,1862.0986 A2,2 0 0 0 1307.3931,1864.0986 L1315.3931,1864.0986 L1305.3931,1854.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="502.8931" x="797.5" y="1871.2925">Private chat reports, history, attachment and WebSocket access for admin/super-admin</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="408.9668" x="797.5" y="1886.2412">require fresh MFA before content; WebSocket rechecks before delivery</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="237.7451" x="797.5" y="1901.1899">and every 30 seconds during live access.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.8105" x="797.5" y="1916.1387">Super-admin service-request detail also requires fresh MFA.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1777" x="797.5" y="1931.0874">Other sensitive reads and staging replay remain open.</text></g><g class="entity" data-qualified-name="GMN31" data-source-line="38" id="ent0032"><path d="M458,1744.0986 L458,1763.5986 L439.7324,1767.5986 L458,1771.5986 L458,1790.9448 A4,4 0 0 0 462,1794.9448 L862.7339,1794.9448 A4,4 0 0 0 866.7339,1790.9448 L866.7339,1750.0986 L856.7339,1740.0986 L462,1740.0986 A4,4 0 0 0 458,1744.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M856.7339,1740.0986 L856.7339,1748.0986 A2,2 0 0 0 858.7339,1750.0986 L866.7339,1750.0986 L856.7339,1740.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><