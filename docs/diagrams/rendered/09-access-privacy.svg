#1085;&#1080;&#1103; &#1089;&#1074;&#1077;&#1088;&#1103;&#1102;&#1090;&#1089;&#1103; &#1089; HMAC index.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.5122" x="466.5" y="389.7798">Bounded backfill &#1076;&#1086;&#1087;&#1080;&#1089;&#1099;&#1074;&#1072;&#1077;&#1090; MAC &#1089;&#1090;&#1072;&#1088;&#1099;&#1084; subjects;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="342.6147" x="466.5" y="404.7285">opt-in strict flag &#1086;&#1090;&#1074;&#1077;&#1088;&#1075;&#1072;&#1077;&#1090; &#1086;&#1090;&#1089;&#1091;&#1090;&#1089;&#1090;&#1074;&#1080;&#1077; MAC &#1087;&#1086;&#1089;&#1083;&#1077; cutover.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="422.0684" x="466.5" y="419.6772">User avatar URL, community display name &#1080; preferred city &#1080;&#1084;&#1077;&#1102;&#1090; HMAC</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.0552" x="466.5" y="434.626">&#1087;&#1086; user UUID; &#1095;&#1072;&#1089;&#1090;&#1080;&#1095;&#1085;&#1099;&#1077; &#1074;&#1099;&#1073;&#1086;&#1088;&#1082;&#1080; &#1074;&#1082;&#1083;&#1102;&#1095;&#1072;&#1102;&#1090; binding. Preferred city</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="379.5771" x="466.5" y="449.5747">&#1086;&#1073;&#1085;&#1086;&#1074;&#1083;&#1103;&#1077;&#1090;&#1089;&#1103; &#1087;&#1086;&#1076; row lock. Bounded backfill &#1080; opt-in strict reader.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="399.4897" x="466.5" y="464.5234">Client vehicle VIN/plate/internal number/image URL &#1080;&#1084;&#1077;&#1102;&#1090; HMAC &#1087;&#1086;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1758" x="466.5" y="479.4722">vehicle UUID &#1080; owner UUID; bounded backfill