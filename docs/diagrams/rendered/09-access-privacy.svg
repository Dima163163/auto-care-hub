<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="2610px" preserveAspectRatio="none" style="width:2123px;height:2610px;background:#FAFBFD;" version="1.1" viewBox="0 0 2123 2610" width="2123px" zoomAndPan="magnify"><title>Access / privacy &#8212; &#1087;&#1088;&#1086;&#1074;&#1077;&#1088;&#1103;&#1077;&#1084;&#1099;&#1077; &#1075;&#1088;&#1072;&#1085;&#1080;&#1094;&#1099; &#1074; &#1090;&#1077;&#1082;&#1091;&#1097;&#1077;&#1084; &#1082;&#1086;&#1076;&#1077;</title><defs/><g><rect fill="#FAFBFD" height="2610" style="stroke:none;stroke-width:1;" width="2123" x="0" y="0"/><g class="title" data-source-line="2"><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="403.6621" x="834.1689" y="23.1318">Access / privacy &#8212; &#1087;&#1088;&#1086;&#1074;&#1077;&#1088;&#1103;&#1077;&#1084;&#1099;&#1077; &#1075;&#1088;&#1072;&#1085;&#1080;&#1094;&#1099; &#1074; &#1090;&#1077;&#1082;&#1091;&#1097;&#1077;&#1084; &#1082;&#1086;&#1076;&#1077;</text></g><!--entity Input--><g class="entity" data-qualified-name="Input" data-source-line="4" id="ent0002"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="246.1416" x="241.026" y="49.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="99.7217" x="251.026" y="71.2925">Incoming request</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1416" x="251.026" y="86.2412">body bounds / Origin / CSRF / rate limit</text></g><!--entity Auth--><g class="entity" data-qualified-name="Auth" data-source-line="5" id="ent0003"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="210.7598" x="258.526" y="136.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="67.209" x="268.526" y="158.2925">requireAuth</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="190.7598" x="268.526" y="173.2412">current active user / bearer token</text></g><!--entity Resource--><g class="entity" data-qualified-name="Resource" data-source-line="6" id="ent0004"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="244.0088" x="242.026" y="935.5986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159.6689" x="252.026" y="957.7925">Resource resolved from DB</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="224.0088" x="252.026" y="972.7412">request / thread / provider / attachment</text></g><!--entity Client--><g class="entity" data-qualified-name="Client" data-source-line="7" id="ent0005"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="176.8062" x="49.526" y="1742.5986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="77.3081" x="59.526" y="1764.7925">Client access</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="156.8062" x="59.526" y="1779.7412">resource.clientId == user.id</text></g><!--entity Provider--><g class="entity" data-qualified-name="Provider" data-source-line="8" id="ent0006"><rect fill="#EAF1FB" height="64.8462" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="238.2324" x="245.026" y="1735.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="92.479" x="255.026" y="1757.2925">Provider access</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="186.7671" x="255.026" y="1772.2412">active membership + permission</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="218.2324" x="255.026" y="1787.1899">location scope / legacy owner fallback</text></g><!--entity Admin--><g class="entity" data-qualified-name="Admin" data-source-line="9" id="ent0007"><rect fill="#EAF1FB" height="64.8462" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="242.936" x="928.526" y="1735.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.1563" x="938.526" y="1757.2925">Privileged access</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.936" x="938.526" y="1772.2412">role + exceptional reason / assignment</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="200.7637" x="938.526" y="1787.1899">&#1079;&#1072;&#1074;&#1080;&#1089;&#1080;&#1090; &#1086;&#1090; &#1082;&#1086;&#1085;&#1082;&#1088;&#1077;&#1090;&#1085;&#1086;&#1075;&#1086; entrypoint</text></g><!--entity StepUp--><g class="entity" data-qualified-name="StepUp" data-source-line="10" id="ent0008"><rect fill="#EAF1FB" height="64.8462" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="267.127" x="523.526" y="2058.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="74.4136" x="533.526" y="2080.2925">MFA step-up</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="164.0298" x="533.526" y="2095.2412">fresh session proof &lt;= 5 min</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="247.127" x="533.526" y="2110.1899">privileged mutations + CSV + private reads</text></g><!--entity ChatWrite--><g class="entity" data-qualified-name="ChatWrite" data-source-line="11" id="ent0009"><rect fill="#EAF1FB" height="64.8462" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="228.8252" x="164.526" y="2058.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="138.0107" x="174.526" y="2080.2925">Shared chat write policy</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="208.8252" x="174.526" y="2095.2412">private request: client / provider only</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="203.0615" x="174.526" y="2110.1899">support / escalation: admin allowed</text></g><!--entity Result--><g class="entity" data-qualified-name="Result" data-source-line="12" id="ent0010"><rect fill="#EAF1FB" height="34.9487" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="209.2871" x="245.526" y="2381.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="189.2871" x="255.526" y="2403.2925">Use-case mutation / private DTO</text></g><!--entity Object--><g class="entity" data-qualified-name="Object" data-source-line="13" id="ent0011"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="236.0361" x="232.026" y="2470.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="148.8589" x="242.026" y="2492.2925">Authorized object delivery</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="216.0361" x="242.026" y="2507.2412">private object key / short-lived access</text></g><!--entity Audit--><g class="entity" data-qualified-name="Audit" data-source-line="14" id="ent0012"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="279.8096" x="1345.026" y="2065.5986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="127.1689" x="1355.026" y="2087.7925">Audit / security events</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="259.8096" x="1355.026" y="2102.7412">&#1073;&#1077;&#1079; private message bodies / raw credentials</text></g><g class="entity" data-qualified-name="GMN28" data-source-line="31" id="ent0029"><path d="M809.026,1858.0986 L809.026,2086.5986 L790.6813,2090.5986 L809.026,2094.5986 L809.026,2323.5093 A4,4 0 0 0 813.026,2327.5093 L1323.1554,2327.5093 A4,4 0 0 0 1327.1554,2323.5093 L1327.1554,1864.0986 L1317.1554,1854.0986 L813.026,1854.0986 A4,4 0 0 0 809.026,1858.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1317.1554,1854.0986 L1317.1554,1862.0986 A2,2 0 0 0 1319.1554,1864.0986 L1327.1554,1864.0986 L1317.1554,1854.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4395" x="815.026" y="1871.2925">Private admin dashboards, chat reports and privileged chat actions</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="176.3188" x="815.026" y="1886.2412">plus other privileged mutations</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="107.6436" x="815.026" y="1901.1899">require fresh MFA.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="497.1294" x="815.026" y="1916.1387">Chat subject index, history, attachment and WebSocket access for admin/super-admin</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="408.9668" x="815.026" y="1931.0874">require fresh MFA before content; WebSocket rechecks before delivery</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="237.7451" x="815.026" y="1946.0361">and every 30 seconds during live access.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="399.5977" x="815.026" y="1960.9849">Super-admin index lists support/escalation only; private request chats</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="354.085" x="815.026" y="1975.9336">require per-thread audited access with an emergency reason.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="386.604" x="815.026" y="1990.8823">Privileged index reads audit actor role and item count, not subjects.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="426.3403" x="815.026" y="2005.8311">Admin private request chat requires an active assigned moderation report;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="416.9331" x="815.026" y="2020.7798">provider membership cannot replace it. The request chat-thread shortcut</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="343.9668" x="815.026" y="2035.7285">rejects admin and super-admin before returning the subject.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.9121" x="815.026" y="2050.6772">Legacy request conversation, attachment and WebSocket also reject both</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="379.374" x="815.026" y="2065.626">privileged roles; they use the audited chat route for private review.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.374" x="815.026" y="2080.5747">Admin and super-admin service-request detail, repair timeline and owner</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1333" x="815.026" y="2095.5234">request list require fresh MFA before private data.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="400.334" x="815.026" y="2110.4722">Broadcast detail and provider inbox require it for both privileged roles.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="447.9668" x="815.026" y="2125.4209">Internal provider workspace GET routes also require fresh MFA for both roles.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="404.6313" x="815.026" y="2140.3696">Provider workspace mutations also require it before validation or write.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7368" x="815.026" y="2155.3184">Service/broadcast request transitions require it for privileged actors.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="448.7666" x="815.026" y="2170.2671">Catalog gap reviewer cannot decide own proposal under the request row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="460.3511" x="815.026" y="2185.2158">Provider change reviewer cannot decide a request authored before role change.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.9058" x="815.026" y="2200.1646">Appeal reviewer cannot decide own appeal or revoke own chat restriction.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="815.026" y="2215.1133">Participant block DELETE is limited to its blocker; a moderation</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="389.543" x="815.026" y="2230.062">restriction can only be revoked by an accepted independent appeal.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.3403" x="815.026" y="2245.0107">A party of any historical chat report cannot be assigned moderator, read</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.353" x="815.026" y="2259.9595">the private thread as admin, extend access or decide another case after</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="456.7075" x="815.026" y="2274.9082">role change. Admin and super-admin report indexes exclude conflicted threads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="406.123" x="815.026" y="2289.8569">Assignment and decision scan all thread reports under the thread lock;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="356.2241" x="815.026" y="2304.8057">only pending reports can grant time-limited moderator access.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.4087" x="815.026" y="2319.7544">Other modules' sensitive reads and staging replay remain open.</text></g><g class="entity" data-qualified-name="GMN31" data-source-line="64" id="ent0032"><path d="M501.526,1744.0986 L501.526,1763.5986 L483.2585,1767.5986 L501.526,1771.5986 L501.526,1790.9448 A4,4 0 0 0 505.526,1794.9448 L906.2599,1794.9448 A4,4 0 0 0 910.2599,1790.9448 L910.2599,1750.0986 L900.2599,1740.0986 L505.526,1740.0986 A4,4 0 0 0 501.526,1744.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M900.2599,1740.0986 L900.2599,1748.0986 A2,2 0 0 0 902.2599,1750.0986 L910.2599,1750.0986 L900.2599,1740.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="387.7339" x="507.526" y="1757.2925">Workspace permission scopes &#1080;&#1084;&#1077;&#1102;&#1090; provider/location &#1089;&#1077;&#1084;&#1072;&#1085;&#1090;&#1080;&#1082;&#1091;.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="270.2515" x="507.526" y="1772.2412">&#1043;&#1083;&#1086;&#1073;&#1072;&#1083;&#1100;&#1085;&#1099;&#1081; owner &#8212; &#1077;&#1097;&#1105; compatibility &#1088;&#1086;&#1083;&#1100;;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="328.7832" x="507.526" y="1787.1899">&#1086;&#1076;&#1080;&#1085; frontend guard &#1085;&#1077; &#1103;&#1074;&#1083;&#1103;&#1077;&#1090;&#1089;&#1103; backend authorization.</text></g><g class="entity" data-qualified-name="GMN34" data-source-line="69" id="ent0035"><path d="M504.026,227.0986 L504.026,956.5986 L486.3063,960.5986 L504.026,964.5986 L504.026,1694.0742 A4,4 0 0 0 508.026,1698.0742 L1009.7321,1698.0742 A4,4 0 0 0 1013.7321,1694.0742 L1013.7321,233.0986 L1003.7321,223.0986 L508.026,223.0986 A4,4 0 0 0 504.026,227.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1003.7321,223.0986 L1003.7321,231.0986 A2,2 0 0 0 1005.7321,233.0986 L1013.7321,233.0986 L1003.7321,223.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="406.0215" x="510.026" y="240.2925">Privileged TOTP secret stored as row-bound AES-GCM by user UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="427.8066" x="510.026" y="255.2412">recovery code hashes are one-use. Account deletion removes both tables.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="315.2437" x="510.026" y="270.1899">&#1053;&#1086;&#1074;&#1099;&#1077; user/invitation email envelopes &#1089;&#1086;&#1076;&#1077;&#1088;&#1078;&#1072;&#1090; MAC</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="236.3677" x="510.026" y="285.1387">&#1089; row ID, &#1072; invitation &#1090;&#1072;&#1082;&#1078;&#1077; &#1089; provider ID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="306.0649" x="510.026" y="300.0874">afterLoad &#1089;&#1074;&#1077;&#1088;&#1103;&#1077;&#1090; MAC &#1080; email &#1089; HMAC blind index.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="318.9507" x="5