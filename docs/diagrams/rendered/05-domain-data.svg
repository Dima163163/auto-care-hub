"#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="146.7134" x="793" y="2323.2925">name : autocare_appeals</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="793" y="2338.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="793" y="2353.1899">processed : bigint</text></g><!--class CatalogGapCheckpoint--><g class="entity" data-qualified-name="CatalogGapCheckpoint" data-source-line="305" id="ent0053"><rect fill="#F1F1F1" height="82.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="254.106" x="736.5" y="2502.0986"/><ellipse cx="771.3444" cy="2517.0986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M773.8141,2521.5986 L767.9108,2521.5986 L767.9108,2512.1216 L773.8141,2512.1216 L773.8141,2513.772 L769.7833,2513.772 L769.7833,2515.8159 L773.4332,2515.8159 L773.4332,2517.4663 L769.7833,2517.4663 L769.7833,2519.9482 L773.8141,2519.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="177.7852" x="788.9764" y="2521.8181">CatalogGapBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="737.5" x2="989.606" y1="2532.0986" y2="2532.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="747.5" cy="2545.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.106" x="755.5" y="2548.2925">name : autocare_catalog_gap_requests</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="755.5" y="2563.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="755.5" y="2578.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN110" data-source-line="367" id="ent0111"><path d="M1922.5,2047.5986 L1922.5,2109.3936 A4,4 0 0 0 1926.5,2113.3936 L2251.6523,2113.3936 A4,4 0 0 0 2255.6523,2109.3936 L2255.6523,2053.5986 L2245.6523,2043.5986 L2093,2043.5986 L2089,2025.7559 L2085,2043.5986 L1926.5,2043.5986 A4,4 0 0 0 1922.5,2047.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2245.6523,2043.5986 L2245.6523,2051.5986 A2,2 0 0 0 2247.6523,2053.5986 L2255.6523,2053.5986 L2245.6523,2043.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1928.5" y="2060.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1928.5" y="2075.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1928.5" y="2090.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1928.5" y="2105.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN113" data-source-line="373" id="ent0114"><path d="M3238.5,1417.5986 L3238.5,1479.3936 A4,4 0 0 0 3242.5,1483.3936 L3512.7642,1483.3936 A4,4 0 0 0 3516.7642,1479.3936 L3516.7642,1423.5986 L3506.7642,1413.5986 L3381.5,1413.5986 L3377.5,1395.7559 L3373.5,1413.5986 L3242.5,1413.5986 A4,4 0 0 0 3238.5,1417.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3506.7642,1413.5986 L3506.7642,1421.5986 A2,2 0 0 0 3508.7642,1423.5986 L3516.7642,1423.5986 L3506.7642,1413.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3244.5" y="1430.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3244.5" y="1445.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3244.5" y="1460.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3244.5" y="1475.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN116" data-source-line="379" id="ent0117"><path d="M696,1895.0986 L696,1941.9448 A4,4 0 0 0 700,1945.9448 L1026.5869,1945.9448 A4,4 0 0 0 1030.5869,1941.9448 L1030.5869,1901.0986 L1020.5869,1891.0986 L867.5,1891.0986 L863.5,1872.6627 L859.5,1891.0986 L700,1891.0986 A4,4 0 0 0 696,1895.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1020.5869,1891.0986 L1020.5869,1899.0986 A2,2 0 0 0 1022.5869,1901.0986 L1030.5869,1901.0986 L1020.5869,1891.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="702" y="1908.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="702" y="1923.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="702" y="1938.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN119" data-source-line="384" id="ent0120"><path d="M3885,1753.0986 L3885,1799.9448 A4,4 0 0 0 3889,1803.9448 L4131.0806,1803.9448 A4,4 0 0 0 4135.0806,1799.9448 L4135.0806,1759.0986 L4125.0806,1749.0986 L4014,1749.0986 L4010,1731.3133 L4006,1749.0986 L3889,1749.0986 A4,4 0 0 0 3885,1753.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4125.0806,1749.0986 L4125.0806,1757.0986 A2,2 0 0 0 4127.0806,1759.0986 L4135.0806,1759.0986 L4125.0806,1749.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3891" y="1766.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3891" y="1781.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3891" y="1796.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN122" data-source-line="389" id="ent0123"><path d="M3193.5,1796.5986 L3193.5,1839.9551 L3246.6095,1542.173 L3193.5,1847.9551 L3193.5,1888.291 A4,4 0 0 0 3197.5,1892.291 L3557.374,1892.291 A4,4 0 0 0 3561.374,1888.291 L3561.374,1802.5986 L3551.374,1792.5986 L3197.5,1792.5986 A4,4 0 0 0 3193.5,1796.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3551.374,1792.5986 L3551.374,1800.5986 A2,2 0 0 0 3553.374,1802.5986 L3561.374,1802.5986 L3551.374,1792.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3199.5" y="1809.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3199.5" y="1824.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3199.5" y="1839.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3199.5" y="1854.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3199.5" y="1869.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3199.5" y="1884.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN128" data-source-line="400" id="ent0129"><path d="M41.5,1897.0986 L41.5,1943.9448 A4,4 0 0 0 45.5,1947.9448 L376.397,1947.9448 A4,4 0 0 0 380.397,1943.9448 L380.397,1903.0986 L370.397,1893.0986 L215,1893.0986 L211,1875.5707 L207,1893.0986 L45.5,1893.0986 A4,4 0 0 0 41.5,1897.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,1893.0986 L370.397,1901.0986 A2,2 0 0 0 372.397,1903.0986 L380.397,1903.0986 L370.397,1893.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="1910.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="1925.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="1940.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN131" data-source-line="405" id="ent0132"><path d="M21,2084.0986 L21,2130.9448 A4,4 0 0 0 25,2134.9448 L397.1377,2134.9448 A4,4 0 0 0 401.1377,2130.9448 L401.1377,2090.0986 L391.1377,2080.0986 L215,2080.0986 L211,2062.5707 L207,2080.0986 L25,2080.0986 A4,4 0 0 0 21,2084.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,2080.0986 L391.1377,2088.0986 A2,2 0 0 0 393.1377,2090.0986 L401.1377,2090.0986 L391.1377,2080.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="2097.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="2112.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="2127.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN134" data-source-line="410" id="ent0135"><path d="M34.5,2440.0986 L34.5,2486.9448 A4,4 0 0 0 38.5,2490.9448 L383.895,2490.9448 A4,4 0 0 0 387.895,2486.9448 L387.895,2446.0986 L377.895,2436.0986 L215,2436.0986 L211,2418.4153 L207,2436.0986 L38.5,2436.0986 A4,4 0 0 0 34.5,2440.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,2436.0986 L377.895,2444.0986 A2,2 0 0 0 379.895,2446.0986 L387.895,2446.0986 L377.895,2436.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="2453.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="2468.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="2483.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN137" data-source-line="415" id="ent0138"><path d="M661,2069.0986 L661,2115.9448 A4,4 0 0 0 665,2119.9448 L1062.4077,2119.9448 A4,4 0 0 0 1066.4077,2115.9448 L1066.4077,2075.0986 L1056.4077,2065.0986 L867.5,2065.0986 L863.5,2047.4153 L859.5,2065.0986 L665,2065.0986 A4,4 0 0 0 661,2069.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1056.4077,2065.0986 L1056.4077,2073.0986 A2,2 0 0 0 1058.4077,2075.0986 L1066.4077,2075.0986 L1056.4077,2065.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="667" y="2082.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="667" y="2097.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="667" y="2112.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN140" data-source-line="420" id="ent0141"><path d="M1281,2622.0986 L1281,2650.3767 L1355.3221,2417.6098 L1281,2658.3767 L1281,2668.9448 A4,4 0 0 0 1285,2672.9448 L1692.5005,2672.9448 A4,4 0 0 0 1696.5005,2668.9448 L1696.5005,2628.0986 L1686.5005,2618.0986 L1285,2618.0986 A4,4 0 0 0 1281,2622.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1686.5005,2618.0986 L1686.5005,2626.0986 A2,2 0 0 0 1688.5005,2628.0986 L1696.5005,2628.0986 L1686.5005,2618.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1287" y="2635.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1287" y="2650.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1287" y="2665.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN143" data-source-line="425" id="ent0144"><path d="M666,2811.0986 L666,2857.9448 A4,4 0 0 0 670,2861.9448 L1056.5596,2861.9448 A4,4 0 0 0 1060.5596,2857.9448 L1060.5596,2817.0986 L1050.5596,2807.0986 L867.5,2807.0986 L863.5,2789.4153 L859.5,2807.0986 L670,2807.0986 A4,4 0 0 0 666,2811.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1050.5596,2807.0986 L1050.5596,2815.0986 A2,2 0 0 0 1052.5596,2817.0986 L1060.5596,2817.0986 L1050.5596,2807.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="672" y="2824.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="672" y="2839.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="672" y="2854.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN146" data-source-line="430" id="ent0147"><path d="M1288.5,2927.0986 L1288.5,2973.9448 A4,4 0 0 0 1292.5,2977.9448 L1685.5977,2977.9448 A4,4 0 0 0 1689.5977,2973.9448 L1689.5977,2933.0986 L1679.5977,2923.0986 L1493,2923.0986 L1489,2905.4153 L1485,2923.0986 L1292.5,2923.0986 A4,4 0 0 0 1288.5,2927.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1679.5977,2923.0986 L1679.5977,2931.0986 A2,2 0 0 0 1681.5977,2933.0986 L1689.5977,2933.0986 L1679.5977,2923.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1294.5" y="2940.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1294.5" y="2955.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1294.5" y="2970.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN149" data-source-line="435" id="ent0150"><path d="M2536.5,278.0986 L2536.5,324.9448 A4,4 0 0 0 2540.5,328.9448 L2938.6567,328.9448 A4,4 0 0 0 2942.6567,324.9448 L2942.6567,284.0986 L2932.6567,274.0986 L2743.5,274.0986 L2739.5,256.4153 L2735.5,274.0986 L2540.5,274.0986 A4,4 0 0 0 2536.5,278.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2932.6567,274.0986 L2932.6567,282.0986 A2,2 0 0 0 2934.6567,284.0986 L2942.6567,284.0986 L2932.6567,274.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2542.5" y="291.2925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2542.5" y="306.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2542.5" y="321.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN152" data-source-line="440" id="ent0153"><path d="M2520,999.0986 L2520,1045.9448 A4,4 0 0 0 2524,1049.9448 L2955.3804,1049.9448 A4,4 0 0 0 2959.3804,1045.9448 L2959.3804,1005.0986 L2949.3804,995.0986 L2743.5,995.0986 L2739.5,977.4153 L2735.5,995.0986 L2524,995.0986 A4,4 0 0 0 2520,999.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2949.3804,995.0986 L2949.3804,1003.0986 A2,2 0 0 0 2951.3804,1005.0986 L2959.3804,1005.0986 L2949.3804,995.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2526" y="1012.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2526" y="1027.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2526" y="1042.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN155" data-source-line="445" id="ent0156"><path d="M3162,681.0986 L3162,727.9448 A4,4 0 0 0 3166,731.9448 L3588.6841,731.9448 A4,4 0 0 0 3592.6841,727.9448 L3592.6841,687.0986 L3582.6841,677.0986 L3381.5,677.0986 L3377.5,659.4153 L3373.5,677.0986 L3166,677.0986 A4,4 0 0 0 3162,681.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3582.6841,677.0986 L3582.6841,685.0986 A2,2 0 0 0 3584.6841,687.0986 L3592.6841,687.0986 L3582.6841,677.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3168" y="694.2925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3168" y="709.2412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3168" y="724.1899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN158" data-source-line="450" id="ent0159"><path d="M3158,1088.0986 L3158,1134.9448 A4,4 0 0 0 3162,1138.9448 L3593.4312,1138.9448 A4,4 0 0 0 3597.4312,1134.9448 L3597.4312,1094.0986 L3587.4312,1084.0986 L3381.5,1084.0986 L3377.5,1066.4153 L3373.5,1084.0986 L3162,1084.0986 A4,4 0 0 0 3158,1088.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3587.4312,1084.0986 L3587.4312,1092.0986 A2,2 0 0 0 3589.4312,1094.0986 L3597.4312,1094.0986 L3587.4312,1084.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8423" x="3164" y="1101.2925">U02: HMAC binds reason to block/thread/blocker/blocked-user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.4312" x="3164" y="1116.2412">Status can change without breaking the binding. Bounded compare-write</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="3164" y="1131.1899">and full verify precede opt-in strict read; deletion clears both.</text></g><g class="entity" data-qualified-name="GMN161" data-source-line="455" id="ent0162"><path d="M3162,1723.0986 L3162,1769.9448 A4,4 0 0 0 3166,1773.9448 L3589.4268,1773.9448 A4,4 0 0 0 3593.4268,1769.9448 L3593.4268,1729.0986 L3583.4268,1719.0986 L3381.5,1719.0986 L3377.5,1701.4153 L3373.5,1719.0986 L3166,1719.0986 A4,4 0 0 0 3162,1723.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3583.4268,1719.0986 L3583.4268,1727.0986 A2,2 0 0 0 3585.4268,1729.0986 L3593.4268,1729.0986 L3583.4268,1719.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410.4268" x="3168" y="1736.2925">U02: HMAC binds reference/notes to evidence/provider UUID and kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4604" x="3168" y="1751.2412">Read verifies reference against blind index. Backfill clears stale</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="3168" y="1766.1899">indexes after null redaction; full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN164" data-source-line="460" id="ent0165"><path d="M641,1382.5986 L641,1444.3936 A4,4 0 0 0 645,1448.3936 L1082.1567,1448.3936 A4,4 0 0 0 1086.1567,1444.3936 L1086.1567,1388.5986 L1076.1567,1378.5986 L867.5,1378.5986 L863.5,1360.1408 L859.5,1378.5986 L645,1378.5986 A4,4 0 0 0 641,1382.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1076.1567,1378.5986 L1076.1567,1386.5986 A2,2 0 0 0 1078.1567,1388.5986 L1086.1567,1388.5986 L1076.1567,1378.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1567" x="647" y="1395.7925">U02: HMAC binds encrypted payload and review reason to request UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.3149" x="647" y="1410.7412">provider UUID, requester UUID and kind. Account deletion reseals each</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.9121" x="647" y="1425.6899">redacted payload with its own binding and clears reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="647" y="1440.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN167" data-source-line="466" id="ent0168"><path d="M646.5,2382.5986 L646.5,2444.3936 A4,4 0 0 0 650.5,2448.3936 L1076.834,2448.3936 A4,4 0 0 0 1080.834,2444.3936 L1080.834,2388.5986 L1070.834,2378.5986 L867.5,2378.5986 L863.5,2360.1408 L859.5,2378.5986 L650.5,2378.5986 A4,4 0 0 0 646.5,2382.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1070.834,2378.5986 L1070.834,2386.5986 A2