FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2205.6523,666.5986 L2205.6523,674.5986 A2,2 0 0 0 2207.6523,676.5986 L2215.6523,676.5986 L2205.6523,666.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1888.5" y="683.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1888.5" y="698.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1888.5" y="713.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1888.5" y="728.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN91" data-source-line="299" id="ent0092"><path d="M3184,566.5986 L3184,628.3936 A4,4 0 0 0 3188,632.3936 L3458.2642,632.3936 A4,4 0 0 0 3462.2642,628.3936 L3462.2642,572.5986 L3452.2642,562.5986 L3327,562.5986 L3323,544.7559 L3319,562.5986 L3188,562.5986 A4,4 0 0 0 3184,566.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3452.2642,562.5986 L3452.2642,570.5986 A2,2 0 0 0 3454.2642,572.5986 L3462.2642,572.5986 L3452.2642,562.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3190" y="579.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3190" y="594.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3190" y="609.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3190" y="624.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN94" data-source-line="305" id="ent0095"><path d="M676,380.0986 L676,426.9448 A4,4 0 0 0 680,430.9448 L1006.5869,430.9448 A4,4 0 0 0 1010.5869,426.9448 L1010.5869,386.0986 L1000.5869,376.0986 L847.5,376.0986 L843.5,357.6627 L839.5,376.0986 L680,376.0986 A4,4 0 0 0 676,380.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1000.5869,376.0986 L1000.5869,384.0986 A2,2 0 0 0 1002.5869,386.0986 L1010.5869,386.0986 L1000.5869,376.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="682" y="393.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="682" y="408.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="682" y="423.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN97" data-source-line="310" id="ent0098"><path d="M3816,273.0986 L3816,309.7951 L3827.157,100.1486 L3816,317.7951 L3816,319.9448 A4,4 0 0 0 3820,323.9448 L4062.0806,323.9448 A4,4 0 0 0 4066.0806,319.9448 L4066.0806,279.0986 L4056.0806,269.0986 L3820,269.0986 A4,4 0 0 0 3816,273.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4056.0806,269.0986 L4056.0806,277.0986 A2,2 0 0 0 4058.0806,279.0986 L4066.0806,279.0986 L4056.0806,269.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3822" y="286.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3822" y="301.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3822" y="316.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN100" data-source-line="315" id="ent0101"><path d="M3139,332.5986 L3139,424.291 A4,4 0 0 0 3143,428.291 L3502.874,428.291 A4,4 0 0 0 3506.874,424.291 L3506.874,338.5986 L3496.874,328.5986 L3327,328.5986 L3323,310.601 L3319,328.5986 L3143,328.5986 A4,4 0 0 0 3139,332.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3496.874,328.5986 L3496.874,336.5986 A2,2 0 0 0 3498.874,338.5986 L3506.874,338.5986 L3496.874,328.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3145" y="345.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3145" y="360.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3145" y="375.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3145" y="390.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3145" y="405.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3145" y="420.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN106" data-source-line="326" id="ent0107"><path d="M41.5,438.0986 L41.5,484.9448 A4,4 0 0 0 45.5,488.9448 L376.397,488.9448 A4,4 0 0 0 380.397,484.9448 L380.397,444.0986 L370.397,434.0986 L215,434.0986 L211,416.5707 L207,434.0986 L45.5,434.0986 A4,4 0 0 0 41.5,438.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,434.0986 L370.397,442.0986 A2,2 0 0 0 372.397,444.0986 L380.397,444.0986 L370.397,434.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="451.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="466.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="481.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN109" data-source-line="331" id="ent0110"><path d="M21,735.0986 L21,781.9448 A4,4 0 0 0 25,785.9448 L397.1377,785.9448 A4,4 0 0 0 401.1377,781.9448 L401.1377,741.0986 L391.1377,731.0986 L215,731.0986 L211,713.5707 L207,731.0986 L25,731.0986 A4,4 0 0 0 21,735.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,731.0986 L391.1377,739.0986 A2,2 0 0 0 393.1377,741.0986 L401.1377,741.0986 L391.1377,731.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="748.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="763.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="778.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN112" data-source-line="336" id="ent0113"><path d="M34.5,1091.0986 L34.5,1137.9448 A4,4 0 0 0 38.5,1141.9448 L383.895,1141.9448 A4,4 0 0 0 387.895,1137.9448 L387.895,1097.0986 L377.895,1087.0986 L215,1087.0986 L211,1069.4153 L207,1087.0986 L38.5,1087.0986 A4,4 0 0 0 34.5,1091.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,1087.0986 L377.895,1095.0986 A2,2 0 0 0 379.895,1097.0986 L387.895,1097.0986 L377.895,1087.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="1104.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="1119.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="1134.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN115" data-source-line="341" id="ent0116"><path d="M641,720.0986 L641,766.9448 A4,4 0 0 0 645,770.9448 L1042.4077,770.9448 A4,4 0 0 0 1046.4077,766.9448 L1046.4077,726.0986 L1036.4077,716.0986 L847.5,716.0986 L843.5,698.4153 L839.5,716.0986 L645,716.0986 A4,4 0 0 0 641,720.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1036.4077,716.0986 L1036.4077,724.0986 A2,2 0 0 0 1038.4077,726.0986 L1046.4077,726.0986 L1036.4077,716.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="647" y="733.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="647" y="748.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="647" y="763.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN118" data-source-line="346" id="ent0119"><path d="M1241,898.0986 L1241,944.9448 A4,4 0 0 0 1245,948.9448 L1652.5005,948.9448 A4,4 0 0 0 1656.5005,944.9448 L1656.5005,904.0986 L1646.5005,894.0986 L1453,894.0986 L1449,876.4153 L1445,894.0986 L1245,894.0986 A4,4 0 0 0 1241,898.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1646.5005,894.0986 L1646.5005,902.0986 A2,2 0 0 0 1648.5005,904.0986 L1656.5005,904.0986 L1646.5005,894.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1247" y="911.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1247" y="926.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1247" y="941.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN121" data-source-line="351" id="ent0122"><path d="M646,1420.0986 L646,1466.9448 A4,4 0 0 0 650,1470.9448 L1036.5596,1470.9448 A4,4 0 0 0 1040.5596,1466.9448 L1040.5596,1426.0986 L1030.5596,1416.0986 L847.5,1416.0986 L843.5,1398.4153 L839.5,1416.0986 L650,1416.0986 A4,4 0 0 0 646,1420.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1030.5596,1416.0986 L1030.5596,1424.0986 A2,2 0 0 0 1032.5596,1426.0986 L1040.5596,1426.0986 L1030.5596,1416.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="652" y="1433.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="652" y="1448.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="652" y="1463.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN124" data-source-line="356" id="ent0125"><path d="M1248.5,1536.0986 L1248.5,1582.9448 A4,4 0 0 0 1252.5,1586.9448 L1645.5977,1586.9448 A4,4 0 0 0 1649.5977,1582.9448 L1649.5977,1542.0986 L1639.5977,1532.0986 L1453,1532.0986 L1449,1514.4153 L1445,1532.0986 L1252.5,1532.0986 A4,4 0 0 0 1248.5,1536.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1639.5977,1532.0986 L1639.5977,1540.0986 A2,2 0 0 0 1641.5977,1542.0986 L1649.5977,1542.0986 L1639.5977,1532.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1254.5" y="1549.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1254.5" y="1564.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1254.5" y="1579.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN127" data-source-line="361" id="ent0128"><path d="M2496.5,1303.0986 L2496.5,1349.9448 A4,4 0 0 0 2500.5,1353.9448 L2898.6567,1353.9448 A4,4 0 0 0 2902.6567,1349.9448 L2902.6567,1309.0986 L2892.6567,1299.0986 L2703.5,1299.0986 L2699.5,1281.4153 L2695.5,1299.0986 L2500.5,1299.0986 A4,4 0 0 0 2496.5,1303.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2892.6567,1299.0986 L2892.6567,1307.0986 A2,2 0 0 0 2894.6567,1309.0986 L2902.6567,1309.0986 L2892.6567,1299.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2502.5" y="1316.2925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2502.5" y="1331.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2502.5" y="1346.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN130" data-source-line="366" id="ent0131"><path d="M2480,187.0986 L2480,233.9448 A4,4 0 0 0 2484,237.9448 L2915.3804,237.9448 A4,4 0 0 0 2919.3804,233.9448 L2919.3804,193.0986 L2909.3804,183.0986 L2703.5,183.0986 L2699.5,165.4153 L2695.5,183.0986 L2484,183.0986 A4,4 0 0 0 2480,187.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2909.3804,183.0986 L2909.3804,191.0986 A2,2 0 0 0 2911.3804,193.0986 L2919.3804,193.0986 L2909.3804,183.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2486" y="200.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2486" y="215.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2486" y="230.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN133" data-source-line="371" id="ent0134"><path d="M6,917.0986 L6,963.9448 A4,4 0 0 0 10,967.9448 L411.7241,967.9448 A4,4 0 0 0 415.7241,963.9448 L415.7241,923.0986 L405.7241,913.0986 L215,913.0986 L211,895.5707 L207,913.0986 L10,913.0986 A4,4 0 0 0 6,917.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,913.0986 L405.7241,921.0986 A2,2 0 0 0 407.7241,923.0986 L415.7241,923.0986 L405.7241,913.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="930.2925">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="945.2412">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="960.1899">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN136" data-source-line="376" id="ent0137"><path d="M3118,865.5986 L3118,927.3936 A4,4 0 0 0 3122,931.3936 L3523.7241,931.3936 A4,4 0 0 0 3527.7241,927.3936 L3527.7241,871.5986 L3517.7241,861.5986 L3327,861.5986 L3323,843.4611 L3319,861.5986 L3122,861.5986 A4,4 0 0 0 3118,865.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3517.7241,861.5986 L3517.7241,869.5986 A2,2 0 0 0 3519.7241,871.5986 L3527.7241,871.5986 L3517.7241,861.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.165" x="3124" y="878.7925">U02: non-null body HMAC binds plaintext to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="3124" y="893.7412">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="3124" y="908.6899">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252.1924" x="3124" y="923.6387">opt-in strict read. Null body has null binding.</text></g><g class="entity" data-qualified-name="GMN139" data-source-line="382" id="ent0140"><path d="M3118,1063.5986 L3118,1125.3936 A4,4 0 0 0 3122,1129.3936 L3523.7241,1129.3936 A4,4 0 0 0 3527.7241,1125.3936 L3527.7241,1069.5986 L3517.7241,1059.5986 L3327,1059.5986 L3323,1041.4611 L3319,1059.5986 L3122,1059.5986 A4,4 0 0 0 3118,1063.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3517.7241,1059.5986 L3517.7241,1067.5986 A2,2 0 0 0 3519.7241,1069.5986 L3527.7241,1069.5986 L3517.7241,1059.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="356.9414" x="3124" y="1076.7925">U02: non-null offer HMAC binds decrypted JSON to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="3124" y="1091.7412">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="3124" y="1106.6899">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="250.0151" x="3124" y="1121.6387">opt-in strict read. Null offer has null binding.</text></g><g class="entity" data-qualified-name="GMN142" data-source-line="388" id="ent0143"><path d="M2494.5,1485.5986 L249