tLength="207.3906" x="1995.5" y="2034.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN142" data-source-line="462" id="ent0143"><path d="M3320.5,1431.5986 L3320.5,1493.3936 A4,4 0 0 0 3324.5,1497.3936 L3594.7642,1497.3936 A4,4 0 0 0 3598.7642,1493.3936 L3598.7642,1437.5986 L3588.7642,1427.5986 L3463.5,1427.5986 L3459.5,1409.8312 L3455.5,1427.5986 L3324.5,1427.5986 A4,4 0 0 0 3320.5,1431.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3588.7642,1427.5986 L3588.7642,1435.5986 A2,2 0 0 0 3590.7642,1437.5986 L3598.7642,1437.5986 L3588.7642,1427.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3326.5" y="1444.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3326.5" y="1459.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3326.5" y="1474.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3326.5" y="1489.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN145" data-source-line="468" id="ent0146"><path d="M705.5,1651.0986 L705.5,1697.9448 A4,4 0 0 0 709.5,1701.9448 L1036.0869,1701.9448 A4,4 0 0 0 1040.0869,1697.9448 L1040.0869,1657.0986 L1030.0869,1647.0986 L877,1647.0986 L873,1628.6627 L869,1647.0986 L709.5,1647.0986 A4,4 0 0 0 705.5,1651.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1030.0869,1647.0986 L1030.0869,1655.0986 A2,2 0 0 0 1032.0869,1657.0986 L1040.0869,1657.0986 L1030.0869,1647.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="711.5" y="1664.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="711.5" y="1679.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="711.5" y="1694.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN148" data-source-line="473" id="ent0149"><path d="M3967,1964.0986 L3967,2010.9448 A4,4 0 0 0 3971,2014.9448 L4213.0806,2014.9448 A4,4 0 0 0 4217.0806,2010.9448 L4217.0806,1970.0986 L4207.0806,1960.0986 L4096,1960.0986 L4092,1942.3133 L4088,1960.0986 L3971,1960.0986 A4,4 0 0 0 3967,1964.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4207.0806,1960.0986 L4207.0806,1968.0986 A2,2 0 0 0 4209.0806,1970.0986 L4217.0806,1970.0986 L4207.0806,1960.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3973" y="1977.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3973" y="1992.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3973" y="2007.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN151" data-source-line="478" id="ent0152"><path d="M3275.5,1941.5986 L3275.5,2033.291 A4,4 0 0 0 3279.5,2037.291 L3639.374,2037.291 A4,4 0 0 0 3643.374,2033.291 L3643.374,1947.5986 L3633.374,1937.5986 L3463.5,1937.5986 L3459.5,1919.601 L3455.5,1937.5986 L3279.5,1937.5986 A4,4 0 0 0 3275.5,1941.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3633.374,1937.5986 L3633.374,1945.5986 A2,2 0 0 0 3635.374,1947.5986 L3643.374,1947.5986 L3633.374,1937.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3281.5" y="1954.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3281.5" y="1969.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3281.5" y="1984.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3281.5" y="1999.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3281.5" y="2014.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3281.5" y="2029.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN157" data-source-line="489" id="ent0158"><path d="M41.5,1781.0986 L41.5,1827.9448 A4,4 0 0 0 45.5,1831.9448 L376.397,1831.9448 A4,4 0 0 0 380.397,1827.9448 L380.397,1787.0986 L370.397,1777.0986 L215,1777.0986 L211,1759.5707 L207,1777.0986 L45.5,1777.0986 A4,4 0 0 0 41.5,1781.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,1777.0986 L370.397,1785.0986 A2,2 0 0 0 372.397,1787.0986 L380.397,1787.0986 L370.397,1777.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="1794.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="1809.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="1824.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN160" data-source-line="494" id="ent0161"><path d="M21,2390.0986 L21,2436.9448 A4,4 0 0 0 25,2440.9448 L397.1377,2440.9448 A4,4 0 0 0 401.1377,2436.9448 L401.1377,2396.0986 L391.1377,2386.0986 L215,2386.0986 L211,2368.5707 L207,2386.0986 L25,2386.0986 A4,4 0 0 0 21,2390.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,2386.0986 L391.1377,2394.0986 A2,2 0 0 0 393.1377,2396.0986 L401.1377,2396.0986 L391.1377,2386.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="2403.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="2418.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="2433.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN163" data-source-line="499" id="ent0164"><path d="M34.5,2208.0986 L34.5,2254.9448 A4,4 0 0 0 38.5,2258.9448 L383.895,2258.9448 A4,4 0 0 0 387.895,2254.9448 L387.895,2214.0986 L377.895,2204.0986 L215,2204.0986 L211,2186.4153 L207,2204.0986 L38.5,2204.0986 A4,4 0 0 0 34.5,2208.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,2204.0986 L377.895,2212.0986 A2,2 0 0 0 379.895,2214.0986 L387.895,2214.0986 L377.895,2204.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="2221.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="2236.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="2251.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN166" data-source-line="504" id="ent0167"><path d="M670.5,1825.0986 L670.5,1871.9448 A4,4 0 0 0 674.5,1875.9448 L1071.9077,1875.9448 A4,4 0 0 0 1075.9077,1871.9448 L1075.9077,1831.0986 L1065.9077,1821.0986 L877,1821.0986 L873,1803.4153 L869,1821.0986 L674.5,1821.0986 A4,4 0 0 0 670.5,1825.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1065.9077,1821.0986 L1065.9077,1829.0986 A2,2 0 0 0 1067.9077,1831.0986 L1075.9077,1831.0986 L1065.9077,1821.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="676.5" y="1838.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="676.5" y="1853.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="676.5" y="1868.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN169" data-source-line="509" id="ent0170"><path d="M1322.5,2539.0986 L1322.5,2572.6326 L1396.7211,2127.9994 L1322.5,2580.6326 L1322.5,2585.9448 A4,4 0 0 0 1326.5,2589.9448 L1734.0005,2589.9448 A4,4 0 0 0 1738.0005,2585.9448 L1738.0005,2545.0986 L1728.0005,2535.0986 L1326.5,2535.0986 A4,4 0 0 0 1322.5,2539.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1728.0005,2535.0986 L1728.0005,2543.0986 A2,2 0 0 0 1730.0005,2545.0986 L1738.0005,2545.0986 L1728.0005,2535.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1328.5" y="2552.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1328.5" y="2567.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1328.5" y="2582.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN172" data-source-line="514" id="ent0173"><path d="M675.5,2728.0986 L675.5,2774.9448 A4,4 0 0 0 679.5,2778.9448 L1066.0596,2778.9448 A4,4 0 0 0 1070.0596,2774.9448 L1070.0596,2734.0986 L1060.0596,2724.0986 L877,2724.0986 L873,2706.4153 L869,2724.0986 L679.5,2724.0986 A4,4 0 0 0 675.5,2728.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1060.0596,2724.0986 L1060.0596,2732.0986 A2,2 0 0 0 1062.0596,2734.0986 L1070.0596,2734.0986 L1060.0596,2724.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="681.5" y="2741.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="681.5" y="2756.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="681.5" y="2771.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN175" data-source-line="519" id="ent0176"><path d="M1330,2844.0986 L1330,2890.9448 A4,4 0 0 0 1334,2894.9448 L1727.0977,2894.9448 A4,4 0 0 0 1731.0977,2890.9448 L1731.0977,2850.0986 L1721.0977,2840.0986 L1534.5,2840.0986 L1530.5,2822.4153 L1526.5,2840.0986 L1334,2840.0986 A4,4 0 0 0 1330,2844.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1721.0977,2840.0986 L1721.0977,2848.0986 A2,2 0 0 0 1723.0977,2850.0986 L1731.0977,2850.0986 L1721.0977,2840.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1336" y="2857.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1336" y="2872.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1336" y="2887.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN178" data-source-line="524" id="ent0179"><path d="M2611,1640.0986 L2611,1686.9448 A4,4 0 0 0 2615,1690.9448 L3013.1567,1690.9448 A4,4 0 0 0 3017.1567,1686.9448 L3017.1567,1646.0986 L3007.1567,1636.0986 L2818,1636.0986 L2814,1618.4153 L2810,1636.0986 L2615,1636.0986 A4,4 0 0 0 2611,1640.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3007.1567,1636.0986 L3007.1567,1644.0986 A2,2 0 0 0 3009.1567,1646.0986 L3017.1567,1646.0986 L3007.1567,1636.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2617" y="1653.2925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2617" y="1668.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2617" y="1683.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN181" data-source-line="529" id="ent0182"><path d="M2594.5,816.0986 L2594.5,862.9448 A4,4 0 0 0 2598.5,866.9448 L3029.8804,866.9448 A4,4 0 0 0 3033.8804,862.9448 L3033.8804,822.0986 L3023.8804,812.0986 L2818,812.0986 L2814,794.4153 L2810,812.0986 L2598.5,812.0986 A4,4 0 0 0 2594.5,816.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3023.8804,812.0986 L3023.8804,820.0986 A2,2 0 0 0 3025.8804,822.0986 L3033.8804,822.0986 L3023.8804,812.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2600.5" y="829.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2600.5" y="844.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2600.5" y="859.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN184" data-source-line="534" id="ent0185"><path d="M3244,154.0986 L3244,200.9448 A4,4 0 0 0 3248,204.9448 L3670.6841,204.9448 A4,4 0 0 0 3674.6841,200.9448 L3674.6841,160.0986 L3664.6841,150.0986 L3463.5,150.0986 L3459.5,132.4153 L3455.5,150.0986 L3248,150.0986 A4,4 0 0 0 3244,154.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3664.6841,150.0986 L3664.6841,158.0986 A2,2 0 0 0 3666.6841,160.0986 L3674.6841,160.0986 L3664.6841,150.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3250" y="167.2925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3250" y="182.2412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3250" y="197.1899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN187" data-source-line="539" id="ent0188"><path d="M3240,328.0986 L3240,374.9448 A4,4 0 0 0 3244,378.9448 L3675.4312,378.9448 A4,4 0 0 0 3679.4312,374.9448 L3679.4312,334.0986 L3669.4312,324.0986 L3463.5,324.0986 L3459.5,306.4153 L3455.5,324.0986 L3244,324.0986 A4,4 0 0 0 3240,328.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3669.4312,324.0986 L3669.4312,332.0986 A2,2 0 0 0 3671.4312,334.0986 L3679.4312,334.0986 L3669.4312,324.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8423" x="3246" y="341.2925">U02: HMAC binds reason to block/thread/blocker/blocked-user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.4312" x="3246" y="356.2412">Status can change without breaking the binding. Bounded compare-write</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="3246" y="371.1899">and full verify precede opt-in strict read; deletion clears both.</text></g><g class="entity" data-qualified-name="GMN190" data-source-line="544" id="ent0191"><path d="M3244,1752.0986 L3244,1798.9448 A4,4 0 0 0 3248,1802.9448 L3671.4268,1802.9448 A4,4 0 0 0 3675.4268,1798.9448 L3675.4268,1758.0986 L3665.4268,1748.0986 L3463.5,1748.0986 L3459.5,1730.4153 L3455.5,1748.0986 L3248,1748.0986 A4,4 0 0 0 3244,1752.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3665.4268,1748.0986 L3665.4268,1756.0986 A2,2 0 0 0 3667.4268,1758.0986 L3675.4268,1758.0986 L3665.4268,1748.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410.4268" x="3250" y="1765.2925">U02: HMAC binds reference/notes to evidence/provider UUID and kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4604" x="3250" y="1780.2412">Read verifies reference against blind index. Backfill clears stale</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="3250" y="1795.1899">indexes after null redaction; full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN193" data-source-line="549" id="ent0194"><path d="M650.5,1018.5986 L650.5,1080.3936 A4,4 0 0 0 654.5,1084.3936 L1091.6567,1084.3936 A4,4 0 0 0 1095.6567,1080.3936 L1095.6567,1024.5986 L1085.6567,1014.5986 L877,1014.5986 L873,996.1408 L869,1014.5986 L654.5,1014.5986 A4,4 0 0 0 650.5,1018.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1085.6567,1014.5986 L1085.6567,1022.5986 A2,2 0 0 0 1087.6567,1024.5986 L1095.6567,1024.5986 L1085.6567,1014.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1567" x="656.5" y="1031.7925">U02: HMAC binds encrypted payload and review reason to request UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.3149" x="656.5" y="1046.7412">provider UUID, requester UUID and kind. Account deletion reseals each</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.9121" x="656.5" y="1061.6899">redacted payload with its own binding and clears reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="656.5" y="1076.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN196" data-source-line="555" id="ent0197"><path d="M656,1999.5986 L656,2061.3936 A4,4 0 0 0 660,2065.3936 L1086.334,2065.3936 A4,4 0 0 0 1090.334,2061.3936 L1090.334,2005.5986 L1080.334,1995.5986 L877,1995.5986 L873,1977.1408 L869,1995.5986 L660,1995.5986 A4,4 0 0 0 656,1999.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1080.334,1995.5986 L1080.334,2003.5986 A2,2 0 0 0 1082.334,2005.5986 L1090.334,2005.5986 L1080.334,1995.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.334" x="662" y="2012.7925">U02: HMAC binds reason and decisionReason to appeal UUID, subject,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="411.144" x="662" y="2027.7412">subjectId, submitter UUID and nullable provider UUID. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="405.4121" x="662" y="2042.6899">reseals each redacted reason and clears decision reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="662" y="2057.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN199" data-source-line="561" id="ent0200"><path d="M662,2353.5986 L662,2415.3936 A4,4 0 0 0 666,2419.3936 L1080.0005,2419.3936 A4,4 0 0 0 1084.0005,2415.3936 L1084.0005,2359.5986 L1074.0005,2349.5986 L877,2349.5986 L873,2331.1408 L869,2349.5986 L666,2349.5986 A4,4 0 0 0 662,2353.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1074.0005,2349.5986 L1074.0005,2357.5986 A2,2 0 0 0 1076.0005,2359.5986 L1084.0005,2359.5986 L1074.0005,2349.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0005" x="668" y="2366.7925">U02: four HMACs bind encrypted fields to gap UUID, requester UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8931" x="668" y="2381.7412">nullable provider UUID and catalog slugs/price type. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5386" x="668" y="2396.6899">reseals each redacted row and clears reviewReason with its binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="668" y="2411.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN202" data-source-line="567" id="ent0203"><path d="M2587,626.5986 L2587,688.3936 A4,4 0 0 0 2591,692.3936 L3036.834,692.3936 A4,4 0 0 0 3040.834,688.3936 L3040.834,632.5986 L3030.834,622.5986 L2818,622.5986 L2814,604.1408 L2810,622.5986 L2591,622.5986 A4,4 0 0 0 2587,626.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3030.834,622.5986 L3030.834,630.5986 A2,2 0 0 0 3032.834,632.5986 L3040.834,632.5986 L3030.834,622.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="432.834" x="2593" y="639.7925">U02: three HMACs bind encrypted title, notes and metadata to event UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1885" x="2593" y="654.7412">request UUID and eventType. Account deletion reseals title and metadata</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="379.3486" x="2593" y="669.6899">for each row and clears notes with its binding. Full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="96.8145" x="2593" y="684.6387">opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN205" data-source-line="573" id="ent0206"><path d="M665.5,800.0986 L665.5,876.8423 A4,4 0 0 0 669.5,880.8423 L1076.3467,880.8423 A4,4 0 0 0 1080.3467,876.8423 L1080.3467,806.0986 L1070.3467,796.0986 L877,796.0986 L873,778.3412 L869,796.0986 L669.5,796.0986 A4,4 0 0 0 665.5,800.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1070.3467,796.0986 L1070.3467,804.0986 A2,2 0 0 0 1072.3467,806.0986 L1080.3467,806.0986 L1070.3467,796.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="390.2158" x="671.5" y="813.2925">U02: HMAC binds issueDescription and nullable vehicleSnapshot to</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="285.3906" x="671.5" y="828.2412">broadcast UUID, client UUID and definition UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="354.7832" x="671.5" y="843.1899">marketId is excluded: the FK sets it to null on market deletion.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="393.8467" x="671.5" y="858.1387">Account deletion reseals redacted issue and clears vehicle snapshot</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.0151" x="671.5" y="873.0874">with binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN208" data-source-line="580" id="ent0209"><path d="M1300,1026.0986 L1300,1055.0438 L1417.4875,832.9647 L1300,1063.0438 L1300,1072.9448 A4,4 0 0 0 1304,1076.9448 L1757.0513,1076.9448 A4,4 0 0 0 1761.0513,1072.9448 L1761.0513,1032.0986 L1751.0513,1022.0986 L1304,1022.0986 A4,4 0 0 0 1300,1026.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1751.0513,1022.0986 L1751.0513,1030.0986 A2,2 0 0 0 1753.0513,1032.0986 L1761.0513,1032.0986 L1751.0513,1022.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="440.0513" x="1306" y="1039.2925">U02: HMAC binds encrypted offerSnapshot to offer UUID, broadcast request</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0132" x="1306" y="1054.2412">UUID, provider UUID and location UUID. Account deletion reseals the</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="407.5322" x="1306" y="1069.1899">redacted snapshot for each offer. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN211" data-source-line="585" id="ent0212"><path d="M2603.5,1450.5986 L2603.5,1512.3936 A4,4 0 0 0 2607.5,1516.3936 L3020.8022,1516.3936 A4,4 0 0 0 3024.8022,1512.3936 L3024.8022,1456.5986 L3014.8022,1446.5986 L2818,1446.5986 L2814,1428.1408 L2810,1446.5986 L2607.5,1446.5986 A4,4 0 0 0 2603.5,1450.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3014.8022,1446.5986 L3014.8022,1454.5986 A2,2 0 0 0 3016.8022,1456.5986 L3024.8022,1456.5986 L3014.8022,1446.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.2051" x="2609.5" y="1463.7925">U02: HMAC binds summary and nullable resolution to claim UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="400.3022" x="2609.5" y="1478.7412">request/client/provider UUID and claimType. Account deletion reseals</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="354.0596" x="2609.5" y="1493.6899">redacted summary per row and clears resolution with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="2609.5" y="1508.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN214" data-source-line="591" id="ent0215"><path d="M641,2543.0986 L641,2589.9448 A4,4 0 0 0 645,2593.9448 L1100.9268,2593.9448 A4,4 0 0 0 1104.9268,2589.9448 L1104.9268,2549.0986 L1094.9268,2539.0986 L877,2539.0986 L873,2521.4153 L869,2539.0986 L645,2539.0986 A4,4 0 0 0 641,2543.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1094.9268,2539.0986 L1094.9268,2547.0986 A2,2 0 0 0 1096.9268,2549.0986 L1104.9268,2549.0986 L1094.9268,2539.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="442.9268" x="647" y="2556.2925">U02: HMAC binds vehicleSnapshot, symptoms and answer to question UUID</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="420.5386" x="647" y="2571.2412">and client UUID. Account deletion reseals redacted symptoms and clears</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="378.625" x="647" y="2586.1899">optional fields with bindings. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN217" data-source-line="596" id="ent0218"><path d="M647,3026.0986 L647,3072.9448 A4,4 0 0 0 651,3076.9448 L1094.6567,3076.9448 A4,4 0 0 0 1098.6567,3072.9448 L1098.6567,3032.0986 L1088.6567,3022.0986 L877,3022.0986 L873,3004.4153 L869,3022.0986 L651,3022.0986 A4,4 0 0 0 647,3026.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1088.6567,3022.0986 L1