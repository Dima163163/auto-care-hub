="spacing" textLength="101.8926" x="778" y="2450.1899">processed : bigint</text></g><!--class FleetAccountCheckpoint--><g class="entity" data-qualified-name="FleetAccountCheckpoint" data-source-line="367" id="ent0064"><rect fill="#F1F1F1" height="82.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="214.2788" x="766" y="2548.0986"/><ellipse cx="780" cy="2563.0986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M782.4697,2567.5986 L776.5664,2567.5986 L776.5664,2558.1216 L782.4697,2558.1216 L782.4697,2559.772 L778.439,2559.772 L778.439,2561.8159 L782.0889,2561.8159 L782.0889,2563.4663 L778.439,2563.4663 L778.439,2565.9482 L782.4697,2565.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="184.2788" x="793" y="2567.8181">FleetAccountBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="767" x2="979.2788" y1="2578.0986" y2="2578.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="777" cy="2591.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="185.0088" x="785" y="2594.2925">name : autocare_fleet_accounts</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="785" y="2609.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="785" y="2624.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN135" data-source-line="443" id="ent0136"><path d="M1989.5,1927.5986 L1989.5,1989.3936 A4,4 0 0 0 1993.5,1993.3936 L2318.6523,1993.3936 A4,4 0 0 0 2322.6523,1989.3936 L2322.6523,1933.5986 L2312.6523,1923.5986 L2160,1923.5986 L2156,1905.7559 L2152,1923.5986 L1993.5,1923.5986 A4,4 0 0 0 1989.5,1927.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2312.6523,1923.5986 L2312.6523,1931.5986 A2,2 0 0 0 2314.6523,1933.5986 L2322.6523,1933.5986 L2312.6523,1923.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1995.5" y="1940.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1995.5" y="1955.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1995.5" y="1970.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1995.5" y="1985.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN138" data-source-line="449" id="ent0139"><path d="M3320.5,1431.5986 L3320.5,1493.3936 A4,4 0 0 0 3324.5,1497.3936 L3594.7642,1497.3936 A4,4 0 0 0 3598.7642,1493.3936 L3598.7642,1437.5986 L3588.7642,1427.5986 L3463.5,1427.5986 L3459.5,1409.8312 L3455.5,1427.5986 L3324.5,1427.5986 A4,4 0 0 0 3320.5,1431.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3588.7642,1427.5986 L3588.7642,1435.5986 A2,2 0 0 0 3590.7642,1437.5986 L3598.7642,1437.5986 L3588.7642,1427.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3326.5" y="1444.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3326.5" y="1459.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3326.5" y="1474.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3326.5" y="1489.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN141" data-source-line="455" id="ent0142"><path d="M705.5,1503.0986 L705.5,1549.9448 A4,4 0 0 0 709.5,1553.9448 L1036.0869,1553.9448 A4,4 0 0 0 1040.0869,1549.9448 L1040.0869,1509.0986 L1030.0869,1499.0986 L877,1499.0986 L873,1480.6627 L869,1499.0986 L709.5,1499.0986 A4,4 0 0 0 705.5,1503.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1030.0869,1499.0986 L1030.0869,1507.0986 A2,2 0 0 0 1032.0869,1509.0986 L1040.0869,1509.0986 L1030.0869,1499.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="711.5" y="1516.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="711.5" y="1531.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="711.5" y="1546.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN144" data-source-line="460" id="ent0145"><path d="M3967,1964.0986 L3967,2010.9448 A4,4 0 0 0 3971,2014.9448 L4213.0806,2014.9448 A4,4 0 0 0 4217.0806,2010.9448 L4217.0806,1970.0986 L4207.0806,1960.0986 L4096,1960.0986 L4092,1942.3133 L4088,1960.0986 L3971,1960.0986 A4,4 0 0 0 3967,1964.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4207.0806,1960.0986 L4207.0806,1968.0986 A2,2 0 0 0 4209.0806,1970.0986 L4217.0806,1970.0986 L4207.0806,1960.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3973" y="1977.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3973" y="1992.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3973" y="2007.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN147" data-source-line="465" id="ent0148"><path d="M3275.5,1941.5986 L3275.5,2033.291 A4,4 0 0 0 3279.5,2037.291 L3639.374,2037.291 A4,4 0 0 0 3643.374,2033.291 L3643.374,1947.5986 L3633.374,1937.5986 L3463.5,1937.5986 L3459.5,1919.601 L3455.5,1937.5986 L3279.5,1937.5986 A4,4 0 0 0 3275.5,1941.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3633.374,1937.5986 L3633.374,1945.5986 A2,2 0 0 0 3635.374,1947.5986 L3643.374,1947.5986 L3633.374,1937.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3281.5" y="1954.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3281.5" y="1969.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3281.5" y="1984.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3281.5" y="1999.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3281.5" y="2014.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3281.5" y="2029.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN153" data-source-line="476" id="ent0154"><path d="M41.5,1661.0986 L41.5,1707.9448 A4,4 0 0 0 45.5,1711.9448 L376.397,1711.9448 A4,4 0 0 0 380.397,1707.9448 L380.397,1667.0986 L370.397,1657.0986 L215,1657.0986 L211,1639.5707 L207,1657.0986 L45.5,1657.0986 A4,4 0 0 0 41.5,1661.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,1657.0986 L370.397,1665.0986 A2,2 0 0 0 372.397,1667.0986 L380.397,1667.0986 L370.397,1657.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="1674.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="1689.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="1704.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN156" data-source-line="481" id="ent0157"><path d="M21,2299.0986 L21,2345.9448 A4,4 0 0 0 25,2349.9448 L397.1377,2349.9448 A4,4 0 0 0 401.1377,2345.9448 L401.1377,2305.0986 L391.1377,2295.0986 L215,2295.0986 L211,2277.5707 L207,2295.0986 L25,2295.0986 A4,4 0 0 0 21,2299.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,2295.0986 L391.1377,2303.0986 A2,2 0 0 0 393.1377,2305.0986 L401.1377,2305.0986 L391.1377,2295.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="2312.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="2327.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="2342.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN159" data-source-line="486" id="ent0160"><path d="M34.5,2117.0986 L34.5,2163.9448 A4,4 0 0 0 38.5,2167.9448 L383.895,2167.9448 A4,4 0 0 0 387.895,2163.9448 L387.895,2123.0986 L377.895,2113.0986 L215,2113.0986 L211,2095.4153 L207,2113.0986 L38.5,2113.0986 A4,4 0 0 0 34.5,2117.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,2113.0986 L377.895,2121.0986 A2,2 0 0 0 379.895,2123.0986 L387.895,2123.0986 L377.895,2113.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="2130.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="2145.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="2160.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN162" data-source-line="491" id="ent0163"><path d="M670.5,1734.0986 L670.5,1780.9448 A4,4 0 0 0 674.5,1784.9448 L1071.9077,1784.9448 A4,4 0 0 0 1075.9077,1780.9448 L1075.9077,1740.0986 L1065.9077,1730.0986 L877,1730.0986 L873,1712.4153 L869,1730.0986 L674.5,1730.0986 A4,4 0 0 0 670.5,1734.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1065.9077,1730.0986 L1065.9077,1738.0986 A2,2 0 0 0 1067.9077,1740.0986 L1075.9077,1740.0986 L1065.9077,1730.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="676.5" y="1747.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="676.5" y="1762.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="676.5" y="1777.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN165" data-source-line="496" id="ent0166"><path d="M1322.5,2930.0986 L1322.5,2976.9448 A4,4 0 0 0 1326.5,2980.9448 L1734.0005,2980.9448 A4,4 0 0 0 1738.0005,2976.9448 L1738.0005,2936.0986 L1728.0005,2926.0986 L1534.5,2926.0986 L1530.5,2908.4153 L1526.5,2926.0986 L1326.5,2926.0986 A4,4 0 0 0 1322.5,2930.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1728.0005,2926.0986 L1728.0005,2934.0986 A2,2 0 0 0 1730.0005,2936.0986 L1738.0005,2936.0986 L1728.0005,2926.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1328.5" y="2943.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1328.5" y="2958.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1328.5" y="2973.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN168" data-source-line="501" id="ent0169"><path d="M675.5,2827.0986 L675.5,2873.9448 A4,4 0 0 0 679.5,2877.9448 L1066.0596,2877.9448 A4,4 0 0 0 1070.0596,2873.9448 L1070.0596,2833.0986 L1060.0596,2823.0986 L877,2823.0986 L873,2805.4153 L869,2823.0986 L679.5,2823.0986 A4,4 0 0 0 675.5,2827.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1060.0596,2823.0986 L1060.0596,2831.0986 A2,2 0 0 0 1062.0596,2833.0986 L1070.0596,2833.0986 L1060.0596,2823.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="681.5" y="2840.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="681.5" y="2855.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="681.5" y="2870.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN171" data-source-line="506" id="ent0172"><path d="M1330,2625.0986 L1330,2659.8142 L1380.8194,2098.5941 L1330,2667.8142 L1330,2671.9448 A4,4 0 0 0 1334,2675.9448 L1727.0977,2675.9448 A4,4 0 0 0 1731.0977,2671.9448 L1731.0977,2631.0986 L1721.0977,2621.0986 L1334,2621.0986 A4,4 0 0 0 1330,2625.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1721.0977,2621.0986 L1721.0977,2629.0986 A2,2 0 0 0 1723.0977,2631.0986 L1731.0977,2631.0986 L1721.0977,2621.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1336" y="2638.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1336" y="2653.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1336" y="2668.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN174" data-source-line="511" id="ent0175"><path d="M2611,1643.0986 L2611,1689.9448 A4,4 0 0 0 2615,1693.9448 L3013.1567,1693.9448 A4,4 0 0 0 3017.1567,1689.9448 L3017.1567,1649.0986 L3007.1567,1639.0986 L2818,1639.0986 L2814,1621.4153 L2810,1639.0986 L2615,1639.0986 A4,4 0 0 0 2611,1643.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3007.1567,1639.0986 L3007.1567,1647.0986 A2,2 0 0 0 3009.1567,1649.0986 L3017.1567,1649.0986 L3007.1567,1639.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2617" y="1656.2925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2617" y="1671.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2617" y="1686.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN177" data-source-line="516" id="ent0178"><path d="M2594.5,816.0986 L2594.5,862.9448 A4,4 0 0 0 2598.5,866.9448 L3029.8804,866.9448 A4,4 0 0 0 3033.8804,862.9448 L3033.8804,822.0986 L3023.8804,812.0986 L2818,812.0986 L2814,794.4153 L2810,812.0986 L2598.5,812.0986 A4,4 0 0 0 2594.5,816.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3023.8804,812.0986 L3023.8804,820.0986 A2,2 0 0 0 3025.8804,822.0986 L3033.8804,822.0986 L3023.8804,812.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2600.5" y="829.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2600.5" y="844.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2600.5" y="859.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN180" data-source-line="521" id="ent0181"><path d="M3244,154.0986 L3244,200.9448 A4,4 0 0 0 3248,204.9448 L3670.6841,204.9448 A4,4 0 0 0 3674.6841,200.9448 L3674.6841,160.0986 L3664.6841,150.0986 L3463.5,150.0986 L3459.5,132.4153 L3455.5,150.0986 L3248,150.0986 A4,4 0 0 0 3244,154.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3664.6841,150.0986 L3664.6841,158.0986 A2,2 0 0 0 3666.6841,160.0986 L3674.6841,160.0986 L3664.6841,150.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3250" y="167.2925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3250" y="182.2412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3250" y="197.1899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN183" data-source-line="526" id="ent0184"><path d="M3240,328.0986 L3240,374.9448 A4,4 0 0 0 3244,378.9448 L3675.4312,378.9448 A4,4 0 0 0 3679.4312,374.9448 L3679.4312,334.0986 L3669.4312,324.0986 L3463.5,324.0986 L3459.5,306.4153 L3455.5,324.0986 L3244,324.0986 A4,4 0 0 0 3240,328.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3669.4312,324.0986 L3669.4312,332.0986 A2,2 0 0 0 3671.4312,334.0986 L3679.4312,334.0986 L3669.4312,324.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8423" x="3246" y="341.2925">U02: HMAC binds reason to block/thread/blocker/blocked-user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.4312" x="3246" y="356.2412">Status can change without breaking the binding. Bounded compare-write</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="3246" y="371.1899">and full verify precede opt-in strict read; deletion clears both.</text></g><g class="entity" data-qualified-name="GMN186" data-source-line="531" id="ent0187"><path d="M3244,1752.0986 L3244,1798.9448 A4,4 0 0 0 3248,1802.9448 L3671.4268,1802.9448 A4,4 0 0 0 3675.4268,1798.9448 L3675.4268,1758.0986 L3665.4268,1748.0986 L3463.5,1748.0986 L3459.5,1730.4153 L3455.5,1748.0986 L3248,1748.0986 A4,4 0 0 0 3244,1752.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3665.4268,1748.0986 L3665.4268,1756.0986 A2,2 0 0 0 3667.4268,1758.0986 L3675.4268,1758.0986 L3665.4268,1748.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410.4268" x="3250" y="1765.2925">U02: HMAC binds reference/notes to evidence/provider UUID and kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4604" x="3250" y="1780.2412">Read verifies reference against blind index. Backfill clears stale</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="3250" y="1795.1899">indexes after null redaction; full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN189" data-source-line="536" id="ent0190"><path d="M650.5,1035.5986 L650.5,1097.3936 A4,4 0 0 0 654.5,1101.3936 L1091.6567,1101.3936 A4,4 0 0 0 1095.6567,1097.3936 L1095.6567,1041.5986 L1085.6567,1031.5986 L877,1031.5986 L873,1013.1408 L869,1031.5986 L654.5,1031.5986 A4,4 0 0 0 650.5,1035.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1085.6567,1031.5986 L1085.6567,1039.5986 A2,2 0 0 0 1087.6567,1041.5986 L1095.6567,1041.5986 L1085.6567,1031.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1567" x="656.5" y="1048.7925">U02: HMAC binds encrypted payload and review reason to request UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.3149" x="656.5" y="1063.7412">provider UUID, requester UUID and kind. Account deletion reseals each</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.9121" x="656.5" y="1078.6899">redacted payload with its own binding and clears reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="656.5" y="1093.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN192" data-source-line="542" id="ent0193"><path d="M656,1908.5986 L656,1970.3936 A4,4 0 0 0 660,1974.3936 L1086.334,1974.3936 A4,4 0 0 0 1090.334,1970.3936 L1090.334,1914.5986 L1080.334,1904.5986 L877,1904.5986 L873,1886.1408 L869,1904.5986 L660,1904.5986 A4,4 0 0 0 656,1908.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1080.334,1904.5986 L1080.334,1912.5986 A2,2 0 0 0 1082.334,1914.5986 L1090.334,1914.5986 L1080.334,1904.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.334" x="662" y="1921.7925">U02: HMAC binds reason and decisionReason to appeal UUID, subject,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="411.144" x="662" y="1936.7412">subjectId, submitter UUID and nullable provider UUID. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="405.4121" x="662" y="1951.6899">reseals each redacted reason and clears decision reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="662" y="1966.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN195" data-source-line="548" id="ent0196"><path d="M662,2289.5986 L662,2351.3936 A4,4 0 0 0 666,2355.3936 L1080.0005,2355.3936 A4,4 0 0 0 1084.0005,2351.3936 L1084.0005,2295.5986 L1074.0005,2285.5986 L877,2285.5986 L873,2267.1408 L869,2285.5986 L666,2285.5986 A4,4 0 0 0 662,2289.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1074.0005,2285.5986 L1074.0005,2293.5986 A2,2 0 0 0 1076.0005,2295.5986 L1084.0005,2295.5986 L1074.0005,2285.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0005" x="668" y="2302.7925">U02: four HMACs bind encrypted fields to gap UUID, requester UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8931" x="668" y="2317.7412">nullable provider UUID and catalog slugs/price type. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5386" x="668" y="2332.6899">reseals each redacted row and clears reviewReason with its binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="668" y="2347.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN198" data-source-line="554" id="ent0199"><path d="M2587,626.5986 L2587,688.3936 A4,4 0 0 0 2591,692.393