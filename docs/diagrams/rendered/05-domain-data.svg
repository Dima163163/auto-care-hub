552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3244.5" y="1125.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3244.5" y="1140.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3244.5" y="1155.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3244.5" y="1170.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN112" data-source-line="365" id="ent0113"><path d="M696,251.0986 L696,297.9448 A4,4 0 0 0 700,301.9448 L1026.5869,301.9448 A4,4 0 0 0 1030.5869,297.9448 L1030.5869,257.0986 L1020.5869,247.0986 L867.5,247.0986 L863.5,228.6627 L859.5,247.0986 L700,247.0986 A4,4 0 0 0 696,251.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1020.5869,247.0986 L1020.5869,255.0986 A2,2 0 0 0 1022.5869,257.0986 L1030.5869,257.0986 L1020.5869,247.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="702" y="264.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="702" y="279.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="702" y="294.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN115" data-source-line="370" id="ent0116"><path d="M3885,303.0986 L3885,339.7951 L3876.9869,123.0636 L3885,347.7951 L3885,349.9448 A4,4 0 0 0 3889,353.9448 L4131.0806,353.9448 A4,4 0 0 0 4135.0806,349.9448 L4135.0806,309.0986 L4125.0806,299.0986 L3889,299.0986 A4,4 0 0 0 3885,303.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4125.0806,299.0986 L4125.0806,307.0986 A2,2 0 0 0 4127.0806,309.0986 L4135.0806,309.0986 L4125.0806,299.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3891" y="316.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3891" y="331.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3891" y="346.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN118" data-source-line="375" id="ent0119"><path d="M3193.5,191.5986 L3193.5,283.291 A4,4 0 0 0 3197.5,287.291 L3557.374,287.291 A4,4 0 0 0 3561.374,283.291 L3561.374,197.5986 L3551.374,187.5986 L3381.5,187.5986 L3377.5,169.601 L3373.5,187.5986 L3197.5,187.5986 A4,4 0 0 0 3193.5,191.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3551.374,187.5986 L3551.374,195.5986 A2,2 0 0 0 3553.374,197.5986 L3561.374,197.5986 L3551.374,187.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3199.5" y="204.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3199.5" y="219.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3199.5" y="234.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3199.5" y="249.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3199.5" y="264.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3199.5" y="279.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN124" data-source-line="386" id="ent0125"><path d="M41.5,400.0986 L41.5,446.9448 A4,4 0 0 0 45.5,450.9448 L376.397,450.9448 A4,4 0 0 0 380.397,446.9448 L380.397,406.0986 L370.397,396.0986 L215,396.0986 L211,378.5707 L207,396.0986 L45.5,396.0986 A4,4 0 0 0 41.5,400.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,396.0986 L370.397,404.0986 A2,2 0 0 0 372.397,406.0986 L380.397,406.0986 L370.397,396.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="413.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="428.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="443.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN127" data-source-line="391" id="ent0128"><path d="M21,723.0986 L21,769.9448 A4,4 0 0 0 25,773.9448 L397.1377,773.9448 A4,4 0 0 0 401.1377,769.9448 L401.1377,729.0986 L391.1377,719.0986 L215,719.0986 L211,701.5707 L207,719.0986 L25,719.0986 A4,4 0 0 0 21,723.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,719.0986 L391.1377,727.0986 A2,2 0 0 0 393.1377,729.0986 L401.1377,729.0986 L391.1377,719.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="736.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="751.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="766.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN130" data-source-line="396" id="ent0131"><path d="M34.5,1079.0986 L34.5,1125.9448 A4,4 0 0 0 38.5,1129.9448 L383.895,1129.9448 A4,4 0 0 0 387.895,1125.9448 L387.895,1085.0986 L377.895,1075.0986 L215,1075.0986 L211,1057.4153 L207,1075.0986 L38.5,1075.0986 A4,4 0 0 0 34.5,1079.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,1075.0986 L377.895,1083.0986 A2,2 0 0 0 379.895,1085.0986 L387.895,1085.0986 L377.895,1075.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="1092.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="1107.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="1122.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN133" data-source-line="401" id="ent0134"><path d="M661,1226.0986 L661,1272.9448 A4,4 0 0 0 665,1276.9448 L1062.4077,1276.9448 A4,4 0 0 0 1066.4077,1272.9448 L1066.4077,1232.0986 L1056.4077,1222.0986 L867.5,1222.0986 L863.5,1204.4153 L859.5,1222.0986 L665,1222.0986 A4,4 0 0 0 661,1226.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1056.4077,1222.0986 L1056.4077,1230.0986 A2,2 0 0 0 1058.4077,1232.0986 L1066.4077,1232.0986 L1056.4077,1222.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="667" y="1239.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="667" y="1254.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="667" y="1269.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN136" data-source-line="406" id="ent0137"><path d="M1281,1057.0986 L1281,1103.9448 A4,4 0 0 0 1285,1107.9448 L1692.5005,1107.9448 A4,4 0 0 0 1696.5005,1103.9448 L1696.5005,1063.0986 L1686.5005,1053.0986 L1493,1053.0986 L1489,1035.4153 L1485,1053.0986 L1285,1053.0986 A4,4 0 0 0 1281,1057.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1686.5005,1053.0986 L1686.5005,1061.0986 A2,2 0 0 0 1688.5005,1063.0986 L1696.5005,1063.0986 L1686.5005,1053.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1287" y="1070.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1287" y="1085.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1287" y="1100.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN139" data-source-line="411" id="ent0140"><path d="M666,1400.0986 L666,1446.9448 A4,4 0 0 0 670,1450.9448 L1056.5596,1450.9448 A4,4 0 0 0 1060.5596,1446.9448 L1060.5596,1406.0986 L1050.5596,1396.0986 L867.5,1396.0986 L863.5,1378.4153 L859.5,1396.0986 L670,1396.0986 A4,4 0 0 0 666,1400.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1050.5596,1396.0986 L1050.5596,1404.0986 A2,2 0 0 0 1052.5596,1406.0986 L1060.5596,1406.0986 L1050.5596,1396.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="672" y="1413.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="672" y="1428.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="672" y="1443.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN142" data-source-line="416" id="ent0143"><path d="M1288.5,1479.0986 L1288.5,1525.9448 A4,4 0 0 0 1292.5,1529.9448 L1685.5977,1529.9448 A4,4 0 0 0 1689.5977,1525.9448 L1689.5977,1485.0986 L1679.5977,1475.0986 L1493,1475.0986 L1489,1457.4153 L1485,1475.0986 L1292.5,1475.0986 A4,4 0 0 0 1288.5,1479.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1679.5977,1475.0986 L1679.5977,1483.0986 A2,2 0 0 0 1681.5977,1485.0986 L1689.5977,1485.0986 L1679.5977,1475.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1294.5" y="1492.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1294.5" y="1507.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1294.5" y="1522.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN145" data-source-line="421" id="ent0146"><path d="M2536.5,1628.0986 L2536.5,1674.9448 A4,4 0 0 0 2540.5,1678.9448 L2938.6567,1678.9448 A4,4 0 0 0 2942.6567,1674.9448 L2942.6567,1634.0986 L2932.6567,1624.0986 L2743.5,1624.0986 L2739.5,1606.4153 L2735.5,1624.0986 L2540.5,1624.0986 A4,4 0 0 0 2536.5,1628.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2932.6567,1624.0986 L2932.6567,1632.0986 A2,2 0 0 0 2934.6567,1634.0986 L2942.6567,1634.0986 L2932.6567,1624.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2542.5" y="1641.2925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2542.5" y="1656.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2542.5" y="1671.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN148" data-source-line="426" id="ent0149"><path d="M2520,418.0986 L2520,464.9448 A4,4 0 0 0 2524,468.9448 L2955.3804,468.9448 A4,4 0 0 0 2959.3804,464.9448 L2959.3804,424.0986 L2949.3804,414.0986 L2743.5,414.0986 L2739.5,396.4153 L2735.5,414.0986 L2524,414.0986 A4,4 0 0 0 2520,418.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2949.3804,414.0986 L2949.3804,422.0986 A2,2 0 0 0 2951.3804,424.0986 L2959.3804,424.0986 L2949.3804,414.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2526" y="431.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2526" y="446.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2526" y="461.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN151" data-source-line="431" id="ent0152"><path d="M3162,1864.0986 L3162,1910.9448 A4,4 0 0 0 3166,1914.9448 L3588.6841,1914.9448 A4,4 0 0 0 3592.6841,1910.9448 L3592.6841,1870.0986 L3582.6841,1860.0986 L3381.5,1860.0986 L3377.5,1842.4153 L3373.5,1860.0986 L3166,1860.0986 A4,4 0 0 0 3162,1864.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3582.6841,1860.0986 L3582.6841,1868.0986 A2,2 0 0 0 3584.6841,1870.0986 L3592.6841,1870.0986 L3582.6841,1860.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3168" y="1877.2925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3168" y="1892.2412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3168" y="1907.1899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN154" data-source-line="436" id="ent0155"><path d="M3158,1403.0986 L3158,1449.9448 A4,4 0 0 0 3162,1453.9448 L3593.4312,1453.9448 A4,4 0 0 0 3597.4312,1449.9448 L3597.4312,1409.0986 L3587.4312,1399.0986 L3381.5,1399.0986 L3377.5,1381.4153 L3373.5,1399.0986 L3162,1399.0986 A4,4 0 0 0 3158,1403.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3587.4312,1399.0986 L3587.4312,1407.0986 A2,2 0 0 0 3589.4312,1409.0986 L3597.4312,1409.0986 L3587.4312,1399.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8423" x="3164" y="1416.2925">U02: HMAC binds reason to block/thread/blocker/blocked-user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.4312" x="3164" y="1431.2412">Status can change without breaking the binding. Bounded compare-write</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="3164" y="1446.1899">and full verify precede opt-in strict read; deletion clears both.</text></g><g class="entity" data-qualified-name="GMN157" data-source-line="441" id="ent0158"><path d="M3162,527.0986 L3162,573.9448 A4,4 0 0 0 3166,577.9448 L3589.4268,577.9448 A4,4 0 0 0 3593.4268,573.9448 L3593.4268,533.0986 L3583.4268,523.0986 L3381.5,523.0986 L3377.5,505.4153 L3373.5,523.0986 L3166,523.0986 A4,4 0 0 0 3162,527.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3583.4268,523.0986 L3583.4268,531.0986 A2,2 0 0 0 3585.4268,533.0986 L3593.4268,533.0986 L3583.4268,523.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410.4268" x="3168" y="540.2925">U02: HMAC binds reference/notes to evidence/provider UUID and kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4604" x="3168" y="555.2412">Read verifies reference against blind index. Backfill clears stale</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="3168" y="570.1899">indexes after null redaction; full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN160" data-source-line="446" id="ent0161"><path d="M641,425.5986 L641,487.3936 A4,4 0 0 0 645,491.3936 L1082.1567,491.3936 A4,4 0 0 0 1086.1567,487.3936 L1086.1567,431.5986 L1076.1567,421.5986 L867.5,421.5986 L863.5,403.1408 L859.5,421.5986 L645,421.5986 A4,4 0 0 0 641,425.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1076.1567,421.5986 L1076.1567,429.5986 A2,2 0 0 0 1078.1567,431.5986 L1086.1567,431.5986 L1076.1567,421.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1567" x="647" y="438.7925">U02: HMAC binds encrypted payload and review reason to request UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.3149" x="647" y="453.7412">provider UUID, requester UUID and kind. Account deletion reseals each</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.9121" x="647" y="468.6899">redacted payload with its own binding and clears reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="647" y="483.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN163" data-source-line="452" id="ent0164"><path d="M646.5,692.5986 L646.5,754.3936 A4,4 0 0 0 650.5,758.3936 L1076.834,758.3936 A4,4 0 0 0 1080.834,754.3936 L1080.834,698.5986 L1070.834,688.5986 L867.5,688.5986 L863.5,670.1408 L859.5,688.5986 L650.5,688.5986 A4,4 0 0 0 646.5,692.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M