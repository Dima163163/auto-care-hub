0 0 1122.1523,236.5986 L1130.1523,236.5986 L1120.1523,226.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="803" y="243.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="803" y="258.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="803" y="273.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="803" y="288.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN46" data-source-line="126" id="ent0047"><path d="M1329,510.5986 L1329,572.3936 A4,4 0 0 0 1333,576.3936 L1603.2642,576.3936 A4,4 0 0 0 1607.2642,572.3936 L1607.2642,516.5986 L1597.2642,506.5986 L1472,506.5986 L1468,488.7559 L1464,506.5986 L1333,506.5986 A4,4 0 0 0 1329,510.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1597.2642,506.5986 L1597.2642,514.5986 A2,2 0 0 0 1599.2642,516.5986 L1607.2642,516.5986 L1597.2642,506.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="1335" y="523.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="1335" y="538.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="1335" y="553.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="1335" y="