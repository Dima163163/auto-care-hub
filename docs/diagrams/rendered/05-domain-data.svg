698.6523,531.4984 L1688.6523,521.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1371.5" y="538.6922">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1371.5" y="553.6409">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1371.5" y="568.5897">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1371.5" y="583.5384">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN67" data-source-line="216" id="ent0068"><path d="M2638,901.4984 L2638,963.2933 A4,4 0 0 0 2642,967.2933 L2912.2642,967.2933 A4,4 0 0 0 2916.2642,963.2933 L2916.2642,907.4984 L2906.2642,897.4984 L2781,897.4984 L2777,879.6556 L2773,897.4984 L2642,897.4984 A4,4 0 0 0 2638,901.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2906.2642,897.4984 L2906.2642,905.4984 A2,2 0 0 0 2908.2642,907.4984 L2916.2642,907.4984 L2906.2642,897.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="2644" y="914.6922">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="2644" y="929.6409">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="2644" y="944.5897">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="2644" y="959.5384">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN70" data-source-line="222" id="ent0071"><path d="M633,228.9984 L633,275.8446 A4,4 0 0 0 637,279.8446 L963.5869,279.8446 A4,4 0 0 0 967.5869,275.8446 L967.5869,234.9984 L957.5869,224.9984 L804.5,224.9984 L800.5,206.5625 L796.5,224.9984 L637,224.9984 A4,4 0 0 0 633,228.9984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M957.5869,224.9984 L957.5869,232.9984 A2,2 0 0 0 959.5869,234.9984 L967.5869,234.9984 L957.5869,224.9984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="639" y="242.1922">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="639" y="257.1409">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="639" y="272.0897">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN73" data-source-line="227" id="ent0074"><path d="M3270,212.9984 L3270,249.6949 L3281.157,40.0483 L3270,257.6949 L3270,259.8446 A4,4 0 0 0 3274,263.8446 L3516.0806,263.8446 A4,4 0 0 0 3520.0806,259.8446 L3520.0806,218.9984 L3510.0806,208.9984 L3274,208.9984 A4,4 0 0 0 3270,212.9984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3510.0806,208.9984 L3510.0806,216.9984 A2,2 0 0 0 3512.0806,218.9984 L3520.0806,218.9984 L3510.0806,208.9984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3276" y="226.1922">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3276" y="241.1409">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3276" y="256.0897">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN76" data-source-line="232" id="ent0077"><path d="M2593,155.4984 L2593,247.1907 A4,4 0 0 0 2597,251.1907 L2956.874,251.1907 A4,4 0 0 0 2960.874,247.1907 L2960.874,161.4984 L2950.874,151.4984 L2781,151.4984 L2777,133.5007 L2773,151.4984 L2597,151.4984 A4,4 0 0 0 2593,155.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2950.874,151.4984 L2950.874,159.4984 A2,2 0 0 0 2952.874,161.4984 L2960.874,161.4984 L2950.874,151.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="2599" y="168.6922">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="2599" y="183.6409">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="2599" y="198.5897">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="2599" y="213.5384">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="2599" y="228.4871">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="2599" y="243.4359">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN82" data-source-line="243" id="ent0083"><path d="M41.5,234.9984 L41.5,281.8446 A4,4 0 0 0 45.5,285.8446 L376.397,285.8446 A4,4 0 0 0 380.397,281.8446 L380.397,240.9984 L370.397,230.9984 L215,230.9984 L211,213.4705 L207,230.9984 L45.5,230.9984 A4,4 0 0 0 41.5,234.9984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,230.9984 L370.397,238.9984 A2,2 0 0 0 372.397,240.9984 L380.397,240.9984 L370.397,230.9984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="248.1922">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="263.1409">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="278.0897">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN85" data-source-line="248" id="ent0086"><path d="M21,602.9984 L21,649.8446 A4,4 0 0 0 25,653.8446 L397.1377,653.8446 A4,4 0 0 0 401.1377,649.8446 L401.1377,608.9984 L391.1377,598.9984 L215,598.9984 L211,581.4705 L207,598.9984 L25,598.9984 A4,4 0 0 0 21,602.9984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,598.9984 L391.1377,606.9984 A2,2 0 0 0 393.1377,608.9984 L401.1377,608.9984 L391.1377,598.9984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="616.1922">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="631.1409">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="646.0897">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN88" data-source-line="253" id="ent0089"><path d="M6,420.9984 L6,467.8446 A4,4 0 0 0 10,471.8446 L411.7241,471.8446 A4,4 0 0 0 415.7241,467.8446 L415.7241,426.9984 L405.7241,416.9984 L215,416.9984 L211,399.4705 L207,416.9984 L10,416.9984 A4,4 0 0 0 6,420.9984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,416.9984 L405.7241,424.9984 A2,2 0 0 0 407.7241,426.9984 L415.7241,426.9984 L405.7241,416.9984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="434.1922">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="449.1409">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="464.0897">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN91" data-source-line="258" id="ent0092"><path d="M2572,581.4984 L2572,643.2933 A4,4 0 0 0 2576,647.2933 L2977.7241,647.2933 A4,4 0 0 0 2981.7241,643.2933 L2981.7241,587.4984 L2971.7241,577.4984 L2781,577.4984 L2777,559.3608 L2773,577.4984 L2576,577.4984 A4,4 0 0 0 2572,581.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2971.7241,577.4984 L2971.7241,585.4984 A2,2 0 0 0 2973.7241,587.4984 L2981.7241,587.4984 L2971.7241,577.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.165" x="2578" y="594.6922">U02: non-null body HMAC binds plaintext to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="2578" y="609.6409">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="2578" y="624.5897">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252.1924" x="2578" y="639.5384">opt-in strict read. Null body has null binding.</text></g><g class="entity" data-qualified-name="GMN94" data-source-line="264" id="ent0095"><path d="M2572,383.4984 L2572,445.2933 A4,4 0 0 0 2576,449.2933 L2977.7241,449.2933 A4,4 0 0 0 2981.7241,445.2933 L2981.7241,389.4984 L2971.7241,379.4984 L2781,379.4984 L2777,361.3608 L2773,379.4984 L2576,379.4984 A4,4 0 0 0 2572,383.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2971.7241,379.4984 L2971.7241,387.4984 A2,2 0 0 0 2973.7241,389.4984 L2981.7241,389.4984 L2971.7241,379.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="356.9414" x="2578" y="396.6922">U02: non-null offer HMAC binds decrypted JSON to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="2578" y="411.6409">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="2578" y="426.5897">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="250.0151" x="2578" y="441.5384">opt-in strict read. Null offer has null binding.</text></g><g class="entity" data-qualified-name="GMN97" data-source-line="270" id="ent0098"><path d="M1963,652.4984 L1963,714.2933 A4,4 0 0 0 1967,718.2933 L2368.7241,718.2933 A4,4 0 0 0 2372.7241,714.2933 L2372.7241,658.4984 L2362.7241,648.4984 L2172,648.4984 L2168,630.3608 L2164,648.4984 L1967,648.4984 A4,4 0 0 0 1963,652.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2362.7241,648.4984 L2362.7241,656.4984 A2,2 0 0 0 2364.7241,658.4984 L2372.7241,658.4984 L2362.7241,648.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="294.7979" x="1969" y="665.6922">U02: subject HMAC binds plaintext to thread UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="270.9561" x="1969" y="680.6409">type and request/provider/client/creator UUIDs.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="1969" y="695.5897">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="351.9141" x="1969" y="710.5384">opt-in strict read. Account deletion rebinds redacted subjects.</text></g><g class="entity" data-qualified-name="GMN100" data-source-line="276" id="ent0101"><path d="M1327,1081.4984 L1327,1143.2933 A4,4 0 0 0 1331,1147.2933 L1732.7241,1147.2933 A4,4 0 0 0 1736.7241,1143.2933 L1736.7241,1087.4984 L1726.7241,1077.4984 L1536,1077.4984 L1532,1059.3608 L1528,1077.4984 L1331,1077.4984 A4,4 0 0 0 1327,1081.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1726.7241,1077.4984 L1726.7241,1085.4984 A2,2 0 0 0 1728.7241,1087.4984 L1736.7241,1087.4984 L1726.7241,1077.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="343.9287" x="1333" y="1094.6922">U02: booking JSON HMAC binds plaintext to request UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="230.4961" x="1333" y="1109.6409">client/provider/location/definition UUIDs.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="1333" y="1124.5897">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="365.6631" x="1333" y="1139.5384">opt-in strict read. Account deletion clears snapshot and binding.</text></g><g class="entity" data-qualified-name="GMN103" data-source-line="282" id="ent0104"><path d="M3178,124.4984 L3178,186.2933 A4,4 0 0 0 3182,190.2933 L3607.8262,190.2933 A4,4 0 0 0 3611.8262,186.2933 L3611.8262,130.4984 L3601.8262,120.4984 L3399,120.4984 L3395,102.1567 L3391,120.4984 L3182,120.4984 A4,4 0 0 0 3178,124.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3601.8262,120.4984 L3601.8262,128.4984 A2,2 0 0 0 3603.8262,130.4984 L3611.8262,130.4984 L3601.8262,120.4984" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="218.918" x="3184" y="137.6922">&#1055;&#1091;&#1085;&#1082;&#1090;&#1080;&#1088; &#8212; &#1083;&#1086;&#1075;&#1080;&#1095;&#1077;&#1089;&#1082;&#1072;&#1103; &#1089;&#1074;&#1103;&#1079;&#1100;, &#1085;&#1077; FK.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="399.5278" x="3184" y="152.6409">Reference lookup fix &#1090;&#1088;&#1077;&#1073;&#1091;&#1077;&#1090; &#1087;&#1088;&#1080;&#1084;&#1077;&#1085;&#1077;&#1085;&#1080;&#1103; migration &#1080; &#1087;&#1088;&#1086;&#1074;&#1077;&#1088;&#1082;&#1080; DB.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="412.8262" x="3184" y="167.5897">Snapshot &#1080; FK &#1085;&#1077;&#1083;&#1100;&#1079;&#1103; &#1074;&#1086;&#1089;&#1089;&#1090;&#1072;&#1085;&#1072;&#1074;&#1083;&#1080;&#1074;&#1072;&#1090;&#1100; &#1080;&#1079; &#1101;&#1090;&#1086;&#1081; &#1089;&#1086;&#1082;&#1088;&#1072;&#1097;&#1105;&#1085;&#1085;&#1086;&#1081; &#1082;&#1072;&#1088;&#1090;&#1099;:</