iest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1266" y="770.1899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1266" y="785.1387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN51" data-source-line="150" id="ent0052"><path d="M2075,169.0986 L2075,230.8936 A4,4 0 0 0 2079,234.8936 L2349.2642,234.8936 A4,4 0 0 0 2353.2642,230.8936 L2353.2642,175.0986 L2343.2642,165.0986 L2218,165.0986 L2214,147.2559 L2210,165.0986 L2079,165.0986 A4,4 0 0 0 2075,169.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2343.2642,165.0986 L2343.2642,173.0986 A2,2 0 0 0 2345.2642,175.0986 L2353.2642,175.0986 L2343.2642,165.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="2081" y="182.2925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="2081" y="197.2412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="2081" y="212.1899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="2081" y="227.1387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN54" data-source-line="156" id="ent0055"><path d="M566,719.5986 L566,766.4448 A4,4 0 0 0 570,770.4448 L896.5869,770.4448 A4,4 0 0 0 900.5869,766.4448 L900.5869,725.5986 L890.5869,715.5986 L737.5,715.5986 L733.5,697.1627 L729.5,715.5986 L570,715.5986 A4,4 0 0 0 566,719.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M890.5869,715.5986 L890.5869,723.5986 A2,2 0 0 0 892.5869,725.5986 L900.5869,725.5986 L890.5869,715.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="572" y="732.7925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="572" y="747.7412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="572" y="762.6899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN57" data-source-line="161" id="ent0058"><path d="M2686,837.5986 L2686,884.4448 A4,4 0 0 0 2690,888.4448 L2932.0806,888.4448 A4,4 0 0 0 2936.0806,884.4448 L2936.0806,843.5986 L2926.0806,833.5986 L2815,833.5986 L2811,815.8386 L2807,833.5986 L2690,833.5986 A4,4 0 0 0 2686,837.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2926.0806,833.5986 L2926.0806,841.5986 A2,2 0 0 0 2928.0806,843.5986 L2936.0806,843.5986 L2926.0806,833.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="2692" y="850.7925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="2692" y="865.7412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="2692" y="880.6899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN60" data-source-line="166" id="ent0061"><path d="M2030,735.0986 L2030,826.791 A4,4 0 0 0 2034,830.791 L2393.874,830.791 A4,4 0 0 0 2397.874,826.791 L2397.874,741.0986 L2387.874,731.0986 L2218,731.0986 L2214,713.101 L2210,731.0986 L2034,731.0986 A4,4 0 0 0 2030,735.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2387.874,731.0986 L2387.874,739.0986 A2,2 0 0 0 2389.874,741.0986 L2397.874,741.0986 L2387.874,731.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="2036" y="748.2925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="2036" y="763.2412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="2036" y="778.1899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="2036" y="793.1387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="2036" y="808.0874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="2036" y="823.0361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN66" data-source-line="177" id="ent0067"><path d="M26.5,629.5986 L26.5,676.4448 A4,4 0 0 0 30.5,680.4448 L361.397,680.4448 A4,4 0 0 0 365.397,676.4448 L365.397,635.5986 L355.397,625.5986 L200,625.5986 L196,608.0707 L192,625.5986 L30.5,625.5986 A4,4 0 0 0 26.5,629.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M355.397,625.5986 L355.397,633.5986 A2,2 0 0 0 357.397,635.5986 L365.397,635.5986 L355.397,625.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="32.5" y="642.7925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="32.5" y="657.7412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="32.5" y="672.6899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN69" data-source-line="182" id="ent0070"><path d="M6,438.5986 L6,485.4448 A4,4 0 0 0 10,489.4448 L382.1377,489.4448 A4,4 0 0 0 386.1377,485.4448 L386.1377,444.5986 L376.1377,434.5986 L200,434.5986 L196,417.0707 L192,434.5986 L10,434.5986 A4,4 0 0 0 6,438.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M376.1377,434.5986 L376.1377,442.5986 A2,2 0 0 0 378.1377,444.5986 L386.1377,444.5986 L376.1377,434.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="12" y="451.7925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="466.7412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="12" y="481.6899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN72" data-source-line="187" id="ent0073"><path d="M2594,911.0986 L2594,907.0986 L2593.8789,945.8616 L2594,915.0986 L2594,972.8936 A4,4 0 0 0 2598,976.8936 L3023.8262,976.8936 A4,4 0 0 0 3027.8262,972.8936 L3027.8262,917.0986 L3017.8262,907.0986 L2598,907.0986 A4,4 0 0 0 2594,911.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3017.8262,907.0986 L3017.8262,915.0986 A2,2 0 0 0 3019.