="79.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="2405" cy="92.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="208.8315" x="2413" y="95.2925">name : autocare_service_messages</text><line style="stroke:#181818;stroke-width:1;" x1="2395" x2="2626.8315" y1="102.0474" y2="102.0474"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="2400" y="118.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="2400" y="133.1899">processed : bigint</text></g><!--class ChatCheckpoint--><g class="entity" data-qualified-name="ChatCheckpoint" data-source-line="140" id="ent0026"><rect fill="#F1F1F1" height="90.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="209.2261" x="1797.5" y="650.0986"/><ellipse cx="1811.5" cy="665.0986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M1813.9697,669.5986 L1808.0664,669.5986 L1808.0664,660.1216 L1813.9697,660.1216 L1813.9697,661.772 L1809.939,661.772 L1809.939,663.8159 L1813.5889,663.8159 L1813.5889,665.4663 L1809.939,665.4663 L1809.939,667.9482 L1813.9697,667.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="179.2261" x="1824.5" y="669.8181">ChatSubjectBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="1798.5" x2="2005.7261" y1="680.0986" y2="680.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="1808.5" cy="693.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="176.3379" x="1816.5" y="696.2925">name : autocare_chat_threads</text><line style="stroke:#181818;stroke-width:1;" x1="1798.5" x2="2005.7261" y1="703.0474" y2="703.0474"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="1803.5" y="719.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="1803.5" y="734.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN56" data-source-line="176" id="ent0057"><path d="M1327,1145.5986 L1327,1207.3936 A4,4 0 0 0 1331,1211.3936 L1656.1523,1211.3936 A4,4 0 0 0 1660.1523,1207.3936 L1660.1523,1151.5986 L1650.1523,1141.5986 L1497.5,1141.5986 L1493.5,1123.7559 L1489.5,1141.5986 L1331,1141.5986 A4,4 0 0 0 1327,1145.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1650.1523,1141.5986 L1650.1523,1149.5986 A2,2 0 0 0 1652.1523,1151.5986 L1660.1523,1151.5986 L1650.1523,1141.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1333" y="1158.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1333" y="1173.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1333" y="1188.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1333" y="1203.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN59" data-source-line="182" id="ent0060"><path d="M2372,564.5986 L2372,626.3936 A4,4 0 0 0 2376,630.3936 L2646.2642,630.3936 A4,4 0 0 0 2650.2642,626.3936 L2650.2642,570.5986 L2640.2642,560.5986 L2515,560.5986 L2511,542.7559 L2507,560.5986 L2376,560.5986 A4,4 0 0 0 2372,564.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2640.2642,560.5986 L2640.2642,568.5986 A2,2 0 0 0 2642.2642,570.5986 L2650.2642,570.5986 L2640.2642,560.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="2378" y="577.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="2378" y="592.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="2378" y="607.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="2378" y="622.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN62" data-source-line="188" id="ent0063"><path d="M633,1080.0986 L633,1126.9448 A4,4 0 0 0 637,1130.9448 L963.5869,1130.9448 A4,4 0 0 0 967.5869,1126.9448 L967.5869,1086.0986 L957.5869,1076.0986 L804.5,1076.0986 L800.5,1057.6627 L796.5,1076.0986 L637,1076.0986 A4,4 0 0 0 633,1080.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M957.5869,1076.0986 L957.5869,1084.0986 A2,2 0 0 0 959.5869,1086.0986 L967.5869,1086.0986 L957.5869,1076.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="639" y="1093.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="639" y="1108.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="639" y="1123.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN65" data-source-line="193" id="ent0066"><path d="M3004,1299.0986 L3004,1345.9448 A4,4 0 0 0 3008,1349.9448 L3250.0806,1349.9448 A4,4 0 0 0 3254.0806,1345.9448 L3254.0806,1305.0986 L3244.0806,1295.0986 L3133,1295.0986 L3129,1277.3386 L3125,1295.0986 L3008,1295.0986 A4,4 0 0 0 3004,1299.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3244.0806,1295.0986 L3244.0806,1303.0986 A2,2 0 0 0 3246.0806,1305.0986 L3254.0806,1305.0986 L3244.0806,1295.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3010" y="1312.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3010" y="1327.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3010" y="1342.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN68" data-source-line="198" id="ent0069"><path d="M2327,1153.5986 L2327,1245.291 A4,4 0 0 0 2331,1249.291 L2690.874,1249.291 A4,4 0 0 0 2694.874,1245.291 L2694.874,1159.5986 L2684.874,1149.5986 L2515,1149.5986 L2511,1131.601 L2507,1149.5986 L2331,1149.5986 A4,4 0 0 0 2327,1153.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2684.874,1149.5986 L2684.874,1157.5986 A2,2 0 0 0 2686.874,1159.5986 L2694.874,1159.5986 L2684.874,1149.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="2333" y="1166.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="2333" y="1181.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="2333" y="1196.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="2333" y="1211.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="2333" y="1226.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="2333" y="1241.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN74" data-source-line="209" id="ent0075"><path d="M41.5,933.0986 L41.5,979.9448 A4,4 0 0 0 45.5,983.9448 L376.397,983.9448 A4,4 0 0 0 380.397,979.9448 L380.397,939.0986 L370.397,929.0986 L215,929.0986 L211,911.5707 L207,929.0986 L45.5,929.0986 A4,4 0 0 0 41.5,933.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,929.0986 L370.397,937.0986 A2,2 0 0 0 372.397,939.0986 L380.397,939.0986 L370.397,929.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="946.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="961.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="976.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN77" data-source-line="214" id="ent0078"><path d="M21,1115.0986 L21,1161.9448 A4,4 0 0 0 25,1165.9448 L397.1377,1165.9448 A4,4 0 0 0 401.1377,1161.9448 L401.1377,1121.0986 L391.1377,1111.0986 L215,1111.098