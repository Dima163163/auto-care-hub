int--><g class="entity" data-qualified-name="EstimateCheckpoint" data-source-line="161" id="ent0029"><rect fill="#F1F1F1" height="90.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="243.9097" x="1410" y="874.9128"/><ellipse cx="1424" cy="889.9128" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M1426.4697,894.4128 L1420.5664,894.4128 L1420.5664,884.9358 L1426.4697,884.9358 L1426.4697,886.5862 L1422.439,886.5862 L1422.439,888.6301 L1426.0889,888.6301 L1426.0889,890.2805 L1422.439,890.2805 L1422.439,892.7624 L1426.4697,892.7624 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.9097" x="1437" y="894.6323">EstimateSnapshotBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="1411" x2="1652.9097" y1="904.9128" y2="904.9128"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="1421" cy="917.8872" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="199.4434" x="1429" y="921.1067">name : autocare_service_requests</text><line style="stroke:#181818;stroke-width:1;" x1="1411" x2="1652.9097" y1="927.8616" y2="927.8616"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="1416" y="944.0554">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="1416" y="959.0041">processed : bigint</text></g><g class="entity" data-qualified-name="GMN62" data-source-line="200" id="ent0063"><path d="M1365.5,453.4128 L1365.5,515.2077 A4,4 0 0 0 1369.5,519.2077 L1694.6523,519.2077 A4,4 0 0 0 1698.6523,515.2077 L1698.6523,459.4128 L1688.6523,449.4128 L1536,449.4128 L1532,431.5701 L1528,449.4128 L1369.5,449.4128 A4,4 0 0 0 1365.5,453.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1688.6523,449.4128 L1688.6523,457.4128 A2,2 0 0 0 1690.6523,459.4128 L1698.6523,459.4128 L1688.6523,449.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1371.5" y="466.6067">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1371.5" y="481.5554">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1371.5" y="496.5041">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1371.5" y="511.4529">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN65" data-source-line="206" id="ent0066"><path d="M2638,928.4128 L2638,990.2077 A4,4 0 0 0 2642,994.2077 L2912.2642,994.2077 A4,4 0 0 0 2916.2642,990.2077 L2916.2642,934.4128 L2906.2642,924.4128 L2781,924.4128 L2777,906.5701 L2773,924.4128 L2642,924.4128 A4,4 0 0 0 2638,928.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2906.2642,924.4128 L2906.2642,932.4128 A2,2 0 0 0 2908.2642,934.4128 L2916.2642,934.4128 L2906.2642,924.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="2644" y="941.6067">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="2644" y="956.5554">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="2644" y="971.5041">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="2644" y="986.4529">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN68" data-source-line="212" id="ent0069"><path d="M633,255.9128 L633,302.759 A4,4 0 0 0 637,306.759 L963.5869,306.759 A4,4 0 0 0 967.5869,302.759 L967.5869,261.9128 L957.5869,251.9128 L804.5,251.9128 L800.5,233.4769 L796.5,251.9128 L637,251.9128 A4,4 0 0 0 633,255.9128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M957.5869,251.9128 L957.5869,259.9128 A2,2 0 0 0 959.5869,261.9128 L967.5869,261.9128 L957.5869,251.9128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="639" y="269.1067">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="639" y="284.0554">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="639" y="299.0041">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN71" data-source-line="217" id="ent0072"><path d="M3270,221.9128 L3270,258.6093 L3281.157,48.9628 L3270,266.6093 L3270,268.759 A4,4 0 0 0 3274,272.759 L3516.0806,272.759 A4,4 0 0 0 3520.0806,268.759 L3520.0806,227.9128 L3510.0806,217.9128 L3274,217.9128 A4,4 0 0 0 3270,221.9128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3510.0806,217.9128 L3510.0806,225.9128 A2,2 0 0 0 3512.0806,227.9128 L3520.0806,227.9128 L3510.0806,217.9128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3276" y="235.1067">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3276" y="250.0554">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3276" y="265.0041">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN74" data-source-line="222" id="ent0075"><path d="M2593,182.4128 L2593,274.1052 A4,4 0 0 0 2597,278.1052 L2956.874,278.1052 A4,4 0 0 0 2960.874,274.1052 L2960.874,188.4128 L2950.874,178.4128 L2781,178.4128 L2777,160.4151 L2773,178.4128 L2597,178.4128 A4,4 0 0 0 2593,182.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2950.874,178.4128 L2950.874,186.4128 A2,2 0 0 0 2952.874,188.4128 L2960.874,188.4128 L2950.874,178.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="2599" y="195.6067">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="2599" y="210.5554">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="2599" y="225.5041">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="2599" y="240.4529">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="2599" y="255.4016">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="2599" y="270.3503">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN80" data-source-line="233" id="ent0081"><path d="M41.5,280.9128 L41.5,327.759 A4,4 0 0 0 45.5,331.759 L376.397,331.759 A4,4 0 0 0 380.397,327.759 L380.397,286.9128 L370.397,276.9128 L215,276.9128 L211,259.3849 L207,276.9128 L45.5,276.9128 A4,4 0 0 0 41.5,280.9128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,276.9128 L370.397,284.9128 A2,2 0 0 0 372.397,286.9128 L380.397,286.9128 L370.397,276.9128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="294.1067">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="309.0554">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="324.0041">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN83" data-source-line="238" id="ent0084"><path d="M21,645.9128 L21,692.759 A4,4 0 0 0 25,696.759 L397.1377,696.759 A4,4 0 0 0 401.1377,692.759 L401.1377,651.9128 L391.1377,641.9128 L215,641.9128 L211,624.3849 L207,641.9128 L25,641.9128 A4,4 0 0 0 21,645.9128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,641.9128 L391.1377,649.9128 A2,2 0 0 0 393.1377,651.9128 L401.1377,651.9128 L391.1377,641.9128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="659.1067">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="674.0554">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="689.0041">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN86" data-source-line="243" id="ent0087"><path d="M6,463.9128 L6,510.759 A4,4 0 0 0 10,514.759 L411.7241,514.759 A4,4 0 0 0 415.7241,510.759 L415.7241,469.9128 L405.7241,459.9128 L215,459.9128 L211,442.3849 L207,459.9128 L10,459.9128 A4,4 0 0 0 6,463.9128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,459.9128 L405.7241,467.9128 A2,2 0 0 0 407.7241,469.9128 L415.7241,469.9128 L405.7241,459.9128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="477.1067">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="492.0554">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="507.0041">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN89" data-source-line="248" id="ent0090"><path d="M2572,608.4128 L2572,670.2077 A4,4 0 0 0 2576,674.2077 L2977.7241,674.2077 A4,4 0 0 0 2981.7241,670.2077 L2981.7241,614.4128 L2971.7241,604.4128 L2781,604.4128 L2777,586.2753 L2773,604.4128 L2576,604.4128 A4,4 0 0 0 2572,608.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2971.7241,604.4128 L2971.7241,612.4128 A2,2 0 0 0 2973.7241,614.4128 L2981.7241,614.4128 L2971.7241,604.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.165" x="2578" y="621.6067">U02: non-null body HMAC binds plaintext to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="2578" y="636.5554">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="2578" y="651.5041">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252.1924" x="2578" y="666.4529">opt-in strict read. Null body has null binding.</text></g><g class="entity" data-qualified-name="GMN92" data-source-line="254" id="ent0093"><path d="M2572,410.4128 L2572,472.2077 A4,4 0 0 0 2576,476.2077 L2977.7241,476.2077 A4,4 0 0 0 2981.7241,472.2077 L2981.7241,416.4128 L2971.7241,406.4128 L2781,406.4128 L2777,388.2753 L2773,406.4128 L2576,406.4128 A4,4 0 0 0 2572,410.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2971.7241,406.4128 L2971.7241,414.4128 A2,2 0 0 0 2973.7241,416.4128 L2981.7241,416.4128 L2971.7241,406.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="356.9414" x="2578" y="423.6067">U02: non-null offer HMAC binds decrypted JSON to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="2578" y="438.5554">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="2578" y="453.5041">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="250.0151" x="2578" y="468.4529">opt-in strict read. Null offer has null binding.</text></g><g class="entity" data-qualified-name="GMN95" data-source-line="260" id="ent0096"><path d="M1963,701.4128 L1963,763.2077 A4,4 0 0 0 1967,767.2077 L2368.7241,767.2077 A4,4 0 0 0 2372.7241,763.2077 L2372.7241,707.4128 L2362.7241,697.4128 L2172,697.4128 L2168,679.2753 L2164,697.4128 L1967,697.4128 A4,4 0 0 0 1963,701.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2362.7241,697.4128 L2362.7241,705.4128 A2,2 0 0 0 2364.7241,707.4128 L2372.7241,707.4128 L2362.7241,697.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="294.7979" x="1969" y="714.6067">U02: subject HMAC binds plaintext to thread UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="270.9561" x="1969" y="729.5554">type and request/provider/client/creator UUIDs.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="1969" y="744.5041">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="351.9141" x="1969" y="759.4529">opt-in strict read. Account deletion rebinds redacted subjects.</text></g><g class="entity" data-qualified-name="GMN98" data-source-line="266" id="ent0099"><path d="M1327,752.4128 L1327,814.2077 A4,4 0 0 0 1331,818.2077 L1732.7241,818.2077 A4,4 0 0 0 1736.7241,814.2077 L1736.7241,758.4128 L1726.7241,748.4128 L1536,748.4128 L1532,730.2753 L1528,748.4128 L1331,748.4128 A4,4 0 0 0 1327,752.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1726.7241,748.4128 L1726.7241,756.4128 A2,2 0 0 0 1728.7241,758.4128 L1736.7241,758.4128 L1726.7241,748.4128" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="343.9287" x="1333" y="765.6067">U02: booking JSON HMAC binds plaintext to request UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="230.4961" x="1333" y="780.5554">client/provider/location/definition UUIDs.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjus