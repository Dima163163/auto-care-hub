.939,138.9663 L121.939,141.4482 L125.9697,141.4482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="172.7007" x="136.5" y="143.3181">UserProfileBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="110.5" x2="311.2007" y1="153.5986" y2="153.5986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="120.5" cy="166.573" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="75.1436" x="128.5" y="169.7925">name : users</text><line style="stroke:#181818;stroke-width:1;" x1="110.5" x2="311.2007" y1="176.5474" y2="176.5474"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="115.5" y="192.7412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="115.5" y="207.6899">processed : bigint</text></g><!--class MessageCheckpoint--><g class="entity" data-qualified-name="MessageCheckpoint" data-source-line="126" id="ent0024"><rect fill="#F1F1F1" height="90.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="233.8315" x="2185" y="283.5986"/><ellipse cx="2204.8709" cy="298.5986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M2207.3406,303.0986 L2201.4373,303.0986 L2201.4373,293.6216 L2207.3406,293.6216 L2207.3406,295.272 L2203.3098,295.272 L2203.3098,297.3159 L2206.9597,297.3159 L2206.9597,298.9663 L2203.3098,298.9663 L2203.3098,301.4482 L2207.3406,301.4482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="190.7852" x="2219.1755" y="303.3181">MessageBodyBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="2186" x2="2417.8315" y1="313.5986" y2="313.5986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="2196" cy="326.573" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="208.8315" x="2204" y="329.7925">name : autocare_service_messages</text><line style="stroke:#181818;stroke-width:1;" x1="2186" x2="2417.8315" y1="336.5474" y2="336.5474"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="2191" y="352.7412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="2191" y="367.6899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN52" data-source-line="160" id="ent0053"><path d="M1327,169.0986 L1327,230.8936 A4,4 0 0 0 1331,234.8936 L1656.1523,234.8936 A4,4 0 0 0 1660.1523,230.8936 L1660.1523,175.0986 L1650.1523,165.0986 L1497.5,165.0986 L1493.5,147.2559 L1489.5,165.0986 L1331,165.0986 A4,4 0 0 0 1327,169.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1650.1523,165.0986 L1650.1523,173.0986 A2,2 0 0 0 1652.1523,175.0986 L1660.1523,175.0986 L1650.1523,165.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1333" y="182.2925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1333" y="197.2412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1333" y="212.1899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1333" y="227.1387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN55" data-source-line="166" id="ent0056"><path d="M2163,687.0986 L2163,748.8936 A4,4 0 0 0 2167,752.8936 L2437.2642,752.8936 A4,4 0 0 0 2441.2642,748.8936 L2441.2642,693.0986 L2431.2642,683.0986 L2306,683.0986 L2302,665.2559 L2298,683.0986 L2167,683.0986 A4,4 0 0 0 2163,687.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2431.2642,683.0986 L2431.2642,691.0986 A2,2 0 0 0 2433.2642,693.0986 L2441.2642,693.0986 L2431.2642,683.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="2169" y="700.2925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="2169" y="715.2412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="2169" y="730.1899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="2169" y="745.1387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN58" data-source-line="172" id="ent0059"><path d="M633,334.5986 L633,381.4448 A4,4 0 0 0 637,385.4448 L963.5869,385.4448 A4,4 0 0 0 967.5869,381.4448 L967.5869,340.5986 L957.5869,330.5986 L804.5,330.5986 L800.5,312.1627 L796.5,330.5986 L637,330.5986 A4,4 0 0 0 633,334.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M957.5869,330.5986 L957.5869,338.5986 A2,2 0 0 0 959.5869,340.5986 L967.5869,340.5986 L957.5869,330.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="639" y="347.7925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="639" y="362.7412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="639" y="377.6899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN61" data-source-line="177" id="ent0062"><path d="M2795,347.5986 L2795,384.2951 L2806.2167,141.0784 L2795,392.2951 L2795,394.4448 A4,4 0 0 0 2799,398.4448 L3041.0806,398.4448 A4,4 0 0 0 3045.0806,394.4448 L3045.0806,353.5986 L3035.0806,343.5986 L2799,343.5986 A4,4 0 0 0 2795,347.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3035.0806,343.5986 L3035.0806,351.5986 A2,2 0 0 0 3037.0806,353.5986 L3045.0806,353.5986 L3035.0806,343.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="2801" y="360.7925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="2801" y="375.7412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="2801" y="390.6899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN64" data-source-line="182" id="ent0065"><path d="M2118,169.0986 L2118,260.791 A4,4 0 0 0 2122,264.791 L2481.874,264.791 A4,4 0 0 0 2485.874,260.791 L2485.874,175.0986 L2475.874,165.0986 L2306,165.0986 L2302,147.101 L2298,165.0986 L2122,165.0986 A4,4 0 0 0 2118,169.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2475.874,165.0986 L2475.874,173.0986 A2,2 0 0 0 2477.874,175.0986 L2485.874,175.0986 L2475.874,165.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="2124" y="182.2925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="2124" y="197.2412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="2124" y="212.1899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="2124" y="227.1387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="2124" y="242.0874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="2124" y="257.0361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN70" data-source-line="193" id="ent0071"><path d="M41.5,418.5986 L41.5,465.4448 A4,4 0 0 0 45.5,469.4448 L376.397,469.4448 A4,4 0 0 0 380.397,465.4448 L380.397,424.5986 L370.397,414.5986 L215,414.5986 L211,397.0707 L207,414.5986 L45.5,414.5986 A4,4 0 0 0 41.5,418.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,414.5986 L370.397,422.5986 A2,2 0 0 0 372.397,424.5986 L380.397,424.5986 L370.397,414.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="431.7925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="446.7412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="461.6899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN73" data-source-line="198" id="ent0074"><path d="M21,600.5986 L21,647.4448 A4,4 0 0 0 25,651.4448 L397.1377,651.4448 A4,4 0 0 0 401.1377,647.4448 L401.1377,606.5986 L391.1377,596.5986 L215,596.5986 L211,579.0707 L207,596.5986 L25,596.5986 A4,4 0 0 0 21,600.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,596.5986 L391.1377,604.5986 A2,2 0 0 0 393.1377,606.5986 L401.1377,606.5986 L391.1377,596.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="613.7925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="628.7412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="643.6899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN76" data-source-line="203" id="ent0077"><path d="M6,236.5986 L6,283.4448 A4,4 0 0 0 10,287.4448 L411.7241,287.4448 A4,4 0 0 0 415.7241,283.4448 L415.7241,242.5986 L405.7241,232.5986 L215,232.5986 L211,215.0707 L207,232.5986 L10,232.5986 A4,4 0 0 0 6,236.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,232.5986 L405.7241,240.5986 A2,2 0 0 0 407.7241,242.5986 L415.7241,242.5986 L405.7241,232.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="249.7925">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="264.7412">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#