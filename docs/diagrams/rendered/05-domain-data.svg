" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="1308.5" y="1138.2925">name : autocare_broadcast_requests</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="1308.5" y="1153.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="1308.5" y="1168.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN119" data-source-line="394" id="ent0120"><path d="M2526.5,2009.5986 L2526.5,2071.3936 A4,4 0 0 0 2530.5,2075.3936 L2855.6523,2075.3936 A4,4 0 0 0 2859.6523,2071.3936 L2859.6523,2015.5986 L2849.6523,2005.5986 L2697,2005.5986 L2693,1987.7559 L2689,2005.5986 L2530.5,2005.5986 A4,4 0 0 0 2526.5,2009.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2849.6523,2005.5986 L2849.6523,2013.5986 A2,2 0 0 0 2851.6523,2015.5986 L2859.6523,2015.5986 L2849.6523,2005.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="2532.5" y="2022.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="2532.5" y="2037.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="2532.5" y="2052.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="2532.5" y="2067.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN122" data-source-line="400" id="ent0123"><path d="M3199.5,1533.5986 L3199.5,1575.0961 L3219.6116,1205.7084 L3199.5,1583.0961 L3199.5,1595.3936 A4,4 0 0 0 3203.5,1599.3936 L3473.7642,1599.3936 A4,4 0 0 0 3477.7642,1595.3936 L3477.7642,1539.5986 L3467.7642,1529.5986 L3203.5,1529.5986 A4,4 0 0 0 3199.5,1533.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3467.7642,1529.5986 L3467.7642,1537.5986 A2,2 0 0 0 3469.7642,1539.5986 L3477.7642,1539.5986 L3467.7642,1529.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3205.5" y="1546.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3205.5" y="1561.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3205.5" y="1576.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3205.5" y="1591.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN125" data-source-line="406" id="ent0126"><path d="M580,1713.0986 L580,1759.9448 A4,4 0 0 0 584,1763.9448 L910.5869,1763.9448 A4,4 0 0 0 914.5869,1759.9448 L914.5869,1719.0986 L904.5869,1709.0986 L751.5,1709.0986 L747.5,1690.6627 L743.5,1709.0986 L584,1709.0986 A4,4 0 0 0 580,1713.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M904.5869,1709.0986 L904.5869,1717.0986 A2,2 0 0 0 906.5869,1719.0986 L914.5869,1719.0986 L904.5869,1709.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="586" y="1726.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="586" y="1741.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="586" y="1756.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN128" data-source-line="411" id="ent0129"><path d="M3846,1955.0986 L3846,2001.9448 A4,4 0 0 0 3850,2005.9448 L4092.0806,2005.9448 A4,4 0 0 0 4096.0806,2001.9448 L4096.0806,1961.0986 L4086.0806,1951.0986 L3975,1951.0986 L3971,1933.3133 L3967,1951.0986 L3850,1951.0986 A4,4 0 0 0 3846,1955.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4086.0806,1951.0986 L4086.0806,1959.0986 A2,2 0 0 0 4088.0806,1961.0986 L4096.0806,1961.0986 L4086.0806,1951.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3852" y="1968.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3852" y="1983.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3852" y="1998.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN131" data-source-line="416" id="ent0132"><path d="M3154.5,1621.5986 L3154.5,1665.5666 L3207.6095,1454.173 L3154.5,1673.5666 L3154.5,1713.291 A4,4 0 0 0 3158.5,1717.291 L3518.374,1717.291 A4,4 0 0 0 3522.374,1713.291 L3522.374,1627.5986 L3512.374,1617.5986 L3158.5,1617.5986 A4,4 0 0 0 3154.5,1621.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3512.374,1617.5986 L3512.374,1625.5986 A2,2 0 0 0 3514.374,1627.5986 L3522.374,1627.5986 L3512.374,1617.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3160.5" y="1634.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3160.5" y="1649.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3160.5" y="1664.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3160.5" y="1679.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3160.5" y="1694.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3160.5" y="1709.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN137" data-source-line="427" id="ent0138"><path d="M6,1950.0986 L6,1996.9448 A4,4 0 0 0 10,2000.9448 L340.897,2000.9448 A4,4 0 0 0 344.897,1996.9448 L344.897,1956.0986 L334.897,1946.0986 L179.5,1946.0986 L175.5,1928.5707 L171.5,1946.0986 L10,1946.0986 A4,4 0 0 0 6,1950.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M334.897,1946.0986 L334.897,1954.0986 A2,2 0 0 0 336.897,1956.0986 L344.897,1956.0986 L334.897,1946.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="12" y="1963.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="12" y="1978.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="12" y="1993.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN140" data-source-line="432" id="ent0141"><path d="M557.5,2124.0986 L557.5,2170.9448 A4,4 0 0 0 561.5,2174.9448 L933.6377,2174.9448 A4,4 0 0 0 937.6377,2170.9448 L937.6377,2130.0986 L927.6377,2120.0986 L751.5,2120.0986 L747.5,2102.5707 L743.5,2120.0986 L561.5,2120.0986 A4,4 0 0 0 557.5,2124.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M927.6377,2120.0986 L927.6377,2128.0986 A2,2 0 0 0 929.6377,2130.0986 L937.6377,2130.0986 L927.6377,2120.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="563.5" y="2137.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="563.5" y="2152.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="563.5" y="2167.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN143" data-source-line="437" id="ent0144"><path d="M571,1887.0986 L571,1933.9448 A4,4 0 0 0 575,1937.9448 L920.395,1937.9448 A4,4 0 0 0 924.395,1933.9448 L924.395,1893.0986 L914.395,1883.0986 L751.5,1883.0986 L747.5,1865.4153 L743.5,1883.0986 L575,1883.0986 A4,4 0 0 0 571,1887.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M914.395,1883.0986 L914.395,1891.0986 A2,2 0 0 0 916.395,1893.0986 L924.395,1893.0986 L914.395,1883.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="577" y="1900.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="577" y="1915.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="577" y="1930.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN146" data-source-line="442" id="ent0147"><path d="M1209.5,1901.0986 L1209.5,1947.9448 A4,4 0 0 0 1213.5,1951.9448 L1610.9077,1951.9448 A4,4 0 0 0 1614.9077,1947.9448 L1614.9077,1907.0986 L1604.9077,1897.0986 L1416,1897.0986 L1412,1879.4153 L1408,1897.0986 L1213.5,1897.0986 A4,4 0 0 0 1209.5,1901.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1604.9077,1897.0986 L1604.9077,1905.0986 A2,2 0 0 0 1606.9077,1907.0986 L1614.9077,1907.0986 L1604.9077,1897.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="1215.5" y="1914.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="1215.5" y="1929.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="1215.5" y="1944.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN149" data-source-line="447" id="ent0150"><path d="M1824,2453.0986 L1824,2481.3767 L1898.2765,2046.0808 L1824,2489.3767 L1824,2499.9448 A4,4 0 0 0 1828,2503.9448 L2235.5005,2503.9448 A4,4 0 0 0 2239.5005,2499.9448 L2239.5005,2459.0986 L2229.5005,2449.0986 L1828,2449.0986 A4,4 0 0 0 1824,2453.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2229.5005,2449.0986 L2229.5005,2457.0986 A2,2 0 0 0 2231.5005,2459.0986 L2239.5005,2459.0986 L2229.5005,2449.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1830" y="2466.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1830" y="2481.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1830" y="2496.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN152" data-source-line="452" id="ent0153"><path d="M1214.5,2642.0986 L1214.5,2688.9448 A4,4 0 0 0 1218.5,2692.9448 L1605.0596,2692.9448 A4,4 0 0 0 1609.0596,2688.9448 L1609.0596,2648.0986 L1599.0596,2638.0986 L1416,2638.0986 L1412,2620.4153 L1408,2638.0986 L1218.5,2638.0986 A4,4 0 0 0 1214.5,2642.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1599.0596,2638.0986 L1599.0596,2646.0986 A2,2 0 0 0 1601.0596,2648.0986 L1609.0596,2648.0986 L1599.0596,2638.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="1220.5" y="2655.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="1220.5" y="2670.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="1220.5" y="2685.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN155" data-source-line="457" id="ent0156"><path d="M1831.5,2758.0986 L1831.5,2804.9448 A4,4 0 0 0 1835.5,2808.9448 L2228.5977,2808.9448 A4,4 0 0 0 2232.5977,2804.9448 L2232.5977,2764.0986 L2222.5977,2754.0986 L2036,2754.0986 L2032,2736.4153 L2028,2754.0986 L1835.5,2754.0986 A4,4 0 0 0 1831.5,2758.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2222.5977,2754.0986 L2222.5977,2762.0986 A2,2 0 0 0 2224.5977,2764.0986 L2232.5977,2764.0986 L2222.5977,2754.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1837.5" y="2771.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1837.5" y="2786.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1837.5" y="2801.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN158" data-source-line="462" id="ent0159"><path d="M2490,1439.0986 L2490,1485.9448 A4,4 0 0 0 2494,1489.9448 L2892.1567,1489.9448 A4,4 0 0 0 2896.1567,1485.9448 L2896.1567,1445.0986 L2886.1567,1435.0986 L2697,1435.0986 L2693,1417.4153 L2689,1435.0986 L2494,1435.0986 A4,4 0 0 0 2490,1439.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2886.1567,1435.0986 L2886.1567,1443.0986 A2,2 0 0 0 2888.1567,1445.0986 L2896.1567,1445.0986 L2886.1567,1435.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2496" y="1452.2925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2496" y="1467.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2496" y="1482.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN161" data-source-line="467" id="ent0162"><path d="M2473.5,1782.0986 L2473.5,1828.9448 A4,4 0 0 0 2477.5,1832.9448 L2908.8804,1832.9448 A4,4 0 0 0 2912.8804,1828.9448 L2912.8804,1788.0986 L2902.8804,1778.0986 L2697,1778.0986 L2693,1760.4153 L2689,1778.0986 L2477.5,1778.0986 A4,4 0 0 0 2473.5,1782.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2902.8804,1778.0986 L2902.8804,1786.0986 A2,2 0 0 0 2904.8804,1788.0986 L2912.8804,1788.0986 L2902.8804,1778.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2479.5" y="1795.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2479.5" y="1810.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2479.5" y="1825.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN164" data-source-line="472" id="ent0165"><path d="M3123,271.0986 L3123,300.8426 L3223.4458,78.8913 L3123,308.8426 L3123,317.9448 A4,4 0 0 0 3127,321.9448 L3549.6841,321.9448 A4,4 0 0 0 3553.6841,317.9448 L3553.6841,277.0986 L3543.6841,267.0986 L3127,267.0986 A4,4 0 0 0 3123,271.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3543.6841,267.0986 L3543.6841,275.0986 A2,2 0 0 0 3545.6841,277.0986 L3553.6841,277.0986 L3543.6841,267.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3129" y="284.2925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3129" y="299.2412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3129" y="314.1899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN167" data-source-line="477" id="ent0168"><path d="M3119,445.0986 L3119,491.9448 A4,4 0 0 0 3123,495.9448 L3554.4312,495.9448 A4,4 0 0 0 3558.4312,491.9448 L3558.4312,451.0986 L3548.4312,441.0986 L3342.5,441.0986 L3338.5,423.4153 L3334.5,441.0986 L3123,441.0986 A4,4 0 0 0 3119,445.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3548.4312,441.0986 L3548.4312,449.0986 A2,2 0 0 0 3550.4312,451.0986 L3558.4312,451.0986 L3548.4312,441.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8423" x="3125" y="458.2925">U02: HMAC binds reason to block/thread/blocker/blocked-user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.4312" x="3125" y="473.2412">Status can change without breaking the binding. Bounded compare-write</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="3125" y="488.1899">and full verify precede opt-in strict read; deletion clears both.</text></g><g class="entity" data-qualified-name="GMN170" data-source-line="482" id="ent0171"><path d="M3123,1995.0986 L3123,2041.9448 A4,4 0 0 0 3127,2045.9448 L3550.4268,2045.9448 A4,4 0 0 0 3554.4268,2041.9448 L3554.4268,2001.0986 L3544.4268,1991.0986 L3342.5,1991.0986 L3338.5,1973.4153 L3334.5,1991.0986 L3127,1991.0986 A4,4 0 0 0 3123,1995.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3544.4268,1991.0986 L3544.4268,1999.0986 A2,2 0 0 0 3546.4268,2001.0986 L3554.4268,2001.0986 L3544.4268,1991.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410.4268" x="3129" y="2008.2925">U02: HMAC binds reference/notes to evidence/provider UUID and kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4604" x="3129" y="2023.2412">Read verifies reference against blind index. Backfill clears stale</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="3129" y="2038.1899">indexes after null redaction; full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN173" data-source-line="487" id="ent0174"><path d="M525,1495.5986 L525,1557.3936 A4,4 0 0 0 529,1561.3936 L966.1567,1561.3936 A4,4 0 0 0 970.1567,1557.3936 L970.1567,1501.5986 L960.1567,1491.5986 L751.5,1491.5986 L747.5,1473.1408 L743.5,1491.5986 L529,1491.5986 A4,4 0 0 0 525,1495.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M960.1567,1491.5986 L960.1567,1499.5986 A2,2 0 0 0 962.1567,1501.5986 L970.1567,1501.5986 L960.1567,1491.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1567" x="531" y="1508.7925">U02: HMAC binds encrypted payload and review reason to request UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.3149" x="531" y="1523.7412">provider UUID, requester UUID and kind. Account deletion reseals each</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.9121" x="531" y="1538.6899">redacted payload with its own binding and clears reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="531" y="1553.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN176" data-source-line="493" id="ent0177"><path d="M1195,2255.5986 L1195,2317.3936 A4,4 0 0 0 1199,2321.3936 L1625.334,2321.3936 A4,4 0 0 0 1629.334,2317.3936 L1629.334,2261.5986 L1619.334,2251.5986 L1416,2251.5986 L1412,2233.1408 L1408,2251.5986 L1199,2251.5986 A4,4 0 0 0 1195,2255.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1619.334,2251.5986 L1619.334,2259.5986 A2,2 0 0 0 1621.334,2261.5986 L1629.334,2261.5986 L1619.334,2251.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.334" x="1201" y="2268.7925">U02: HMAC binds reason and decisionReason to appeal UUID, subject,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="411.144" x="1201" y="2283.7412">subjectId, submitter UUID and nullable provider UUID. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="405.4121" x="1201" y="2298.6899">reseals each redacted reason and clears decision reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="1201" y="2313.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN179" data-source-line="499" id="ent0180"><path d="M1201,2445.5986 L1201,2507.3936 A4,4 0 0 0 1205,2511.3936 L1619.0005,2511.3936 A4,4 0 0 0 1623.0005,2507.3936 L1623.0005,2451.5986 L1613.0005,2441.5986 L1416,2441.5986 L1412,2423.1408 L1408,2441.5986 L1205,2441.5986 A4,4 0 0 0 1201,2445.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1613.0005,2441.5986 L1613.0005,2449.5986 A2,2 0 0 0 1615.0005,2451.5986 L1623.0005,2451.5986 L1613.0005,2441.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0005" x="1207" y="2458.7925">U02: four HMACs bind encrypted fields to gap UUID, requester UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8931" x="1207" y="2473.7412">nullable provider UUID and catalog slugs/price type. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5386" x="1207" y="2488.6899">reseals each redacted row and clears reviewReason with its binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="1207" y="2503.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN182" data-source-line="505" id="ent0183"><path d="M2466,263.5986 L2466,325.3936 A4,4 0 0 0 2470,329.3936 L2915.834,329.3936 A4,4 0 0 0 2919.834,325.3936 L2919.834,269.5986 L2909.834,259.5986 L2697,259.5986 L2693,241.1408 L2689,259.5986 L2470,259.5986 A4,4 0 0 0 2466,263.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2909.834,259.5986 L2909.834,267.5986 A2,2 0 0 0 2911.834,269.5986 L2919.834,269.5986 L2909.834,259.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="432.834" x="2472" y="276.7925">U02: three HMACs bind encrypted title, notes and metadata to event UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1885" x="2472" y="291.7412">request UUID and eventType. Account deletion reseals title and metadata</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="379.3486" x="2472" y="306.6899">for each row and clears notes with its binding. Full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="96.8145" x="2472" y="321.6387">opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN185" data-source-line="511" id="ent0186"><path d="M1204.5,1197.0986 L1204.5,1273.8423 A4,4 0 0 0 1208.5,1277.8423 L1615.3467,1277.8423 A4,4 0 0 0 1619.3467,1273.8423 L1619.3467,1203.0986 L1609.3467,1193.0986 L1416,1193.0986 L1412,1175.3412 L1408,1193.0986 L1208.5,1193.0986 A4,4 0 0 0 1204.5,1197.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1609.3467,1193.0986 L1609.3467,1201.0986 A2,2 0 0 0 1611.3467,1203.0986 L1619.3467,1203.0986 L1609.3467,1193.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="390.2158" x="1210.5" y="1210.2925">U02: HMAC binds issueDescription and nullable vehicleSnapshot to</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="285.3906" x="1210.5" y="1225.2412">broadcast UUID, client UUID and definition UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="354.7832" x="1210.5" y="1240.1899">marketId is excluded: the FK sets it to null on market deletion.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="393.8467" x="1210.5" y="1255.1387">Account deletion reseals redacted issue and clears vehicle snapshot</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.0151" x="1210.5" y="1270.0874">with binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN188" data-source-line="518" id="ent0189"><path d="M542.5,2306.0986 L542.5,2352.9448 A4,4 0 0 0 546.5,2356.9448 L948.2241,2356.9448 A4,4 0 0 0 952.2241,2352.9448 L952.2241,2312.0986 L942.2241,2302.0986 L751.5,2302.0986 L747.5,2284.5707 L743.5,2302.0986 L546.5,2302.0986 A4,4 0 0 0 542.5,2306.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M942.2241,2302.0986 L942.2241,2310.0986 A2,2 0 0 0 944.2241,2312.0986 L952.2241,2312.0986 L942.2241,2302.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="548.5" y="2319.2925">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="548.5" y="2334.2412">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="548.5" y="2349.1899">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN191" data-source-line="523" id="ent0192"><path d="M3133.5,1081.5986 L3133.5,1115.5453 L3221.3551,902.082 L3133.5,1123.5453 L3133.5,1143.3936 A4,4 0 0 0 3137.5,1147.3936 L3539.2241,1147.3936 A4,4 0 0 0 3543.2241,1143.3936 L3543.2241,1087.5986 L3533.2241,1077.5986 L3137.5,1077.5986 A4,4 0 0 0 3133.5,1081.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3533.2241,1077.5986 L3533.2241,1085.5986 A2,2 0 0 0 3535.2241,1087.5986 L3543.2241,1087.5986 L3533.2241,1077.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.165" x="3139.5" y="1094.7925">U02: non-null body HMAC binds plaintext to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="3139.5" y="1109.7412">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="3139.5" y="1124.6899">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252.1