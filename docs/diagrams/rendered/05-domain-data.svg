troke-width:1;" x1="2021.5" x2="2228.7261" y1="594.0474" y2="594.0474"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="2026.5" y="610.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="2026.5" y="625.1899">processed : bigint</text></g><!--class BookingCheckpoint--><g class="entity" data-qualified-name="BookingCheckpoint" data-source-line="147" id="ent0027"><rect fill="#F1F1F1" height="90.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="240.3169" x="1412" y="640.0986"/><ellipse cx="1426" cy="655.0986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M1428.4697,659.5986 L1422.5664,659.5986 L1422.5664,650.1216 L1428.4697,650.1216 L1428.4697,651.772 L1424.439,651.772 L1424.439,653.8159 L1428.0889,653.8159 L1428.0889,655.4663 L1424.439,655.4663 L1424.439,657.9482 L1428.4697,657.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="210.3169" x="1439" y="659.8181">BookingSnapshotBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="1413" x2="1651.3169" y1="670.0986" y2="670.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="1423" cy="683.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="199.4434" x="1431" y="686.2925">name : autocare_service_requests</text><line style="stroke:#181818;stroke-width:1;" x1="1413" x2="1651.3169" y1="693.0474" y2="693.0474"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="1418" y="709.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="1418" y="724.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN58" data-source-line="184" id="ent0059"><path d="M1365.5,1073.5986 L1365.5,1135.3936 A4,4 0 0 0 1369.5,1139.3936 L1694.6523,1139.3936 A4,4 0 0 0 1698.6523,1135.3936 L1698.6523,1079.5986 L1688.6523,1069.5986 L1536,1069.5986 L1532,1051.7559 L1528,1069.5986 L1369.5,1069.5986 A4,4 0 0 0 1365.5,1073.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1688.6523,1069.5986 L1688.6523,1077.5986 A2,2 0 0 0 1690.6523,1079.5986 L1698.6523,1079.5986 L1688.6523,1069.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1371.5" y="1086.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1371.5" y="1101.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1371.5" y="1116.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1371.5" y="1131.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN61" data-source-line="190" id="ent0062"><path d="M2595,1063.5986 L2595,1103.0563 L2615.4538,897.5428 L2595,1111.0563 L2595,1125.3936 A4,4 0 0 0 2599,1129.3936 L2869.2642,1129.3936 A4,4 0 0 0 2873.2642,1125.3936 L2873.2642,1069.5986 L2863.2642,1059.5986 L2599,1059.5986 A4,4 0 0 0 2595,1063.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2863.2642,1059.5986 L2863.2642,1067.5986 A2,2 0 0 0 2865.2642,1069.5986 L2873.2642,1069.5986 L2863.2642,1059.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="2601" y="1076.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="2601" y="1091.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="2601" y="1106.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="2601" y="1121.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN64" data-source-line="196" id="ent0065"><path d="M633,674.0986 L633,720.9448 A4,4 0 0 0 637,724.9448 L963.5869,724.9448 A4,4 0 0 0 967.5869,720.9448 L967.5869,680.0986 L957.5869,670.0986 L804.5,670.0986 L800.5,651.6627 L796.5,670.0986 L637,670.0986 A4,4 0 0 0 633,674.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M957.5869,670.0986 L957.5869,678.0986 A2,2 0 0 0 959.5869,680.0986 L967.5869,680.0986 L957.5869,670.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="639" y="687.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="639" y="702.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="639" y="717.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN67" data-source-line="201" id="ent0068"><path d="M3227,273.0986 L3227,309.7951 L3238.157,100.1486 L3227,317.7951 L3227,319.9448 A4,4 0 0 0 3231,323.9448 L3473.0806,323.9448 A4,4 0 0 0 3477.0806,319.9448 L3477.0806,279.0986 L3467.0806,269.0986 L3231,269.0986 A4,4 0 0 0 3227,273.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3467.0806,269.0986 L3467.0806,277.0986 A2,2 0 0 0 3469.0806,279.0986 L3477.0806,279.0986 L3467.0806,269.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3233" y="286.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3233" y="301.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3233" y="316.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN70" data-source-line="206" id="ent0071"><path d="M2550,215.5986 L2550,307.291 A4,4 0 0 0 2554,311.291 L2913.874,311.291 A4,4 0 0 0 2917.874,307.291 L2917.874,221.5986 L2907.874,211.5986 L2738,211.5986 L2734,193.601 L2730,211.5986 L2554,211.5986 A4,4 0 0 0 2550,215.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2907.874,211.5986 L2907.874,219.5986 A2,2 0 0 0 2909.874,221.5986 L2917.874,221.5986 L2907.874,211.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="2556" y="228.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="2556" y="243.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="2556" y="258.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="2556" y="273.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="2556" y="288.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="2556" y="303.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN76" data-source-line="217" id="ent0077"><path d="M41.5,719.0986 L41.5,765.9448 A4,4 0 0 0 45.5,769.9448 L376.397,769.9448 A4,4 0 0 0 380.397,765.9448 L380.397,725.0986 L370.397,715.0986 L215,715.0986 L211,697.5707 L207,715.0986 L45.5,715.0986 A4,4 0 0 0 41.5,719.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,715.0986 L370.397,723.0986 A2,2 0 0 0 372.397,725.0986 L380.397,725.0986 L370.397,715.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="732.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="747.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="762.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN79" data-source-line="222" id="ent0080"><path d="M21,1087.0986 L21,1133.9448 A4,4 0 0 0 25,1137.9448 L397.1377,1137.9448 A4,4 0 0 0 401.1377,1133.9448 L401.1377,1093.0986 L391.1377,1083.0986 L215,1083.0986 L211,1065.5707 L207,1083.0986 L25,1083.0986 A4,4 0 0 0 21,1087.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,1083.0986 L391.1377,1091.0986 A2,2 0 0 0 393.1377,1093.0986 L401.1377,1093.0986 L391.1377,1083.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="1100.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="1115.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="1130.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN82" data-source-line="227" id="ent0083"><path d="M6,905.0986 L6,951.9448 A4,4 0 0 0 10,955.9448 L411.7241,955.9448 A4,4 0 0 0 415.7241,951.9448 L415.7241,911.0986 L405.7241,901.0986 L215,901.0986 L211,883.5707 L207,901.0986 L10,901.0986 A4,4 0 0 0 6,905.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,901.0986 L405.7241,909.0986 A2,2 0 0 0 407.7241,911.0986 L415.7241,911.0986 L405.7241,901.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="918.2925">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="933.2412">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="948.1899">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN85" data-source-line="232" id="ent0086"><path d="M2529,975.5986 L2529,1006.1229 L2616.7204,565.2487 L2529,1014.1229 L2529,1037.3936 A4,4 0 0 0 2533,1041.3936 L2934.7241,1041.3936 A4,4 0 0 0 2938.7241,1037.3936 L2938.7241,981.5986 L2928.7241,971.5986 L2533,971.5986 A4,4 0 0 0 2529,975.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2928.