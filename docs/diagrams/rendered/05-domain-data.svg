djust="spacing" textLength="190.7852" x="2219.1755" y="266.8181">MessageBodyBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="2186" x2="2417.8315" y1="277.0986" y2="277.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="2196" cy="290.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="208.8315" x="2204" y="293.2925">name : autocare_service_messages</text><line style="stroke:#181818;stroke-width:1;" x1="2186" x2="2417.8315" y1="300.0474" y2="300.0474"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="2191" y="316.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="2191" y="331.1899">processed : bigint</text></g><!--class OfferCheckpoint--><g class="entity" data-qualified-name="OfferCheckpoint" data-source-line="133" id="ent0025"><rect fill="#F1F1F1" height="90.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="233.8315" x="2185" y="49.0986"/><ellipse cx="2205.2022" cy="64.0986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M2207.6719,68.5986 L2201.7686,68.5986 L2201.7686,59.1216 L2207.6719,59.1216 L2207.6719,60.772 L2203.6412,60.772 L2203.6412,62.8159 L2207.2911,62.8159 L2207.2911,64.4663 L2203.6412,64.4663 L2203.6412,66.9482 L2207.6719,66.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="190.0488" x="2219.5805" y="68.8181">MessageOfferBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="2186" x2="2417.8315" y1="79.0986" y2="79.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="2196" cy="92.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="208.8315" x="2204" y="95.2925">name : autocare_service_messages</text><line style="stroke:#181818;stroke-width:1;" x1="2186" x2="2417.8315" y1="102.0474" y2="102.0474"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="2191" y="118.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="2191" y="133.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN54" data-source-line="168" id="ent0055"><path d="M1327,1108.5986 L1327,1170.3936 A4,4 0 0 0 1331,1174.3936 L1656.1523,1174.3936 A4,4 0 0 0 1660.1523,1170.3936 L1660.1523,1114.5986 L1650.1523,1104.5986 L1497.5,1104.5986 L1493.5,1086.7559 L1489.5,1104.5986 L1331,1104.5986 A4,4 0 0 0 1327,1108.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1650.1523,1104.5986 L1650.1523,1112.5986 A2,2 0 0 0 1652.1523,1114.5986 L1660.1523,1114.5986 L1650.1523,1104.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1333" y="1121.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1333" y="1136.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1333" y="1151.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1333" y="1166.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN57" data-source-line="174" id="ent0058"><path d="M2163,564.5986 L2163,626.3936 A4,4 0 0 0 2167,630.3936 L2437.2642,630.3936 A4,4 0 0 0 2441.2642,626.3936 L2441.2642,570.5986 L2431.2642,560.5986 L2306,560.5986 L2302,542.7559 L2298,560.5986 L2167,560.5986 A4,4 0 0 0 2163,564.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2431.2642,560.5986 L2431.2642,568.5986 A2,2 0 0 0 2433.2642,570.5986 L2441.2642,570.5986 L2431.2642,560.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="2169" y="577.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="2169" y="592.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="2169" y="607.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="2169" y="622.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN60" data-source-line="180" id="ent0061"><path d="M633,1041.0986 L633,1087.9448 A4,4 0 0 0 637,1091.9448 L963.5869,1091.9448 A4,4 0 0 0 967.5869,1087.9448 L967.5869,1047.0986 L957.5869,1037.0986 L804.5,1037.0986 L800.5,1018.6627 L796.5,1037.0986 L637,1037.0986 A4,4 0 0 0 633,1041.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M957.5869,1037.0986 L957.5869,1045.0986 A2,2 0 0 0 959.5869,1047.0986 L967.5869,1047.0986 L957.5869,1037.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="639" y="1054.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="639" y="1069.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="639" y="1084.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN63" data-source-line="185" id="ent0064"><path d="M2795,1209.0986 L2795,1255.9448 A4,4 0 0 0 2799,1259.9448 L3041.0806,1259.9448 A4,4 0 0 0 3045.0806,1255.9448 L3045.0806,1215.0986 L3035.0806,1205.0986 L2924,1205.0986 L2920,1187.3386 L2916,1205.0986 L2799,1205.0986 A4,4 0 0 0 2795,1209.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3035.0806,1205.0986 L3035.0806,1213.0986 A2,2 0 0 0 3037.0806,1215.0986 L3045.0806,1215.0986 L3035.0806,1205.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="2801" y="1222.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="2801" y="1237.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="2801" y="1252.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN66" data-source-line="190" id="ent0067"><path d="M2118,1116.5986 L2118,1208.291 A4,4 0 0 0 2122,1212.291 L2481.874,1212.291 A4,4 0 0 0 2485.874,1208.291 L2485.874,1122.5986 L2475.874,1112.5986 L2306,1112.5986 L2302,1094.601 L2298,1112.5986 L2122,1112.5986 A4,4 0 0 0 2118,1116.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2475.874,1112.5986 L2475.874,1120.5986 A2,2 0 0 0 2477.874,1122.5986 L2485.874,1122.5986 L2475.874,1112.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="2124" y="1129.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="2124" y="1144.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="2124" y="1159.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="2124" y="1174.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="2124" y="1189.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="2124" y="1204.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN72" data-source-line="201" id="ent0073"><path d="M41.5,894.0986 L41.5,940.9448 A4,4 0 0 0 45.5,944.9448 L376.397,944.9448 A4,4 0 0 0 380.397,940.9448 L380.397,900.0986 L370.397,890.0986 L215,890.0986 L211,872.5707 L207,890.0986 L45.5,890.0986 A4,4 0 0 0 41.5,894.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,890.0986 L370.397,898.0986 A2,2 0 0 0 372.397,900.0986 L380.397,900.0986 L370.397,890.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="907.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="922.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="937.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN75" data-source-line="206" id