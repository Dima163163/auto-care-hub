GMN44" data-source-line="130" id="ent0045"><path d="M1219,505.9171 L1219,567.712 A4,4 0 0 0 1223,571.712 L1548.1523,571.712 A4,4 0 0 0 1552.1523,567.712 L1552.1523,511.9171 L1542.1523,501.9171 L1389.5,501.9171 L1385.5,484.0744 L1381.5,501.9171 L1223,501.9171 A4,4 0 0 0 1219,505.9171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1542.1523,501.9171 L1542.1523,509.9171 A2,2 0 0 0 1544.1523,511.9171 L1552.1523,511.9171 L1542.1523,501.9171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1225" y="519.111">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1225" y="534.0597">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1225" y="549.0084">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1225" y="563.9572">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN47" data-source-line="136" id="ent0048"><path d="M2034,288.9171 L2034,350.712 A4,4 0 0 0 2038,354.712 L2308.2642,354.712 A4,4 0 0 0 2312.2642,350.712 L2312.2642,294.9171 L2302.2642,284.9171 L2177,284.9171 L2173,267.0744 L2169,284.9171 L2038,284.9171 A4,4 0 0 0 2034,288.9171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2302.2642,284.9171 L2302.2642,292.9171 A2,2 0 0 0 2304.2642,294.9171 L2312.2642,294.9171 L2302.2642,284.9171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="2040" y="302.111">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="2040" y="317.0597">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="2040" y="332.0084">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="2040" y="346.9572">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN50" data-source-line="142" id="ent0051"><path d="M525,211.4171 L525,258.2633 A4,4 0 0 0 529,262.2633 L855.5869,262.2633 A4,4 0 0 0 859.5869,258.2633 L859.5869,217.4171 L849.5869,207.4171 L696.5,207.4171 L692.5,188.9812 L688.5,207.4171 L529,207.4171 A4,4 0 0 0 525,211.4171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M849.5869,207.4171 L849.5869,215.4171 A2,2 0 0 0 851.5869,217.4171 L859.5869,217.4171 L849.5869,207.4171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="531" y="224.611">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="531" y="239.5597">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="531" y="254.5084">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN53" data-source-line="147" id="ent0054"><path d="M2645,370.4171 L2645,407.1136 L2656.1946,96.0813 L2645,415.1136 L2645,417.2633 A4,4 0 0 0 2649,421.2633 L2891.0806,421.2633 A4,4 0 0 0 2895.0806,417.2633 L2895.0806,376.4171 L2885.0806,366.4171 L2649,366.4171 A4,4 0 0 0 2645,370.4171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2885.0806,366.4171 L2885.0806,374.4171 A2,2 0 0 0 2887.0806,376.4171 L2895.0806,376.4171 L2885.0806,366.4171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="2651" y="383.611">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="2651" y="398.5597">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="2651" y="413.5084">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN56" data-source-line="152" id="ent0057"><path d="M1989,579.9171 L1989,614.2768 L2042.2064,99.034 L1989,622.2768 L1989,671.6095 A4,4 0 0 0 1993,675.6095 L2352.874,675.6095 A4,4 0 0 0 2356.874,671.6095 L2356.874,585.9171 L2346.874,575.9171 L1993,575.9171 A4,4 0 0 0 1989,579.9171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2346.874,575.9171 L2346.874,583.9171 A2,2 0 0 0 2348.874,585.9171 L2356.874,585.9171 L2346.874,575.9171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="1995" y="593.111">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="1995" y="608.0597">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="1995" y="623.0084">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="1995" y="637.9572">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="1995" y="652.9059">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="1995" y="667.8546">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN62" data-source-line="163" id="ent0063"><path d="M6,316.4171 L6,363.2633 A4,4 0 0 0 10,367.2633 L340.897,367.2633 A4,4 0 0 0 344.897,363.2633 L344.897,322.4171 L334.897,312.4171 L179.5,312.4171 L175.5,294.8892 L171.5,312.4171 L10,312.4171 A4,4 0 0 0 6,316.4171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M334.897,312.4171 L334.897,320.4171 A2,2 0 0 0 336.897,322.4171 L344.897,322.4171 L334.897,312.4171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="12" y="329.611">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="12" y="344.5597">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="12" y="359.5084">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN65" data-source-line="168" id="ent0066"><path d="M2553,281.9171 L2553,311.9506 L2656.1946,96.0813 L2553,319.9506 L2553,343.712 A4,4 0 0 0 2557,347.712 L2982.8262,347.712 A4,4 0 0 0 2986.8262,343.712 L2986.8262,287.9171 L2976.8262,277.9171 L2557,277.9171 A4,4 0 0 0 2553,281.9171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2976.8262,277.9171 L2976.8262,285.9171 A2,2 0 0 0 2978.8262,287.9171 L2986.8262,287.9171 L2976.8262,277.9171" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="218.918" x="2559" y="295.111">&#1055;&#1091;&#