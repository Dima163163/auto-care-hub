nt-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3326.5" y="913.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3326.5" y="928.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3326.5" y="943.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN149" data-source-line="480" id="ent0150"><path d="M705.5,1909.0986 L705.5,1955.9448 A4,4 0 0 0 709.5,1959.9448 L1036.0869,1959.9448 A4,4 0 0 0 1040.0869,1955.9448 L1040.0869,1915.0986 L1030.0869,1905.0986 L877,1905.0986 L873,1886.6627 L869,1905.0986 L709.5,1905.0986 A4,4 0 0 0 705.5,1909.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1030.0869,1905.0986 L1030.0869,1913.0986 A2,2 0 0 0 1032.0869,1915.0986 L1040.0869,1915.0986 L1030.0869,1905.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="711.5" y="1922.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="711.5" y="1937.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="711.5" y="1952.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN152" data-source-line="485" id="ent0153"><path d="M3967,1900.0986 L3967,1946.9448 A4,4 0 0 0 3971,1950.9448 L4213.0806,1950.9448 A4,4 0 0 0 4217.0806,1946.9448 L4217.0806,1906.0986 L4207.0806,1896.0986 L4096,1896.0986 L4092,1878.3133 L4088,1896.0986 L3971,1896.0986 A4,4 0 0 0 3967,1900.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4207.0806,1896.0986 L4207.0806,1904.0986 A2,2 0 0 0 4209.0806,1906.0986 L4217.0806,1906.0986 L4207.0806,1896.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3973" y="1913.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3973" y="1928.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3973" y="1943.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN155" data-source-line="490" id="ent0156"><path d="M3275.5,1943.5986 L3275.5,1986.9551 L3328.6095,1689.173 L3275.5,1994.9551 L3275.5,2035.291 A4,4 0 0 0 3279.5,2039.291 L3639.374,2039.291 A4,4 0 0 0 3643.374,2035.291 L3643.374,1949.5986 L3633.374,1939.5986 L3279.5,1939.5986 A4,4 0 0 0 3275.5,1943.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3633.374,1939.5986 L3633.374,1947.5986 A2,2 0 0 0 3635.374,1949.5986 L3643.374,1949.5986 L3633.374,1939.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3281.5" y="1956.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3281.5" y="1971.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3281.5" y="1986.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3281.5" y="2001.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3281.5" y="2016.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3281.5" y="2031.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN161" data-source-line="501" id="ent0162"><path d="M41.5,2052.0986 L41.5,2098.9448 A4,4 0 0 0 45.5,2102.9448 L376.397,2102.9448 A4,4 0 0 0 380.397,2098.9448 L380.397,2058.0986 L370.397,2048.0986 L215,2048.0986 L211,2030.5707 L207,2048.0986 L45.5,2048.0986 A4,4 0 0 0 41.5,2052.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,2048.0986 L370.397,2056.0986 A2,2 0 0 0 372.397,2058.0986 L380.397,2058.0986 L370.397,2048.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="2065.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="2080.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="2095.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN164" data-source-line="506" id="ent0165"><path d="M21,2477.0986 L21,2523.9448 A4,4 0 0 0 25,2527.9448 L397.1377,2527.9448 A4,4 0 0 0 401.1377,2523.9448 L401.1377,2483.0986 L391.1377,2473.0986 L215,2473.0986 L211,2455.5707 L207,2473.0986 L25,2473.0986 A4,4 0 0 0 21,2477.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,2473.0986 L391.1377,2481.0986 A2,2 0 0 0 393.1377,2483.0986 L401.1377,2483.0986 L391.1377,2473.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="2490.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="2505.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="2520.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN167" data-source-line="511" id="ent0168"><path d="M34.5,2295.0986 L34.5,2341.9448 A4,4 0 0 0 38.5,2345.9448 L383.895,2345.9448 A4,4 0 0 0 387.895,2341.9448 L387.895,2301.0986 L377.895,2291.0986 L215,2291.0986 L211,2273.4153 L207,2291.0986 L38.5,2291.0986 A4,4 0 0 0 34.5,2295.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,2291.0986 L377.895,2299.0986 A2,2 0 0 0 379.895,2301.0986 L387.895,2301.0986 L377.895,2291.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="2308.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="2323.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="2338.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN170" data-source-line="516" id="ent0171"><path d="M670.5,2090.0986 L670.5,2136.9448 A4,4 0 0 0 674.5,2140.9448 L1071.9077,2140.9448 A4,4 0 0 0 1075.9077,2136.9448 L1075.9077,2096.0986 L1065.9077,2086.0986 L877,2086.0986 L873,2068.4153 L869,2086.0986 L674.5,2086.0986 A4,4 0 0 0 670.5,2090.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1065.9077,2086.0986 L1065.9077,2094.0986 A2,2 0 0 0 1067.9077,2096.0986 L1075.9077,2096.0986 L1065.9077,2086.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="676.5" y="2103.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="676.5" y="2118.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="676.5" y="2133.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN173" data-source-line="521" id="ent0174"><path d="M1322.5,2772.0986 L1322.5,2818.9448 A4,4 0 0 0 1326.5,2822.9448 L1734.0005,2822.9448 A4,4 0 0 0 1738.0005,2818.9448 L1738.0005,2778.0986 L1728.0005,2768.0986 L1534.5,2768.0986 L1530.5,2750.4153 L1526.5,2768.0986 L1326.5,2768.0986 A4,4 0 0 0 1322.5,2772.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1728.0005,2768.0986 L1728.0005,2776.0986 A2,2 0 0 0 1730.0005,2778.0986 L1738.0005,2778.0986 L1728.0005,2768.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1328.5" y="2785.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1328.5" y="2800.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1328.5" y="2815.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN176" data-source-line="526" id="ent0177"><path d="M675.5,3353.0986 L675.5,3399.9448 A4,4 0 0 0 679.5,3403.9448 L1066.0596,3403.9448 A4,4 0 0 0 1070.0596,3399.9448 L1070.0596,3359.0986 L1060.0596,3349.0986 L877,3349.0986 L873,3331.4153 L869,3349.0986 L679.5,3349.0986 A4,4 0 0 0 675.5,3353.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1060.0596,3349.0986 L1060.0596,3357.0986 A2,2 0 0 0 1062.0596,3359.0986 L1070.0596,3359.0986 L1060.0596,3349.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="681.5" y="3366.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="681.5" y="3381.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="681.5" y="3396.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN179" data-source-line="531" id="ent0180"><path d="M1330,3164.0986 L1330,3210.9448 A4,4 0 0 0 1334,3214.9448 L1727.0977,3214.9448 A4,4 0 0 0 1731.0977,3210.9448 L1731.0977,3170.0986 L1721.0977,3160.0986 L1534.5,3160.0986 L1530.5,3142.4153 L1526.5,3160.0986 L1334,3160.0986 A4,4 0 0 0 1330,3164.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1721.0977,3160.0986 L1721.0977,3168.0986 A2,2 0 0 0 1723.0977,3170.0986 L1731.0977,3170.0986 L1721.0977,3160.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1336" y="3177.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1336" y="3192.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1336" y="3207.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN182" data-source-line="536" id="ent0183"><path d="M2611,1762.0986 L2611,1808.9448 A4,4 0 0 0 2615,1812.9448 L3013.1567,1812.9448 A4,4 0 0 0 3017.1567,1808.9448 L3017.1567,1768.0986 L3007.1567,1758.0986 L2818,1758.0986 L2814,1740.4153 L2810,1758.0986 L2615,1758.0986 A4,4 0 0 0 2611,1762.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3007.1567,1758.0986 L3007.1567,1766.0986 A2,2 0 0 0 3009.1567,1768.0986 L3017.1567,1768.0986 L3007.1567,1758.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2617" y="1775.2925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2617" y="1790.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2617" y="1805.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN185" data-source-line="541" id="ent0186"><path d="M2594.5,1082.0986 L2594.5,1128.9448 A4,4 0 0 0 2598.5,1132.9448 L3029.8804,1132.9448 A4,4 0 0 0 3033.8804,1128.9448 L3033.8804,1088.0986 L3023.8804,1078.0986 L2818,1078.0986 L2814,1060.4153 L2810,1078.0986 L2598.5,1078.0986 A4,4 0 0 0 2594.5,1082.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3023.8804,1078.0986 L3023.8804,1086.0986 A2,2 0 0 0 3025.8804,1088.0986 L3033.8804,1088.0986 L3023.8804,1078.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2600.5" y="1095.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2600.5" y="1110.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2600.5" y="1125.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN188" data-source-line="546" id="ent0189"><path d="M3244,550.0986 L3244,596.9448 A4,4 0 0 0 3248,600.9448 L3670.6841,600.9448 A4,4 0 0 0 3674.6841,596.9448 L3674.6841,556.0986 L3664.6841,546.0986 L3463.5,546.0986 L3459.5,528.4153 L3455.5,546.0986 L3248,546.0986 A4,4 0 0 0 3244,550.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3664.6841,546.0986 L3664.6841,554.0986 A2,2 0 0 0 3666.6841,556.0986 L3674.6841,556.0986 L3664.6841,546.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3250" y="563.2925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3250" y="578.2412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3250" y="593.1899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN191" data-source-line="551" id="ent0192"><path d="M3240,1191.0986 L3240,1237.9448 A4,4 0 0 0 3244,1241.9448 L3675.4312,1241.9448 A4,4 0 0 0 3679.4312,1237.9448 L3679.4312,1197.0986 L3669.4312,1187.0986 L3463.5,1187.0986 L3459.5,1169.4153 L3455.5,1187.0986 L3244,1187.0986 A4,4 0 0 0 3240,1191.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3669.4312,1187.0986 L3669.4312,1195.0986 A2,2 0 0 0 3671.4312,1197.0986 L3679.4312,1197.0986 L3669.4312,1187.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8423" x="3246" y="1204.2925">U02: HMAC binds reason to block/thread/blocker/blocked-user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.4312" x="3246" y="1219.2412">Status can change without breaking the binding. Bounded compare-write</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="3246" y="1234.1899">and full verify precede opt-in strict read; deletion clears both.</text></g><g class="entity" data-qualified-name="GMN194" data-source-line="556" id="ent0195"><path d="M3244,1870.0986 L3244,1916.9448 A4,4 0 0 0 3248,1920.9448 L3671.4268,1920.9448 A4,4 0 0 0 3675.4268,1916.9448 L3675.4268,1876.0986 L3665.4268,1866.0986 L3463.5,1866.0986 L3459.5,1848.4153 L3455.5,1866.0986 L3248,1866.0986 A4,4 0 0 0 3244,1870.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3665.4268,1866.0986 L3665.4268,1874.0986 A2,2 0 0 0 3667.4268,1876.0986 L3675.4268,1876.0986 L3665.4268,1866.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410.4268" x="3250" y="1883.2925">U02: HMAC binds reference/notes to evidence/provider UUID and kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4604" x="3250" y="1898.2412">Read verifies reference against blind index. Backfill clears stale</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="3250" y="1913.1899">indexes after null redaction; full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN197" data-source-line="561" id="ent0198"><path d="M650.5,1344.5986 L650.5,1406.3936 A4,4 0 0 0 654.5,1410.3936 L1091.6567,1410.3936 A4,4 0 0 0 1095.6567,1406.3936 L1095.6567,1350.5986 L1085.6567,1340.5986 L877,1340.5986 L873,1322.1408 L869,1340.5986 L654.5,1340.5986 A4,4 0 0 0 650.5,1344.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1085.6567,1340.5986 L1085.6567,1348.5986 A2,2 0 0 0 1087.6567,1350.5986 L1095.6567,1350.5986 L1085.6567,1340.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1567" x="656.5" y="1357.7925">U02: HMAC binds encrypted payload and review reason to request UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.3149" x="656.5" y="1372.7412">provider UUID, requester UUID and kind. Account deletion reseals each</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.9121" x="656.5" y="1387.6899">redacted payload with its own binding and clears reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="656.5" y="1402.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN200" data-source-line="567" id="ent0201"><path d="M656,2264.5986 L656,2326.3936 A4,4 0 0 0 660,2330.3936 L1086.334,2330.3936 A4,4 0 0 0 1090.334,2326.3936 L1090.334,2270.5986 L1080.334,2260.5986 L877,2260.5986 L873,2242.1408 L869,2260.5986 L660,2260.5986 A4,4 0 0 0 656,2264.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1080.334,2260.5986 L1080.334,2268.5986 A2,2 0 0 0 1082.334,2270.5986 L1090.334,2270.5986 L1080.334,2260.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.334" x="662" y="2277.7925">U02: HMAC binds reason and decisionReason to appeal UUID, subject,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="411.144" x="662" y="2292.7412">subjectId, submitter UUID and nullable provider UUID. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="405.4121" x="662" y="2307.6899">reseals each redacted reason and clears decision reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="662" y="2322.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN203" data-source-line="573" id="ent0204"><path d="M662,2814.5986 L662,2876.3936 A4,4 0 0 0 666,2880.3936 L1080.0005,2880.3936 A4,4 0 0 0 1084.0005,2876.3936 L1084.0005,2820.5986 L1074.0005,2810.5986 L877,2810.5986 L873,2792.1408 L869,2810.5986 L666,2810.5986 A4,4 0 0 0 662,2814.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1074.0005,2810.5986 L1074.0005,2818.5986 A2,2 0 0 0 1076.0005,2820.5986 L1084.0005,2820.5986 L1074.0005,2810.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0005" x="668" y="2827.7925">U02: four HMACs bind encrypted fields to gap UUID, requester UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8931" x="668" y="2842.7412">nullable provider UUID and catalog slugs/price type. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5386" x="668" y="2857.6899">reseals each redacted row and clears reviewReason with its binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="668" y="2872.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN206" data-source-line="579" id="ent0207"><path d="M2587,1572.5986 L2587,1634.3936 A4,4 0 0 0 2591,1638.3936 L3036.834,1638.3936 A4,4 0 0 0 3040.834,1634.3936 L3040.834,1578.5986 L3030.834,1568.5986 L2818,1568.5986 L2814,1550.1408 L2810,1568.5986 L2591,1568.5986 A4,4 0 0 0 2587,1572.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3030.834,1568.5986 L3030.834,1576.5986 A2,2 0 0 0 3032.834,1578.5986 L3040.834,1578.5986 L3030.834,1568.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="432.834" x="2593" y="1585.7925">U02: three HMACs bind encrypted title, notes and metadata to event UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1885" x="2593" y="1600.7412">request UUID and eventType. Account deletion reseals title and metadata</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="379.3486" x="2593" y="1615.6899">for each row and clears notes with its binding. Full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="96.8145" x="2593" y="1630.6387">opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN209" data-source-line="585" id="ent0210"><path d="M665.5,1015.0986 L665.5,1091.8423 A4,4 0 0 0 669.5,1095.8423 L1076.3467,1095.8423 A4,4 0 0 0 1080.3467,1091.8423 L1080.3467,1021.0986 L1070.3467,1011.0986 L877,1011.0986 L873,993.3412 L869,1011.0986 L669.5,1011.0986 A4,4 0 0 0 665.5,1015.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1070.3467,1011.0986 L1070.3467,1019.0986 A2,2 0 0