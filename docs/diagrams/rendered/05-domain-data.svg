roke:#181818;stroke-width:0.5;" width="210.667" x="738" y="854.0986"/><ellipse cx="752" cy="869.0986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M754.4697,873.5986 L748.5664,873.5986 L748.5664,864.1216 L754.4697,864.1216 L754.4697,865.772 L750.439,865.772 L750.439,867.8159 L754.0889,867.8159 L754.0889,869.4663 L750.439,869.4663 L750.439,871.9482 L754.4697,871.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="180.667" x="765" y="873.8181">BookingTextBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="739" x2="947.667" y1="884.0986" y2="884.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="749" cy="897.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="95.3926" x="757" y="900.2925">name : bookings</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="757" y="915.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="757" y="930.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN78" data-source-line="259" id="ent0079"><path d="M1882.5,1303.5986 L1882.5,1365.3936 A4,4 0 0 0 1886.5,1369.3936 L2211.6523,1369.3936 A4,4 0 0 0 2215.6523,1365.3936 L2215.6523,1309.5986 L2205.6523,1299.5986 L2053,1299.5986 L2049,1281.7559 L2045,1299.5986 L1886.5,1299.5986 A4,4 0 0 0 1882.5,1303.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2205.6523,1299.5986 L2205.6523,1307.5986 A2,2 0 0 0 2207.6523,1309.5986 L2215.6523,1309.5986 L2205.6523,1299.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1888.5" y="1316.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1888.5" y="1331.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1888.5" y="1346.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1888.5" y="1361.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN81" data-source-line="265" id="ent0082"><path d="M3155,1221.5986 L3155,1283.3936 A4,4 0 0 0 3159,1287.3936 L3429.2642,1287.3936 A4,4 0 0 0 3433.2642,1283.3936 L3433.2642,1227.5986 L3423.2642,1217.5986 L3298,1217.5986 L3294,1199.7559 L3290,1217.5986 L3159,1217.5986 A4,4 0 0 0 3155,1221.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3423.2642,1217.5986 L3423.2642,1225.5986 A2,2 0 0 0 3425.2642,1227.5986 L3433.2642,1227.5986 L3423.2642,1217.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3161" y="1234.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3161" y="1249.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3161" y="1264.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3161" y="1279.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN84" data-source-line="271" id="ent0085"><path d="M676,425.0986 L676,471.9448 A4,4 0 0 0 680,475.9448 L1006.5869,475.9448 A4,4 0 0 0 1010.5869,471.9448 L1010.5869,431.0986 L1000.5869,421.0986 L847.5,421.0986 L843.5,402.6627 L839.5,421.0986 L680,421.0986 A4,4 0 0 0 676,425.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1000.5869,421.0986 L1000.5869,429.0986 A2,2 0 0 0 1002.5869,431.0986 L1010.5869,431.0986 L1000.5869,421.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="682" y="438.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="682" y="453.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="682" y="468.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN87" data-source-line="276" id="ent0088"><path d="M3787,273.0986 L3787,309.7951 L3798.157,100.1486 L3787,317.7951 L3787,319.9448 A4,4 0 0 0 3791,323.9448 L4033.0806,323.9448 A4,4 0 0 0 4037.0806,319.9448 L4037.0806,279.0986 L4027.0806,269.0986 L3791,269.0986 A4,4 0 0 0 3787,273.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4027.0806,269.0986 L4027.0806,277.0986 A2,2 0 0 0 4029.0806,279.0986 L4037.0806,279.0986 L4027.0806,269.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3793" y="286.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3793" y="301.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3793" y="316.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN90" data-source-line="281" id="ent0091"><path d="M3110,233.5986 L3110,325.291 A4,4 0 0 0 3114,329.291 L3473.874,329.291 A4,4 0 0 0 3477.874,325.291 L3477.874,239.5986 L3467.874,229.5986 L3298,229.5986 L3294,211.601 L3290,229.5986 L3114,229.5986 A4,4 0 0 0 3110,233.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3467.874,229.5986 L3467.874,237.5986 A2,2 0 0 0 3469.874,239.5986 L3477.874,239.5986 L3467.874,229.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3116" y="246.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3116" y="261.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3116" y="276.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3116" y="291.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3116" y="306.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3116" y="321.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN96" data-source-line="292" id="ent0097"><path d="M41.5,421.0986 L41.5,467.9448 A4,4 0 0 0 45.5,471.9448 L376.397,471.9448 A4,4 0 0 0 380.397,467.9448 L380.397,427.0986 L370.397,417.0986 L215,417.0986 L211,399.5707 L207,417.0986 L45.5,417.0986 A4,4 0 0 0 41.5,421.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,417.0986 L370.397,425.0986 A2,2 0 0 0 372.397,427.0986 L380.397,427.0986 L370.397,417.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="434.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="449.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="464.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN99" data-source-line="297" id="ent0100"><path d="M21,777.0986 L21,823.9448 A4,4 0 0 0 25,827.9448 L397.1377,827.9448 A4,4 0 0 0 401.1377,823.9448 L401.1377,783.0986 L391.1377,773.0986 L215,773.0986 L211,755.5707 L207,773.0986 L25,773.0986 A4,4 0 0 0 21,777.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,773.0986 L391.1377,781.0986 A2,2 0 0 0 393.1377,783.0986 L401.1377,783.0986 L391.1377,773.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="790.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="805.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="820.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN102" data-source-line="302" id="ent0103"><path d="M34.5,595.0986 L34.5,641.9448 A4,4 0 0 0 38.5,645.9448 L383.895,645.9448 A4,4 0 0 0 387.895,641.9448 L387.895,601.0986 L377.895,591.