 fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1333" y="793.1387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN53" data-source-line="158" id="ent0054"><path d="M2142,169.0986 L2142,230.8936 A4,4 0 0 0 2146,234.8936 L2416.2642,234.8936 A4,4 0 0 0 2420.2642,230.8936 L2420.2642,175.0986 L2410.2642,165.0986 L2285,165.0986 L2281,147.2559 L2277,165.0986 L2146,165.0986 A4,4 0 0 0 2142,169.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2410.2642,165.0986 L2410.2642,173.0986 A2,2 0 0 0 2412.2642,175.0986 L2420.2642,175.0986 L2410.2642,165.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="2148" y="182.2925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="2148" y="197.2412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="2148" y="212.1899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="2148" y="227.1387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN56" data-source-line="164" id="ent0057"><path d="M633,667.5986 L633,714.4448 A4,4 0 0 0 637,718.4448 L963.5869,718.4448 A4,4 0 0 0 967.5869,714.4448 L967.5869,673.5986 L957.5869,663.5986 L804.5,663.5986 L800.5,645.1627 L796.5,663.5986 L637,663.5986 A4,4 0 0 0 633,667.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M957.5869,663.5986 L957.5869,671.5986 A2,2 0 0 0 959.5869,673.5986 L967.5869,673.5986 L957.5869,663.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="639" y="680.7925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="639" y="695.7412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="639" y="710.6899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN59" data-source-line="169" id="ent0060"><path d="M2753,891.5986 L2753,938.4448 A4,4 0 0 0 2757,942.4448 L2999.0806,942.4448 A4,4 0 0 0 3003.0806,938.4448 L3003.0806,897.5986 L2993.0806,887.5986 L2882,887.5986 L2878,869.8386 L2874,887.5986 L2757,887.5986 A4,4 0 0 0 2753,891.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2993.0806,887.5986 L2993.0806,895.5986 A2,2 0 0 0 2995.0806,897.5986 L3003.0806,897.5986 L2993.0806,887.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="2759" y="904.7925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="2759" y="919.7412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="2759" y="934.6899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN62" data-source-line="174" id="ent0063"><path d="M2097,743.0986 L2097,834.791 A4,4 0 0 0 2101,838.791 L2460.874,838.791 A4,4 0 0 0 2464.874,834.791 L2464.874,749.0986 L2454.874,739.0986 L2285,739.0986 L2281,721.101 L2277,739.0986 L2101,739.0986 A4,4 0 0 0 2097,743.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2454.874,739.0986 L2454.874,747.0986 A2,2 0 0 0 2456.874,749.0986 L2464.874,749.0986 L2454.874,739.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="2103" y="756.2925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="2103" y="771.2412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="2103" y="786.1899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="2103" y="801.1387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="2103" y="816.0874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="2103" y="831.0361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN68" data-source-line="185" id="ent0069"><path d="M41.5,520.5986 L41.5,567.4448 A4,4 0 0 0 45.5,571.4448 L376.397,571.4448 A4,4 0 0 0 380.397,567.4448 L380.397,526.5986 L370.397,516.5986 L215,516.5986 L211,499.0707 L207,516.5986 L45.5,516.5986 A4,4 0 0 0 41.5,520.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,516.5986 L370.397,524.5986 A2,2 0 0 0 372.397,526.5986 L380.397,526.5986 L370.397,516.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="533.7925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="548.7412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="563.6899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN71" data-source-line="190" id="ent0072"><path d="M21,702.5986 L21,749.4448 A4,4 0 0 0 25,753.4448 L397.1377,753.4448 A4,4 0 0 0 401.1377,749.4448 L401.1377,708.5986 L391.1377,698.5986 L215,698.5986 L211,681.0707 L207,698.5986 L25,698.5986 A4,4 0 0 0 21,702.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,698.5986 L391.1377,706.5986 A2,2 0 0 0 393.1377,708.5986 L401.1377,708.5986 L391.1377,698.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="715.7925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="730.7412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="745.6899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN74" data-source-line="195" id="ent0075"><path d="M6,338.5986 L6,385.4448 A4,4 0 0 0 10,389.4448 L411.7241,389.4448 A4,4 0 0 0 415.7241,385.4448 L415.7241,344.5986 L405.7241,334.5986 L215,334.5986 L211,317.0707 L207,334.5986 L10,334.5986 A4,4 0 0 0 6,338.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,334.5986 L405.7241,342.5986 A2,2 0 0 0 407.7241,344.5986 L415.7241,344.5986 L405.7241,334.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="351.7925">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="366.7412">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="381.6899">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN77" data-source-line="200" id="ent0078"><path d="M2661,965.0986 L2661,961.0986 L2660.8789,999.8616 L2661,969.0986 L2661,1026.8936 A4,4 0 0 0 2665,1030.8936 L3090.8262,1030.8936 A4,4 0 0 0 3094.8262,1026.8936 L3094.8262,971.0986 L3084.8262,961.0986 L2665,961.0986 A4,4 0 0 0 2661,965.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3084.8262,961.0986 L3084.8262,969.0986 A2,2 0 0 0 3086.8262,971.0986 L3094.8262,971.0986 L3084.8262,961.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="218.918" x="2667" y="978.2925">&#1055;&#1091;&#1085;&#1082;&#1090;&#1080;&#1088; &#8212; &#1083;&#1086;&#1075;&#1080;&#1095;&#1077;&#1089;&#1082;&#1072;&#1103; &#1089;&#1074;&#1103;&#1079;&#1100;, &#1085;&#1077; FK.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="399.5278" x="2667" y="993.2412">Reference lookup fix &#1090;&#1088;&#1077;&#1073;&#1091;&#1077;&#1090; &#1087;&#1088;&#1080;&#1084;&#1077;&#1085;&#1077;&#1085;&#1080;&#1103; migration &#1080; &#1087;&#1088;&#1086;&#1074;&#1077;&#1088;&#1082;&#1080; DB.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="412.8262" x="2667" y="1008.1899">Snapshot &#1080; FK &#1085;&#1077;&#1083;&#1100;&#1079;&#1103; &#1074;&#1086;&#1089;&#1089;&#1090;&#1072;&#1085;&#1072;&#1074;&#1083;&#1080;&#1074;&#1072;&#1090;&#1100; &#1080;&#1079; &#1101;&#1090;&#1086