e="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="755.1899">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN81" data-source-line="216" id="ent0082"><path d="M2097,360.5986 L2097,422.3936 A4,4 0 0 0 2101,426.3936 L2502.7241,426.3936 A4,4 0 0 0 2506.7241,422.3936 L2506.7241,366.5986 L2496.7241,356.5986 L2306,356.5986 L2302,338.4611 L2298,356.5986 L2101,356.5986 A4,4 0 0 0 2097,360.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2496.7241,356.5986 L2496.7241,364.5986 A2,2 0 0 0 2498.7241,366.5986 L2506.7241,366.5986 L2496.7241,356.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.165" x="2103" y="373.7925">U02: non-null body HMAC binds plaintext to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="2103" y="388.7412">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="2103" y="403.6899">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252.1924" x="2103" y="418.6387">opt-in strict read. Null body has null binding.</text></g><g class="entity" data-qualified-name="GMN84" data-source-line="222" id="ent0085"><path d="M2097,162.5986 L2097,224.3936 A4,4 0 0 0 2101,228.3936 L2502.7241,228.3936 A4,4 0 0 0 2506.7241,224.3936 L2506.7241,168.5986 L2496.7241,158.5986 L2306,158.5986 L2302,140.4611 L2298,158.5986 L2101,158.5986 A4,4 0 0 0 2097,162.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2496.7241,158.5986 L2496.7241,166.5986 A2,2 0 0 0 2498.7241,168.5986 L2506.7241,168.5986 L2496.7241,158.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#