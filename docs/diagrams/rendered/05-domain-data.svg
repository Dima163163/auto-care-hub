me="GMN98" data-source-line="327" id="ent0099"><path d="M1882.5,901.5986 L1882.5,963.3936 A4,4 0 0 0 1886.5,967.3936 L2211.6523,967.3936 A4,4 0 0 0 2215.6523,963.3936 L2215.6523,907.5986 L2205.6523,897.5986 L2053,897.5986 L2049,879.7559 L2045,897.5986 L1886.5,897.5986 A4,4 0 0 0 1882.5,901.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2205.6523,897.5986 L2205.6523,905.5986 A2,2 0 0 0 2207.6523,907.5986 L2215.6523,907.5986 L2205.6523,897.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1888.5" y="914.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1888.5" y="929.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1888.5" y="944.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1888.5" y="959.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN101" data-source-line="333" id="ent0102"><path d="M3198.5,1127.5986 L3198.5,1169.0961 L3218.6116,651.7084 L3198.5,1177.0961 L3198.5,1189.3936 A4,4 0 0 0 3202.5,1193.3936 L3472.7642,1193.3936 A4,4 0 0 0 3476.7642,1189.3936 L3476.7642,1133.5986 L3466.7642,1123.5986 L3202.5,1123.5986 A4,4 0 0 0 3198.5,1127.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3466.7642,1123.5986 L3466.7642,1131.5986 A2,2 0 0 0 3468.7642,1133.5986 L3476.7642,1133.5986 L3466.7642,1123.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3204.5" y="1140.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3204.5" y="1155.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3204.5" y="1170.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3204.5" y="1185.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN104" data-source-line="339" id="ent0105"><path d="M676,603.0986 L676,649.9448 A4,4 0 0 0 680,653.9448 L1006.5869,653.9448 A4,4 0 0 0 1010.5869,649.9448 L1010.5869,609.0986 L1000.5869,599.0986 L847.5,599.0986 L843.5,580.6627 L839.5,599.0986 L680,599.0986 A4,4 0 0 0 676,603.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1000.5869,599.0986 L1000.5869,607.0986 A2,2 0 0 0 1002.5869,609.0986 L1010.5869,609.0986 L1000.5869,599.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="682" y="616.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="682" y="631.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="682" y="646.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN107" data-source-line="344" id="ent0108"><path d="M3845,416.0986 L3845,452.7951 L3836.9869,236.0636 L3845,460.7951 L3845,462.9448 A4,4 0 0 0 3849,466.9448 L4091.0806,466.9448 A4,4 0 0 0 4095.0806,462.9448 L4095.0806,422.0986 L4085.0806,412.0986 L3849,412.0986 A4,4 0 0 0 3845,416.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4085.0806,412.0986 L4085.0806,420.0986 A2,2 0 0 0 4087.0806,422.0986 L4095.0806,422.0986 L4085.0806,412.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3851" y="429.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3851" y="444.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3851" y="459.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN110" data-source-line="349" id="ent0111"><path d="M3153.5,497.5986 L3153.5,589.291 A4,4 0 0 0 3157.5,593.291 L3517.374,593.291 A4,4 0 0 0 3521.374,589.291 L3521.374,503.5986 L3511.374,493.5986 L3341.5,493.5986 L3337.5,475.601 L3333.5,493.5986 L3157.5,493.5986 A4,4 0 0 0 3153.5,497.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3511.374,493.5986 L3511.374,501.5986 A2,2 0 0 0 3513.374,503.5986 L3521.374,503.5986 L3511.374,493.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3159.5" y="510.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3159.5" y="525.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3159.5" y="540.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3159.5" y="555.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3159.5" y="570.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3159.5" y="585.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN116" data-source-line="360" id="ent0117"><path d="M41.5,623.0986 L41.5,669.9448 A4,4 0 0 0 45.5,673.9448 L376.397,673.9448 A4,4 0 0 0 380.397,669.9448 L380.397,629.0986 L370.397,619.0986 L215,619.0986 L211,601.5707 L207,619.0986 L45.5,619.0986 A4,4 0 0 0 41.5,623.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,619.0986 L370.397,627.0986 A2,2 0 0 0 372.397,629.0986 L380.397,629.0986 L370.397,619.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="636.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="651.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="666.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN119" data-source-line="365" id="ent0120"><path d="M21,811.0986 L21,857.9448 A4,4 0 0 0 25,861.9448 L397.1377,861.9448 A4,4 0 0 0 401.1377,857.9448 L401.1377,817.0986 L391.1377,807.0986 L215,807.0986 L211,789.5707 L207,807.0986 L25,807.0986 A4,4 0 0 0 21,811.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,807.0986 L391.1377,815.0986 A2,2 0 0 0 393.1377,817.0986 L401.1377,817.0986 L391.1377,807.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="824.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="839.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="854.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN122" data-source-line="370" id="ent0123"><path d="M34.5,1167.0986 L34.5,1213.9448 A4,4 0 0 0 38.5,1217.9448 L383.895,1217.9448 A4,4 0 0 0 387.895,1213.9448 L387.895,1173.0986 L377.895,1163.0986 L215,1163.0986 L211,1145.4153 L207,1163.0986 L38.5,1163.0986 A4,4 0 0 0 34.5,1167.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,1163.0986 L377.895,1171.0986 A2,2 0 0 0 379.895,1173.0986 L387.895,1173.0986 L377.895,1163.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="1180.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="1195.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="1210.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN125" data-source-line="375" id="ent0126"><path d="M641,794.0986 L641,840.9448 A4,4 0 0 0 645,844.9448 L1042.4077,844.9448 A4,4 0 0 0 1046.4077,840.9448 L1046.4077,800.0986 L1036.4077,790.0986 L847.5,790.0986 L843.5,772.4153 L839.5,790.0986 L645,790.0986 A4,4 0 0 0 641,794.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1036.4077,790.0986 L1036.4077,798.0986 A2,2 0 0 0 1038.4077,800.0986 L1046.4077,800.0986 L1036.4077,790.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="647" y="807.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="647" y="822.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="647" y="837.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN128" data-source-line="380" id="ent0129"><path d="M1241,1465.0986 L1241,1511.9448 A4,4 0 0 0 1245,1515.9448 L1652.5005,1515.9448 A4,4 0 0 0 1656.5005,1511.9448 L1656.5005,1471.0986 L1646.5005,1461.0986 L1453,1461.0986 L1449,1443.4153 L1445,1461.0986 L1245,1461.0986 A4,4 0 0 0 1241,1465.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1646.5005,1461.0986 L1646.5005,1469.0986 A2,2 0 0 0 1648.5005,1471.0986 L1656.5005,1471.0986 L1646.5005,1461.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1247" y="1478.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1247" y="1493.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1247" y="1508.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN131" data-source-line="385" id="ent0132"><path d="M646,1654.0986 L646,1700.9448 A4,4 0 0 0 650,1704.9448 L1036.5596,1704.9448 A4,4 0 0 0 1040.5596,1700.9448 L1040.5596,1660.0986 L1030.5596,1650.0986 L847.5,1650.0986 L843.5,1632.4153 L839.5,1650.0986 L650,1650.0986 A4,4 0 0 0 646,1654.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1030.5596,1650.0986 L1030.5596,1658.0986 A2,2 0 0 0 1032.5596,1660.0986 L1040.5596,1660.0986 L1030.5596,1650.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="652" y="1667.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="652" y="1682.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="652" y="1697.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN134" data-source-line="390" id="ent0135"><path d="M1248.5,1770.0986 L1248.5,1816.9448 A4,4 0 0 0 1252.5,1820.9448 L1645.5977,1820.9448 A4,4 0 0 0 1649.5977,1816.9448 L1649.5977,1776.0986 L1639.5977,1766.0986 L1453,1766.0986 L1449,1748.4153 L1445,1766.0986 L1252.5,1766.0986 A4,4 0 0 0 1248.5,1770.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1639.5977,1766.0986 L1639.5977,1774.0986 A2,2 0 0 0 1641.5977,1776.0986 L1649.5977,1776.0986 L1639.5977,1766.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1254.5" y="1783.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1254.5" y="1798.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1254.5" y="1813.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN137" data-source-line="395" id="ent0138"><path d="M2496.5,1631.0986 L2496.5,1677.9448 A4,4 0 0 0 2500.5,1681.9448 L2898.6567,1681.9448 A4,4 0 0 0 2902.6567,1677.9448 L2902.6567,1637.0986 L2892.6567,1627.0986 L2703.5,1627.0986 L2699.5,1609.4153 L2695.5,1627.0986 L2500.5,1627.0986 A4,4 0 0 0 2496.5,1631.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2892.6567,1627.0986 L2892.6567,1635.0986 A2,2 0 0 0 2894.6567,1637.0986 L2902.6567,1637.0986 L2892.6567,1627.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2502.5" y="1644.2925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2502.5" y="1659.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2502.5" y="1674.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN140" data-source-line="400" id="ent0141"><path d="M2480,370.0986 L2480,416.9448 A4,4 0 0 0 2484,420.9448 L2915.3804,420.9448 A4,4 0 0 0 2919.3804,416.9448 L2919.3804,376.0986 L2909.3804,366.0986 L2703.5,366.0986 L2699.5,348.4153 L2695.5,366.0986 L2484,366.0986 A4,4 0 0 0 2480,370.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2909.3804,366.0986 L2909.3804,374.0986 A2,2 0 0 0 2911.3804,376.0986 L2919.3804,376.0986 L2909.3804,366.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2486" y="383.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2486" y="398.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2486" y="413.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN143" data-source-line="405" id="ent0144"><path d="M3122,1879.0986 L3122,1925.9448 A4,4 0 0 0 3126,1929.9448 L3548.6841,1929.9448 A4,4 0 0 0 3552.6841,1925.9448 L3552.6841,1885.0986 L3542.6841,1875.0986 L3341.5,1875.0986 L3337.5,1857.4153 L3333.5,1875.0986 L3126,1875.0986 A4,4 0 0 0 3122,1879.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3542.6841,1875.0986 L3542.6841,1883.0986 A2,2 0 0 0 3544.6841,1885.0986 L3552.6841,1885.0986 L3542.6841,1875.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3128" y="1892.2925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3128" y="1907.2412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3128" y="1922.1899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN146" data-source-line="410" id="ent0147"><path d="M3118,1418.0986 L3118,1464.9448 A4,4 0 0 0 3122,1468.9448 L3553.4312,1468.9448 A4,4 0 0 0 3557.4312,1464.9448 L3557.4312,1424.0986 L3547.4312,1414.0986 L3341.5,1414.0986 L3337.5,1396.4153 L3333.5,1414.0986 L3122,1414.0986 A4,4 0 0 0 3118,1418.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3547.4312,1414.0986 L3547.4312,1422.0986 A2,2 0 0 0 3549.4312,1424.0986 L3557.4312,1424.0986 L3547.4312,1414.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8423" x="3124" y="1431.2925">U02: HMAC binds reason to block/thread/blocker/blocked-user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.4312" x="3124" y="1446.2412">Status can change without breaking the binding. Bounded compare-write</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="3124" y="1461.1899">and full verify precede opt-in strict read; deletion clears both.</text></g><g class="entity" data-qualified-name="GMN149" data-source-line="415" id="ent0150"><path d="M3122,154.0986 L3122,200.9448 A4,4 0 0 0 3126,204.9448 L3549.4268,204.9448 A4,4 0 0 0 3553.4268,200.9448 L3553.4268,160.0986 L3543.4268,150.0986 L3341.5,150.0986 L3337.5,132.4153 L3333.5,150.0986 L3126,150.0986 A4,4 0 0 0 3122,154.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3543.4268,150.0986 L3543.4268,158.0986 A2,2 0 0 0 3545.4268,160.0986 L3553.4268,160.0986 L3543.4268,150.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410.4268" x="3128" y="167.2925">U02: HMAC binds reference/notes to evidence/provider UUID and kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4604" x="3128" y="182.2412">Read verifies reference against blind index. Backfill clears stale</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="3128" y="197.1899">indexes after null redaction; full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN152" data-source-line="420" id="ent0153"><path d="M6,993.0986 L6,1039.9448 A4,4 0 0 0 10,1043.9448 L411.7241,1043.9448 A4,4 0 0 0 415.7241,1039.9448 L415.7241,999.0986 L405.7241,989.0986 L215,989.0986 L211,971.5707 L207,989.0986 L10,989.0986 A4,4 0 0 0 6,993.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,989.0986 L405.7241,997.0986 A2,2 0 0 0 407.7241,999.0986 L415.7241,999.0986 L405.7241,989.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="1006.2925">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="1021.2412">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="1036.1899">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN155" data-source-line="425" id="ent0156"><path d="M3132.5,1039.5986 L3132.5,1101.3936 A4,4 0 0 0 3136.5,1105.3936 L3538.2241,1105.3936 A4,4 0 0 0 3542.2241,1101.3936 L3542.2241,1045.5986 L3532.2241,1035.5986 L3341.5,1035.5986 L3337.5,1017.4611 L3333.5,1035.5986 L3136.5,1035.5986 A4,4 0 0 0 3132.5,1039.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3532.2241,1035.5986 L3532.2241,1043.5986 A2,2 0 0 0 3534.2241,1045.5986 L3542.2241,1045.5986 L3532.2241,1035.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.165" x="3138.5" y="1052.7925">U02: non-null body HMAC binds plaintext to message,</text><text fill="#000000" font-family="