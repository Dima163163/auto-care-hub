nt-size="13" lengthAdjust="spacing" textLength="361.3149" x="2502.5" y="614.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2502.5" y="629.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN134" data-source-line="380" id="ent0135"><path d="M2480,412.0986 L2480,458.9448 A4,4 0 0 0 2484,462.9448 L2915.3804,462.9448 A4,4 0 0 0 2919.3804,458.9448 L2919.3804,418.0986 L2909.3804,408.0986 L2703.5,408.0986 L2699.5,390.4153 L2695.5,408.0986 L2484,408.0986 A4,4 0 0 0 2480,412.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2909.3804,408.0986 L2909.3804,416.0986 A2,2 0 0 0 2911.3804,418.0986 L2919.3804,418.0986 L2909.3804,408.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2486" y="425.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2486" y="440.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2486" y="455.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN137" data-source-line="385" id="ent0138"><path d="M3118,905.0986 L3118,951.9448 A4,4 0 0 0 3122,955.9448 L3544.6841,955.9448 A4,4 0 0 0 3548.6841,951.9448 L3548.6841,911.0986 L3538.6841,901.0986 L3337.5,901.0986 L3333.5,883.4153 L3329.5,901.0986 L3122,901.0986 A4,4 0 0 0 3118,905.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3538.6841,901.0986 L3538.6841,909.0986 A2,2 0 0 0 3540.6841,911.0986 L3548.6841,911.0986 L3538.6841,901.0986" fill=