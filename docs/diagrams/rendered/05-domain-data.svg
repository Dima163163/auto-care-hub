949.7788" y1="1119.0986" y2="1119.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="747.5" cy="1132.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="127.8989" x="755.5" y="1135.2925">name : client_vehicles</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="755.5" y="1150.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="755.5" y="1165.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN70" data-source-line="231" id="ent0071"><path d="M1718.5,675.5986 L1718.5,737.3936 A4,4 0 0 0 1722.5,741.3936 L2047.6523,741.3936 A4,4 0 0 0 2051.6523,737.3936 L2051.6523,681.5986 L2041.6523,671.5986 L1889,671.5986 L1885,653.7559 L1881,671.5986 L1722.5,671.5986 A4,4 0 0 0 1718.5,675.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2041.6523,671.5986 L2041.6523,679.5986 A2,2 0 0 0 2043.6523,681.5986 L2051.6523,681.5986 L2041.6523,671.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1724.5" y="688.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1724.5" y="703.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1724.5" y="718.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1724.5" y="733.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN73" data-source-line="237" id="ent0074"><path d="M2991,979.5986 L2991,1019.0563 L3011.4538,813.5428 L2991,1027.0563 L2991,1041.3936 A4,4 0 0 0 2995,1045.3936 L3265.2642,1045.3936 A4,4 0 0 0 3269.2642,1041.3936 L3269.2642,985.5986 L3259.2642,975.5986 L2995,975.5986 A4,4 0 0 0 2991,979.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3259.2642,975.5986 L3259.2642,983.5986 A2,2 0 0 0 3261.2642,985.5986 L3269.2642,985.5986 L3259.2642,975.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="2997" y="992.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="2997" y="1007.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="2997" y="1022.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="2997" y="1037.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN76" data-source-line="243" id="ent0077"><path d="M676,323.0986 L676,369.9448 A4,4 0 0 0 680,373.9448 L1006.5869,373.9448 A4,4 0 0 0 1010.5869,369.9448 L1010.5869,329.0986 L1000.5869,319.0986 L847.5,319.0986 L843.5,300.6627 L839.5,319.0986 L680,319.0986 A4,4 0 0 0 676,323.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1000.5869,319.0986 L1000.5869,327.0986 A2,2 0 0 0 1002.5869,329.0986 L1010.5869,329.0986 L1000.5869,319.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="682" y="336.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="682" y="351.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="682" y="366.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN79" data-source-line="248" id="ent0080"><path d="M3623,273.0986 L3623,309.7951 L3634.157,100.1486 L3623,317.7951 L3623,319.9448 A4,4 0 0 0 3627,323.9448 L3869.0806,323.9448 A4,4 0 0 0 3873.0806,319.9448 L3873.0806,279.0986 L3863.0806,269.0986 L3627,269.0986 A4,4 0 0 0 3623,273.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3863.0806,269.0986 L3863.0806,277.0986 A2,2 0 0 0 3865.0806,279.0986 L3873.0806,279.0986 L3863.0806,269.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3629" y="286.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3629" y="301.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3629" y="316.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN82" data-source-line="253" id="ent0083"><path d="M2946,233.5986 L2946,325.291 A4,4 0 0 0 2950,329.291 L3309.874,329.291 A4,4 0 0 0 3313.874,325.291 L3313.874,239.5986 L3303.874,229.5986 L3134,229.5986 L3130,211.601 L3126,229.5986 L2950,229.5986 A4,4 0 0 0 2946,233.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3303.874,229.5986 L3303.874,237.5986 A2,2 0 0 0 3305.874,239.5986 L3313.874,239.5986 L3303.874,229.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="2952" y="246.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="2952" y="261.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="2952" y="276.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="2952" y="291.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="2952" y="306.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="2952" y="321.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN88" data-source-line="264" id="ent0089"><path d="M41.5,460.0986 L41.5,506.9448 A4,4 0 0 0 45.5,510.9448 L376.397,510.9448 A4,4 0 0 0 380.397,506.9448 L380.397,466.0986 L370.397,456.0986 L215,456.0986 L211,438.5707 L207,456.0986 L45.5,456.0986 A4,4 0 0 0 41.5,460.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,456.0986 L370.397,464.0986 A2,2 0 0 0 372.397,466.0986 L380.397,466.0986 L370.397,456.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="473.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="488.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="503.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN91" data-source-line="269" id="ent0092"><path d="M21,1077.0986 L21,1123.9448 A4,4 0 0 0 25,1127.9448 L397.1377,1127.9448 A4,4 0 0 0 401.1377,1123.9448 L401.1377,1083.0986 L391.1377,1073.0986 L215,1073.0986 L211,1055.5707 L207,1073.0986 L25,1073.0986 A4,4 0 0 0 21,1077.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,1073.0986 L391.1377,1081.0986 A2,2 0 0 0 393.1377,1083.0986 L401.1377,1083.0986 L391.1377,1073.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="1090.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="1105.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="1120.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN94" data-source-line="274" id="ent0095"><path d="M34.5,895.0986 L34.5,941.9448 A4,4 0 0 0 38.5,945.9448 L383.895,945.9448 A4,4 0 0 0 387.895,941.9448 L387.895,901.0986 L377.895,891.0986 L215,891.0986 L211,873.4153 L207,891.0986 L38.5,891.0986 A4,4 0 0 0 34.5,895.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,891.0986 L377.895,899.0986 A2,2 0 0 0 379.895,901.0986 L387.895,901.0986 L377.895,891.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="908.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="923.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="938.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN97" data-source-line="279" id="ent0098"><path d="M641,1194.0986 L641,1240.9448 A4,4 0 0 0 645,1244.9448 L1042.4077,1244.9448 A4,4 0 0 0 1046.4077,1240.9448 L1046.4077,1200.0986 L1036.4077,1190.0986 L847.5,1190.0986 L843.5,1172.4153 L839.5,1190.0986 L645,1190.0986 A4,4 0 0 0 641,1194.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1036.4077,1190.0986 L1036.4077,1198.0986 A2,2 0 0 0 1038.4077,1200.0986 L1046.4077,1200.0986 L1036.4077,1190.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="647" y="1207.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="647" y="1222.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="647" y="1237.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN100" data-source-line="284" id="ent0101"><path d="M6,721.0986 L6,767.9448 A4,4 0 0 0 10,771.9448 L411.7241,771.9448 A4,4 0 0 0 415.7241,767.9448 L415.7241,727.0986 L405.7241,717.0986 L215,717.0986 L211,699.5707 L207,717.0986 L10,717.0986 A4,4 0 0 0 6,721.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,717.0986 L405.7241,725.0986 A2,2 0 0 0 407.7241,727.0986 L415.7241,727.0986 L405.7241,717.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjus