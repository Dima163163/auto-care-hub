<g data-visibility-modifier="IE_MANDATORY"><ellipse cx="1310.5" cy="1640.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="216.8105" x="1318.5" y="1643.2925">name : booking_reschedule_requests</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="1318.5" y="1658.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="1318.5" y="1673.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN82" data-source-line="272" id="ent0083"><path d="M1882.5,657.5986 L1882.5,719.3936 A4,4 0 0 0 1886.5,723.3936 L2211.6523,723.3936 A4,4 0 0 0 2215.6523,719.3936 L2215.6523,663.5986 L2205.6523,653.5986 L2053,653.5986 L2049,635.7559 L2045,653.5986 L1886.5,653.5986 A4,4 0 0 0 1882.5,657.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2205.6523,653.5986 L2205.6523,661.5986 A2,2 0 0 0 2207.6523,663.5986 L2215.6523,663.5986 L2205.6523,653.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1888.5" y="670.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1888.5" y="685.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1888.5" y="700.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1888.5" y="715.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN85" data-source-line="278" id="ent0086"><path d="M3155,1101.5986 L3155,1163.3936 A4,4 0 0 0 3159,1167.3936 L3429.2642,1167.3936 A4,4 0 0 0 3433.2642,1163.3936 L3433.2642,1107.5986 L3423.2642,1097.5986 L3298,1097.5986 L3294,1079.7559 L3290,1097.5986 L3159,1097.5986 A4,4 0 0 0 3155,1101.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3423.2642,1097.5986 L3423.2642,1105.5986 A2,2 0 0 0 3425.2642,1107.5986 L3433.2642,1107.5986 L3423.2642,1097.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3161" y="1114.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3161" y="1129.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3161" y="1144.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3161" y="1159.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN88" data-source-line="284" id="ent0089"><path d="M676,334.0986 L676,380.9448 A4,4 0 0 0 680,384.9448 L1006.5869,384.9448 A4,4 0 0 0 1010.5869,380.9448 L1010.5869,340.0986 L1000.5869,330.0986 L847.5,330.0986 L843.5,311.6627 L839.5,330.0986 L680,330.0986 A4,4 0 0 0 676,334.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1000.5869,330.0986 L1000.5869,338.0986 A2,2 0 0 0 1002.5869,340.0986 L1010.5869,340.0986 L1000.5869,330.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="682" y="347.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="682" y="362.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="682" y="377.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN91" data-source-line="289" id="ent0092"><path d="M3787,273.0986 L3787,309.7951 L3798.157,100.1486 L3787,317.7951 L3787,319.9448 A4,4 0 0 0 3791,323.9448 L4033.0806,323.9448 A4,4 0 0 0 4037.0806,319.9448 L4037.0806,279.0986 L4027.0806,269.0986 L3791,269.0986 A4,4 0 0 0 3787,273.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4027.0806,269.0986 L4027.0806,277.0986 A2,2 0 0 0 4029.0806,279.0986 L4037.0806,279.0986 L4027.0806,269.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3793" y="286.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3793" y="301.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3793" y="316.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN94" data-source-line="294" id="ent0095"><path d="M3110,215.5986 L3110,307.291 A4,4 0 0 0 3114,311.291 L3473.874,311.291 A4,4 0 0 0 3477.874,307.291 L3477.874,221.5986 L3467.874,211.5986 L3298,211.5986 L3294,193.601 L3290,211.5986 L3114,211.5986 A4,4 0 0 0 3110,215.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3467.874,211.5986 L3467.874,219.5986 A2,2 0 0 0 3469.874,221.5986 L3477.874,221.5986 L3467.874,211.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3116" y="228.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3116" y="243.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3116" y="258.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3116" y="273.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3116" y="288.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3116" y="303.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN100" data-source-line="305" id="ent0101"><path d="M41.5,580.0986 L41.5,626.9448 A4,4 0 0 0 45.5,630.9448 L376.397,630.9448 A4,4 0 0 0 380.397,626.9448 L380.397,586.0986 L370.397,576.0986 L215,576.0986 L211,558.5707 L207,576.0986 L45.5,576.0986 A4,4 0 0 0 41.5,580.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,576.0986 L370.397,584.0986 A2,2 0 0 0 372.397,586.0986 L380.397,586.0986 L370.397,576.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="593.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="608.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="623.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN103" data-source-line="310" id="ent0104"><path d="M21,1305.0986 L21,1351.9448 A4,4 0 0 0 25,1355.9448 L397.1377,1355.9448 A4,4 0 0 0 401.1377,1351.9448 L401.1377,1311.0986 L391.1377,1301.0986 L215,1301.0986 L211,1283.5707 L207,1301.0986 L25,1301.0986 A4,4 0 0 0 21,1305.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,1301.0986 L391.1377,1309.0986 A2,2 0 0 0 393.1377,1311.0986 L401.1377,1311.0986 L391.1377,1301.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="1318.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="1333.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="1348.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN106" data-source-line="315" id="ent0107"><path d="M34.5,1123.0986 L34.5,1169.9448 A4,4 0 0 0 38.5,1173.9448 L383.895,1173.9448 A4,4 0 0 0 387.895,1169.9448 L387.895,1129.0986 L377.895,1119.0986 L215,1119.0986 L211,1101.4153 L207,1119.0986 L38.5,1119.0986 A4,4 0 0 0 34.5,1123.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,1119.0986 L377.895,1127.0986 A2,2 0 0 0 379.895,1129.0986 L387.895,1129.0986 L377.895,1119.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="1136.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="1151.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="1166.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN109" data-source-line="320" id="ent0110"><path d="M641,1630.0986 L641,1676.9448 A4,4 0 0 0 645,1680.9448 L1042.4077,1680.9448 A4,4 0 0 0 1046.4077,1676.9448 L1046.4077,1636.0986 L1036.4077,1626.0986 L847.5,1626.0986 L843.5,1608.4153 L839.5,1626.0986 L645,1626.0986 A4,4 0 0 0 641,1630.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1036.4077,1626.0986 L1036.4077,1634.0986 A2,2 0 0 0 1038.4077,1636.0986 L1046.4077,1636.0986 L1036.4077,1626.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="647" y="1643.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="647" y="1658.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="647" y="1673.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN112" data-source-line="325" id="ent0113"><path d="M1241,1193.0986 L1241,1239.9448 A4,4 0 0 0 1245,1243.9448 L1652.5005,1243.9448 A4,4 0 0 0 1656.5005,1239.9448 L1656.5005,1199.0986 L1646.5005,1189.0986 L1453,1189.0986 L1449,1171.4153 L1445,1189.0986 L1245,1189.0986 A4,4 0 0 0 1241,1193.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1646.5005,1189.0986 L1646.5005,1197.0986 A2,2 0 0 0 1648.5005,1199.0986 L1656.5005,1199.0986 L1646.5005,1189.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1247" y="1206.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1247" y="1221.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1247" y="1236.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN115" data-source-line="330" id="ent0116"><path d="M646,1456.0986 L646,1502.9448 A4,4 0 0 0 650,1506.9448 L1036.5596,1506.9448 A4,4 0 0 0 1040.5596,1502.9448 L1040.5596,1462.0986 L1030.5596,1452.0986 L847.5,1452.0986 L843.5,1434.4153 L839.5,1452.0986 L650,1452.0986 A4,4 0 0 0 646,1456.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1030.5596,1452.0986 L1030.5596,1460.0986 A2,2 0 0 0 1032.5596,1462.0986 L1040.5596,1462.0986 L1030.5596,1452.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="652" y="1469.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="652" y="1484.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="652" y="1499.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN118" data-source-line="335" id="ent0119"><path d="M1248.5,1702.0986 L1248.5,1748.9448 A4,4 0 0 0 1252.5,1752.9448 L1645.5977,1752.9448 A4,4 0 0 0 1649.5977,1748.9448 L1649.5977,1708.0986 L1639.5977,1698.0986 L1453,1698.0986 L1449,1680.4153 L1445,1698.0986 L1252.5,1698.0986 A4,4 0 0 0 1248.5,1702.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1639.5977,1698.0986 L1639.5977,1706.0986 A2,2 0 0 0 1641.5977,1708.0986 L1649.5977,1708.0986 L1639.5977,1698.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1254.5" y="1715.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1254.5" y="1730.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1254.5" y="1745.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN121" data-source-line="340" id="ent0122"><path d="M6,949.0986 L6,995.9448 A4,4 0 0 0 10,999.9448 L411.7241,999.9448 A4,4 0 0 0 415.7241,995.9448 L415.7241,955.0986 L405.7241,945.0986 L215,945.0986 L211,927.5707 L207,945.0986 L10,945.0986 A4,4 0 0 0 6,949.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,945.0986 L405.7241,953.0986 A2,2 0 0 0 407.7241,955.0986 L415.7241,955.0986 L405.7241,945.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="962.2925">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="977.2412">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="992.1899">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN124" data-source-line="345" id="ent0125"><path d="M3089,443.5986 L3089,505.3936 A4,4 0 0 0 3093,509.3936 L3494.7241,509.3936 A4,4 0 0 0 3498.7241,505.3936 L3498.7241,449.5986 L3488.7241,439.5986 L3298,439.5986 L3294,421.4611 L3290,439.5986 L3093,439.5986 A4,4 0 0 0 3089,443.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3488.7241,439.5986 L3488.7241,447.5986 A2,2 0 0 0 3490.7241,449.5986 L3498.7241,449.5986 L3488.7241,439.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.165" x="3095" y="456.7925">U02: non-null body HMAC binds plaintext to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="3095" y="471.7412">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="3095" y="486.6899">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252.1924" x="3095" y="501.6387">opt-in strict read. Null body has null binding.</text></g><g class="entity" data-qualified-name="GMN127" data-source-line="351" id="ent0128"><path d="M3089,641.5986 L3089,703.3936 A4,4 0 0 0 3093,707.3936 L3494.7241,707.3936 A4,4 0 0 0 3498.7241,703.3936 L3498.7241,647.5986 L3488.7241,637.5986 L3298,637.5986 L3294,619.4611 L3290,637.5986 L3093,637.5986 A4,4 0 0 0 3089,641.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3488.7241,637.5986 L3488.7241,645.5986 A2,2 0 0 0 3490.7241,647.5986 L3498.7241,647.5986 L3488.7241,637.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="356.9414" x="3095" y="654.7925">U02: non-null offer HMAC binds decrypte