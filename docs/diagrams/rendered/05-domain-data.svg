a-qualified-name="GMN43" data-source-line="122" id="ent0044"><path d="M937,230.5986 L937,292.3936 A4,4 0 0 0 941,296.3936 L1266.1523,296.3936 A4,4 0 0 0 1270.1523,292.3936 L1270.1523,236.5986 L1260.1523,226.5986 L1107.5,226.5986 L1103.5,208.7559 L1099.5,226.5986 L941,226.5986 A4,4 0 0 0 937,230.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1260.1523,226.5986 L1260.1523,234.5986 A2,2 0 0 0 1262.1523,236.5986 L1270.1523,236.5986 L1260.1523,226.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="943" y="243.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="943" y="258.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="943" y="273.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="943" y="288.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN46" data-source-line="128" id="ent0047"><path d="M1469,510.5986 L1469,572.3936 A4,4 0 0 0 1473,576.3936 L1743.2642,576.3936 A4,4 0 0 0 1747.2642,572.3936 L1747.2642,516.5986 L1737.2642,506.5986 L1612,506.5986 L1608,488.7559 L1604,506.5986 L1473,506.5986 A4,4 0 0 0 1469,510.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1737.2642,506.5986 L1737.2642,514.5986 A2,2 0 0 0 1739.2642,516.5986 L1747.2642,516.5986 L1737.2642,506.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="1475" y="523.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="1475" y="538.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="1475" y="553.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="1475" y="568.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN49" data-source-line="134" id="ent0050"><path d="M6,552.0986 L6,598.9448 A4,4 0 0 0 10,602.9448 L336.5869,602.9448 A4,4 0 0 0 340.5869,598.9448 L340.5869,558.0986 L330.5869,548.0986 L177.5,548.0986 L173.5,529.6627 L169.5,548.0986 L10,548.0986 A4,4 0 0 0 6,552.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M330.5869,548.0986 L330.5869,556.0986 A2,2 0 0 0 332.5869,558.0986 L340.5869,558.0986 L330.5869,548.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="12" y="565.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="12" y="580.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="12" y="595.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN52" data-source-line="139" id="ent0053"><path d="M2035,840.0986 L2035,876.7951 L2046.4645,672.0544 L2035,884.7951 L2035,886.9448 A4,4 0 0 0 2039,890.9448 L2281.0806,890.9448 A4,4 0 0 0 2285.0806,886.9448 L2285.0806,846.0986 L2275.0806,836.0986 L2039,836.0986 A4,4 0 0 0 2035,840.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2275.0806,836.0986 L2275.0806,844.0986 A2,2 0 0 0 2277.0806,846.0986 L2