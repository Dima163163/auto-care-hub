"#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="793" y="2386.1899">processed : bigint</text></g><!--class CatalogGapCheckpoint--><g class="entity" data-qualified-name="CatalogGapCheckpoint" data-source-line="311" id="ent0054"><rect fill="#F1F1F1" height="82.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="254.106" x="736.5" y="2581.0986"/><ellipse cx="771.3444" cy="2596.0986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M773.8141,2600.5986 L767.9108,2600.5986 L767.9108,2591.1216 L773.8141,2591.1216 L773.8141,2592.772 L769.7833,2592.772 L769.7833,2594.8159 L773.4332,2594.8159 L773.4332,2596.4663 L769.7833,2596.4663 L769.7833,2598.9482 L773.8141,2598.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="177.7852" x="788.9764" y="2600.8181">CatalogGapBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="737.5" x2="989.606" y1="2611.0986" y2="2611.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="747.5" cy="2624.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.106" x="755.5" y="2627.2925">name : autocare_catalog_gap_requests</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="755.5" y="2642.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="755.5" y="2657.1899">processed : bigint</text></g><!--class RepairEventCheckpoint--><g class="entity" data-qualified-name="RepairEventCheckpoint" data-source-line="316" id="ent0055"><rect fill="#F1F1F1" height="82.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="209.9434" x="2642" y="1046.0986"/><ellipse cx="2656" cy="1061.0986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M2658.4697,1065.5986 L2652.5664,1065.5986 L2652.5664,1056.1216 L2658.4697,1056.1216 L2658.4697,1057.772 L2654.439,1057.772 L2654.439,1059.8159 L2658.0889,1059.8159 L2658.0889,1061.4663 L2654.439,1061.4663 L2654.439,1063.9482 L2658.4697,1063.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="179.9434" x="2669" y="1065.8181">RepairEventBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="2643" x2="2850.9434" y1="1076.0986" y2="1076.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="2653" cy="1089.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="179.9434" x="2661" y="1092.2925">name : autocare_repair_events</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="2661" y="1107.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="2661" y="1122.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN114" data-source-line="380" id="ent0115"><path d="M1922.5,2042.5986 L1922.5,2104.3936 A4,4 0 0 0 1926.5,2108.3936 L2251.6523,2108.3936 A4,4 0 0 0 2255.6523,2104.3936 L2255.6523,2048.5986 L2245.6523,2038.5986 L2093,2038.5986 L2089,2020.7559 L2085,2038.5986 L1926.5,2038.5986 A4,4 0 0 0 1922.5,2042.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2245.6523,2038.5986 L2245.6523,2046.5986 A2,2 0 0 0 2247.6523,2048.5986 L2255.6523,2048.5986 L2245.6523,2038.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1928.5" y="2055.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1928.5" y="2070.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1928.5" y="2085.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1928.5" y="2100.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN117" data-source-line="386" id="ent0118"><path d="M3253.5,1134.5986 L3253.5,1196.3936 A4,4 0 0 0 3257.5,1200.3936 L3527.7642,1200.3936 A4,4 0 0 0 3531.7642,1196.3936 L3531.7642,1140.5986 L3521.7642,1130.5986 L3396.5,1130.5986 L3392.5,1112.7559 L3388.5,1130.5986 L3257.5,1130.5986 A4,4 0 0 0 3253.5,1134.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3521.7642,1130.5986 L3521.7642,1138.5986 A2,2 0 0 0 3523.7642,1140.5986 L3531.7642,1140.5986 L3521.7642,1130.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3259.5" y="1147.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3259.5" y="1162.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3259.5" y="1177.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3259.5" y="1192.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN120" data-source-line="392" id="ent0121"><path d="M696,1928.0986 L696,1974.9448 A4,4 0 0 0 700,1978.9448 L1026.5869,1978.9448 A4,4 0 0 0 1030.5869,1974.9448 L1030.5869,1934.0986 L1020.5869,1924.0986 L867.5,1924.0986 L863.5,1905.6627 L859.5,1924.0986 L700,1924.0986 A4,4 0 0 0 696,1928.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1020.5869,1924.0986 L1020.5869,1932.0986 A2,2 0 0 0 1022.5869,1934.0986 L1030.5869,1934.0986 L1020.5869,1924.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="702" y="1941.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="702" y="1956.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="702" y="1971.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN123" data-source-line="397" id="ent0124"><path d="M3900,1937.0986 L3900,1983.9448 A4,4 0 0 0 3904,1987.9448 L4146.0806,1987.9448 A4,4 0 0 0 4150.0806,1983.9448 L4150.0806,1943.0986 L4140.0806,1933.0986 L4029,1933.0986 L4025,1915.3133 L4021,1933.0986 L3904,1933.0986 A4,4 0 0 0 3900,1937.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4140.0806,1933.0986 L4140.0806,1941.0986 A2,2 0 0 0 4142.0806,1943.0986 L4150.0806,1943.0986 L4140.0806,1933.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3906" y="1950.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3906" y="1965.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3906" y="1980.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN126" data-source-line="402" id="ent0127"><path d="M3208.5,1914.5986 L3208.5,2006.291 A4,4 0 0 0 3212.5,2010.291 L3572.374,2010.291 A4,4 0 0 0 3576.374,2006.291 L3576.374,1920.5986 L3566.374,1910.5986 L3396.5,1910.5986 L3392.5,1892.601 L3388.5,1910.5986 L3212.5,1910.5986 A4,4 0 0 0 3208.5,1914.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3566.374,1910.5986 L3566.374,1918.5986 A2,2 0 0 0 3568.374,1920.5986 L3576.374,1920.5986 L3566.374,1910.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3214.5" y="1927.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3214.5" y="1942.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3214.5" y="1957.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3214.5" y="1972.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3214.5" y="1987.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3214.5" y="2002.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN132" data-source-line="413" id="ent0133"><path d="M41.5,1935.0986 L41.5,1981.9448 A4,4 0 0 0 45.5,1985.9448 L376.397,1985.9448 A4,4 0 0 0 380.397,1981.9448 L380.397,1941.0986 L370.397,1931.0986 L215,1931.0986 L211,1913.5707 L207,1931.0986 L45.5,1931.0986 A4,4 0 0 0 41.5,1935.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,1931.0986 L370.397,1939.0986 A2,2 0 0 0 372.397,1941.0986 L380.397,1941.0986 L370.397,1931.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="1948.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="1963.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="1978.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN135" data-source-line="418" id="ent0136"><path d="M21,2477.0986 L21,2523.9448 A4,4 0 0 0 25,2527.9448 L397.1377,2527.9448 A4,4 0 0 0 401.1377,2523.9448 L401.1377,2483.0986 L391.1377,2473.0986 L215,2473.0986 L211,2455.5707 L207,2473.0986 L25,2473.0986 A4,4 0 0 0 21,2477.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,2473.0986 L391.1377,2481.0986 A2,2 0 0 0 393.1377,2483.0986 L401.1377,2483.0986 L391.1377,2473.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="2490.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="2505.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="2520.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN138" data-source-line="423" id="ent0139"><path d="M34.5,2295.0986 L34.5,2341.9448 A4,4 0 0 0 38.5,2345.9448 L383.895,2345.9448 A4,4 0 0 0 387.895,2341.9448 L387.895,2301.0986 L377.895,2291.0986 L215,2291.0986 L211,2273.4153 L207,2291.0986 L38.5,2291.0986 A4,4 0 0 0 34.5,2295.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,2291.0986 L377.895,2299.0986 A2,2 0 0 0 379.895,2301.0986 L387.895,2301.0986 L377.895,2291.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="2308.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="2323.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="2338.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN141" data-source-line="428" id="ent0142"><path d="M661,2102.0986 L661,2148.9448 A4,4 0 0 0 665,2152.9448 L1062.4077,2152.9448 A4,4 0 0 0 1066.4077,2148.9448 L1066.4077,2108.0986 L1056.4077,2098.0986 L867.5,2098.0986 L863.5,2080.4153 L859.5,2098.0986 L665,2098.0986 A4,4 0 0 0 661,2102.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1056.4077,2098.0986 L1056.4077,2106.0986 A2,2 0 0 0 1058.4077,2108.0986 L1066.4077,2108.0986 L1056.4077,2098.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="667" y="2115.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="667" y="2130.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="667" y="2145.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN144" data-source-line="433" id="ent0145"><path d="M1281,2524.0986 L1281,2570.9448 A4,4 0 0 0 1285,2574.9448 L1692.5005,2574.9448 A4,4 0 0 0 1696.5005,2570.9448 L1696.5005,2530.0986 L1686.5005,2520.0986 L1493,2520.0986 L1489,2502.4153 L1485,2520.0986 L1285,2520.0986 A4,4 0 0 0 1281,2524.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1686.5005,2520.0986 L1686.5005,2528.0986 A2,2 0 0 0 1688.5005,2530.0986 L1696.5005,2530.0986 L1686.5005,2520.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1287" y="2537.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1287" y="2552.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1287" y="2567.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN147" data-source-line="438" id="ent0148"><path d="M666,2876.0986 L666,2922.9448 A4,4 0 0 0 670,2926.9448 L1056.5596,2926.9448 A4,4 0 0 0 1060.5596,2922.9448 L1060.5596,2882.0986 L1050.5596,2872.0986 L867.5,2872.0986 L863.5,2854.4153 L859.5,2872.0986 L670,2872.0986 A4,4 0 0 0 666,2876.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1050.5596,2872.0986 L1050.5596,2880.0986 A2,2 0 0 0 1052.5596,2882.0986 L1060.5596,2882.0986 L1050.5596,2872.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="672" y="2889.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="672" y="2904.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="672" y="2919.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN150" data-source-line="443" id="ent0151"><path d="M1288.5,2960.0986 L1288.5,3006.9448 A4,4 0 0 0 1292.5,3010.9448 L1685.5977,3010.9448 A4,4 0 0 0 1689.5977,3006.9448 L1689.5977,2966.0986 L1679.5977,2956.0986 L1493,2956.0986 L1489,2938.4153 L1485,2956.0986 L1292.5,2956.0986 A4,4 0 0 0 1288.5,2960.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1679.5977,2956.0986 L1679.5977,2964.0986 A2,2 0 0 0 1681.5977,2966.0986 L1689.5977,2966.0986 L1679.5977,2956.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1294.5" y="2973.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1294.5" y="2988.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1294.5" y="3003.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN153" data-source-line="448" id="ent0154"><path d="M2544,1576.0986 L2544,1622.9448 A4,4 0 0 0 2548,1626.9448 L2946.1567,1626.9448 A4,4 0 0 0 2950.1567,1622.9448 L2950.1567,1582.0986 L2940.1567,1572.0986 L2751,1572.0986 L2747,1554.4153 L2743,1572.0986 L2548,1572.0986 A4,4 0 0 0 2544,1576.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2940.1567,1572.0986 L2940.1567,1580.0986 A2,2 0 0 0 2942.1567,1582.0986 L2950.1567,1582.0986 L2940.1567,1572.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2550" y="1589.2925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2550" y="1604.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2550" y="1619.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN156" data-source-line="453" id="ent0157"><path d="M2527.5,1777.0986 L2527.5,1823.9448 A4,4 0 0 0 2531.5,1827.9448 L2962.8804,1827.9448 A4,4 0 0 0 2966.8804,1823.9448 L2966.8804,1783.0986 L2956.8804,1773.0986 L2751,1773.0986 L2747,1755.4153 L2743,1773.0986 L2531.5,1773.0986 A4,4 0 0 0 2527.5,1777.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2956.8804,1773.0986 L2956.8804,1781.0986 A2,2 0 0 0 2958.8804,1783.0986 L2966.8804,1783.0986 L2956.8804,1773.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2533.5" y="1790.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2533.5" y="1805.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2533.5" y="1820.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN159" data-source-line="458" id="ent0160"><path d="M3177,259.0986 L3177,305.9448 A4,4 0 0 0 3181,309.9448 L3603.6841,309.9448 A4,4 0 0 0 3607.6841,305.9448 L3607.6841,265.0986 L3597.6841,255.0986 L3396.5,255.0986 L3392.5,237.4153 L3388.5,255.0986 L3181,255.0986 A4,4 0 0 0 3177,259.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3597.6841,255.0986 L3597.6841,263.0986 A2,2 0 0 0 3599.6841,265.0986 L3607.6841,265.0986 L3597.6841,255.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3183" y="272.2925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3183" y="287.2412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3183" y="302.1899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN162" data-source-line="463" id="ent0163"><path d="M3173,945.0986 L3173,991.9448 A4,4 0 0 0 3177,995.9448 L3608.4312,995.9448 A4,4 0 0 0 3612.4312,991.9448 L3612.4312,951.0986 L3602.4312,941.0986 L3396.5,941.0986 L3392.5,923.4153 L3388.5,941.0986 L3177,941.0986 A4,4 0 0 0 3173,945.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3602.4312,941.0986 L3602.4312,949.0986 A2,2 0 0 0 3604.4312,951.0986 L3612.4312,951.0986 L3602.4312,941.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8423" x="3179" y="958.2925">U02: HMAC binds reason to block/thread/blocker/blocked-user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.4312" x="3179" y="973.2412">Status can change without breaking the binding. Bounded compare-write</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="3179" y="988.1899">and full verify precede opt-in strict read; deletion clears both.</text></g><g class="entity" data-qualified-name="GMN165" data-source-line="468" id="ent0166"><path d="M3177,1609.0986 L3177,1655.9448 A4,4 0 0 0 3181,1659.9448 L3604.4268,1659.9448 A4,4 0 0 0 3608.4268,1655.9448 L3608.4268,1615.0986 L3598.4268,1605.0986 L3396.5,1605.0986 L3392.5,1587.4153 L3388.5,1605.0986 L3181,1605.0986 A4,4 0 0 0 3177,1609.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3598.4268,1605.0986 L3598.4268,1613.0986 A2,2 0 0 0 3600.4268,1615.0986 L3608.4268,1615.0986 L3598.4268,1605.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410.4268" x="3183" y="1622.2925">U02: HMAC binds reference/notes to evidence/provider UUID and kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4604" x="3183" y="1637.2412">Read verifies reference against blind index. Backfill clears stale</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="3183" y="1652.1899">indexes after null redaction; full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN168" data-source-line="473" id="ent0169"><path d="M641,1268.5986 L641,1330.3936 A4,4 0 0 0 645,1334.3936 L1082.1567,1334.3936 A4,4 0 0 0 1086.1567,1330.3936 L1086.1567,1274.5986 L1076.1567,1264.5986 L867.5,1264.5986 L863.5,1246.1408 L859.5,1264.5986 L645,1264.5986 A4,4 0 0 0 641,1268.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1076.1567,1264.5986 L1076.1567,1272.5986 A2,2 0 0 0 1078.1567,1274.5986 L1086.1567,1274.5986 L1076.1567,1264.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1567" x="647" y="1281.7925">U02: HMAC binds encrypted payload and review reason to request UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.3149" x="647" y="1296.7412">provider UUID, requester UUID and kind. Account deletion reseals each</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.9121" x="647" y="1311.6899">redacted payload with its own binding and clears reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="647" y="1326.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN171" data-source-line="479" id="ent0172"><path d="M646.5,2415.5986 L646.5,2477.3936 A4,4 0 0 0 650.5,2481.3936 L1076.834,2481.3936 A4,4 0 0 0 1080.834,2477.3936 L1080.834,2421.5986 L1070.834,2411.5986 L867.5,2411.5986 L863.5,2393.1408 L859.5,2411.5986 L650.5,2411.5986 A4,4 0 0 0 646.5,2415.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1070.834,2411.5986 L1070.834,2419.5986 A2,2 0 0 0 1072.834,2421.5986 L1080.834,2421.5986 L1070.834,2411.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.334" x="652.5" y="2428.7925">U02: HMAC binds reason and decisionReason to appeal UUID, subject,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="411.144" x="652.5" y="2443.7412">subjectId, submitter UUID and nullable provider UUID. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="405.4121" x="652.5" y="2458.6899">reseals each redacted reason and clears decision reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="652.5" y="2473.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN174" data-source-line="485" id="ent0175"><path d="M652.5,2686.5986 L652.5,2748.3936 A4,4 0 0 0 656.5,2752.3936 L1070.5005,2752.3936 A4,4 0 0 0 1074.5005,2748.3936 L1074.5005,2692.5986 L1064.5005,2682.5986 L867.5,2682.5986 L863.5,2664.1408 L859.5,2682.5986 L656.5,2682.5986 A4,4 0 0 0 652.5,2686.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1064.5005,2682.5986 L1064.5005,2690.5986 A2,2 0 0 0 1066.5005,2692.5986 L1074.5005,2692.5986 L1064.5005,2682.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0005" x="658.5" y="2699.7925">U02: four HMACs bind encrypted fields to gap UUID, requester UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8931" x="658.5" y="2714.7412">nullable provider UUID and catalog slugs/price type. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5386" x="658.5" y="2729.6899">reseals each redacted row and clears reviewReason with its binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="658.5" y="2744.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN177" data-source-line="491" id="ent0178"><path d="M2520,1151.5986 L2520,1213.3936 A4,4 0 0 0 2524,1217.3936 L2969.834,1217.3936 A4,4 0 0 0 2973.834,1213.3936 L2973.834,1157.5986 L2963.834,1147.5986 L2751,1147.5986 L2747,1129.1408 L2743,1147.5986 L2524,1147.5986 A4,4 0 0 0 2520,1151.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2963.834,1147.5986 L2963.834,1155.5986 A2,2 0 0 0 2965.834,1157.5986 L2973.834,1157.5986 L2963.834,1147.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="432.834" x="2526" y="1164.7925">U02: three HMACs bind encrypted title, notes and metadata to event UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1885" x="2526" y="1179.7412">request UUID and eventType. Account deletion reseals title and metadata</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="379.3486" x="2526" y="1194.6899">for each row and clears notes with its binding. Full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="96.8145" x="2526" y="1209.6387">opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN180" data-source-line="497" id="ent0181"><path d="M6,2121.0986 L6,2167.9448 A4,4 0 0 0 10,2171.9448 L411.7241,2171.9448 A4,4 0 0 0 415.7241,2167.9448 L415.7241,2127.0986 L405.7241,2117.0986 L215,2117.0986 L211,2099.5707 L207,2117.0986 L10,2117.0986 A4,4 0 0 0 6,2121.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,2117.0986 L405.7241,2125.0986 A2,2 0 0 0 407.7241,2127.0986 L415.7241,2127.0986 L405.7241,2117.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="2134.2925">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="2149.2412">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="2164.1899">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN183" data-source-line="502" id="ent0184"><path d=