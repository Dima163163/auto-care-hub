nt-size="13" lengthAdjust="spacing" textLength="418.3804" x="2486" y="405.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2486" y="420.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2486" y="435.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN141" data-source-line="397" id="ent0142"><path d="M3122,1612.0986 L3122,1658.9448 A4,4 0 0 0 3126,1662.9448 L3548.6841,1662.9448 A4,4 0 0 0 3552.6841,1658.9448 L3552.6841,1618.0986 L3542.6841,1608.0986 L3341.5,1608.0986 L3337.5,1590.4153 L3333.5,1608.0986 L3126,1608.0986 A4,4 0 0 0 3122,1612.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3542.6841,1608.0986 L3542.6841,1616.0986 A2,2 0 0 0 3544.6841,1618.0986 L3552.6841,1618.0986 L3542.6841,1608.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3128" y="1625.2925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3128" y="1640.2412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3128" y="1655.1899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN144" data-source-line="402" id="ent0145"><path d="M3118,1283.0986 L3118,1329.9448 A4,4 0 0 0 3122,1333.9448 L3553.4312,1333.9448 A4,4 0 0 0 3557.4312,1329.9448 L3557.4312,1289.0986 L3547.4312,1279.0986 L3341.5,1279.0986 L3337.5,1261.4153 L33