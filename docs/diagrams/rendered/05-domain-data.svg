g" textLength="215.3569" x="3161" y="1332.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3161" y="1347.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3161" y="1362.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3161" y="1377.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN92" data-source-line="298" id="ent0093"><path d="M676,395.0986 L676,441.9448 A4,4 0 0 0 680,445.9448 L1006.5869,445.9448 A4,4 0 0 0 1010.5869,441.9448 L1010.5869,401.0986 L1000.5869,391.0986 L847.5,391.0986 L843.5,372.6627 L839.5,391.0986 L680,391.0986 A4,4 0 0 0 676,395.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1000.5869,391.0986 L1000.5869,399.0986 A2,2 0 0 0 1002.5869,401.0986 L1010.5869,401.0986 L1000.5869,391.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="682" y="408.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="682" y="423.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="682" y="438.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN95" data-source-line="303" id="ent0096"><path d="M3787,273.0986 L3787,309.7951 L3798.157,100.1486 L3787,317.7951 L3787,319.9448 A4,4 0 0 0 3791,323.9448 L4033.0806,323.9448 A4,4 0 0 0 4037.0806,319.9448 L4037.0806,279.0986 L4027.0806,269.0986 L3791,269.0986 A4,4 0 0 0 3787,273.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4027.0806,269.0986 L4027.0806,277.0986 A2,2 0 0 0 4029.0806,279.0986 L4037.0806,279.0986 L4027.0806,269.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3793" y="286.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3793" y="301.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3793" y="316.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN98" data-source-line="308" id="ent0099"><path d="M3110,332.5986 L3110,424.291 A4,4 0 0 0 3114,428.291 L3473.874,428.291 A4,4 0 0 0 3477.874,424.291 L3477.874,338.5986 L3467.874,328.5986 L3298,328.5986 L3294,310.601 L3290,328.5986 L3114,328.5986 A4,4 0 0 0 3110,332.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3467.874,328.5986 L3467.874,336.5986 A2,2 0 0 0 3469.874,338.5986 L3477.874,338.5986 L3467.874,328.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3116" y="345.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3116" y="360.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3116" y="375.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3116" y="390.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3116" y="405.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3116" y="420.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN104" data-source-line="319" id="ent0105"><path d="M41.5,674.0986 L41.5,720.9448 A4,4 0 0 0 45.5,724.9448 L376.397,724.9448 A4,4 0 0 0 380.397,720.9448 L380.397,680.0986 L370.397,670.0986 L215,670.0986 L211,652.5707 L207,670.0986 L45.5,670.0986 A4,4 0 0 0 41.5,674.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,670.0986 L370.397,678.0986 A2,2 0 0 0 372.397,680.0986 L380.397,680.0986 L370.397,670.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="687.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="702.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="717.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN107" data-source-line="324" id="ent0108"><path d="M21,1433.0986 L21,1479.9448 A4,4 0 0 0 25,1483.9448 L397.1377,1483.9448 A4,4 0 0 0 401.1377,1479.9448 L401.1377,1439.0986 L391.1377,1429.0986 L215,1429.0986 L211,1411.5707 L207,1429.0986 L25,1429.0986 A4,4 0 0 0 21,1433.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,1429.0986 L391.1377,1437.0986 A2,2 0 0 0 393.1377,1439.0986 L401.1377,1439.0986 L391.1377,1429.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="1446.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="1461.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="1476.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN110" data-source-line="329" id="ent0111"><path d="M34.5,1251.0986 L34.5,1297.9448 A4,4 0 0 0 38.5,1301.9448 L383.895,1301.9448 A4,4 0 0 0 387.895,1297.9448 L387.895,1257.0986 L377.895,1247.0986 L215,1247.0986 L211,1229.4153 L207,1247.0986 L38.5,1247.0986 A4,4 0 0 0 34.5,1251.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,1247.0986 L377.895,1255.0986 A2,2 0 0 0 379.895,1257.0986 L387.895,1257.0986 L377.895,1247.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="1264.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="1279.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="1294.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN113" data-source-line="334" id="ent0114"><path d="M641,1758.0986 L641,1804.9448 A4,4 0 0 0 645,1808.9448 L1042.4077,1808.9448 A4,4 0 0 0 1046.4077,1804.9448 L1046.4077,1764.0986 L1036.4077,1754.0986 L847.5,1754.0986 L843.5,1736.4153 L839.5,1754.0986 L645,1754.0986 A4,4 0 0 0 641,1758.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1036.4077,1754.0986 L1036.4077,1762.0986 A2,2 0 0 0 1038.4077,1764.0986 L1046.4077,1764.0986 L1036.4077,1754.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="647" y="1771.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="647" y="1786.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="647" y="1801.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN116" data-source-line="339" id="ent0117"><path d="M1241,1321.0986 L1241,1367.9448 A4,4 0 0 0 1245,1371.9448 L1652.5005,1371.9448 A4,4 0 0 0 1656.5005,1367.9448 L1656.5005,1327.0986 L1646.5005,1317.0986 L1453,1317.0986 L1449,1299.4153 L1445,1317.0986 L1245,1317.0986 A4,4 0 0 0 1241,1321.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1646.5005,1317.0986 L1646.5005,1325.0986 A2,2 0 0 0 1648.5005,1327.0986 L1656.5005,1327.0986 L1646.5005,1317.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1247" y="1334.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1247" y="1349.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1247" y="1364.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN119" data-source-line="344" id="ent0120"><path d="M646,1584.0986 L646,1630.9448 A4,4 0 0 0 650,1634.9448 L1036.5596,1634.9448 A4,4 0 0 0 1040.5596,1630.9448 L1040.5596,1590.0986 L1030.5596,1580.0986 L847.5,1580.0986 L843.5,1562.4153 L839.5,1580.0986 L650,1580.0986 A4,4 0 0 0 646,1584.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1030.5596,1580.0986 L1030.5596,1588.0986 A2,2 0 0 0 1032.5596,1590.0986 L1040.5596,1590.0986 L1030.5596,1580.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="652" y="1597.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="652" y="1612.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="652" y="1627.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN122" data-source-line="349" id="ent0123"><path d="M1248.5,1830.0986 L1248.5,1876.9448 A4,4 0 0 0 1252.5,1880.9448 L1645.5977,1880.9448 A4,4 0 0 0 1649.5977,1876.9448 L1649.5977,1836.0986 L1639.5977,1826.0986 L1453,1826.0986 L1449,1808.4153 L1445,1826.0986 L1252.5,1826.0986 A4,4 0 0 0 1248.5,1830.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1639.5977,1826.0986 L1639.5977,1834.0986 A2,2 0 0 0 1641.5977,1836.0986 L1649.5977,1836.0986 L1639.5977,1826.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1254.5" y="1843.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1254.5" y="1858.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1254.5" y="1873.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN125" data-source-line="354" id="ent0126"><path d="M2482,193.0986 L2482,239.9448 A4,4 0 0 0 2486,243.9448 L2884.1567,243.9448 A4,4 0 0 0 2888.1567,239.9448 L2888.1567,199.0986 L2878.1567,189.0986 L2689,189.0986 L2685,171.4153 L2681,189.0986 L2486,189.0986 A4,4 0 0 0 2482,193.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2878.1567,189.0986 L2878.1567,197.0986 A2,2 0 0 0 2880.1567,199.0986 L2888.1567,199.0986 L2878.1567,189.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2488" y="206.2925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2488" y="221.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2488" y="236.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN128" data-source-line="359" id="ent0129"><path d="M6,1077.0986 L6,1123.9448 A4,4 0 0 0 10,1127.9448 L411.7241,1127.9448 A4,4 0 0 0 415.7241,1123.9448 L415.7241,1083.0986 L405.7241,1073.0986 L215,1073.0986 L211,1055.5707 L207,1073.0986 L10,1073.0986 A4,4 0 0 0 6,1077.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,1073.0986 L405.7241,1081.0986 A2,2 0 0 0 407.7241,1083.0986 L415.7241,1083.0986 L405.7241,1073.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="1090.2925">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="1105.2412">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="1120.1899">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN131" data-source-line="364" id="ent0132"><path d="M3089,859.5986 L3089,921.3936 A4,4 0 0 0 3093,925.3936 L3494.7241,925.3936 A4,4 0 0 0 3498.7241,921.3936 L3498.7241,865.5986 L3488.7241,855.5986 L3298,855.5986 L3294,837.4611 L3290,855.5986 L3093,855.5986 A4,4 0 0 0 3089,859.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3488.7241,855.5986 L3488.7241,863.5986 A2,2 0 0 0 3490.7241,865.5986 L3498.7241,865.5986 L3488.7241,855.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.165" x="3095" y="872.7925">U02: non-null body HMAC binds plaintext to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="3095" y="887.7412">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="3095" y="902.6899">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252.1924" x="3095" y="917.6387">opt-in strict read. Null body has null binding.</text></g><g class="entity" data-qualified-name="GMN134" data-source-line="370" id="ent0135"><path d="M3089,661.5986 L3089,723.39