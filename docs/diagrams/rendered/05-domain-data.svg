x="803" y="205.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="803" y="220.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="803" y="235.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="803" y="250.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN46" data-source-line="125" id="ent0047"><path d="M1329,339.5986 L1329,401.3936 A4,4 0 0 0 1333,405.3936 L1603.2642,405.3936 A4,4 0 0 0 1607.2642,401.3936 L1607.2642,345.5986 L1597.2642,335.5986 L1472,335.5986 L1468,317.7559 L1464,335.5986 L1333,335.5986 A4,4 0 0 0 1329,339.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1597.2642,335.5986 L1597.2642,343.5986 A2,2 0 0 0 1599.2642,345.5986 L1607.2642,345.5986 L1597.2642,335.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="1335" y="352.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="1335" y="367.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="1335" y="382.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="1335" y="397.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN50" data-source-line="132" id="ent0051"><path d="M1803,725.5986 L1803,787.3936 A4,4 0 0 0 1807,791.3936 L2232.8262