.5986"/><ellipse cx="2692.5" cy="1363.5986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M2694.9697,1368.0986 L2689.0664,1368.0986 L2689.0664,1358.6216 L2694.9697,1358.6216 L2694.9697,1360.272 L2690.939,1360.272 L2690.939,1362.3159 L2694.5889,1362.3159 L2694.5889,1363.9663 L2690.939,1363.9663 L2690.939,1366.4482 L2694.9697,1366.4482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="203.0615" x="2705.5" y="1368.3181">GuaranteeClaimBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="2679.5" x2="2910.5615" y1="1378.5986" y2="1378.5986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="2689.5" cy="1391.573" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="203.7915" x="2697.5" y="1394.7925">name : autocare_guarantee_claims</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="2697.5" y="1409.7412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="2697.5" y="1424.6899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN127" data-source-line="417" id="ent0128"><path d="M1970.5,2020.0986 L1970.5,2081.8936 A4,4 0 0 0 1974.5,2085.8936 L2299.6523,2085.8936 A4,4 0 0 0 2303.6523,2081.8936 L2303.6523,2026.0986 L2293.6523,2016.0986 L2141,2016.0986 L2137,1998.2559 L2133,2016.0986 L1974.5,2016.0986 A4,4 0 0 0 1970.5,2020.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2293.6523,2016.0986 L2293.6523,2024.0986 A2,2 0 0 0 2295.6523,2026.0986 L2303.6523,2026.0986 L2293.6523,2016.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1976.5" y="2033.2925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1976.5" y="2048.2412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1976.5" y="2063.1899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1976.5" y="2078.1387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN130" data-source-line="423" id="ent0131"><path d="M3301.5,1432.0986 L3301.5,1493.8936 A4,4 0 0 0 3305.5,1497.8936 L3575.7642,1497.8936 A4,4 0 0 0 3579.7642,1493.8936 L3579.7642,1438.0986 L3569.7642,1428.0986 L3444.5,1428.0986 L3440.5,1410.3312 L3436.5,1428.0986 L3305.5,1428.0986 A4,4 0 0 0 3301.5,1432.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3569.7642,1428.0986 L3569.7642,1436.0986 A2,2 0 0 0 3571.7642,1438.0986 L3579.7642,1438.0986 L3569.7642,1428.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3307.5" y="1445.2925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3307.5" y="1460.2412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3307.5" y="1475.1899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3307.5" y="1490.1387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN133" data-source-line="429" id="ent0134"><path d="M696,1664.5986 L696,1711.4448 A4,4 0 0 0 700,1715.4448 L1026.5869,1715.4448 A4,4 0 0 0 1030.5869,1711.4448 L1030.5869,1670.5986 L1020.5869,1660.5986 L867.5,1660.5986 L863.5,1642.1627 L859.5,1660.5986 L700,1660.5986 A4,4 0 0 0 696,1664.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1020.5869,1660.5986 L1020.5869,1668.5986 A2,2 0 0 0 1022.5869,1670.5986 L1030.5869,1670.5986 L1020.5869,1660.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="702" y="1677.7925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="702" y="1692.7412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="702" y="1707.6899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN136" data-source-line="434" id="ent0137"><path d="M3948,1985.5986 L3948,2032.4448 A4,4 0 0 0 3952,2036.4448 L4194.0806,2036.4448 A4,4 0 0 0 4198.0806,2032.4448 L4198.0806,1991.5986 L4188.0806,1981.5986 L4077,1981.5986 L4073,1963.8133 L4069,1981.5986 L3952,1981.5986 A4,4 0 0 0 3948,1985.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4188.0806,1981.5986 L4188.0806,1989.5986 A2,2 0 0 0 4190.0806,1991.5986 L4198.0806,1991.5986 L4188.0806,1981.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3954" y="1998.7925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3954" y="2013.7412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3954" y="2028.6899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN139" data-source-line="439" id="ent0140"><path d="M3256.5,1768.0986 L3256.5,1859.791 A4,4 0 0 0 3260.5,1863.791 L3620.374,1863.791 A4,4 0 0 0 3624.374,1859.791 L3624.374,1774.0986 L3614.374,1764.0986 L3444.5,1764.0986 L3440.5,1746.101 L3436.5,1764.0986 L3260.5,1764.0986 A4,4 0 0 0 3256.5,1768.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3614.374,1764.0986 L3614.374,1772.0986 A2,2 0 0 0 3616.374,1774.0986 L3624.374,1774.0986 L3614.374,1764.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3262.5" y="1781.2925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3262.5" y="1796.2412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3262.5" y="1811.1899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3262.5" y="1826.1387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3262.5" y="1841.0874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3262.5" y="1856.0361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN145" data-source-line="450" id="ent0146"><path d="M41.5,1660.5986 L41.5,1707.4448 A4,4 0 0 0 45.5,1711.4448 L376.397,1711.4448 A4,4 0 0 0 380.397,1707.4448 L380.397,1666.5986 L370.397,1656.5986 L215,1656.5986 L211,1639.0707 L207,1656.5986 L45.5,1656.5986 A4,4 0 0 0 41.5,1660.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,1656.5986 L370.397,1664.5986 A2,2 0 0 0 372.397,1666.5986 L380.397,1666.5986 L370.397,1656.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="1673.7925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="1688.7412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="1703.6899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN148" data-source-line="455" id="ent0149"><path d="M21,2016.5986 L21,2063.4448 A4,4 0 0 0 25,2067.4448 L397.1377,2067.4448 A4,4 0 0 0 401.1377,2063.4448 L401.1377,2022.5986 L391.1377,2012.5986 L215,2012.5986 L211,1995.0707 L207,2012.5986 L25,2012.5986 A4,4 0 0 0 21,2016.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,2012.5986 L391.1377,2020.5986 A2,2 0 0 0 393.1377,2022.5986 L401.1377,2022.5986 L391.1377,2012.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="2029.7925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="2044.7412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="2059.6899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN151" data-source-line="460" id="ent0152"><path d="M34.5,1834.5986 L34.5,1881.4448 A4,4 0 0 0 38.5,1885.4448 L383.895,1885.4448 A4,4 0 0 0 387.895,1881.4448 L387.895,1840.5986 L377.895,1830.5986 L215,1830.5986 L211,1812.9153 L207,1830.5986 L38.5,1830.5986 A4,4 0 0 0 34.5,1834.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,1830.5986 L377.895,1838.5986 A2,2 0 0 0 379.895,1840.5986 L387.895,1840.5986 L377.895,1830.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="1847.7925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="1862.7412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="1877.6899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN154" data-source-line="465" id="ent0155"><path d="M661,2101.5986 L661,2148.4448 A4,4 0 0 0 665,2152.4448 L1062.4077,2152.4448 A4,4 0 0 0 1066.4077,2148.4448 L1066.4077,2107.5986 L1056.4077,2097.5986 L867.5,2097.5986 L863.5,2079.9153 L859.5,2097.5986 L665,2097.5986 A4,4 0 0 0 661,2101.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1056.4077,2097.5986 L1056.4077,2105.5986 A2,2 0 0 0 1058.4077,2107.5986 L1066.4077,2107.5986 L1056.4077,2097.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="667" y="2114.7925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="667" y="2129.7412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="667" y="2144.6899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN157" data-source-line="470" id="ent0158"><path d="M1303.5,2735.5986 L1303.5,2782.4448 A4,4 0 0 0 1307.5,2786.4448 L1715.0005,2786.4448 A4,4 0 0 0 1719.0005,2782.4448 L1719.0005,2741.5986 L1709.0005,2731.5986 L1515.5,2731.5986 L1511.5,2713.9153 L1507.5,2731.5986 L1307.5,2731.5986 A4,4 0 0 0 1303.5,2735.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1709.0005,2731.5986 L1709.0005,2739.5986 A2,2 0 0 0 1711.0005,2741.5986 L1719.0005,2741.5986 L1709.0005,2731.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1309.5" y="2748.7925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1309.5" y="2763.7412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1309.5" y="2778.6899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN160" data-source-line="475" id="ent0161"><path d="M666,2655.5986 L666,2702.4448 A4,4 0 0 0 670,2706.4448 L1056.5596,2706.4448 A4,4 0 0 0 1060.5596,2702.4448 L1060.5596,2661.5986 L1050.5596,2651.5986 L867.5,2651.5986 L863.5,2633.9153 L859.5,2651.5986 L670,2651.5986 A4,4 0 0 0 666,2655.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1050.5596,2651.5986 L1050.5596,2659.5986 A2,2 0 0 0 1052.5596,2661.5986 L1060.5596,2661.5986 L1050.5596,2651.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="672" y="2668.7925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="672" y="2683.7412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="672" y="2698.6899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN163" data-source-line="480" id="ent0164"><path d="M1311,2430.5986 L1311,2465.972 L1361.8194,2107.0941 L1311,2473.972 L1311,2477.4448 A4,4 0 0 0 1315,2481.4448 L1708.0977,2481.4448 A4,4 0 0 0 1712.0977,2477.4448 L1712.0977,2436.5986 L1702.0977,2426.5986 L1315,2426.5986 A4,4 0 0 0 1311,2430.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1702.0977,2426.5986 L1702.0977,2434.5986 A2,2 0 0 0 1704.0977,2436.5986 L1712.0977,2436.5986 L1702.0977,2426.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1317" y="2443.7925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1317" y="2458.7412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1317" y="2473.6899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN166" data-source-line="485" id="ent0167"><path d="M2592,1643.5986 L2592,1690.4448 A4,4 0 0 0 2596,1694.4448 L2994.1567,1694.4448 A4,4 0 0 0 2998.1567,1690.4448 L2998.1567,1649.5986 L2988.1567,1639.5986 L2799,1639.5986 L2795,1621.9153 L2791,1639.5986 L2596,1639.5986 A4,4 0 0 0 2592,1643.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2988.1567,1639.5986 L2988.1567,1647.5986 A2,2 0 0 0 2990.1567,1649.5986 L2998.1567,1649.5986 L2988.1567,1639.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2598" y="1656.7925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2598" y="1671.7412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2598" y="1686.6899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN169" data-source-line="490" id="ent0170"><path d="M2575.5,161.5986 L2575.5,208.4448 A4,4 0 0 0 2579.5,212.4448 L3010.8804,212.4448 A4,4 0 0 0 3014.8804,208.4448 L3014.8804,167.5986 L3004.8804,157.5986 L2799,157.5986 L2795,139.9153 L2791,157.5986 L2579.5,157.5986 A4,4 0 0 0 2575.5,161.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3004.8804,157.5986 L3004.8804,165.5986 A2,2 0 0 0 3006.8804,167.5986 L3014.8804,167.5986 L3004.8804,157.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2581.5" y="174.7925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2581.5" y="189.7412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2581.5" y="204.6899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN172" data-source-line="495" id="ent0173"><path d="M3225,270.5986 L3225,317.4448 A4,4 0 0 0 3229,321.4448 L3651.6841,321.4448 A4,4 0 0 0 3655.6841,317.4448 L3655.6841,276.5986 L3645.6841,266.5986 L3444.5,266.5986 L3440.5,248.9153 L3436.5,266.5986 L3229,266.5986 A4,4 0 0 0 3225,270.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3645.6841,266.5986 L3645.6841,274.5986 A2,2 0 0 0 3647.6841,276.5986 L3655.6841,276.5986 L3645.6841,266.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3231" y="283.7925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3231" y="298.7412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3231" y="313.6899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN175" data-source-line="500" id="ent0176"><path d="M3221,444.5986 L3221,491.4448 A4,4 0 0 0 3225,495.4448 L3656.4312,495.4448 A4,4 0 0 0 3660.4312,491.4448 L3660.4312,450.5986 L3650.4312,440.5986 L3444.5,440.5986 L3440.5,422.9153 L3436.5,440.5986 L3225,440.5986 A4,4 0 0 0 3221,444.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3650.4312,440.5986 L3650.4312,448.5986 A2,2 0 0 0 3652.4312,450.5986 L3660.4312,450.5986 L3650.4312,440.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8423" x="3227" y="457.7925">U02: HMAC binds reason to block/thread/blocker/blocked-user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.4312" x="3227" y="472.7412">Status can change without breaking the binding. Bounded compare-write</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="3227" y="487.6899">and full verify precede opt-in strict read; deletion clears both.</text></g><g class="entity" data-qualified-name="GMN178" data-source-line="505" id="ent0179"><path d="M3225,2025.5986 L3225,2072.4448 A4,4 0 0 0 3229,2076.4448 L3652.4268,2076.4448 A4,4 0 0 0 3656.4268,2072.4448 L3656.4268,2031.5986 L3646.4268,2021.5986 L3444.5,2021.5986 L3440.5,2003.9153 L3436.5,2021.5986 L3229,2021.5986 A4,4 0 0 0 3225,2025.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3646.4268,2021.5986 L3646.4268,2029.5986 A2,2 0 0 0 3648.4268,2031.5986 L3656.4268,2031.5986 L3646.4268,2021.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410.4268" x="3231" y="2038.7925">U02: HMAC binds reference/notes to evidence/provider UUID and kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4604" x="3231" y="2053.7412">Read verifies reference against blind index. Backfill clears stale</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="3231" y="2068.6899">indexes after null redaction; full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN181" data-source-line="510" id="ent0182"><path d="M641,1204.0986 L641,1265.8936 A4,4 0 0 0 645,1269.8936 L1082.1567,1269.8936 A4,4 0 0 0 1086.1567,1265.8936 L1086.1567,1210.0986 L1076.1567,1200.0986 L867.5,1200.0986 L863.5,1181.6408 L859.5,1200.0986 L645,1200.0986 A4,4 0 0 0 641,1204.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1076.1567,1200.0986 L1076.1567,1208.0986 A2,2 0 0 0 1078.1567,1210.0986 L1086.1567,1210.0986 L1076.1567,1200.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1567" x="647" y="1217.2925">U02: HMAC binds encrypted payload and review reason to request UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.3149" x="647" y="1232.2412">provider UUID, requester UUID and kind. Account deletion reseals each</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.9121" x="647" y="1247.1899">redacted payload with its own binding and clears reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="647" y="1262.1387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN184" data-source-line="516" id="ent0185"><path d="M646.5,2276.0986 L646.5,2337.8936 A4,4 0 0 0 650.5,2341.8936 L1076.834,2341.8936 A4,4 0 0 0 1080.834,2337.8936 L1080.834,2282.0986 L1070.834,2272.0986 L867.5,2272.0986 L863.5,2253.6408 L859.5,2272.0986 L650.5,2272.0986 A4,4 0 0 0 646.5,2276.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1070.834,2272.0986 L1070.834,2280.0986 A2,2 0 0 0 1072.834,2282.0986 L1080.834,2282.0986 L1070.834,2272.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.334" x="652.5" y="2289.2925">U02: HMAC binds reason and decisionReason to appeal UUID, subject,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="411.144" x="652.5" y="2304.2412">subjectId, submitter UUID and nullable provider UUID. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="405.4121" x="652.5" y="2319.1899">reseals each redacted reason and clears decision reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="652.5" y="2334.1387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN187" data-source-line="522" id="ent0188"><path d="M652.5,2466.0986 L652.5,2527.8936 A4,4 0 0 0 656.5,2531.8936 L1070.5005,2531.8936 A4,4 0 0 0 1074.5005,2527.8936 L1074.5005,2472.0986 L1064.5005,2462.0986 L867.5,2462.0986 L863.5,2443.6408 L859.5,2462.0986 L656.5,2462.0986 A4,4 0 0 0 652.5,2466.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1064.5005,2462.0986 L1064.5005,2470.0986 A2,2 0 0 0 1066.5005,2472.0986 L1074.5005,2472.0986 L1064.5005,2462.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0005" x="658.5" y="2479.2925">U02: four HMACs bind encrypted fields to gap UUID, requester UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8931" x="658.5" y="2494.2412">nullable provider UUID and catalog slugs/price type. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5386" x="658.5" y="2509.1899">reseals each redacted row and clears reviewReason with its binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="658.5" y="2524.1387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN190" data-source-line="528" id="ent0191"><path d="M2568,792.0986 L2568,853.8936 A4,4 0 0 0 2572,857.8936 L3017.834,857.8936 A4,4 0 0 0 3021.834,853.8936 L3021.834,798.0986 L3011.834,788.0986 L2799,788.0986 L2795,769.6408 L2791,788.0986 L2572,788.0986 A4,4 0 0 0 2568,792.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3011.834,788.0986 L3011.834,796.0986 A2,2 0 0 0 3013.834,798.0986 L3021.834,798.0986 L3011.834,788.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="432.834" x="2574" y="805.2925">U02: three HMACs bind encrypted title, notes and metadata to event UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1885" x="2574" y="820.2412">request UUID and eventType. Account deletion reseals title and metadata</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="379.3486" x="2574" y="835.1899">for each row and clears notes with its binding. Full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="96.8145" x="2574" y="850.1387">opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN193" data-source-line="534" id="ent0194"><path d="M656,869.5986 L656,946.3423 A4,4 0 0 0 660,950.3423 L1066.8467,950.3423 A4,4 0 0 0 1070.8467,946.3423 L1070.8467,875.5986 L1060.8467,865.5986 L867.5,865.5986 L863.5,847.8412 L859.5,865.5986 L660,865.5986 A4,4 0 0 0 656,869.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1060.8467,865.5986 L1060.8467,873.5986 A2,2 0 0 0 1062.8467,875.5986 L1070.8467,875.5986 L1060.8467,865.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="390.2158" x="662" y="882.7925">U02: HMAC binds issueDescription and nullable vehicleSnapshot to</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="285.3906" x="662" y="897.7412">broadcast UUID, client UUID and definition UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="354.7832" x="662" y="912.6899">marketId is excluded: the FK sets it to null on market deletion.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="393.8467" x="662" y="927.6387">Account deletion reseals redacted issue and clears vehicle snapshot</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.0151" x="662" y="942.5874">with binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN196" data-source-line="541" id="ent0197"><path d="M1281,1035.5986 L1281,1082.4448 A4,4 0 0 0 1285,1086.4448 L1738.0513,1086.4448 A4,4 0 0 0 1742.0513,1082.4448 L1742.0513,1041.5986 L1732.0513,1031.5986 L1515.5,1031.5986 L1511.5,974.627 L1507.5,1031.5986 L1285,1031.5986 A4,4 0 0 0 1281,1035.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1732.0513,1031.5986 L1732.0513,1039.5986 A2,2 0 0 0 1734.0513,1041.5986 L1742.0513,1041.5986 L1732.0513,1031.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="440.0513" x="1287" y="1048.7925">U02: HMAC binds encrypted offerSnapshot to offer UUID, broadcast request</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0132" x="1287" y="1063.7412">UUID, provider UUID and location UUID. Account deletion reseals the</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="407.5322" x="1287" y="1078.6899">redacted snapshot for each offer. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN199" data-source-line="546" id="ent0200"><path d="M2584.5,1454.0986 L2584.5,1515.8936 A4,4 0 0 0 2588.5,1519.8936 L3001.8022,1519.8936 A4,4 0 0 0 3005.8022,1515.8936 L3005.8022,1460.0986 L2995.8022,1450.0986 L2799,1450.0986 L2795,1431.6408 L2791,1450.0986 L2588.5,1450.0986 A4,4 0 0 0 2584.5,1454.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2995.8022,1450.0986 L2995.8022,1458.0986 A2,2