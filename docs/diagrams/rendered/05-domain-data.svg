e="GMN83" data-source-line="224" id="ent0084"><path d="M2306,360.5986 L2306,422.3936 A4,4 0 0 0 2310,426.3936 L2711.7241,426.3936 A4,4 0 0 0 2715.7241,422.3936 L2715.7241,366.5986 L2705.7241,356.5986 L2515,356.5986 L2511,338.4611 L2507,356.5986 L2310,356.5986 A4,4 0 0 0 2306,360.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2705.7241,356.5986 L2705.7241,364.5986 A2,2 0 0 0 2707.7241,366.5986 L2715.7241,366.5986 L2705.7241,356.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.165" x="2312" y="373.7925">U02: non-null body HMAC binds plaintext to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="2312" y="388.7412">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="2312" y="403.6899">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252.1924" x="2312" y="418.6387">opt-in strict read. Null body has null binding.</text></g><g class="entity" data-qualified-name="GMN86" data-source-line="230" id="ent0087"><path d="M2306,162.5986 L2306,224.3936 A4,4 0 0 0 2310,228.3936 L2711.7241,228.3936 A4,4 0 0 0 2715.7241,224.3936 L2715.7241,168.5986 L2705.7241,158.5986 L2515,158.5986 L2511,140.4611 L2507,158.5986 L2310,158.5986 A4,4 0 0 0 2306,162.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2705.7241,158.5986 L2705.7241,166.5986 A2,2 0 0 0 2707.7241,168.5986 L2715.7241,168.5986 L2705.7241,158.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="356.9414" x="2312" y="175.7925">U02: non-null offer HMAC binds decrypted JSON to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="2312" y="190.7412">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="2312" y="205.6899">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="250.0151" x="2312" y="220.6387">opt-in strict read. Null offer has null binding.</text></g><g class="entity" data-qualified-name="GMN89" data-source-line="236" id="ent0090"><path d="M1697,879.5986 L1697,875.5986 L1797.4453,696.3881 L1697,883.5986 L1697,941.3936 A4,4 0 0 0 1701,945.3936 L2102.7241,945.3936 A4,4 0 0 0 2106.7241,941.3936 L2106.7241,885.5986 L2096.7241,875.5986 L1701,875.5986 A4,4 0 0 0 1697,879.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2096.7241,875.5986 L2096.7241,883.5986 A2,2 0 0 0 2098.7241,885.5986 L2106.7241,885.5986 L2096.7241,875.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="294.7979" x="1703" y="892.7925">U02: subject HMAC binds plaintext to thread UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="270.9561" x="1703" y="907.7412">type and request/provider/client/creator UUIDs.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="1703" y="922.6899">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="351.9141" x="1703" y="937.6387">opt-in strict read. Account deletion rebinds redacted subjects.</text></g><g class="entity" data-qualified-name="GMN92" data-source-line="242" id="ent0093"><path d="M2912,1372.5986 L2912,1368.5986 L2911.8789,