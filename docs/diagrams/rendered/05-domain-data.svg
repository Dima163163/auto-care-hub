acing" textLength="184.2788" x="755.5" y="1090.8181">ClientVehicleBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="729.5" x2="941.7788" y1="1101.0986" y2="1101.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="739.5" cy="1114.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="127.8989" x="747.5" y="1117.2925">name : client_vehicles</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="747.5" y="1132.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="747.5" y="1147.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN68" data-source-line="223" id="ent0069"><path d="M1710.5,657.5986 L1710.5,719.3936 A4,4 0 0 0 1714.5,723.3936 L2039.6523,723.3936 A4,4 0 0 0 2043.6523,719.3936 L2043.6523,663.5986 L2033.6523,653.5986 L1881,653.5986 L1877,635.7559 L1873,653.5986 L1714.5,653.5986 A4,4 0 0 0 1710.5,657.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2033.6523,653.5986 L2033.6523,661.5986 A2,2 0 0 0 2035.6523,663.5986 L2043.6523,663.5986 L2033.6523,653.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1716.5" y="670.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1716.5" y="685.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1716.5" y="700.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1716.5" y="715.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN71" data-source-line="229" id="ent0072"><path d="M2983,961.5986 L2983,1001.0563 L3003.4538,795.5428 L2983,1009.0563 L2983,1023.3936 A4,4 0 0 0 2987,1027.3936 L3257.2642,1027.3936 A4,4 0 0 0 3261.2642,1023.3936 L3261.2642,967.5986 L3251.2642,957.5986 L2987,957.5986 A4,4 0 0 0 2983,961.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3251.2642,957.5986 L3251.2642,965.5986 A2,2 0 0 0 3253.2642,967.5986 L3261.2642,967.5986 L3251.2642,957.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="2989" y="974.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="2989" y="989.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="2989" y="1004.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="2989" y="1019.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN74" data-source-line="235" id="ent0075"><path d="M668,295.0986 L668,341.9448 A4,4 0 0 0 672,345.9448 L998.5869,345.9448 A4,4 0 0 0 1002.5869,341.9448 L1002.5869,301.0986 L992.5869,291.0986 L839.5,291.0986 L835.5,272.6627 L831.5,291.0986 L672,291.0986 A4,4 0 0 0 668,295.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M992.5869,291.0986 L992.5869,299.0986 A2,2 0 0 0 994.5869,301.0986 L1002.5869,301.0986 L992.5869,291.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="674" y="308.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="674" y="323.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="674" y="338.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN77" data-source-line="240" id="ent0078"><path d="M3615,273.0986 L3615,309.7951 L3626.157,100.1486 L3615,317.7951 L3615,319.9448 A4,4 0 0 0 3619,323.9448 L3861.0806,323.9448 A4,4 0 0 0 3865.0806,319.9448 L3865.0806,279.0986 L3855.0806,269.0986 L3619,269.0986 A4,4 0 0 0 3615,273.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3855.0806,269.0986 L3855.0806,277.0986 A2,2 0 0 0 3857.0806,279.0986 L3865.0806,279.0986 L3855.0806,269.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3621" y="286.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3621" y="301.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3621" y="316.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN80" data-source-line="245" id="ent0081"><path d="M2938,215.5986 L2938,307.291 A4,4 0 0 0 2942,311.291 L3301.874,311.291 A4,4 0 0 0 3305.874,307.291 L3305.874,221.5986 L3295.874,211.5986 L3126,211.5986 L3122,193.601 L3118,211.5986 L2942,211.5986 A4,4 0 0 0 2938,215.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3295.874,211.5986 L3295.874,219.5986 A2,2 0 0 0 3297.874,221.5986 L3305.874,221.5986 L3295.874,211.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="2944" y="228.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="2944" y="243.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="2944" y="258.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="2944" y="273.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="2944" y="288.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="2944" y="303.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN86" data-source-line="256" id="ent0087"><path d="M41.5,454.0986 L41.5,500.9448 A4,4 0 0 0 45.5,504.9448 L376.397,504.9448 A4,4 0 0 0 380.397,500.9448 L380.397,460.0986 L370.397,450.0986 L215,450.0986 L211,432.5707 L207,450.0986 L45.5,450.0986 A4,4 0 0 0 41.5,454.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,450.0986 L370.397,458.0986 A2,2 0 0 0 372.397,460.0986 L380.397,460.0986 L370.397,450.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="467.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="482.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="497.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN89" data-source-line="261" id="ent0090"><path d="M21,868.0986 L21,914.9448 A4,4 0 0 0 25,918.9448 L397.1377,918.9448 A4,4 0 0 0 401.1377,914.9448 L401.1377,874.0986 L391.1377,864.0986 L215,864.0986 L211,846.5707 L207,864.0986 L25,864.0986 A4,4 0 0 0 21,868.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,864.0986 L391.1377,872.0986 A2,2 0 0 0 393.1377,874.0986 L401.1377,874.0986 L391.1377,864.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="881.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="896.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="911.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN92" data-source-line="266" id="ent0093"><path d="M633,1176.0986 L633,1222.9448 A4,4 0 0 0 637,1226.9448 L1034.4077,1226.9448 A4,4 0 0 0 1038.4077,1222.9448 L1038.4077,1182.0986 L1028.4077,1172.0986 L839.5,1172.0986 L835.5,1154.4153 L831.5,1172.0986 L637,1172.0986 A4,4 0 0 0 633,1176.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1028.4077,1172.0986 L1028.4077,1180.0986 A2,2 0 0 0 1030.4077,1182.0986 L1038.4077,1182.0986 L1028.4077,1172.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="639" y="1189.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="639" y="1204.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="639" y="1219.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN95" data-source-line="271" id="ent0096"><path d="M6,1050.0986 L6,1096.9448 A4,4 0 0 0 10,1100.9448 L411.7241,1100.9448 A4,4 0 0 0 415.7241,1096.9448 L415.7241,1056.0986 L405.7241,1046.0986 L215,1046.0986 L211,1028.5707 L207,1046.0986 L10,1046.0986 A4,4 0 0 0 6,1050.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,1046.0986 L405.7241,1054.0986 A2,2 0 0 0 407.7241,1056.0986 L415.7241,1056.0986 L405.7241,1046.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="1063.2925">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="1078.2412">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="1093.1899">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN98" data-source-line="276" id="ent0099"><path d="M2917,443.5986 L2917,505.3936 A4,4 0 0 0 2921,509.3936 L3322.7241,509.3936 A4,4 0 0 0 3326.7241,505.3936 L3326.7241,449.5986 L3316.7241,439.5986 L3126,439.5986 L3122,421.4611 L3118,439.5986 L2921,439.5986 A4,4 0 0 0 2917,443.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3316.7241,439.5986 L3316.7241,447.5986 A2,2 0 0 0 3318.7241,44