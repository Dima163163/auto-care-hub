6.0986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M1414.9697,720.5986 L1409.0664,720.5986 L1409.0664,711.1216 L1414.9697,711.1216 L1414.9697,712.772 L1410.939,712.772 L1410.939,714.8159 L1414.5889,714.8159 L1414.5889,716.4663 L1410.939,716.4663 L1410.939,718.9482 L1414.9697,718.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="195.8315" x="1425.5" y="720.8181">BroadcastOfferBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="1399.5" x2="1623.3315" y1="731.0986" y2="731.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="1409.5" cy="744.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="198.0088" x="1417.5" y="747.2925">name : autocare_broadcast_offers</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="1417.5" y="762.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="1417.5" y="777.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN125" data-source-line="409" id="ent0126"><path d="M1970.5,1051.5986 L1970.5,1113.3936 A4,4 0 0 0 1974.5,1117.3936 L2299.6523,1117.3936 A4,4 0 0 0 2303.6523,1113.3936 L2303.6523,1057.5986 L2293.6523,1047.5986 L2141,1047.5986 L2137,1029.7559 L2133,1047.5986 L1974.5,1047.5986 A4,4 0 0 0 1970.5,1051.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2293.6523,1047.5986 L2293.6523,1055.5986 A2,2 0 0 0 2295.6523,1057.5986 L2303.6523,1057.5986 L2293.6523,1047.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1976.5" y="1064.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1976.5" y="1079.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1976.5" y="1094.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1976.5" y="1109.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN128" data-source-line="415" id="ent0129"><path d="M3301.5,1426.5986 L3301.5,1468.0961 L3321.9673,1237.0974 L3301.5,1476.0961 L3301.5,1488.3936 A4,4 0 0 0 3305.5,1492.3936 L3575.7642,1492.3936 A4,4 0 0 0 3579.7642,1488.3936 L3579.7642,1432.5986 L3569.7642,1422.5986 L3305.5,1422.5986 A4,4 0 0 0 3301.5,1426.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3569.7642,1422.5986 L3569.7642,1430.5986 A2,2 0 0 0 3571.7642,1432.5986 L3579.7642,1432.5986 L3569.7642,1422.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3307.5" y="1439.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3307.5" y="1454.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3307.5" y="1469.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3307.5" y="1484.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN131" data-source-line="421" id="ent0132"><path d="M696,452.0986 L696,498.9448 A4,4 0 0 0 700,502.9448 L1026.5869,502.9448 A4,4 0 0 0 1030.5869,498.9448 L1030.5869,458.0986 L1020.5869,448.0986 L867.5,448.0986 L863.5,429.6627 L859.5,448.0986 L700,448.0986 A4,4 0 0 0 696,452.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1020.5869,448.0986 L1020.5869,456.0986 A2,2 0 0 0 1022.5869,458.0986 L1030.5869,458.0986 L1020.5869,448.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="702" y="465.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="702" y="480.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="702" y="495.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN134" data-source-line="426" id="ent0135"><path d="M3948,416.0986 L3948,452.7951 L3939.9869,236.0636 L3948,460.7951 L3948,462.9448 A4,4 0 0 0 3952,466.9448 L4194.0806,466.9448 A4,4 0 0 0 4198.0806,462.9448 L4198.0806,422.0986 L4188.0806,412.0986 L3952,412.0986 A4,4 0 0 0 3948,416.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4188.0806,412.0986 L4188.0806,420.0986 A2,2 0 0 0 4190.0806,422.0986 L4198.0806,422.0986 L4188.0806,412.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3954" y="429.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3954" y="444.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3954" y="459.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN137" data-source-line="431" id="ent0138"><path d="M3256.5,381.5986 L3256.5,473.291 A4,4 0 0 0 3260.5,477.291 L3620.374,477.291 A4,4 0 0 0 3624.374,473.291 L3624.374,387.5986 L3614.374,377.5986 L3444.5,377.5986 L3440.5,359.601 L3436.5,377.5986 L3260.5,377.5986 A4,4 0 0 0 3256.5,381.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3614.374,377.5986 L3614.374,385.5986 A2,2 0 0 0 3616.374,387.5986 L3624.374,387.5986 L3614.374,377.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3262.5" y="394.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3262.5" y="409.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3262.5" y="424.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3262.5" y="439.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3262.5" y="454.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3262.5" y="469.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN143" data-source-line="442" id="ent0144"><path d="M41.5,682.0986 L41.5,728.9448 A4,4 0 0 0 45.5,732.9448 L376.397,732.9448 A4,4 0 0 0 380.397,728.9448 L380.397,688.0986 L370.397,678.0986 L215,678.0986 L211,660.5707 L207,678.0986 L45.5,678.0986 A4,4 0 0 0 41.5,682.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,678.0986 L370.397,686.0986 A2,2 0 0 0 372.397,688.0986 L380.397,688.0986 L370.397,678.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="695.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="710.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="725.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN146" data-source-line="447" id="ent0147"><path d="M21,1391.0986 L21,1437.9448 A4,4 0 0 0 25,1441.9448 L397.1377,1441.9448 A4,4 0 0 0 401.1377,1437.9448 L401.1377,1397.0986 L391.1377,1387.0986 L215,1387.0986 L211,1369.5707 L207,1387.0986 L25,1387.0986 A4,4 0 0 0 21,1391.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,1387.0986 L391.1377,1395.0986 A2,2 0 0 0 393.1377,1397.0986 L401.1377,1397.0986 L391.1377,1387.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="1404.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="1419.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="1434.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN149" data-source-line="452" id="ent0150"><path d="M34.5,1209.0986 L34.5,1255.9448 A4,4 0 0 0 38.5,1259.9448 L383.895,1259.9448 A4,4 0 0 0 387.895,1255.9448 L387.895,1215.0986 L377.895,1205.0986 L215,1205.0986 L211,1187.4153 L207,1205.0986 L38.5,1205.0986 A4,4 0 0 0 34.5,1209.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,1205.0986 L377.895,1213.0986 A2,2 0 0 0 379.895,1215.0986 L387.895,1215.0986 L377.895,1205.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="1222.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="1237.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="1252.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN152" data-source-line="457" id="ent0153"><path d="M661,1016.0986 L661,1062.9448 A4,4 0 0 0 665,1066.9448 L1062.4077,1066.9448 A4,4 0 0 0 1066.4077,1062.9448 L1066.4077,1022.0986 L1056.4077,1012.0986 L867.5,1012.0986 L863.5,994.4153 L859.5,1012.0986 L665,1012.0986 A4,4 0 0 0 661,1016.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1056.4077,1012.0986 L1056.4077,1020.0986 A2,2 0 0 0 1058.4077,1022.0986 L1066.4077,1022.0986 L1056.4077,1012.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="667" y="1029.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="667" y="1044.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="667" y="1059.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN155" data-source-line="462" id="ent0156"><path d="M1303.5,1917.0986 L1303.5,1963.9448 A4,4 0 0 0 1307.5,1967.9448 L1715.0005,1967.9448 A4,4 0 0 0 1719.0005,1963.9448 L1719.0005,1923.0986 L1709.0005,1913.0986 L1515.5,1913.0986 L1511.5,1895.4153 L1507.5,1913.0986 L1307.5,1913.0986 A4,4 0 0 0 1303.5,1917.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1709.0005,1913.0986 L1709.0005,1921.0986 A2,2 0 0 0 1711.0005,1923.0986 L1719.0005,1923.0986 L1709.0005,1913.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1309.5" y="1930.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1309.5" y="1945.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1309.5" y="1960.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN158" data-source-line="467" id="ent0159"><path d="M666,1801.0986 L666,1847.9448 A4,4 0 0 0 670,1851.9448 L1056.5596,1851.9448 A4,4 0 0 0 1060.5596,1847.9448 L1060.5596,1807.0986 L1050.5596,1797.0986 L867.5,1797.0986 L863.5,1779.4153 L859.5,1797.0986 L670,1797.0986 A4,4 0 0 0 666,1801.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1050.5596,1797.0986 L1050.5596,1805.0986 A2,2 0 0 0 1052.5596,1807.0986 L1060.5596,1807.0986 L1050.5596,1797.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="672" y="1814.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="672" y="1829.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="672" y="1844.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN161" data-source-line="472" id="ent0162"><path d="M1311,1612.0986 L1311,1647.472 L1361.8194,1405.5941 L1311,1655.472 L1311,1658.9448 A4,4 0 0 0 1315,1662.9448 L1708.0977,1662.9448 A4,4 0 0 0 1712.0977,1658.9448 L1712.0977,1618.0986 L1702.0977,1608.0986 L1315,1608.0986 A4,4 0 0 0 1311,1612.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1702.0977,1608.0986 L1702.0977,1616.0986 A2,2 0 0 0 1704.0977,1618.0986 L1712.0977,1618.0986 L1702.0977,1608.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1317" y="1625.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1317" y="1640.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1317" y="1655.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN164" data-source-line="477" id="ent0165"><path d="M2592,1937.0986 L2592,1983.9448 A4,4 0 0 0 2596,1987.9448 L2994.1567,1987.9448 A4,4 0 0 0 2998.1567,1983.9448 L2998.1567,1943.0986 L2988.1567,1933.0986 L2799,1933.0986 L2795,1915.4153 L2791,1933.0986 L2596,1933.0986 A4,4 0 0 0 2592,1937.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2988.1567,1933.0986 L2988.1567,1941.0986 A2,2 0 0 0 2990.1567,1943.0986 L2998.1567,1943.0986 L2988.1567,1933.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2598" y="1950.2925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2598" y="1965.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2598" y="1980.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN167" data-source-line="482" id="ent0168"><path d="M2575.5,1763.0986 L2575.5,1809.9448 A4,4 0 0 0 2579.5,1813.9448 L3010.8804,1813.9448 A4,4 0 0 0 3014.8804,1809.9448 L3014.8804,1769.0986 L3004.8804,1759.0986 L2799,1759.0986 L2795,1741.4153 L2791,1759.0986 L2579.5,1759.0986 A4,4 0 0 0 2575.5,1763.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3004.8804,1759.0986 L3004.8804,1767.0986 A2,2 0 0 0 3006.8804,1769.0986 L3014.8804,1769.0986 L3004.8804,1759.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2581.5" y="1776.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2581.5" y="1791.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2581.5" y="1806.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN170" data-source-line="487" id="ent0171"><path d="M3225,601.0986 L3225,647.9448 A4,4 0 0 0 3229,651.9448 L3651.6841,651.9448 A4,4 0 0 0 3655.6841,647.9448 L3655.6841,607.0986 L3645.6841,597.0986 L3444.5,597.0986 L3440.5,579.4153 L3436.5,597.0986 L3229,597.0986 A4,4 0 0 0 3225,601.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3645.6841,597.0986 L3645.6841,605.0986 A2,2 0 0 0 3647.6841,607.0986 L3655.6841,607.0986 L3645.6841,597.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3231" y="614.2925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3231" y="629.2412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3231" y="644.1899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN173" data-source-line="492" id="ent0174"><path d="M3221,775.0986 L3221,821.9448 A4,4 0 0 0 3225,825.9448 L3656.4312,825.9448 A4,4 0 0 0 3660.4312,821.9448 L3660.4312,781.0986 L3650.4312,771.0986 L3444.5,771.0986 L3440.5,753.4153 L3436.5,771.0986 L3225,771.0986 A4,4 0 0 0 3221,775.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3650.4312,771.0986 L3650.4312,779.0986 A2,2 0 0 0 3652.4312,781.0986 L3660.4312,781.0986 L3650.4312,771.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8423" x="3227" y="788.2925">U02: HMAC binds reason to block/thread/blocker/blocked-user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.4312" x="3227" y="803.2412">Status can change without breaking the binding. Bounded compare-write</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="3227" y="818.1899">and full verify precede opt-in strict read; deletion clears both.</text></g><g class="entity" data-qualified-name="GMN176" data-source-line="497" id="ent0177"><path d="M3225,154.0986 L3225,200.9448 A4,4 0 0 0 3229,204.9448 L3652.4268,204.9448 A4,4 0 0 0 3656.4268,200.9448 L3656.4268,160.0986 L3646.4268,150.0986 L3444.5,150.0986 L3440.5,132.4153 L3436.5,150.0986 L3229,150.0986 A4,4 0 0 0 3225,154.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3646.4268,150.0986 L3646.4268,158.0986 A2,2 0 0 0 3648.4268,160.0986 L3656.4268,160.0986 L3646.4268,150.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410.4268" x="3231" y="167.2925">U02: HMAC binds reference/notes to evidence/provider UUID and kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4604" x="3231" y="182.2412">Read verifies reference against blind index. Backfill clears stale</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="3231" y="197.1899">indexes after null redaction; full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN179" data-source-line="502" id="ent0180"><path d="M641,220.5986 L641,282.3936 A4,4 0 0 0 645,286.3936 L1082.1567,286.3936 A4,4 0 0 0 1086.1567,282.3936 L1086.1567,226.5986 L1076.1567,216.5986 L867.5,216.5986 L863.5,198.1408 L859.5,216.5986 L645,216.5986 A4,4 0 0 0 641,220.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1076.1567,216.5986 L1076.1567,224.5986 A2,2 0 0 0 1078.1567,226.5986 L1086.1567,226.5986 L1076.1567,216.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1567" x="647" y="233.7925">U02: HMAC binds encrypted payload and review reason to request UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.3149" x="647" y="248.7412">provider UUID, requester UUID and kind. Account deletion reseals each</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.9121" x="647" y="263.6899">redacted payload with its own binding and clears reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="647" y="278.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN182" data-source-line="508" id="ent0183"><path d="M646.5,1379.5986 L646.5,1441.3936 A4,4 0 0 0 650.5,1445.3936 L1076.834,1445.3936 A4,4 0 0 0 1080.834,1441.3936 L1080.834,1385.5986 L1070.834,1375.5986 L867.5,1375.5986 L863.5,1357.1408 L859.5,1375.5986 L650.5,1375.5986 A4,4 0 0 0 646.5,1379.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1070.834,1375.5986 L1070.834,1383.5986 A2,2 0 0 0 1072.834,1385.5986 L1080.834,1385.5986 L1070.834,1375.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.334" x="652.5" y="1392.7925">U02: HMAC binds reason and decisionReason to appeal UUID, subject,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="411.144" x="652.5" y="1407.7412">subjectId, submitter UUID and nullable provider UUID. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="405.4121" x="652.5" y="1422.6899">reseals each redacted reason and clears decision reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="652.5" y="1437.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN185" data-source-line="514" id="ent0186"><path d="M652.5,1597.5986 L652.5,1659.3936 A4,4 0 0 0 656.5,1663.3936 L1070.5005,1663.3936 A4,4 0 0 0 1074.5005,1659.3936 L1074.5005,1603.5986 L1064.5005,1593.5986 L867.5,1593.5986 L863.5,1575.1408 L859.5,1593.5986 L656.5,1593.5986 A4,4 0 0 0 652.5,1597.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1064.5005,1593.5986 L1064.5005,1601.5986 A2,2 0 0 0 1066.5005,1603.5986 L1074.5005,1603.5986 L1064.5005,1593.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0005" x="658.5" y="1610.7925">U02: four HMACs bind encrypted fields to gap UUID, requester UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8931" x="658.5" y="1625.7412">nullable provider UUID and catalog slugs/price type. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5386" x="658.5" y="1640.6899">reseals each redacted row and clears reviewReason with its binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="658.5" y="1655.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN188" data-source-line="520" id="ent0189"><path d="M2568,2111.5986 L2568,2173.3936 A4,4 0 0 0 2572,2177.3936 L3017.834,2177.3936 A4,4 0 0 0 3021.834,2173.3936 L3021.834,2117.5986 L3011.834,2107.5986 L2799,2107.5986 L2795,2089.1408 L2791,2107.5986 L2572,2107.5986 A4,4 0 0 0 2568,2111.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3011.834,2107.5986 L3011.834,2115.5986 A2,2 0 0 0 3013.834,2117.5986 L3021.834,2117.5986 L3011.834,2107.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="432.834" x="2574" y="2124.7925">U02: three HMACs bind encrypted title, notes and metadata to event UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1885" x="2574" y="2139.7412">request UUID and eventType. Account deletion reseals title and metadata</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="379.3486" x="2574" y="2154.6899">for each row and clears notes with its binding. Full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="96.8145" x="2574" y="2169.6387">opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN191" data-source-line="526" id="ent0192"><path d="M656,645.0986 L656,721.8423 A4,4 0 0 0 660,725.8423 L1066.8467,725.8423 A4,4 0 0 0 1070.8467,721.8423 L1070.8467,651.0986 L1060.8467,641.0986 L867.5,641.0986 L863.5,623.3412 L859.5,641.0986 L660,641.0986 A4,4 0 0 0 656,645.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1060.8467,641.0986 L1060.8467,649.0986 A2,2 0 0 0 1062.8467,651.0986 L1070.8467,651.0986 L1060.8467,641.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="390.2158" x="662" y="658.2925">U02: HMAC binds issueDescription and nullable vehicleSnapshot to</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="285.3906" x="662" y="673.2412">broadcast UUID, client UUID and definition UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="354.7832" x="662" y="688.1899">marketId is excluded: the FK sets it to null on market deletion.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="393.8467" x="662" y="703.1387">Account deletion reseals redacted issue and clears vehicle snapshot</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.0151" x="662" y="718.0874">with binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN194" data-source-line="533" id="ent0195"><path d="M1281,806.0986 L1281,852.9448 A4,4 0 0 0 1285,856.9448 L1738.0513,856.9448 A4,4 0 0 0 1742.0513,852.9448 L1742.0513,812.0986 L1732.0513,802.0986 L1515.5,802.0986 L1511.5,784.4153 L1507.5,802.0986 L1285,802.0986 A4,4 0 0 0 1281,806.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1732.0513,802.0986 L1732.0513,810.0986 A2,2 0 0 0 1734.0513,812.0986 L1742.0513,812.0986 L1732.0513,802.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="440.0513" x="1287" y="819.2925">U02: HMAC binds encrypted offerSnapshot to offer UUID, broadcast request</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0132" x="1287" y="834.2412">UUID, provider UUID and location UUID. Account deletion reseals the</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="407.5322" x="1287" y="849.1899">redacted snapshot for each offer. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN197" data-source-line="538" id="ent0198"><path d="M6,1035.0986 L6,1081.9448 A4,4 0 0 0 10,1085.9448 L411.7241,1085.9448 A4,4 0 0 0 415.7241,1081.9448 L415.7241,1041.0986 L405.7241,1031.0986 L215,1031.0986 L211,1013.5707 L207,1031.0986 L10,1031.0986 A4,4 0 0 0 6,1035.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,1031.0986 L405.7241,1039.0986 A2,2 0 0 0 407.7241,1041.0986 L415.7241,1041.0986 L405.7241,1031.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="1048.2925">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="1063.2412">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="1078.1899">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN200" data-source-line="543" id="ent0201"><path d="M3235.5,1112.5986 L3235.5,1174.3936 A4,4 0 0 0 3239.5,1178.3936 L3641.2241,1178.3936 A4,4 0 0 0 3645.2241,1174.3936 L3645.2241,1118.5986 L3635.2241,1108.5986 L3444.5,1108.5986 L3440.5,1090.4611 L3436.5,1108.5986 L3239.5,1108.5986 A4,4 0 0 0 3235.5,1112.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3635.2241,1108.5986 L3635.2241,1116.5986 A2,2 0 0 0 3637.2241,1118.5986 L3645.2241,1118.5986 L3635.2241,1108.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.165" x="3241.5" y="1125.7925">U02: non-null body HMAC binds plaintext to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="3241.5" y="1140.7412">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="3241.5" y="1155.6899">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="252.1924" x="3241.5" y="1170.6387">opt-in strict read. Null body has null binding.</text></g><g class="entity" data-qualified-name="GMN203" data-source-line="549" id="ent0204"><path d="M3235.5,1514.5986 L3235.5,1549.2296 L3323.3143,1348.