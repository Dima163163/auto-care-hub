ify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="250.0151" x="2535" y="501.6387">opt-in strict read. Null offer has null binding.</text></g><g class="entity" data-qualified-name="GMN91" data-source-line="244" id="ent0092"><path d="M1920,654.5986 L1920,716.3936 A4,4 0 0 0 1924,720.3936 L2325.7241,720.3936 A4,4 0 0 0 2329.7241,716.3936 L2329.7241,660.5986 L2319.7241,650.5986 L2129,650.5986 L2125,632.4611 L2121,650.5986 L1924,650.5986 A4,4 0 0 0 1920,654.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2319.7241,650.5986 L2319.7241,658.5986 A2,2 0 0 0 2321.7241,660.5986 L2329.7241,660.5986 L2319.7241,650.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="294.7979" x="1926" y="667.7925">U02: subject HMAC binds plaintext to thread UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="270.9561" x="1926" y="682.7412">type and request/provider/client/creator UUIDs.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="1926" y="697.6899">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="351.9141" x="1926" y="712.6387">opt-in strict read. Account deletion rebinds redacted subjects.</text></g><g class="entity" data-qualified-name="GMN94" data-source-line="250" id="ent0095"><path d="M1327,753.5986 L1327,815.3936 A4,4 0 0 0 1331,819.3936 L1732.7241,819.3936 A4,4 0 0 0 1736.7241,815.3936 L1736.7241,759.5986 L1726.7241,749.5986 L1536,749.5986 L1532,731.4611 L1528,749.5986 L1331,749.5986 A4,4 0 0 0 1327,753.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1726.7241,749.5986 L1726.7241,757.5986 A2,2 0 0 0 1728.7241,759.5986 L1736.7241,759.5986 L1726.7241,749.5