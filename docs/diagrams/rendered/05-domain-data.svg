th:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="173.437" x="3241.5" y="1553.2925">name : autocare_chat_reports</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="3241.5" y="1568.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="3241.5" y="1583.1899">processed : bigint</text></g><!--class ChatBlockCheckpoint--><g class="entity" data-qualified-name="ChatBlockCheckpoint" data-source-line="264" id="ent0046"><rect fill="#F1F1F1" height="82.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="242.4624" x="3216.5" y="1178.0986"/><ellipse cx="3230.5" cy="1193.0986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M3232.9697,1197.5986 L3227.0664,1197.5986 L3227.0664,1188.1216 L3232.9697,1188.1216 L3232.9697,1189.772 L3228.939,1189.772 L3228.939,1191.8159 L3232.5889,1191.8159 L3232.5889,1193.4663 L3228.939,1193.4663 L3228.939,1195.9482 L3232.9697,1195.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="212.4624" x="3243.5" y="1197.8181">ChatBlockReasonBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="3217.5" x2="3457.9624" y1="1208.0986" y2="1208.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="3227.5" cy="1221.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="169.8252" x="3235.5" y="1224.2925">name : autocare_chat_blocks</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="3235.5" y="1239.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="3235.5" y="1254.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN96" data-source-line="319" id="ent0097"><path d="M1882.5,575.5986 L1882.5,637.3936 A4,4 0 0 0 1886.5,641.3936 L2211.6523,641.3936 A4,4 0 0 0 2215.6523,637.3936 L2215.6523,581.5986 L2205.6523,571.5986 L2053,571.5986 L2049,553.7559 L2045,571.5986 L1886.5,571.5986 A4,4 0 0 0 1882.5,575.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2205.6523,571.5986 L2205.6523,579.5986 A2,2 0 0 0 2207.6523,581.5986 L2215.6523,581.5986 L2205.6523,571.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1888.5" y="588.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1888.5" y="603.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1888.5" y="618.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1888.5" y="633.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN99" data-source-line="325" id="ent0100"><path d="M3198.5,697.5986 L3198.5,759.3936 A4,4 0 0 0 3202.5,763.3936 L3472.7642,763.3936 A4,4 0 0 0 3476.7642,759.3936 L3476.7642,703.5986 L3466.7642,693.5986 L3341.5,693.5986 L3337.5,675.7559 L3333.5,693.5986 L3202.5,693.5986 A4,4 0 0 0 3198.5,697.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3466.7642,693.5986 L3466.7642,701.5986 A2,2 0 0 0 3468.7642,703.5986 L3476.7642,703.5986 L3466.7642,693.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3204.5" y="710.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3204.5" y="725.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3204.5" y="740.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3204.5" y="755.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN102" data-source-line="331" id="ent0103"><path d="M676,235.0986 L676,281.9448 A4,4 0 0 0 680,285.9448 L1006.5869,285.9448 A4,4 0 0 0 1010.5869,281.9448 L1010.5869,241.0986 L1000.5869,231.0986 L847.5,231.0986 L843.5,212.6627 L839.5,231.0986 L680,231.0986 A4,4 0 0 0 676,235.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1000.5869,231.0986 L1000.5869,239.0986 A2,2 0 0 0 1002.5869,241.0986 L1010.5869,241.0986 L1000.5869,231.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="682" y="248.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="682" y="263.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="682" y="278.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN105" data-source-line="336" id="ent0106"><path d="M3845,273.0986 L3845,309.7951 L3856.157,100.1486 L3845,317.7951 L3845,319.9448 A4,4 0 0 0 3849,323.9448 L4091.0806,323.9448 A4,4 0 0 0 4095.0806,319.9448 L4095.0806,279.0986 L4085.0806,269.0986 L3849,269.0986 A4,4 0 0 0 3845,273.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4085.0806,269.0986 L4085.0806,277.0986 A2,2 0 0 0 4087.0806,279.0986 L4095.0806,279.0986 L4085.0806,269.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3851" y="286.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3851" y="301.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3851" y="316.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN108" data-source-line="341" id="ent0109"><path d="M3153.5,215.5986 L3153.5,307.291 A4,4 0 0 0 3157.5,311.291 L3517.374,311.291 A4,4 0 0 0 3521.374,307.291 L3521.374,221.5986 L3511.374,211.5986 L3341.5,211.5986 L3337.5,193.601 L3333.5,211.5986 L3157.5,211.5986 A4,4 0 0 0 3153.5,215.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3511.374,211.5986 L3511.374,219.5986 A2,2 0 0 0 3513.374,221.5986 L3521.374,221.5986 L3511.374,211.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3159.5" y="228.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3159.5" y="243.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3159.5" y="258.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3159.5" y="273.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3159.5" y="288.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3159.5" y="303.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN114" data-source-line="352" id="ent0115"><path d="M41.5,255.0986 L41.5,301.9448 A4,4 0 0 0 45.5,305.9448 L376.397,305.9448 A4,4 0 0 0 380.397,301.9448 L380.397,261.0986 L370.397,251.0986 L215,251.0986 L211,233.5707 L207,251.0986 L45.5,251.0986 A4,4 0 0 0 41.5,255.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,251.0986 L370.397,259.0986 A2,2 0 0 0 372.397,261.0986 L380.397,261.0986 L370.397,251.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="268.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="283.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="298.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN117" data-source-line="357" id="ent0118"><path d="M21,461.0986 L21,507.9448 A4,4 0 0 0 25,511.9448 L397.1377,511.9448 A4,4 0 0 0 401.1377,507.9448 L401.1377,467.0986 L391.1377,457.0986 L215,457.0986 L211,439.5707 L207,457.0986 L25,457.0986 A4,4 0 0 0 21,461.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,457.0986 L391.1377,465.0986 A2,2 0 0 0 393.1377,467.0986 L401.1377,467.0986 L391.1377,457.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="474.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="489.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="504.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN120" data-source-line="362" id="ent0121"><path d="M34.5,817.0986 L34.5,863.9448 A4,4 0 0 0 38.5,867.9448 L383.895,867.9448 A4,4 0 0 0 387.895,863.9448 L387.895,823.0986 L377.895,813.0986 L215,813.0986 L211,795.4153 L207,813.0986 L38.5,813.0986 A4,4 0 0 0 34.5,817.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,813.0986 L377.895,821.0986 A2,2 0 0 0 379.895,823.0986 L387.895,823.0986 L377.895,813.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="830.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="845.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="860.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN123" data-source-line="367" id="ent0124"><path d="M641,409.0986 L641,455.9448 A4,4 0 0 0 645,459.9448 L1042.4077,459.9448 A4,4 0 0 0 1046.4077,455.9448 L1046.4077,415.0986 L1036.4077,405.0986 L847.5,405.0986 L843.5,387.4153 L839.5,405.0986 L645,405.0986 A4,4 0 0 0 641,409.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-wid