1523,446.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1225" y="463.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1225" y="478.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1225" y="493.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1225" y="508.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN49" data-source-line="143" id="ent0050"><path d="M2034,467.5986 L2034,529.3936 A4,4 0 0 0 2038,533.3936 L2308.2642,533.3936 A4,4 0 0 0 2312.2642,529.3936 L2312.2642,473.5986 L2302.2642,463.5986 L2177,463.5986 L2173,445.7559 L2169,463.5986 L2038,463.5986 A4,4 0 0 0 2034,467.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2302.2642,463.5986 L2302.2642,471.5986 A2,2 0 0 0 2304.2642,473.5986 L2312.2642,473.5986 L2302.2642,463.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="2040" y="480.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="2040" y="495.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="2040" y="510.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="2040" y="525.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN52" data-source-line="149" id="ent0053"><path d="M525,368.0986 L525,414.9448 A4,4 0 0 0 529,418.9448 L855.5869,418.9448 A4,4 0 0 0 859.5869,414.9448 L859.5869,374.0986 L849.5869,364.0986 L696.5,364.0986 L692.5,345.6627 L688.5,364.0986 L529,364.0986 A4,4 0 0 0 525,368.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M849.5869,364.0986 L849.5869,372.0986 A2,2 0 0 0 851.5869,374.0986 L859.5869,374.0986 L849.5869,364.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="531" y="381.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="531" y="396.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="531" y="411.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN55" data-source-line="154" id="ent0056"><path d="M2645,184.0986 L2645,230.9448 A4,4 0 0 0 2649,234.9448 L2891.0806,234.9448 A4,4 0 0 0 2895.0806,230.9448 L2895.0806,190.0986 L2885.0806,180.0986 L2774,180.0986 L2770,162.3386 L2766,180.0986 L2649,180.0986 A4,4 0 0 0 2645,184.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2885.0806,180.0986 L2885.0806,188.0986 A2,2 0 0 0 2887.0806,190.0986 L2895.0806,190.0986 L2885.0806,180.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="2651" y="197.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="2651" y="212.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="2651" y="227.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN58" data-source-line="159" id="ent0059"><path d="M1989,233.5986 L1989,325.291 A4,4 0 0 0 1993,329.291 L2352.874,329.291 A4,4 0 0 0 2356.874,325.291 L2356.874,239.5986 L2346.874,229.5986 L2177,229.5986 L2173,211.601 L2169,229.5986 L1993,229.5986 A4,4 0 0 0 1989,233.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2346.874,229.5986 L2346.874,237.5986 A2,2 0 0 0 2348.874,239.5986 L2356.874,239.5986 L2346.874,229.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="1995" y="246.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="1995" y="261.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="1995" y="276.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="1995" y="291.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="1995" y="306.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="1995" y="321.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN64" data-source-line="170" id="ent0065"><path d="M6,443.0986 L6,489.9448 A4,4 0 0 0 10,493.9448 L340.897,493.9448 A4,4 0 0 0 344.897,489.9448 L344.897,449.0986 L334.897,439.0986 L179.5,439.0986 L175.5,421.5707 L171.5,439.0986 L10,439.0986 A4,4 0 0 0 6,443.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M334.897,439.0986 L334.897,447.0986 A2,2 0 0 0 336.897,449.0986 L344.897,449.0986 L334.897,439.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="12" y="456.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="12" y="471.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="12" y="486.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN67" data-source-line="175" id="ent0068"><path d="M2553,257.5986 L2553,253.5986 L2552.8272,291.6321 L2553,261.5986 L2553,319.3936 A4,4 0 0 0 2557,323.3936 L2982.8262,323.3936 A4,4 0 0 0 2986.8262,319.3936 L2986.8262,263.5986 L2976.8262,253.5986 L2557,253.5986 A4,4 0 0 0 2553,257.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2976.8262,253.5986 L2976.8262,261.5986 A2,2 0 0 0 2978.8262,263.5986 L2986.8262,263.5986 L2976.8262,253.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="218.918" x="2559" y="270.7925">&#1055;&#1091;&#1085;&#1082;&#1090;&#1080;&#1088; &#8212; &#1083;&#1086;&#1075;&#1080;&#1095;&#1077;&#1089;&#1082;&#1072;&#1103; &#1089;&#1074;&#1103;&#1079;&#1100;, &#1085;&#1077; FK.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="399.5278" x="2559" y="285.7412">Reference lookup fix &#1090;&#1088;&#1077;&#1073;&#1091;&#1077;&#1090; &#1087;&#1088;&#1080;&#1084;&#1077;&#1085;&#1077;&#1085;&#1080;&#1103; mig