="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M1450.9697,3456.5986 L1445.0664,3456.5986 L1445.0664,3447.1216 L1450.9697,3447.1216 L1450.9697,3448.772 L1446.939,3448.772 L1446.939,3450.8159 L1450.5889,3450.8159 L1450.5889,3452.4663 L1446.939,3452.4663 L1446.939,3454.9482 L1450.9697,3454.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="179.9434" x="1461.5" y="3456.8181">FleetVehicleBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="1435.5" x2="1643.4434" y1="3467.0986" y2="3467.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="1445.5" cy="3480.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="179.9434" x="1453.5" y="3483.2925">name : autocare_fleet_vehicles</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="1453.5" y="3498.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="1453.5" y="3513.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN146" data-source-line="474" id="ent0147"><path d="M1998.5,2097.5986 L1998.5,2159.3936 A4,4 0 0 0 2002.5,2163.3936 L2327.6523,2163.3936 A4,4 0 0 0 2331.6523,2159.3936 L2331.6523,2103.5986 L2321.6523,2093.5986 L2169,2093.5986 L2165,2075.7559 L2161,2093.5986 L2002.5,2093.5986 A4,4 0 0 0 1998.5,2097.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2321.6523,2093.5986 L2321.6523,2101.5986 A2,2 0 0 0 2323.6523,2103.5986 L2331.6523,2103.5986 L2321.6523,2093.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="2004.5" y="2110.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="2004.5" y="2125.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="2004.5" y="2140.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="2004.5" y="2155.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN149" data-source-line="480" id="ent0150"><path d="M3329.5,885.5986 L3329.5,947.3936 A4,4 0 0 0 3333.5,951.3936 L3603.7642,951.3936 A4,4 0 0 0 3607.7642,947.3936 L3607.7642,891.5986 L3597.7642,881.5986 L3472.5,881.5986 L3468.5,863.8312 L3464.5,881.5986 L3333.5,881.5986 A4,4 0 0 0 3329.5,885.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3597.7642,881.5986 L3597.7642,889.5986 A2,2 0 0 0 3599.7642,891.5986 L3607.7642,891.5986 L3597.7642,881.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3335.5" y="898.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3335.5" y="913.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3335.5" y="928.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3335.5" y="943.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN152" data-source-line="486" id="ent0153"><path d="M714.5,1910.0986 L714.5,1956.9448 A4,4 0 0 0 718.5,1960.9448 L1045.0869,1960.9448 A4,4 0 0 0 1049.0869,1956.9448 L1049.0869,1916.0986 L1039.0869,1906.0986 L886,1906.0986 L882,1887.6627 L878,1906.0986 L718.5,1906.0986 A4,4 0 0 0 714.5,1910.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1039.0869,1906.0986 L1039.0869,1914.0986 A2,2 0 0 0 1041.0869,1916.0986 L1049.0869,1916.0986 L1039.0869,1906.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="720.5" y="1923.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="720.5" y="1938.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="720.5" y="1953.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN155" data-source-line="491" id="ent0156"><path d="M3976,1900.0986 L3976,1946.9448 A4,4 0 0 0 3980,1950.9448 L4222.0806,1950.9448 A4,4 0 0 0 4226.0806,1946.9448 L4226.0806,1906.0986 L4216.0806,1896.0986 L4105,1896.0986 L4101,1878.3133 L4097,1896.0986 L3980,1896.0986 A4,4 0 0 0 3976,1900.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4216.0806,1896.0986 L4216.0806,1904.0986 A2,2 0 0 0 4218.0806,1906.0986 L4226.0806,1906.0986 L4216.0806,1896.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3982" y="1913.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3982" y="1928.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3982" y="1943.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN158" data-source-line="496" id="ent0159"><path d="M3284.5,1943.5986 L3284.5,1986.9551 L3337.6095,1689.173 L3284.5,1994.9551 L3284.5,2035.291 A4,4 0 0 0 3288.5,2039.291 L3648.374,2039.291 A4,4 0 0 0 3652.374,2035.291 L3652.374,1949.5986 L3642.374,1939.5986 L3288.5,1939.5986 A4,4 0 0 0 3284.5,1943.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3642.374,1939.5986 L3642.374,1947.5986 A2,2 0 0 0 3644.374,1949.5986 L3652.374,1949.5986 L3642.374,1939.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3290.5" y="1956.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3290.5" y="1971.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3290.5" y="1986.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3290.5" y="2001.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3290.5" y="2016.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3290.5" y="2031.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN164" data-source-line="507" id="ent0165"><path d="M46,2019.0986 L46,2065.9448 A4,4 0 0 0 50,2069.9448 L380.897,2069.9448 A4,4 0 0 0 384.897,2065.9448 L384.897,2025.0986 L374.897,2015.0986 L219.5,2015.0986 L215.5,1997.5707 L211.5,2015.0986 L50,2015.0986 A4,4 0 0 0 46,2019.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M374.897,2015.0986 L374.897,2023.0986 A2,2 0 0 0 376.897,2025.0986 L384.897,2025.0986 L374.897,2015.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="52" y="2032.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="52" y="2047.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="52" y="2062.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN167" data-source-line="512" id="ent0168"><path d="M25.5,2233.0986 L25.5,2279.9448 A4,4 0 0 0 29.5,2283.9448 L401.6377,2283.9448 A4,4 0 0 0 405.6377,2279.9448 L405.6377,2239.0986 L395.6377,2229.0986 L219.5,2229.0986 L215.5,2211.5707 L211.5,2229.0986 L29.5,2229.0986 A4,4 0 0 0 25.5,2233.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M395.6377,2229.0986 L395.6377,2237.0986 A2,2 0 0 0 397.6377,2239.0986 L405.6377,2239.0986 L395.6377,2229.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="31.5" y="2246.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="31.5" y="2261.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="31.5" y="2276.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN170" data-source-line="517" id="ent0171"><path d="M39,2589.0986 L39,2635.9448 A4,4 0 0 0 43,2639.9448 L388.395,2639.9448 A4,4 0 0 0 392.395,2635.9448 L392.395,2595.0986 L382.395,2585.0986 L219.5,2585.0986 L215.5,2567.4153 L211.5,2585.0986 L43,2585.0986 A4,4 0 0 0 39,2589.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M382.395,2585.0986 L382.395,2593.0986 A2,2 0 0 0 384.395,2595.0986 L392.395,2595.0986 L382.395,2585.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="45" y="2602.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="45" y="2617.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="45" y="2632.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN173" data-source-line="522" id="ent0174"><path d="M679.5,2091.0986 L679.5,2137.9448 A4,4 0 0 0 683.5,2141.9448 L1080.9077,2141.9448 A4,4 0 0 0 1084.9077,2137.9448 L1084.9077,2097.0986 L1074.9077,2087.0986 L886,2087.0986 L882,2069.4153 L878,2087.0986 L683.5,2087.0986 A4,4 0 0 0 679.5,2091.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1074.9077,2087.0986 L1074.9077,2095.0986 A2,2 0 0 0 1076.9077,2097.0986 L1084.9077,2097.0986 L1074.9077,2087.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="685.5" y="2104.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="685.5" y="2119.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="685.5" y="2134.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN176" data-source-line="527" id="ent0177"><path d="M1331.5,2772.0986 L1331.5,2818.9448 A4,4 0 0 0 1335.5,2822.9448 L1743.0005,2822.9448 A4,4 0 0 0 1747.0005,2818.9448 L1747.0005,2778.0986 L1737.0005,2768.0986 L1543.5,2768.0986 L1539.5,2750.4153 L1535.5,2768.0986 L1335.5,2768.0986 A4,4 0 0 0 1331.5,2772.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1737.0005,2768.0986 L1737.0005,2776.0986 A2,2 0 0 0 1739.0005,2778.0986 L1747.0005,2778.0986 L1737.0005,2768.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1337.5" y="2785.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1337.5" y="2800.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1337.5" y="2815.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN179" data-source-line="532" id="ent0180"><path d="M684.5,3426.0986 L684.5,3472.9448 A4,4 0 0 0 688.5,3476.9448 L1075.0596,3476.9448 A4,4 0 0 0 1079.0596,3472.9448 L1079.0596,3432.0986 L1069.0596,3422.0986 L886,3422.0986 L882,3404.4153 L878,3422.0986 L688.5,3422.0986 A4,4 0 0 0 684.5,3426.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1069.0596,3422.0986 L1069.0596,3430.0986 A2,2 0 0 0 1071.0596,3432.0986 L1079.0596,3432.0986 L1069.0596,3422.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="690.5" y="3439.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="690.5" y="3454.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="690.5" y="3469.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN182" data-source-line="537" id="ent0183"><path d="M1339,3164.0986 L1339,3210.9448 A4,4 0 0 0 1343,3214.9448 L1736.0977,3214.9448 A4,4 0 0 0 1740.0977,3210.9448 L1740.0977,3170.0986 L1730.0977,3160.0986 L1543.5,3160.0986 L1539.5,3142.4153 L1535.5,3160.0986 L1343,3160.0986 A4,4 0 0 0 1339,3164.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1730.0977,3160.0986 L1730.0977,3168.0986 A2,2 0 0 0 1732.0977,3170.0986 L1740.0977,3170.0986 L1730.0977,3160.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1345" y="3177.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1345" y="3192.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1345" y="3207.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN185" data-source-line="542" id="ent0186"><path d="M2620,1762.0986 L2620,1808.9448 A4,4 0 0 0 2624,1812.9448 L3022.1567,1812.9448 A4,4 0 0 0 3026.1567,1808.9448 L3026.1567,1768.0986 L3016.1567,1758.0986 L2827,1758.0986 L2823,1740.4153 L2819,1758.0986 L2624,1758.0986 A4,4 0 0 0 2620,1762.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3016.1567,1758.0986 L3016.1567,1766.0986 A2,2 0 0 0 3018.1567,1768.0986 L3026.1567,1768.0986 L3016.1567,1758.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2626" y="1775.2925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2626" y="1790.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2626" y="1805.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN188" data-source-line="547" id="ent0189"><path d="M2603.5,1082.0986 L2603.5,1128.9448 A4,4 0 0 0 2607.5,1132.9448 L3038.8804,1132.9448 A4,4 0 0 0 3042.8804,1128.9448 L3042.8804,1088.0986 L3032.8804,1078.0986 L2827,1078.0986 L2823,1060.4153 L2819,1078.0986 L2607.5,1078.0986 A4,4 0 0 0 2603.5,1082.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3032.8804,1078.0986 L3032.8804,1086.0986 A2,2 0 0 0 3034.8804,1088.0986 L3042.8804,1088.0986 L3032.8804,1078.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2609.5" y="1095.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2609.5" y="1110.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2609.5" y="1125.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN191" data-source-line="552" id="ent0192"><path d="M3253,550.0986 L3253,596.9448 A4,4 0 0 0 3257,600.9448 L3679.6841,600.9448 A4,4 0 0 0 3683.6841,596.9448 L3683.6841,556.0986 L3673.6841,546.0986 L3472.5,546.0986 L3468.5,528.4153 L3464.5,546.0986 L3257,546.0986 A4,4 0 0 0 3253,550.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3673.6841,546.0986 L3673.6841,554.0986 A2,2 0 0 0 3675.6841,556.0986 L3683.6841,556.0986 L3673.6841,546.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3259" y="563.2925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3259" y="578.2412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3259" y="593.1899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN194" data-source-line="557" id="ent0195"><path d="M3249,1191.0986 L3249,1237.9448 A4,4 0 0 0 3253,1241.9448 L3684.4312,1241.9448 A4,4 0 0 0 3688.4312,1237.9448 L3688.4312,1197.0986 L3678.4312,1187.0986 L3472.5,1187.0986 L3468.5,1169.4153 L3464.5,1187.0986 L3253,1187.0986 A4,4 0 0 0 3249,1191.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3678.4312,1187.0986 L3678.4312,1195.0986 A2,2 0 0 0 3680.4312,1197.0986 L3688.4312,1197.0986 L3678.4312,1187.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8423" x="3255" y="1204.2925">U02: HMAC binds reason to block/thread/blocker/blocked-user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.4312" x="3255" y="1219.2412">Status can change without breaking the binding. Bounded compare-write</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="3255" y="1234.1899">and full verify precede opt-in strict read; deletion clears both.</text></g><g class="entity" data-qualified-name="GMN197" data-source-line="562" id="ent0198"><path d="M3253,1870.0986 L3253,1916.9448 A4,4 0 0 0 3257,1920.9448 L3680.4268,1920.9448 A4,4 0 0 0 3684.4268,1916.9448 L3684.4268,1876.0986 L3674.4268,1866.0986 L3472.5,1866.0986 L3468.5,1848.4153 L3464.5,1866.0986 L3257,1866.0986 A4,4 0 0 0 3253,1870.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3674.4268,1866.0986 L3674.4268,1874.0986 A2,2 0 0 0 3676.4268,1876.0986 L3684.4268,1876.0986 L3674.4268,1866.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410.4268" x="3259" y="1883.2925">U02: HMAC binds reference/notes to evidence/provider UUID and kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4604" x="3259" y="1898.2412">Read verifies reference against blind index. Backfill clears stale</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="3259" y="1913.1899">indexes after null redaction; full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN200" data-source-line="567" id="ent0201"><path d="M659.5,1344.5986 L659.5,1406.3936 A4,4 0 0 0 663.5,1410.3936 L1100.6567,1410.3936 A4,4 0 0 0 1104.6567,1406.3936 L1104.6567,1350.5986 L1094.6567,1340.5986 L886,1340.5986 L882,1322.1408 L878,1340.5986 L663.5,1340.5986 A4,4 0 0 0 659.5,1344.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1094.6567,1340.5986 L1094.6567,1348.5986 A2,2 0 0 0 1096.6567,1350.5986 L1104.6567,1350.5986 L1094.6567,1340.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1567" x="665.5" y="1357.7925">U02: HMAC binds encrypted payload and review reason to request UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.3149" x="665.5" y="1372.7412">provider UUID, requester UUID and kind. Account deletion reseals each</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.9121" x="665.5" y="1387.6899">redacted payload with its own binding and clears reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="665.5" y="1402.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN203" data-source-line="573" id="ent0204"><path d="M665,2265.5986 L665,2327.3936 A4,4 0 0 0 669,2331.3936 L1095.334,2331.3936 A4,4 0 0 0 1099.334,2327.3936 L1099.334,2271.5986 L1089.334,2261.5986 L886,2261.5986 L882,2243.1408 L878,2261.5986 L669,2261.5986 A4,4 0 0 0 665,2265.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1089.334,2261.5986 L1089.334,2269.5986 A2,2 0 0 0 1091.334,2271.5986 L1099.334,2271.5986 L1089.334,2261.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.334" x="671" y="2278.7925">U02: HMAC binds reason and decisionReason to appeal UUID, subject,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="411.144" x="671" y="2293.7412">subjectId, submitter UUID and nullable provider UUID. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="405.4121" x="671" y="2308.6899">reseals each redacted reason and clears decision reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="671" y="2323.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN206" data-source-line="579" id="ent0207"><path d="M671,2729.5986 L671,2791.3936 A4,4 0 0 0 675,2795.3936 L1089.0005,2795.3936 A4,4 0 0 0 1093.0005,2791.3936 L1093.0005,2735.5986 L1083.0005,2725.5986 L886,2725.5986 L882,2707.1408 L878,2725.5986 L675,2725.5986 A4,4 0 0 0 671,2729.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1083.0005,2725.5986 L1083.0005,2733.5986 A2,2 0 0 0 1085.0005,2735.5986 L1093.0005,2735.5986 L1083.0005,2725.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0005" x="677" y="2742.7925">U02: four HMACs bind encrypted fields to gap UUID, requester UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8931" x="677" y="2757.7412">nullable provider UUID and catalog slugs/price type. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5386" x="677" y="2772.6899">reseals each redacted row and clears reviewReason with its binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="677" y="2787.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN209" data-source-line="585" id="ent0210"><path d="M2596,1572.5986 L2596,1634.3936 A4,4 0 0 0 2600,1638.3936 L3045.834,1638.3936 A4,4 0 0 0 3049.834,1634.3936 L3049.834,1578.5986 L3039.834,1568.5986 L2827,1568.5986 L2823,1550.1408 L2819,1568.5986 L2600,1568.5986 A4,4 0 0 0 2596,1572.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3039.834,1568.5986 L3039.834,1576.5986 A2,2 0 0 0 3041.834,1578.5986 L3049.834,1578.5986 L3039.834,1568.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="432.834" x="2602" y="1585.7925">U02: three HMACs bind encrypted title, notes and metadata to event UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1885" x="2602" y="1600.7412">request UUID and eventType. Account deletion reseals title and metadata</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="379.3486" x="2602" y="1615.6899">for each row and clears notes with its binding. Full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="96.8145" x="2602" y="1630.6387">opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN212" data-source-line="591" id="ent0213"><path d="M674.5,1008.0986 L674.5,1084.8423 A4,4 0 0 0 678.5,1088.8423 L1085.3467,1088.8423 A4,4 0 0 0 1089.3467,1084.8423 L1089.3467,1014.0986 L1079.3467,1004.0986 L886,1004.0986 L882,986.3412 L878,1004.0986 L678.5,1004.0986 A4,4 0 0 0 674.5,1008.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1079.3467,1004.0986 L1079.3467,1012.0986 A2,2 0 0 0 1081.3467,1014.0986 L1089.3467,1014.0986 L1079.3467,1004.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="390.2158" x="680.5" y="1021.2925">U02: HMAC binds issueDescription and nullable vehicleSnapshot to</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="285.3906" x="680.5" y="1036.2412">broadcast UUID, client UUID and definition UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="354.7832" x="680.5" y="1051.1899">marketId is excluded: the FK sets it to null on market deletion.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="393.8467" x="680.5" y="1066.1387">Account deletion reseals redacted issue and clears vehicle snapshot</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.0151" x="680.5" y="1081.0874">with binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN215" data-source-line="598" id="ent0216"><path d="M1309,1124.0986 L1309,1170.9448 A4,4 0 0 0 1313,1174.9448 L1766.0513,1174.9448 A4,4 0 0 0 1770.0513,1170.9448 L1770.0513,1130.0986 L1760.0513,1120.0986 L1543.5,1120.0986 L1539.5,1102.4153 L1535.5,1120.0986 L1313,1120.0986 A4,4 0 0 0 1309,1124.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1760.0513,1120.0986 L1760.0513,1128.0986 A2,2 0 0 0 1762.0513,1130.0986 L1770.0513,1130.0986 L1760.0513,1120.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="440.0513" x="1315" y="1137.2925">U02: HMAC binds encrypted offerSnapshot to offer UUID, broadcast request</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0132" x="1315" y="1152.2412">UUID, provider UUID and location UUID. Account deletion reseals the</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="407.5322" x="1315" y="1167.1899">redacted snapshot for each offer. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN218" data-source-line="603" id="ent0219"><path d="M2612.5,884.5986 L2612.5,946.3936 A4,4 0 0 0 2616.5,950.3936 L3029.8022,950.3936 A4,4 0 0 0 3033.8022,946.3936 L3033.8022,890.5986 L3023.8022,880.5986 L2827,880.5986 L2823,862.1408 L2819,880.5986 L2616.5,880.5986 A4,4 0 0 0 2612.5,884.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3023.8022,880.5986 L3023.8022,