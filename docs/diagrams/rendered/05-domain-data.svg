yle="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1928.5" y="2079.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1928.5" y="2094.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1928.5" y="2109.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1928.5" y="2124.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN105" data-source-line="346" id="ent0106"><path d="M3238.5,1029.5986 L3238.5,1071.0961 L3258.6116,553.7084 L3238.5,1079.0961 L3238.5,1091.3936 A4,4 0 0 0 3242.5,1095.3936 L3512.7642,1095.3936 A4,4 0 0 0 3516.7642,1091.3936 L3516.7642,1035.5986 L3506.7642,1025.5986 L3242.5,1025.5986 A4,4 0 0 0 3238.5,1029.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3506.7642,1025.5986 L3506.7642,1033.5986 A2,2 0 0 0 3508.7642,1035.5986 L3516.7642,1035.5986 L3506.7642,1025.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3244.5" y="1042.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3244.5" y="1057.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3244.5" y="1072.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3244.5" y="1087.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN108" data-source-line="352" id="ent0109"><path d="M696,1876.0986 L696,1922.9448 A4,4 0 0 0 700,1926.9448 L1026.5869,1926.9448 A4,4 0 0 0 1030.5869,1922.9448 L1030.5869,1882.0986 L1020.5869,1872.0986 L867.5,1872.0986 L863.5,1853.6627 L859.5,1872.0986 L700,1872.0986 A4,4 0 0 0 696,1876.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1020.5869,1872.0986 L1020.5869,1880.0986 A2,2 0 0 0 1022.5869,1882.0986 L1030.5869,1882.0986 L1020.5869,1872.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="702" y="1889.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="702" y="1904.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="702" y="1919.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN111" data-source-line="357" id="ent0112"><path d="M3885,1817.0986 L3885,1863.9448 A4,4 0 0 0 3889,1867.9448 L4131.0806,1867.9448 A4,4 0 0 0 4135.0806,1863.9448 L4135.0806,1823.0986 L4125.0806,1813.0986 L4014,1813.0986 L4010,1795.3133 L4006,1813.0986 L3889,1813.0986 A4,4 0 0 0 3885,1817.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4125.0806,1813.0986 L4125.0806,1821.0986 A2,2 0 0 0 4127.0806,1823.0986 L4135.0806,1823.0986 L4125.0806,1813.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3891" y="1830.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3891" y="1845.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3891" y="1860.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN114" data-source-line="362" id="ent0115"><path d="M3193.5,1794.5986 L3193.5,1886.291 A4,4 0 0 0 3197.5,1890.291 L3557.374,1890.291 A4,4 0 0 0 3561.374,1886.291 L3561.374,1800.5986 L3551.374,1790.5986 L3381.5,1790.5986 L3377.5,1772.601 L3373.5,1790.5986 L3197.5,1790.5986 A4,4 0 0 0 3193.5,1794.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3551.374,1790.5986 L3551.374,1798.5986 A2,2 0 0 0 3553.374,1800.5986 L3561.374,1800.5986 L3551.374,1790.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3199.5" y="1807.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3199.5" y="1822.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3199.5" y="1837.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3199.5" y="1852.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3199.5" y="1867.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3199.5" y="1882.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN120" data-source-line="373" id="ent0121"><path d="M41.5,1872.0986 L41.5,1918.9448 A4,4 0 0 0 45.5,1922.9448 L376.397,1922.9448 A4,4 0 0 0 380.397,1918.9448 L380.397,1878.0986 L370.397,1868.0986 L215,1868.0986 L211,1850.5707 L207,1868.0986 L45.5,1868.0986 A4,4 0 0 0 41.5,1872.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,1868.0986 L370.397,1876.0986 A2,2 0 0 0 372.397,1878.0986 L380.397,1878.0986 L370.397,1868.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="1885.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="1900.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="1915.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN123" data-source-line="378" id="ent0124"><path d="M21,2410.0986 L21,2456.9448 A4,4 0 0 0 25,2460.9448 L397.1377,2460.9448 A4,4 0 0 0 401.1377,2456.9448 L401.1377,2416.0986 L391.1377,2406.0986 L215,2406.0986 L211,2388.5707 L207,2406.0986 L25,2406.0986 A4,4 0 0 0 21,2410.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,2406.0986 L391.1377,2414.0986 A2,2 0 0 0 393.1377,2416.0986 L401.1377,2416.0986 L391.1377,2406.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="2423.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="2438.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="2453.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN126" data-source-line="383" id="ent0127"><path d="M34.5,2228.0986 L34.5,2274.9448 A4,4 0 0 0 38.5,2278.9448 L383.895,2278.9448 A4,4 0 0 0 387.895,2274.9448 L387.895,2234.0986 L377.895,2224.0986 L215,2224.0986 L211,2206.4153 L207,2224.0986 L38.5,2224.0986 A4,4 0 0 0 34.5,2228.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,2224.0986 L377.895,2232.0986 A2,2 0 0 0 379.895,2234.0986 L387.895,2234.0986 L377.895,2224.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="2241.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="2256.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="2271.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN129" data-source-line="388" id="ent0130"><path d="M661,2247.0986 L661,2293.9448 A4,4 0 0 0 665,2297.9448 L1062.4077,2297.9448 A4,4 0 0 0 1066.4077,2293.9448 L1066.4077,2253.0986 L1056.4077,2243.0986 L867.5,2243.0986 L863.5,2225.4153 L859.5,2243.0986 L665,2243.0986 A4,4 0 0 0 661,2247.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1056.4077,2243.0986 L1056.4077,2251.0986 A2,2 0 0 0 1058.4077,2253.0986 L1066.4077,2253.0986 L1056.4077,2243.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="667" y="2260.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="667" y="2275.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="667" y="2290.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN132" data-source-line="393" id="ent0133"><path d="M1281,2661.0986 L1281,2707.9448 A4,4 0 0 0 1285,2711.9448 L1692.5005,2711.9448 A4,4 0 0 0 1696.5005,2707.9448 L1696.5005,2667.0986 L1686.5005,2657.0986 L1493,2657.0986 L1489,2639.4153 L1485,2657.0986 L1285,2657.0986 A4,4 0 0 0 1281,2661.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1686.5005,2657.0986 L1686.5005,2665.0986 A2,2 0 0 0 1688.5005,2667.0986 L1696.5005,2667.0986 L1686.5005,2657.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1287" y="2674.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1287" y="2689.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1287" y="2704.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN135" data-source-line="398" id="ent0136"><path d="M666,2545.0986 L666,2591.9448 A4,4 0 0 0 670,2595.9448 L1056.5596,2595.9448 A4,4 0 0 0 1060.5596,2591.9448 L1060.5596,2551.0986 L1050.5596,2541.0986 L867.5,2541.0986 L863.5,2523.4153 L859.5,2541.0986 L670,2541.0986 A4,4 0 0 0 666,2545.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1050.5596,2541.0986 L1050.5596,2549.0986 A2,2 0 0 0 1052.5596,2551.0986 L1060.5596,2551.0986 L1050.5596,2541.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="672" y="2558.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="672" y="2573.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="672" y="2588.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN138" data-source-line="403" id="ent0139"><path d="M1288.5,2356.0986 L1288.5,2402.9448 A4,4 0 0 0 1292.5,2406.9448 L1685.5977,2406.9448 A4,4 0 0 0 1689.5977,2402.9448 L1689.5977,2362.0986 L1679.5977,2352.0986 L1493,2352.0986 L1489,2334.4153 L1485,2352.0986 L1292.5,2352.0986 A4,4 0 0 0 1288.5,2356.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1679.5977,2352.0986 L1679.5977,2360.0986 A2,2 0 0 0 1681.5977,2362.0986 L1689.5977,2362.0986 L1679.5977,2352.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1294.5" y="2369.2925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1294.5" y="2384.2412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1294.5" y="2399.1899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN141" data-source-line="408" id="ent0142"><path d="M2536.5,1663.0986 L2536.5,1709.9448 A4,4 0 0 0 2540.5,1713.9448 L2938.6567,1713.9448 A4,4 0 0 0 2942.6567,1709.9448 L2942.6567,1669.0986 L2932.6567,1659.0986 L2743.5,1659.0986 L2739.5,1641.4153 L2735.5,1659.0986 L2540.5,1659.0986 A4,4 0 0 0 2536.5,1663.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2932.6567,1659.0986 L2932.6567,1667.0986 A2,2 0 0 0 2934.6567,1669.0986 L2942.6567,1669.0986 L2932.6567,1659.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2542.5" y="1676.2925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2542.5" y="1691.2412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2542.5" y="1706.1899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN144" data-source-line="413" id="ent0145"><path d="M2520,1137.0986 L2520,1183.9448 A4,4 0 0 0 2524,1187.9448 L2955.3804,1187.9448 A4,4 0 0 0 2959.3804,1183.9448 L2959.3804,1143.0986 L2949.3804,1133.0986 L2743.5,1133.0986 L2739.5,1115.4153 L2735.5,1133.0986 L2524,1133.0986 A4,4 0 0 0 2520,1137.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2949.3804,1133.0986 L2949.3804,1141.0986 A2,2 0 0 0 2951.3804,1143.0986 L2959.3804,1143.0986 L2949.3804,1133.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2526" y="1150.2925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2526" y="1165.2412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2526" y="1180.1899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN147" data-source-line="418" id="ent0148"><path d="M3162,154.0986 L3162,200.9448 A4,4 0 0 0 3166,204.9448 L3588.6841,204.9448 A4,4 0 0 0 3592.6841,200.9448 L3592.6841,160.0986 L3582.6841,150.0986 L3381.5,150.0986 L3377.5,132.4153 L3373.5,150.0986 L3166,150.0986 A4,4 0 0 0 3162,154.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3582.6841,150.0986 L3582.6841,158.0986 A2,2 0 0 0 3584.6841,160.0986 L3592.6841,160.0986 L3582.6841,150.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3168" y="167.2925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3168" y="182.2412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3168" y="197.1899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN150" data-source-line="423" id="ent0151"><path d="M3158,328.0986 L3158,374.9448 A4,4 0 0 0 3162,378.9448 L3593.4312,378.9448 A4,4 0 0 0 3597.4312,374.9448 L3597.4312,334.0986 L3587.4312,324.0986 L3381.5,324.0986 L3377.5,306.4153 L3373.5,324.0986 L3162,324.0986 A4,4 0 0 0 3158,328.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3587.4312,324.0986 L3587.4312,332.0986 A2,2 0 0 0 3589.4312,334.0986 L3597.4312,334.0986 L3587.4312,324.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8423" x="3164" y="341.2925">U02: HMAC binds reason to block/thread/blocker/blocked-user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.4312" x="3164" y="356.2412">Status can change without breaking the binding. Bounded compare-write</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="3164" y="371.1899">and full verify precede opt-in strict read; deletion clears both.</text></g><g class="entity" data-qualified-name="GMN153" data-source-line="428" id="ent0154"><path d="M3162,1474.0986 L3162,1520.9448 A4,4 0 0 0 3166,1524.9448 L3589.4268,1524.9448 A4,4 0 0 0 3593.4268,1520.9448 L3593.4268,1480.0986 L3583.4268,1470.0986 L3381.5,1470.0986 L3377.5,1452.4153 L3373.5,1470.0986 L3166,1470.0986 A4,4 0 0 0 3162,1474.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3583.4268,1470.0986 L3583.4268,1478.0986 A2,2 0 0 0 3585.4268,1480.0986 L3593.4268,1480.0986 L3583.4268,1470.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410.4268" x="3168" y="1487.2925">U02: HMAC binds reference/notes to evidence/provider UUID and kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4604" x="3168" y="1502.2412">Read verifies reference against blind index. Backfill clears stale</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="3168" y="1517.1899">indexes after null redaction; full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN156" data-source-line="433" id="ent0157"><path d="M641,1671.5986 L641,1733.3936 A4,4 0 0 0 645,1737.3936 L1082.1567,1737.3936 A4,4 0 0 0 1086.1567,1733.3936 L1086.1567,1677.5986 L1076.1567,1667.5986 L867.5,1667.5986 L863.5,1649.1408 L859.5,1667.