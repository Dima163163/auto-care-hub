 0 0 0 10,2084.9448 L411.7241,2084.9448 A4,4 0 0 0 415.7241,2080.9448 L415.7241,2040.0986 L405.7241,2030.0986 L215,2030.0986 L211,2012.5707 L207,2030.0986 L10,2030.0986 A4,4 0 0 0 6,2034.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,2030.0986 L405.7241,2038.0986 A2,2 0 0 0 407.7241,2040.0986 L415.7241,2040.0986 L405.7241,2030.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="2047.2925">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="2062.2412">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="2077.1899">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN226" data-source-line="611" id="ent0227"><path d="M3254.5,1095.5986 L3254.5,1157.3936 A4,4 0 0 0 3258.5,1161.3936 L3660.2241,1161.3936 A4,4 0 0 0 3664.2241,1157.3936 L3664.2241,1101.5986 L3654.2241,1091.5986 L3463.5,1091.5986 L3459.5,1073.4611 L3455.5,1091.5986 L3258.5,1091.5986 A4,4 0 0 0 3254.5,1095.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3654.2241,1091.5986 L3654.2241,1099.5986 A2,2 0 0 0 3656.2241,1101.5986 L3664.2241,1101.5986 L3654.2241,1091.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.165" x="3260.5" y="1108.7925">U02: non-null body HMAC binds plaintext to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.1187" x="3260.5" y="1123.7412">request/thread and sender UUIDs and message kind.</text><text fill="#000000" font-family="Arial" fo