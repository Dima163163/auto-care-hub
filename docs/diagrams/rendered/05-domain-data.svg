"13" lengthAdjust="spacing" textLength="187.8906" x="1565.5" y="314.7412">type / payload / idempotencyKey</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="169.8062" x="1565.5" y="329.6899">status / attempts / availableAt</text></g><g class="entity" data-qualified-name="GMN43" data-source-line="124" id="ent0044"><path d="M937,202.0986 L937,263.8936 A4,4 0 0 0 941,267.8936 L1266.1523,267.8936 A4,4 0 0 0 1270.1523,263.8936 L1270.1523,208.0986 L1260.1523,198.0986 L1107.5,198.0986 L1103.5,180.2559 L1099.5,198.0986 L941,198.0986 A4,4 0 0 0 937,202.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1260.1523,198.0986 L1260.1523,206.0986 A2,2 0 0 0 1262.1523,208.0986 L1270.1523,208.0986 L1260.1523,198.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="943" y="215.2925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="943" y="230.2412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="943" y="245.1899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="943" y="260.1387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN46" data-source-line="130" id="ent0047"><path d="M1514,169.0986 L1514,230.8936 A4,4 0 0 0 1518,234.8936 L1788.2642,234.8936 A4,4 0 0 0 1792.2642,230.8936 L1792.2642,175.0986 L1782.2642,165.0986 L1657,165.0986 L1653,147.2559 L1649,165.0986 L1518,165.0986 A4,4 0 0 0 1514,169.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1782.2642,165.0986 L1782.2642,173.0986 A2,2 0 0 0 1784.2642,175.0986 L1792.2642,175.0986 L1782.2642,165.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="1520" y="182.2925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="1520" y="197.2412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="1520" y="212.1899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="1520" y="227.1387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN49" data-source-line="136" id="ent0050"><path d="M6,607.5986 L6,654.4448 A4,4 0 0 0 10,658.4448 L336.5869,658.4448 A4,4 0 0 0 340.5869,654.4448 L340.5869,613.5986 L330.5869,603.5986 L177.5,603.5986 L173.5,585.1627 L169.5,603.5986 L10,603.5986 A4,4 0 0 0 6,607.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M330.5869,603.5986 L330.5869,611.5986 A2,2 0 0 0 332.5869,613.5986 L340.5869,613.5986 L330.5869,603.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="12" y="620.7925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="12" y="635.7412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="12" y="650.6899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN52" data-source-line="141" id="ent0053"><path d="M2125,761.5986 L2125,808.4448 A4,4 0 0 0 2129,812.4448 L2371.0806,812.4448 A4,4 0 0 0 2375.0806,808.4448 L2375.0806,767.5986 L2365.0806,757.5986 L2254,757.5986 L2250,739.8386 L2246,757.5986 L2129,757.5986 A4,4 0 0 0 2125,761.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2365.0806,757.5986 L2365.0806,765.5986 A2,2 0 0 0 2367.0806,767.5986 L2375.0806,767.5986 L2365.0806,757.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="2131" y="774.7925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="2131" y="789.7412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="2131" y="804.6899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN55" data-source-line="146" id="ent0056"><path d="M1469,754.0986 L1469,845.791 A4,4 0 0 0 1473,849.791 L1832.874,849.791 A4,4 0 0 0 1836.874,845.791 L1836.874,760.0986 L1826.874,750.0986 L1657,750.0986 L1653,732.101 L1649,750.0986 L1473,750.0986 A4,4 0 0 0 1469,754.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1826.874,750.0986 L1826.874,758.0986 A2,2 0 0 0 1828.874,760.0986 L1836.874,760.0986 L1826.874,750.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="1475" y="767.2925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="1475" y="782.2412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="1475" y="797.1899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="1475" y="812.1387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="1475" y="827.0874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="1475" y="842.0361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN59" data-source-line="155" id="ent0060"><path d="M2033,835.0986 L2033,831.0986 L2032.8789,869.8616 L2033,839.0986 L2033,896.8936 A4,4 0 0 0 2037,900.8936 L2462.8262,900.8936 A4,4 0 0 0 2466.8262,896.8936 L2466.8262,841.0986 L2456.8262,831.0986 L2037,831.0986 A4,4 0 0 0 2033,835.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2456.8262,831.0986 L2456.8262,839.0986 A2,2 0 0 0 2458.8262,841.0986 L2466.8262,841.0986 L2456.8262,831.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="218.918" x="2039" y="848.2925">&#1055;&#1091;&#1085;&#1082;&#1090;&#1080;&#1088; &#8212; &#1083;&#1086;&#1075;&#1080;&#1095;&#1077;&#1089;&#1082;&#1072;&#1103; &#1089;&#1074;&#1103;&#1079;&#1100;, &#1085;&#1077; FK.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="399.5278" x="2039" y="863.2412">Reference lookup fix &#1090;&#1088;&#1077;&#1073;&#1091;&#1077;&#1090; &#1087;&#1088;&#1080;&#1084;&#1077;&#1085;&#1077;&#1085;&#1080;&#1103; migration &#1080; &#1087;&#1088;&#1086;&#1074;&#1077;&#1088;&#1082;&#1080; DB.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="412.8262" x="2039" y="878.1899">Snapshot &#1080; FK &#1085;&#1077;&#1083;&#1100;&#1079;&#1103; &#1074;&#1086;&#1089;&#1089;&#1090;&#1072;&#1085;&#1