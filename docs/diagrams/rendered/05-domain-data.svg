point" data-source-line="249" id="ent0043"><rect fill="#F1F1F1" height="82.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="272.0996" x="2563.5" y="307.0986"/><ellipse cx="2577.5" cy="322.0986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M2579.9697,326.5986 L2574.0664,326.5986 L2574.0664,317.1216 L2579.9697,317.1216 L2579.9697,318.772 L2575.939,318.772 L2575.939,320.8159 L2579.5889,320.8159 L2579.5889,322.4663 L2575.939,322.4663 L2575.939,324.9482 L2579.9697,324.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="242.0996" x="2590.5" y="326.8181">ServiceQuoteSnapshotBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="2564.5" x2="2834.5996" y1="337.0986" y2="337.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="2574.5" cy="350.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="188.6143" x="2582.5" y="353.2925">name : autocare_service_quotes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="2582.5" y="368.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="2582.5" y="383.1899">processed : bigint</text></g><!--class ChatReportCheckpoint--><g class="entity" data-qualified-name="ChatReportCheckpoint" data-source-line="254" id="ent0044"><rect fill="#F1F1F1" height="82.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="230.167" x="3218.5" y="800.0986"/><ellipse cx="3232.5" cy="815.0986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M3234.9697,819.5986 L3229.0664,819.5986 L3229.0664,810.1216 L3234.9697,810.1216 L3234.9697,811.772 L3230.939,811.772 L3230.939,813.8159 L3234.5889,813.8159 L3234.5889,815.4663 L3230.939,815.4663 L3230.939,817.9482 L3234.9697,817.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="200.167" x="3245.5" y="819.8181">ChatReportTextBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="3219.5" x2="3447.667" y1="830.0986" y2="830.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="3229.5" cy="843.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="173.437" x="3237.5" y="846.2925">name : autocare_chat_reports</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="3237.5" y="861.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="3237.5" y="876.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN92" data-source-line="307" id="ent0093"><path d="M1882.5,636.5986 L1882.5,698.3936 A4,4 0 0 0 1886.5,702.3936 L2211.6523,702.3936 A4,4 0 0 0 2215.6523,698.3936 L2215.6523,642.5986 L2205.6523,632.5986 L2053,632.5986 L2049,614.7559 L2045,632.5986 L1886.5,632.5986 A4,4 0 0 0 1882.5,636.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2205.6523,632.5986 L2205.6523,640.5986 A2,2 0 0 0 2207.6523,642.5986 L2215.6523,642.5986 L2205.6523,632.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1888.5" y="649.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1888.5" y="664.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1888.5" y="679.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1888.5" y="694.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN95" data-source-line="313" id="ent0096"><path d="M3194.5,715.5986 L3194.5,777.3936 A4,4 0 0 0 3198.5,781.3936 L3468.7642,781.3936 A4,4 0 0 0 3472.7642,777.3936 L3472.7642,721.5986 L3462.7642,711.5986 L3337.5,711.5986 L3333.5,693.7559 L3329.5,711.5986 L3198.5,711.5986 A4,4 0 0 0 3194.5,715.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3462.7642,711.5986 L3462.7642,719.5986 A2,2 0 0 0 3464.7642,721.5986 L3472.7642,721.5986 L3462.7642,711.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3200.5" y="728.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3200.5" y="743.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3200.5" y="758.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3200.5" y="773.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN98" data-source-line="319" id="ent0099"><path d="M676,303.0986 L676,349.9448 A4,4 0 0 0 680,353.9448 L1006.5869,353.9448 A4,4 0 0 0 1010.5869,349.9448 L1010.5869,309.0986 L1000.5869,299.0986 L847.5,299.0986 L843.5,280.6627 L839.5,299.0986 L680,299.0986 A4,4 0 0 0 676,303.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1000.5869,299.0986 L1000.5869,307.0986 A2,2 0 0 0 1002.5869,309.0986 L1010.5869,309.0986 L1000.5869,299.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="682" y="316.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="682" y="331.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="682" y="346.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN101" data-source-line="324" id="ent0102"><path d="M3837,184.0986 L3837,230.9448 A4,4 0 0 0 3841,234.9448 L4083.0806,234.9448 A4,4 0 0 0 4087.0806,230.9448 L4087.0806,190.0986 L4077.0806,180.0986 L3966,180.0986 L3962,162.3386 L3958,180.0986 L3841,180.0986 A4,4 0 0 0 3837,184.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4077.0806,180.0986 L4077.0806,188.0986 A2,2 0 0 0 4079.0806,190.0986 L4087.0806,190.0986 L4077.0806,180.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3843" y="197.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3843" y="212.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3843" y="227.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN104" data-source-line="329" id="ent0105"><path d="M3149.5,233.5986 L3149.5,325.291 A4,4 0 0 0 3153.5,329.291 L3513.374,329.291 A4,4 0 0 0 3517.374,325.291 L3517.374,239.5986 L3507.374,229.5986 L3337.5,229.5986 L3333.5,211.601 L3329.5,229.5986 L3153.5,229.5986 A4,4 0 0 0 3149.5,233.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3507.374,229.5986 L3507.374,237.5986 A2,2 0 0 0 3509.374,239.5986 L3517.374,239.5986 L3507.374,229.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3155.5" y="246.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3155.5" y="261.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3155.5" y="276.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3155.5" y="291.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3155.5" y="306.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3155.5" y="321.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN110" data-source-line="340" id="ent0111"><path d="M41.5,368.0986 L41.5,414.9448 A4,4 0 0 0 45.5,418.9448 L376.397,418.9448 A4,4 0 0 0 380.397,414.9448 L380.397,374.0986 L370.397,364.0986 L215,364.0986 L211,346.5707 L207,364.0986 L45.5,364.0986 A4,4 0 0 0 41.5,368.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,364.0986 L370.397,372.0986 A2,2 0 0 0 372.397,374.0986 L380.397,374.0986 L370.397,364.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="381.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="396.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="411.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN113" data-source-line="345" id="ent0114"><path d="M21,663.0986 L21,709.9448 A4,4 0 0 0 25,713.9448 L397.1377,713.9448 A4,4 0 0 0 401.1377,709.9448 L401.1377,669.0986 L391.1377,659.0986 L215,659.0986 L211,641.5707 L207,659.0986 L25,659.0986 A4,4 0 0 0 21,663.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,659.0986 L391.1377,667.0986 A2,2 0 0 0 393.1377,669.0986 L401.1377,669.0986 L391.1377,659.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="676.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="691.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="706.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN116" data-source-line="350" id="ent0117"><path d="M34.5,1019.0986 L34.5,1065.9448 A4,4 0 0 0 38.5,1069.9448 L383.895,1069.9448 A4,4 0 0 0 387.895,1065.9448 L387.895,1025.0986 L377.895,1015.0986 L215,1015.0986 L211,997.4153 L207,1015.0986 L38.5,1015.0986 A4,4 0 0 0 34.5,1019.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,1015.0986 L377.895,1023.0986 A2,2 0 0 0 379.895,1025.0986 L387.895,1025.0986 L377.895,1015.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="1032.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="1047.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="1062.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN119" data-source-line="355" id="ent0120"><path d="M641,648.0986 L641,694.9448 A4,4 0 0 0 645,698.9448 L1042.4077,698.9448 A4,4 0 0 0 1046.4077,694.9448 L1046.4077,654.0986 L1036.4077,644.0986 L847.5,644.0986 L843.5,626.4153 L839.5,644.0986 L645,644.0986 A4,4 0 0 0 641,648.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1036.4077,644.0986 L1036.4077,652.0986 A2,2 0 0 0 1038.4077,654.0986 L1046.4077,654.0986 L1036.4077,644.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="647" y="661.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="647" y="676.2412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="647" y="691.1899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN122" data-source-line="360" id="ent0123"><path d="M1241,1060.0986 L1241,1106.9448 A4,4 0 0 0 1245,1110.9448 L1652.5005,1110.9448 A4,4 0 0 0 1656.5005,1106.9448 L1656.5005,1066.0986 L1646.5005,1056.0986 L1453,1056.0986 L1449,1038.4153 L1445,1056.09