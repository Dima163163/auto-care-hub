ave null binding.</text></g><g class="entity" data-qualified-name="GMN108" data-source-line="312" id="ent0109"><path d="M1241,1493.0986 L1241,1539.9448 A4,4 0 0 0 1245,1543.9448 L1652.5005,1543.9448 A4,4 0 0 0 1656.5005,1539.9448 L1656.5005,1499.0986 L1646.5005,1489.0986 L1453,1489.0986 L1449,1471.4153 L1445,1489.0986 L1245,1489.0986 A4,4 0 0 0 1241,1493.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1646.5005,1489.0986 L1646.5005,1497.0986 A2,2 0 0 0 1648.5005,1499.0986 L1656.5005,1499.0986 L1646.5005,1489.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1247" y="1506.2925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1247" y="1521.2412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1247" y="1536.1899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN111" data-source-line="317" id="ent0112"><path d="M646,959.0986 L646,1005.9448 A4,4 0 0 0 650,1009.9448 L1036.5596,1009.9448 A4,4 0 0 0 1040.5596,1005.9448 L1040.5596,965.0986 L1030.5596,955.0986 L847.5,955.0986 L843.5,937.4153 L839.5,955.0986 L650,955.0986 A4,4 0 0 0 646,959.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1030.5596,955.0986 L1030.5596,963.0986 A2,2 0 0 0 1032.5596,965.0986 L1040.5596,965.0986 L1030.5596,955.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="652" y="972.2925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="652" y="987.2412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="652" y="1002.1899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN114" data-source-line="322" id="ent0115"><path d="M6,959.0986 L6,1005.9448 A4,4 0 0 0 10,1009.9448 L411.7241,1009.9448 A4,4 0 0 0 415.7241,1005.9448 L415.7241,965.0986 L405.7241,955.0986 L215,955.0986 L211,937.5707 L207,955.0986 L10,955.0986 A4,4 0 0 0 6,959.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,955.0986 L405.7241,963.0986 A2,2 0 0 0 407.7241,965.0986 L415.7241,965.0986 L405.7241,955.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="972.2925">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="987.2412">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="1002.1899">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN117" data-source-line="327" id="ent0118"><path d="M3089,659.5986 L3089,721.3936 A4,4 0 0 0 3093,725.3936 L3494.7241,725.3936 A4,4 0 0 0 3498.7241,721.3936 L3498.7241,665.5986 L3488.7241,655.5986 L3298,655.5986 L3294,637.4611 L3290,655.5986 L3093,655.5986 A4,4 0 0 0 3089,659.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3488.7241,655.5986 L3488.7241,663.5986 A2,2 0 0 0 3490.7241,665.5986 L3498.7241,665.5986 L3488.7241,655.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#0000