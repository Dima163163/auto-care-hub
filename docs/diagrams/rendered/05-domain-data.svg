9,1492.3159 L2713.5889,1493.9663 L2709.939,1493.9663 L2709.939,1496.4482 L2713.9697,1496.4482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="203.0615" x="2724.5" y="1498.3181">GuaranteeClaimBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="2698.5" x2="2929.5615" y1="1508.5986" y2="1508.5986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="2708.5" cy="1521.573" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="203.7915" x="2716.5" y="1524.7925">name : autocare_guarantee_claims</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="2716.5" y="1539.7412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="2716.5" y="1554.6899">processed : bigint</text></g><!--class ExpertQuestionCheckpoint--><g class="entity" data-qualified-name="ExpertQuestionCheckpoint" data-source-line="356" id="ent0062"><rect fill="#F1F1F1" height="82.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="228.0088" x="759" y="2556.5986"/><ellipse cx="773" cy="2571.5986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M775.4697,2576.0986 L769.5664,2576.0986 L769.5664,2566.6216 L775.4697,2566.6216 L775.4697,2568.272 L771.439,2568.272 L771.439,2570.3159 L775.0889,2570.3159 L775.0889,2571.9663 L771.439,2571.9663 L771.439,2574.4482 L775.4697,2574.4482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="198.0088" x="786" y="2576.3181">ExpertQuestionBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="760" x2="986.0088" y1="2586.5986" y2="2586.5986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="770" cy="2599.573" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="200.186" x="778" y="2602.7925">name : autocare_expert_questions</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="778" y="2617.7412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="778" y="2632.6899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN131" data-source-line="430" id="ent0132"><path d="M1989.5,2214.0986 L1989.5,2275.8936 A4,4 0 0 0 1993.5,2279.8936 L2318.6523,2279.8936 A4,4 0 0 0 2322.6523,2275.8936 L2322.6523,2220.0986 L2312.6523,2210.0986 L2160,2210.0986 L2156,2192.2559 L2152,2210.0986 L1993.5,2210.0986 A4,4 0 0 0 1989.5,2214.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2312.6523,2210.0986 L2312.6523,2218.0986 A2,2 0 0 0 2314.6523,2220.0986 L2322.6523,2220.0986 L2312.6523,2210.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1995.5" y="2227.2925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1995.5" y="2242.2412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1995.5" y="2257.1899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1995.5" y="2272.1387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN134" data-source-line="436" id="ent0135"><path d="M3320.5,1606.0986 L3320.5,1667.8936 A4,4 0 0 0 3324.5,1671.8936 L3594.7642,1671.8936 A4,4 0 0 0 3598.7642,1667.8936 L3598.7642,1612.0986 L3588.7642,1602.0986 L3463.5,1602.0986 L3459.5,1584.3312 L3455.5,1602.0986 L3324.5,1602.0986 A4,4 0 0 0 3320.5,1606.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3588.7642,1602.0986 L3588.7642,1610.0986 A2,2 0 0 0 3590.7642,1612.0986 L3598.7642,1612.0986 L3588.7642,1602.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3326.5" y="1619.2925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3326.5" y="1634.2412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3326.5" y="1649.1899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3326.5" y="1664.1387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN137" data-source-line="442" id="ent0138"><path d="M705.5,1760.5986 L705.5,1807.4448 A4,4 0 0 0 709.5,1811.4448 L1036.0869,1811.4448 A4,4 0 0 0 1040.0869,1807.4448 L1040.0869,1766.5986 L1030.0869,1756.5986 L877,1756.5986 L873,1738.1627 L869,1756.5986 L709.5,1756.5986 A4,4 0 0 0 705.5,1760.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1030.0869,1756.5986 L1030.0869,1764.5986 A2,2 0 0 0 1032.0869,1766.5986 L1040.0869,1766.5986 L1030.0869,1756.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="711.5" y="1773.7925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="711.5" y="1788.7412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="711.5" y="1803.6899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN140" data-source-line="447" id="ent0141"><path d="M3967,1964.5986 L3967,2011.4448 A4,4 0 0 0 3971,2015.4448 L4213.0806,2015.4448 A4,4 0 0 0 4217.0806,2011.4448 L4217.0806,1970.5986 L4207.0806,1960.5986 L4096,1960.5986 L4092,1942.8133 L4088,1960.5986 L3971,1960.5986 A4,4 0 0 0 3967,1964.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4207.0806,1960.5986 L4207.0806,1968.5986 A2,2 0 0 0 4209.0806,1970.5986 L4217.0806,1970.5986 L4207.0806,1960.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3973" y="1977.7925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3973" y="1992.7412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3973" y="2007.6899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN143" data-source-line="452" id="ent0144"><path d="M3275.5,1942.0986 L3275.5,2033.791 A4,4 0 0 0 3279.5,2037.791 L3639.374,2037.791 A4,4 0 0 0 3643.374,2033.791 L3643.374,1948.0986 L3633.374,1938.0986 L3463.5,1938.0986 L3459.5,1920.101 L3455.5,1938.0986 L3279.5,1938.0986 A4,4 0 0 0 3275.5,1942.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3633.374,1938.0986 L3633.374,1946.0986 A2,2 0 0 0 3635.374,1948.0986 L3643.374,1948.0986 L3633.374,1938.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3281.5" y="1955.2925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3281.5" y="1970.2412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3281.5" y="1985.1899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3281.5" y="2000.1387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3281.5" y="2015.0874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3281.5" y="2030.0361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN149" data-source-line="463" id="ent0150"><path d="M41.5,1784.5986 L41.5,1831.4448 A4,4 0 0 0 45.5,1835.4448 L376.397,1835.4448 A4,4 0 0 0 380.397,1831.4448 L380.397,1790.5986 L370.397,1780.5986 L215,1780.5986 L211,1763.0707 L207,1780.5986 L45.5,1780.5986 A4,4 0 0 0 41.5,1784.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,1780.5986 L370.397,1788.5986 A2,2 0 0 0 372.397,1790.5986 L380.397,1790.5986 L370.397,1780.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="1797.7925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="1812.7412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="1827.6899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN152" data-source-line="468" id="ent0153"><path d="M21,2343.5986 L21,2390.4448 A4,4 0 0 0 25,2394.4448 L397.1377,2394.4448 A4,4 0 0 0 401.1377,2390.4448 L401.1377,2349.5986 L391.1377,2339.5986 L215,2339.5986 L211,2322.0707 L207,2339.5986 L25,2339.5986 A4,4 0 0 0 21,2343.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,2339.5986 L391.1377,2347.5986 A2,2 0 0 0 393.1377,2349.5986 L401.1377,2349.5986 L391.1377,2339.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="2356.7925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="2371.7412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="2386.6899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN155" data-source-line="473" id="ent0156"><path d="M34.5,2161.5986 L34.5,2208.4448 A4,4 0 0 0 38.5,2212.4448 L383.895,2212.4448 A4,4 0 0 0 387.895,2208.4448 L387.895,2167.5986 L377.895,2157.5986 L215,2157.5986 L211,2139.9153 L207,2157.5986 L38.5,2157.5986 A4,4 0 0 0 34.5,2161.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,2157.5986 L377.895,2165.5986 A2,2 0 0 0 379.895,2167.5986 L387.895,2167.5986 L377.895,2157.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="2174.7925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="2189.7412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="2204.6899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN158" data-source-line="478" id="ent0159"><path d="M670.5,1968.5986 L670.5,2015.4448 A4,4 0 0 0 674.5,2019.4448 L1071.9077,2019.4448 A4,4 0 0 0 1075.9077,2015.4448 L1075.9077,1974.5986 L1065.9077,1964.5986 L877,1964.5986 L873,1946.9153 L869,1964.5986 L674.5,1964.5986 A4,4 0 0 0 670.5,1968.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1065.9077,1964.5986 L1065.9077,1972.5986 A2,2 0 0 0 1067.9077,1974.5986 L1075.9077,1974.5986 L1065.9077,1964.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="676.5" y="1981.7925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="676.5" y="1996.7412">Bounded compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.8213" x="676.5" y="2011.6899">precedes opt-in strict read. Null optional fields have null binding.</text></g><g class="entity" data-qualified-name="GMN161" data-source-line="483" id="ent0162"><path d="M1322.5,2986.5986 L1322.5,3033.4448 A4,4 0 0 0 1326.5,3037.4448 L1734.0005,3037.4448 A4,4 0 0 0 1738.0005,3033.4448 L1738.0005,2992.5986 L1728.0005,2982.5986 L1534.5,2982.5986 L1530.5,2964.9153 L1526.5,2982.5986 L1326.5,2982.5986 A4,4 0 0 0 1322.5,2986.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1728.0005,2982.5986 L1728.0005,2990.5986 A2,2 0 0 0 1730.0005,2992.5986 L1738.0005,2992.5986 L1728.0005,2982.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5005" x="1328.5" y="2999.7925">U02: HMAC binds reason to history UUID, booking UUID and status.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="1328.5" y="3014.7412">Bounded compare-write and full verify precede opt-in strict read.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.5386" x="1328.5" y="3029.6899">Account deletion clears reason and binding together.</text></g><g class="entity" data-qualified-name="GMN164" data-source-line="488" id="ent0165"><path d="M675.5,2870.5986 L675.5,2917.4448 A4,4 0 0 0 679.5,2921.4448 L1066.0596,2921.4448 A4,4 0 0 0 1070.0596,2917.4448 L1070.0596,2876.5986 L1060.0596,2866.5986 L877,2866.5986 L873,2848.9153 L869,2866.5986 L679.5,2866.5986 A4,4 0 0 0 675.5,2870.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1060.0596,2866.5986 L1060.0596,2874.5986 A2,2 0 0 0 1062.0596,2876.5986 L1070.0596,2876.5986 L1060.0596,2866.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4287" x="681.5" y="2883.7925">U02: HMAC binds each text field to booking UUID, client UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="373.5596" x="681.5" y="2898.7412">cabinet UUID and service UUID. Bounded compare-write and full</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="357.6523" x="681.5" y="2913.6899">verify precede opt-in strict read. Deletion clears text and MAC.</text></g><g class="entity" data-qualified-name="GMN167" data-source-line="493" id="ent0168"><path d="M1330,2681.5986 L1330,2728.4448 A4,4 0 0 0 1334,2732.4448 L1727.0977,2732.4448 A4,4 0 0 0 1731.0977,2728.4448 L1731.0977,2687.5986 L1721.0977,2677.5986 L1534.5,2677.5986 L1530.5,2659.9153 L1526.5,2677.5986 L1334,2677.5986 A4,4 0 0 0 1330,2681.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1721.0977,2677.5986 L1721.0977,2685.5986 A2,2 0 0 0 1723.0977,2687.5986 L1731.0977,2687.5986 L1721.0977,2677.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="380.0977" x="1336" y="2694.7925">U02: HMAC binds resolution reason to request/booking/requester/</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.1987" x="1336" y="2709.7412">resolver UUID and decision status. Compare-write and full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="339.6187" x="1336" y="2724.6899">precede opt-in strict read; deletion clears reason and MAC.</text></g><g class="entity" data-qualified-name="GMN170" data-source-line="498" id="ent0171"><path d="M2611,1800.5986 L2611,1847.4448 A4,4 0 0 0 2615,1851.4448 L3013.1567,1851.4448 A4,4 0 0 0 3017.1567,1847.4448 L3017.1567,1806.5986 L3007.1567,1796.5986 L2818,1796.5986 L2814,1778.9153 L2810,1796.5986 L2615,1796.5986 A4,4 0 0 0 2611,1800.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3007.1567,1796.5986 L3007.1567,1804.5986 A2,2 0 0 0 3009.1567,1806.5986 L3017.1567,1806.5986 L3007.1567,1796.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.1567" x="2617" y="1813.7925">U02: proposal reason binds to reschedule/request/requester UUID;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="2617" y="1828.7412">decision reason also binds resolver UUID and status. Bounded</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5742" x="2617" y="1843.6899">compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN173" data-source-line="503" id="ent0174"><path d="M2594.5,545.5986 L2594.5,592.4448 A4,4 0 0 0 2598.5,596.4448 L3029.8804,596.4448 A4,4 0 0 0 3033.8804,592.4448 L3033.8804,551.5986 L3023.8804,541.5986 L2818,541.5986 L2814,523.9153 L2810,541.5986 L2598.5,541.5986 A4,4 0 0 0 2594.5,545.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3023.8804,541.5986 L3023.8804,549.5986 A2,2 0 0 0 3025.8804,551.5986 L3033.8804,551.5986 L3023.8804,541.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.3804" x="2600.5" y="558.7925">U02: HMAC binds snapshot to quote/request/provider UUID and version.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.7813" x="2600.5" y="573.7412">Account deletion rewrites each quote with its own encrypted redaction</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="287.5869" x="2600.5" y="588.6899">and binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN176" data-source-line="508" id="ent0177"><path d="M3244,444.5986 L3244,491.4448 A4,4 0 0 0 3248,495.4448 L3670.6841,495.4448 A4,4 0 0 0 3674.6841,491.4448 L3674.6841,450.5986 L3664.6841,440.5986 L3463.5,440.5986 L3459.5,422.9153 L3455.5,440.5986 L3248,440.5986 A4,4 0 0 0 3244,444.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3664.6841,440.5986 L3664.6841,448.5986 A2,2 0 0 0 3666.6841,450.5986 L3674.6841,450.5986 L3664.6841,440.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.6841" x="3250" y="457.7925">U02: HMAC binds each moderation text to report/thread/reporter UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4458" x="3250" y="472.7412">Status and assignment can change without breaking historical text.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="369.2368" x="3250" y="487.6899">Bounded compare-write and full verify precede opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN179" data-source-line="513" id="ent0180"><path d="M3240,270.5986 L3240,317.4448 A4,4 0 0 0 3244,321.4448 L3675.4312,321.4448 A4,4 0 0 0 3679.4312,317.4448 L3679.4312,276.5986 L3669.4312,266.5986 L3463.5,266.5986 L3459.5,248.9153 L3455.5,266.5986 L3244,266.5986 A4,4 0 0 0 3240,270.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3669.4312,266.5986 L3669.4312,274.5986 A2,2 0 0 0 3671.4312,276.5986 L3679.4312,276.5986 L3669.4312,266.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8423" x="3246" y="283.7925">U02: HMAC binds reason to block/thread/blocker/blocked-user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="418.4312" x="3246" y="298.7412">Status can change without breaking the binding. Bounded compare-write</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="347.5723" x="3246" y="313.6899">and full verify precede opt-in strict read; deletion clears both.</text></g><g class="entity" data-qualified-name="GMN182" data-source-line="518" id="ent0183"><path d="M3244,1386.5986 L3244,1433.4448 A4,4 0 0 0 3248,1437.4448 L3671.4268,1437.4448 A4,4 0 0 0 3675.4268,1433.4448 L3675.4268,1392.5986 L3665.4268,1382.5986 L3463.5,1382.5986 L3459.5,1364.9153 L3455.5,1382.5986 L3248,1382.5986 A4,4 0 0 0 3244,1386.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3665.4268,1382.5986 L3665.4268,1390.5986 A2,2 0 0 0 3667.4268,1392.5986 L3675.4268,1392.5986 L3665.4268,1382.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="410.4268" x="3250" y="1399.7925">U02: HMAC binds reference/notes to evidence/provider UUID and kind.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.4604" x="3250" y="1414.7412">Read verifies reference against blind index. Backfill clears stale</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="371.4014" x="3250" y="1429.6899">indexes after null redaction; full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN185" data-source-line="523" id="ent0186"><path d="M650.5,1389.0986 L650.5,1450.8936 A4,4 0 0 0 654.5,1454.8936 L1091.6567,1454.8936 A4,4 0 0 0 1095.6567,1450.8936 L1095.6567,1395.0986 L1085.6567,1385.0986 L877,1385.0986 L873,1366.6408 L869,1385.0986 L654.5,1385.0986 A4,4 0 0 0 650.5,1389.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1085.6567,1385.0986 L1085.6567,1393.0986 A2,2 0 0 0 1087.6567,1395.0986 L1095.6567,1395.0986 L1085.6567,1385.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1567" x="656.5" y="1402.2925">U02: HMAC binds encrypted payload and review reason to request UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.3149" x="656.5" y="1417.2412">provider UUID, requester UUID and kind. Account deletion reseals each</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.9121" x="656.5" y="1432.1899">redacted payload with its own binding and clears reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="656.5" y="1447.1387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN188" data-source-line="529" id="ent0189"><path d="M656,2282.0986 L656,2343.8936 A4,4 0 0 0 660,2347.8936 L1086.334,2347.8936 A4,4 0 0 0 1090.334,2343.8936 L1090.334,2288.0986 L1080.334,2278.0986 L877,2278.0986 L873,2259.6408 L869,2278.0986 L660,2278.0986 A4,4 0 0 0 656,2282.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1080.334,2278.0986 L1080.334,2286.0986 A2,2 0 0 0 1082.334,2288.0986 L1090.334,2288.0986 L1080.334,2278.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="413.334" x="662" y="2295.2925">U02: HMAC binds reason and decisionReason to appeal UUID, subject,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="411.144" x="662" y="2310.2412">subjectId, submitter UUID and nullable provider UUID. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="405.4121" x="662" y="2325.1899">reseals each redacted reason and clears decision reason with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="662" y="2340.1387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN191" data-source-line="535" id="ent0192"><path d="M662,2472.0986 L662,2533.8936 A4,4 0 0 0 666,2537.8936 L1080.0005,2537.8936 A4,4 0 0 0 1084.0005,2533.8936 L1084.0005,2478.0986 L1074.0005,2468.0986 L877,2468.0986 L873,2449.6408 L869,2468.0986 L666,2468.0986 A4,4 0 0 0 662,2472.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1074.0005,2468.0986 L1074.0005,2476.0986 A2,2 0 0 0 1076.0005,2478.0986 L1084.0005,2478.0986 L1074.0005,2468.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0005" x="668" y="2485.2925">U02: four HMACs bind encrypted fields to gap UUID, requester UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="398.8931" x="668" y="2500.2412">nullable provider UUID and catalog slugs/price type. Account deletion</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="394.5386" x="668" y="2515.1899">reseals each redacted row and clears reviewReason with its binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="668" y="2530.1387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN194" data-source-line="541" id="ent0195"><path d="M2587,162.0986 L2587,223.8936 A4,4 0 0 0 2591,227.8936 L3036.834,227.8936 A4,4 0 0 0 3040.834,223.8936 L3040.834,168.0986 L3030.834,158.0986 L2818,158.0986 L2814,139.6408 L2810,158.0986 L2591,158.0986 A4,4 0 0 0 2587,162.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3030.834,158.0986 L3030.834,166.0986 A2,2 0 0 0 3032.834,168.0986 L3040.834,168.0986 L3030.834,158.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="432.834" x="2593" y="175.2925">U02: three HMACs bind encrypted title, notes and metadata to event UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="424.1885" x="2593" y="190.2412">request UUID and eventType. Account deletion reseals title and metadata</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="379.3486" x="2593" y="205.1899">for each row and clears notes with its binding. Full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="96.8145" x="2593" y="220.1387">opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN197" data-source-line="547" id="ent0198"><path d="M665.5,1054.5986 L665.5,1131.3423 A4,4 0 0 0 669.5,1135.3423 L1076.3467,1135.3423 A4,4 0 0 0 1080.3467,1131.3423 L1080.3467,1060.5986 L1070.3467,1050.5986 L877,1050.5986 L873,1032.8412 L869,1050.5986 L669.5,1050.5986 A4,4 0 0 0 665.5,1054.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1070.3467,1050.5986 L1070.3467,1058.5986 A2,2 0 0 0 1072.3467,1060.5986 L1080.3467,1060.5986 L1070.3467,1050.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="390.2158" x="671.5" y="1067.7925">U02: HMAC binds issueDescription and nullable vehicleSnapshot to</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="285.3906" x="671.5" y="1082.7412">broadcast UUID, client UUID and definition UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="354.7832" x="671.5" y="1097.6899">marketId is excluded: the FK sets it to null on market deletion.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="393.8467" x="671.5" y="1112.6387">Account deletion reseals redacted issue and clears vehicle snapshot</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="289.0151" x="671.5" y="1127.5874">with binding. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN200" data-source-line="554" id="ent0201"><path d="M1300,1220.5986 L1300,1267.4448 A4,4 0 0 0 1304,1271.4448 L1757.0513,1271.4448 A4,4 0 0 0 1761.0513,1267.4448 L1761.0513,1226.5986 L1751.0513,1216.5986 L1534.5,1216.5986 L1530.5,1155.6678 L1526.5,1216.5986 L1304,1216.5986 A4,4 0 0 0 1300,1220.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1751.0513,1216.5986 L1751.0513,1224.5986 A2,2 0 0 0 1753.0513,1226.5986 L1761.0513,1226.5986 L1751.0513,1216.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="440.0513" x="1306" y="1233.7925">U02: HMAC binds encrypted offerSnapshot to offer UUID, broadcast request</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="401.0132" x="1306" y="1248.7412">UUID, provider UUID and location UUID. Account deletion reseals the</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="407.5322" x="1306" y="1263.6899">redacted snapshot for each offer. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN203" data-source-line="559" id="ent0204"><path d="M2603.5,1584.0986 L2603.5,1645.8936 A4,4 0 0 0 2607.5,1649.8936 L3020.8022,1649.8936 A4,4 0 0 0 3024.8022,1645.8936 L3024.8022,1590.0986 L3014.8022,1580.0986 L2818,1580.0986 L2814,1561.6408 L2810,1580.0986 L2607.5,1580.0986 A4,4 0 0 0 2603.5,1584.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3014.8022,1580.0986 L3014.8022,1588.0986 A2,2 0 0 0 3016.8022,1590.0986 L3024.8022,1590.0986 L3014.8022,1580.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.2051" x="2609.5" y="1597.2925">U02: HMAC binds summary and nullable resolution to claim UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="400.3022" x="2609.5" y="1612.2412">request/client/provider UUID and claimType. Account deletion reseals</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="354.0596" x="2609.5" y="1627.1899">redacted summary per row and clears resolution with binding.</text><text fill="#000000" 