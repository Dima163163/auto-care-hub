rial" font-size="13" lengthAdjust="spacing" textLength="250.0151" x="2923" y="931.6387">opt-in strict read. Null offer has null binding.</text></g><g class="entity" data-qualified-name="GMN104" data-source-line="288" id="ent0105"><path d="M2308,696.5986 L2308,758.3936 A4,4 0 0 0 2312,762.3936 L2713.7241,762.3936 A4,4 0 0 0 2717.7241,758.3936 L2717.7241,702.5986 L2707.7241,692.5986 L2517,692.5986 L2513,674.4611 L2509,692.5986 L2312,692.5986 A4,4 0 0 0 2308,696.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2707.7241,692.5986 L2707.7241,700.5986 A2,2 0 0 0 2709.7241,702.5986 L2717.7241,702.5986 L2707.7241,692.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="294.7979" x="2314" y="709.7925">U02: subject HMAC binds plaintext to thread UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="270.9561" x="2314" y="724.7412">type and request/provider/client/creator UUIDs.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="2314" y="739.6899">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="351.9141" x="2314" y="754.6387">opt-in strict read. Account deletion rebinds redacted subjects.</text></g><g class="entity" data-qualified-name="GMN107" data-source-line="294" id="ent0108"><path d="M1672,855.5986 L1672,917.3936 A4,4 0 0 0 1676,921.3936 L2077.7241,921.3936 A4,4 0 0 0 2081.7241,917.3936 L2081.7241,861.5986 L2071.7241,851.5986 L1881,851.5986 L1877,833.4611 L1873,851.5986 L1676,851.5986 A4,4 0 0 0 1672,855.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2071.7241,851.5986 L2071.7241,859.5986 A2,2 0 0 0 2073.7241,861.5986 L2081.7241,861.5986 L2071.7241,851.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-wid