-source-line="206" id="ent0036"><rect fill="#F1F1F1" height="82.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="267.0469" x="1308.5" y="1279.0986"/><ellipse cx="1322.5" cy="1294.0986" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M1324.9697,1298.5986 L1319.0664,1298.5986 L1319.0664,1289.1216 L1324.9697,1289.1216 L1324.9697,1290.772 L1320.939,1290.772 L1320.939,1292.8159 L1324.5889,1292.8159 L1324.5889,1294.4663 L1320.939,1294.4663 L1320.939,1296.9482 L1324.9697,1296.9482 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="237.0469" x="1335.5" y="1298.8181">BookingStatusReasonBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="1309.5" x2="1574.5469" y1="1309.0986" y2="1309.0986"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="1319.5" cy="1322.073" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="176.3252" x="1327.5" y="1325.2925">name : booking_status_history</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="1327.5" y="1340.2412">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="1327.5" y="1355.1899">processed : bigint</text></g><g class="entity" data-qualified-name="GMN76" data-source-line="251" id="ent0077"><path d="M1875.5,1194.5986 L1875.5,1256.3936 A4,4 0 0 0 1879.5,1260.3936 L2204.6523,1260.3936 A4,4 0 0 0 2208.6523,1256.3936 L2208.6523,1200.5986 L2198.6523,1190.5986 L2046,1190.5986 L2042,1172.7559 L2038,1190.5986 L1879.5,1190.5986 A4,4 0 0 0 1875.5,1194.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2198.6523,1190.5986 L2198.6523,1198.5986 A2,2 0 0 0 2200.6523,1200.5986 L2208.6523,1200.5986 L2198.6523,1190.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1881.5" y="1207.7925">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1881.5" y="1222.7412">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1881.5" y="1237.6899">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1881.5" y="1252.6387">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN79" data-source-line="257" id="ent0080"><path d="M3148,1221.5986 L3148,1283.3936 A4,4 0 0 0 3152,1287.3936 L3422.2642,1287.3936 A4,4 0 0 0 3426.2642,1283.3936 L3426.2642,1227.5986 L3416.2642,1217.5986 L3291,1217.5986 L3287,1199.7559 L3283,1217.5986 L3152,1217.5986 A4,4 0 0 0 3148,1221.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3416.2642,1217.5986 L3416.2642,1225.5986 A2,2 0 0 0 3418.2642,1227.5986 L3426.2642,1227.5986 L3416.2642,1217.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="3154" y="1234.7925">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="3154" y="1249.7412">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="3154" y="1264.6899">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="3154" y="1279.6387">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN82" data-source-line="263" id="ent0083"><path d="M676,425.0986 L676,471.9448 A4,4 0 0 0 680,475.9448 L1006.5869,475.9448 A4,4 0 0 0 1010.5869,471.9448 L1010.5869,431.0986 L1000.5869,421.0986 L847.5,421.0986 L843.5,402.6627 L839.5,421.0986 L680,421.0986 A4,4 0 0 0 676,425.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1000.5869,421.0986 L1000.5869,429.0986 A2,2 0 0 0 1002.5869,431.0986 L1010.5869,431.0986 L1000.5869,421.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="682" y="438.2925">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="682" y="453.2412">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="682" y="468.1899">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN85" data-source-line="268" id="ent0086"><path d="M3780,273.0986 L3780,309.7951 L3791.157,100.1486 L3780,317.7951 L3780,319.9448 A4,4 0 0 0 3784,323.9448 L4026.0806,323.9448 A4,4 0 0 0 4030.0806,319.9448 L4030.0806,279.0986 L4020.0806,269.0986 L3784,269.0986 A4,4 0 0 0 3780,273.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M4020.0806,269.0986 L4020.0806,277.0986 A2,2 0 0 0 4022.0806,279.0986 L4030.0806,279.0986 L4020.0806,269.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3786" y="286.2925">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3786" y="301.2412">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3786" y="316.1899">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN88" data-source-line="273" id="ent0089"><path d="M3103,233.5986 L3103,325.291 A4,4 0 0 0 3107,329.291 L3466.874,329.291 A4,4 0 0 0 3470.874,325.291 L3470.874,239.5986 L3460.874,229.5986 L3291,229.5986 L3287,211.601 L3283,229.5986 L3107,229.5986 A4,4 0 0 0 3103,233.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3460.874,229.5986 L3460.874,237.5986 A2,2 0 0 0 3462.874,239.5986 L3470.874,239.5986 L3460.874,229.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="3109" y="246.7925">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="3109" y="261.7412">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="3109" y="276.6899">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="3109" y="291.6387">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="3109" y="306.5874">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="3109" y="321.5361">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN94" data-source-line="284" id="ent0095"><path d="M41.5,421.0986 L41.5,467.9448 A4,4 0 0 0 45.5,471.9448 L376.397,471.9448 A4,4 0 0 0 380.397,467.9448 L380.397,427.0986 L370.397,417.0986 L215,417.0986 L211,399.5707 L207,417.0986 L45.5,417.0986 A4,4 0 0 0 41.5,421.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,417.0986 L370.397,425.0986 A2,2 0 0 0 372.397,427.0986 L380.397,427.0986 L370.397,417.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="434.2925">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="449.2412">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="464.1899">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN97" data-source-line="289" id="ent0098"><path d="M21,777.0986 L21,823.9448 A4,4 0 0 0 25,827.9448 L397.1377,827.9448 A4,4 0 0 0 401.1377,823.9448 L401.1377,783.0986 L391.1377,773.0986 L215,773.0986 L211,755.5707 L207,773.0986 L25,773.0986 A4,4 0 0 0 21,777.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,773.0986 L391.1377,781.0986 A2,2 0 0 0 393.1377,783.0986 L401.1377,783.0986 L391.1377,773.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="790.2925">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="805.2412">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="820.1899">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN100" data-source-line="294" id="ent0101"><path d="M34.5,595.0986 L34.5,641.9448 A4,4 0 0 0 38.5,645.9448 L383.895,645.9448 A4,4 0 0 0 387.895,641.9448 L387.895,601.0986 L377.895,591.0986 L215,591.0986 L211,573.4153 L207,591.0986 L38.5,591.0986 A4,4 0 0 0 34.5,595.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M377.895,591.0986 L377.895,599.0986 A2,2 0 0 0 379.895,601.0986 L387.895,601.0986 L377.895,591.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="305.665" x="40.5" y="608.2925">U02: three nullable fields bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6333" x="40.5" y="623.2412">Compare-write and checkpoint commit together; full verify</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.395" x="40.5" y="638.1899">precedes opt-in strict read. Partial selects include binding.</text></g><g class="entity" data-qualified-name="GMN103" data-source-line="299" id="ent0104"><path d="M641,1060.0986 L641,1106.9448 A4,4 0 0 0 645,1110.9448 L1042.4077,1110.9448 A4,4 0 0 0 1046.4077,1106.9448 L1046.4077,1066.0986 L1036.4077,1056.0986 L847.5,1056.0986 L843.5,1038.4153 L839.5,1056.0986 L645,1056.0986 A4,4 0 0 0 641,1060.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1036.4077,1056.0986 L1036.4077,1064.0986 A2,2 0 0 0 1038.4077,1066.0986 L1046.4077,1066.0986 L1036.4077,1056.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.9224" x="647" y="1073.2925">U02: HMAC binds plaintext to vehicle and owner UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="384.4077" x="647" y="1088.2412">Bounded compare-write and checkpoint commit together; full verify</te