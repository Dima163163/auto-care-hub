vider UUID and location UUID. Account deletion reseals the</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="407.5322" x="1306" y="1167.1899">redacted snapshot for each offer. Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN215" data-source-line="597" id="ent0216"><path d="M2603.5,884.5986 L2603.5,946.3936 A4,4 0 0 0 2607.5,950.3936 L3020.8022,950.3936 A4,4 0 0 0 3024.8022,946.3936 L3024.8022,890.5986 L3014.8022,880.5986 L2818,880.5986 L2814,862.1408 L2810,880.5986 L2607.5,880.5986 A4,4 0 0 0 2603.5,884.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3014.8022,880.5986 L3014.8022,888.5986 A2,2 0 0 0 3016.8022,890.5986 L3024.8022,890.5986 L3014.8022,880.5986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.2051" x="2609.5" y="897.7925">U02: HMAC binds summary and nullable resolution to claim UUID,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="400.3022" x="2609.5" y="912.7412">request/client/provider UUID and claimType. Account deletion reseals</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="354.0596" x="2609.5" y="927.6899">redacted summary per row and clears resolution with binding.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.1353" x="2609.5" y="942.6387">Full verify precedes opt-in strict read.</text></g><g class="entity" data-qualified-name="GMN218" data-source-line="603" id="ent0219"><path d="M641,3055.0986 L641,3101.9448 A4,4 0 0 0 645,3105.9448 L1100.9268,3105.9448 A4,4 0 0 0 1104.9268,3101.9448 L1104.9268,3061.0986 L1094.9268,3051.0986 L877,3051.0986 L873,3033.4153 L869,3051.0986 L645,3051.0986 A4,4 0 0 0 641,3055.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M109