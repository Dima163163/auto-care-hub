cing" textLength="101.8926" x="1418" y="936.0083">processed : bigint</text></g><!--class AcceptedQuoteCheckpoint--><g class="entity" data-qualified-name="AcceptedQuoteCheckpoint" data-source-line="154" id="ent0028"><rect fill="#F1F1F1" height="90.8462" rx="4" ry="4" style="stroke:#181818;stroke-width:0.5;" width="228.0215" x="1418" y="524.917"/><ellipse cx="1432" cy="539.917" fill="#ADD1B2" rx="10" ry="10" style="stroke:#181818;stroke-width:1;"/><path d="M1434.4697,544.417 L1428.5664,544.417 L1428.5664,534.9399 L1434.4697,534.9399 L1434.4697,536.5903 L1430.439,536.5903 L1430.439,538.6343 L1434.0889,538.6343 L1434.0889,540.2847 L1430.439,540.2847 L1430.439,542.7666 L1434.4697,542.7666 Z " fill="#000000"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="198.0215" x="1445" y="544.6365">AcceptedQuoteBindingCheckpoint</text><line style="stroke:#181818;stroke-width:0.5;" x1="1419" x2="1645.0215" y1="554.917" y2="554.917"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="1429" cy="567.8914" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="199.4434" x="1437" y="571.1108">name : autocare_service_requests</text><line style="stroke:#181818;stroke-width:1;" x1="1419" x2="1645.0215" y1="577.8657" y2="577.8657"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="79.498" x="1424" y="594.0596">afterId : uuid?</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="1424" y="609.0083">processed : bigint</text></g><g class="entity" data-qualified-name="GMN60" data-source-line="192" id="ent0061"><path d="M1365.5,1169.417 L1365.5,1231.2119 A4,4 0 0 0 1369.5,1235.2119 L1694.6523,1235.2119 A4,4 0 0 0 1698.6523,1231.2119 L1698.6523,1175.417 L1688.6523,1165.417 L1536,1165.417 L1532,1147.5742 L1528,1165.417 L1369.5,1165.417 A4,4 0 0 0 1365.5,1169.417" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1688.6523,1165.417 L1688.6523,1173.417 A2,2 0 0 0 1690.6523,1175.417 L1698.6523,1175.417 L1688.6523,1165.417" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.1523" x="1371.5" y="1182.6108">U18: positive earn/adjustment/refund entries form lots.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="244.9307" x="1371.5" y="1197.5596">Redemption consumes earliest expiry first;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9478" x="1371.5" y="1212.5083">expiry applies only to the unspent amount of its lot.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3906" x="1371.5" y="1227.457">Refund is a new non-expiring credit.</text></g><g class="entity" data-qualified-name="GMN63" data-source-line="198" id="ent0064"><path d="M2638,1217.417 L2638,1279.2119 A4,4 0 0 0 2642,1283.2119 L2912.2642,1283.2119 A4,4 0 0 0 2916.2642,1279.2119 L2916.2642,1223.417 L2906.2642,1213.417 L2781,1213.417 L2777,1195.5742 L2773,1213.417 L2642,1213.417 A4,4 0 0 0 2638,1217.417" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2906.2642,1213.417 L2906.2642,1221.417 A2,2 0 0 0 2908.2642,1223.417 L2916.2642,1223.417 L2906.2642,1213.417" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="2644" y="1230.6108">U19: one canonical case per request.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222.5488" x="2644" y="1245.5596">Historic duplicates retain null caseKey;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.5552" x="2644" y="1260.5083">only the canonical case affects trust.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="257.2642" x="2644" y="1275.457">Allegations never count as proven violations.</text></g><g class="entity" data-qualified-name="GMN66" data-source-line="204" id="ent0067"><path d="M633,722.917 L633,769.7632 A4,4 0 0 0 637,773.7632 L963.5869,773.7632 A4,4 0 0 0 967.5869,769.7632 L967.5869,728.917 L957.5869,718.917 L804.5,718.917 L800.5,700.4811 L796.5,718.917 L637,718.917 A4,4 0 0 0 633,722.917" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M957.5869,718.917 L957.5869,726.917 A2,2 0 0 0 959.5869,728.917 L967.5869,728.917 L957.5869,718.917" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="313.5869" x="639" y="736.1108">N25: successful trust scans advance both timestamps,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1924" x="639" y="751.0596">failed scans advance only attemptedAt.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="233.3843" x="639" y="766.0083">A policy change clears both watermarks.</text></g><g class="entity" data-qualified-name="GMN69" data-source-line="209" id="ent0070"><path d="M3270,268.917 L3270,305.6135 L3281.157,95.967 L3270,313.6135 L3270,315.7632 A4,4 0 0 0 3274,319.7632 L3516.0806,319.7632 A4,4 0 0 0 3520.0806,315.7632 L3520.0806,274.917 L3510.0806,264.917 L3274,264.917 A4,4 0 0 0 3270,268.917" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M3510.0806,264.917 L3510.0806,272.917 A2,2 0 0 0 3512.0806,274.917 L3520.0806,274.917 L3510.0806,264.917" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.0806" x="3276" y="282.1108">U16: exact lookup uses referenceIndex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1606" x="3276" y="297.0596">reference remains randomly encrypted.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="219.6479" x="3276" y="312.0083">Migration backfills existing references.</text></g><g class="entity" data-qualified-name="GMN72" data-source-line="214" id="ent0073"><path d="M2593,229.417 L2593,321.1094 A4,4 0 0 0 2597,325.1094 L2956.874,325.1094 A4,4 0 0 0 2960.874,321.1094 L2960.874,235.417 L2950.874,225.417 L2781,225.417 L2777,207.4193 L2773,225.417 L2597,225.417 A4,4 0 0 0 2593,229.417" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2950.874,225.417 L2950.874,233.417 A2,2 0 0 0 2952.874,235.417 L2960.874,235.417 L2950.874,225.417" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.1924" x="2599" y="242.6108">N24: edit locks the review row, consumes allowance,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.874" x="2599" y="257.5596">increments contentRevision and queues matching evidence.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="268.8423" x="2599" y="272.5083">Older pending evidence becomes superseded;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="2599" y="287.457">moderation checks the matching revision under row lock.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="286.1777" x="2599" y="302.4058">N21: admin status counts aggregate the full table;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="346.144" x="2599" y="317.3545">anomaly signals and calibration use the latest 1000 reviews.</text></g><g class="entity" data-qualified-name="GMN78" data-source-line="225" id="ent0079"><path d="M41.5,721.917 L41.5,768.7632 A4,4 0 0 0 45.5,772.7632 L376.397,772.7632 A4,4 0 0 0 380.397,768.7632 L380.397,727.917 L370.397,717.917 L215,717.917 L211,700.3891 L207,717.917 L45.5,717.917 A4,4 0 0 0 41.5,721.917" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M370.397,717.917 L370.397,725.917 A2,2 0 0 0 372.397,727.917 L380.397,727.917 L370.397,717.917" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="304.916" x="47.5" y="735.1108">U02: compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="317.897" x="47.5" y="750.0596">Verify full row/owner MAC coverage before strict reads.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.8105" x="47.5" y="765.0083">Production backfill and restore remain unverified.</text></g><g class="entity" data-qualified-name="GMN81" data-source-line="230" id="ent0082"><path d="M21,1097.917 L21,1144.7632 A4,4 0 0 0 25,1148.7632 L397.1377,1148.7632 A4,4 0 0 0 401.1377,1144.7632 L401.1377,1103.917 L391.1377,1093.917 L215,1093.917 L211,1076.3891 L207,1093.917 L25,1093.917 A4,4 0 0 0 21,1097.917" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M391.1377,1093.917 L391.1377,1101.917 A2,2 0 0 0 393.1377,1103.917 L401.1377,1103.917 L391.1377,1093.917" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.1377" x="27" y="1111.1108">U02: bounded compare-write and checkpoint commit together.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="27" y="1126.0596">Verify subject MAC by identity/user UUID and provider.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.127" x="27" y="1141.0083">Real KMS/restore and strict cutover remain unverified.</text></g><g class="entity" data-qualified-name="GMN84" data-source-line="235" id="ent0085"><path d="M6,915.917 L6,962.7632 A4,4 0 0 0 10,966.7632 L411.7241,966.7632 A4,4 0 0 0 415.7241,962.7632 L415.7241,921.917 L405.7241,911.917 L215,911.917 L211,894.3891 L207,911.917 L10,911.917 A4,4 0 0 0 6,915.917" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M405.7241,911.917 L405.7241,919.917 A2,2 0 0 0 407.7241,921.917 L415.7241,921.917 L405.7241,911.917" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="382.9858" x="12" y="929.1108">U02: name and non-null phone HMAC bind plaintext to user UUID.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="388.7241" x="12" y="944.0596">Compare-write and checkpoint commit together; full verify precedes</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="316.4561" x="12" y="959.0083">opt-in strict read. Real KMS/restore remains unverified.</text></g><g class="entity" data-qualified-name="GMN87" data-source-line="240" id="ent0088"><path d="M2572,655.417 L2572,717.2119 A4,4 0 0 0 2576,721.2119 L2977.7241,721.2119 A4,4 0 0 0 2981.7241,717.2119 L2981.7241,661.417 L2971.7241,651.417 L2781,651.417 L2777,633.2794 L2773,651.417 L2576,651.417 A4,4 0 0 0 2572,655.417" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2971.7241,651.417 L2971.7241,659.417 A2,2 0 0 0 2973.7241,661.417 L2981.7241,661.417 L2971.7241,651.417" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.165" x="2578" y="668.6108">U02: non-null body HMAC binds plaintext to message,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAd