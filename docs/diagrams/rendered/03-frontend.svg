<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1407px" preserveAspectRatio="none" style="width:2738px;height:1407px;background:#FAFBFD;" version="1.1" viewBox="0 0 2738 1407" width="2738px" zoomAndPan="magnify"><title>Frontend &#8212; &#1085;&#1072;&#1074;&#1080;&#1075;&#1072;&#1094;&#1080;&#1103; &#1080; &#1074;&#1083;&#1072;&#1076;&#1077;&#1083;&#1100;&#1094;&#1099; &#1089;&#1086;&#1089;&#1090;&#1086;&#1103;&#1085;&#1080;&#1103;</title><defs/><g><rect fill="#FAFBFD" height="1407" style="stroke:none;stroke-width:1;" width="2738" x="0" y="0"/><g class="title" data-source-line="2"><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="328.1182" x="1197.9409" y="23.1318">Frontend &#8212; &#1085;&#1072;&#1074;&#1080;&#1075;&#1072;&#1094;&#1080;&#1103; &#1080; &#1074;&#1083;&#1072;&#1076;&#1077;&#1083;&#1100;&#1094;&#1099; &#1089;&#1086;&#1089;&#1090;&#1086;&#1103;&#1085;&#1080;&#1103;</text></g><!--cluster Next production shell--><g class="cluster" data-qualified-name="Next production shell" data-source-line="4" id="ent0002"><rect fill="none" height="276.5" rx="4" ry="4" style="stroke:#181818;stroke-width:1;" width="254" x="1757" y="49.0986"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="132.9009" x="1817.5496" y="63.2925">Next production shell</text></g><!--cluster ???????????? React application tree--><g class="cluster" data-qualified-name="............ React application tree" data-source-line="9" id="ent0006"><rect fill="none" height="728.5" rx="4" ry="4" style="stroke:#181818;stroke-width:1;" width="949" x="14" y="347.0986"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="238.875" x="369.0625" y="361.2925">&#1057;&#1091;&#1097;&#1077;&#1089;&#1090;&#1074;&#1091;&#1102;&#1097;&#1077;&#1077; React application tree</text></g><!--cluster ??????--><g class="cluster" data-qualified-name="......" data-source-line="21" id="ent0017"><rect fill="none" height="492.5" rx="4" ry="4" style="stroke:#181818;stroke-width:1;" width="494" x="971" y="861.0986"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="50.5273" x="1192.7363" y="875.2925">&#1044;&#1072;&#1085;&#1085;&#1099;&#1077;</text></g><!--entity Backend--><g class="entity" data-qualified-name="Backend" data-source-line="29" id="ent0024"><rect fill="#EAF1FB" height="34.9487" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="175.8159" x="2557" y="1303.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="155.8159" x="2567" y="1325.2925">Backend &#1095;&#1077;&#1088;&#1077;&#1079; /api rewrite</text></g><!--entity Mock--><g class="entity" data-qualified-name="Mock" data-source-line="30" id="ent0025"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="166.3008" x="1943" y="1295.5986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="146.3008" x="1953" y="1317.7925">MSW browser + handlers</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="122.0908" x="1953" y="1332.7412">&#1090;&#1086;&#1083;&#1100;&#1082;&#1086; mock runtime</text></g><g class="entity" data-qualified-name="GMN53" data-source-line="59" id="ent0054"><path d="M2127.5,1245.0986 L2127.5,1316.5986 L2109.0459,1320.5986 L2127.5,1324.5986 L2127.5,1396.5859 A4,4 0 0 0 2131.5,1400.5859 L2534.7158,1400.5859 A4,4 0 0 0 2538.7158,1396.5859 L2538.7158,1251.0986 L2528.7158,1241.0986 L2131.5,1241.0986 A4,4 0 0 0 2127.5,1245.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2528.7158,1241.0986 L2528.7158,1249.0986 A2,2 0 0 0 2530.7158,1251.0986 L2538.7158,1251.0986 L2528.7158,1241.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.0913" x="2133.5" y="1258.2925">Super-admin private request chats stay out of the subject index.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="364.1714" x="2133.5" y="1273.2412">Direct emergency read resolves the thread by ID with a reason;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="283.2705" x="2133.5" y="1288.1899">report parties are denied even after case closure.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="299.8569" x="2133.5" y="1303.1387">The request-to-chat shortcut rejects privileged roles.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.125" x="2133.5" y="1318.0874">Participant block creation reuses only an active ordinary block;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="355.5259" x="2133.5" y="1333.0361">a report sanction keeps its case link and appeal-only removal.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="390.2158" x="2133.5" y="1347.9849">Privileged actors and nonparticipants cannot create ordinary blocks.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="355.5386" x="2133.5" y="1362.9336">Admin operational support and escalation history/attachments</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.9414" x="2133.5" y="1377.8823">do not require a private request report assignment.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.8042" x="2133.5" y="1392.8311">Mock behavior is a UI contract, not security evidence.</text></g><g class="entity" data-qualified-name="GMN56" data-source-line="71" id="ent0057"><path d="M1473,1267.0986 L1473,1373.7397 A4,4 0 0 0 1477,1377.7397 L1920.6313,1377.7397 A4,4 0 0 0 1924.6313,1373.7397 L1924.6313,1273.0986 L1914.6313,1263.0986 L1611.1371,1263.0986 L1165.1622,1185.344 L1603.1371,1263.0986 L1477,1263.0986 A4,4 0 0 0 1473,1267.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1914.6313,1263.0986 L1914.6313,1271.0986 A2,2 0 0 0 1916.6313,1273.0986 L1924.6313,1273.0986 L1914.6313,1263.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="275.2979" x="1479" y="1280.2925">catalog / providers / requests / chat / workspace</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.3823" x="1479" y="1295.2412">resources / reviews / bonuses / governance / marketplace</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="350.0542" x="1479" y="1310.1899">&#1060;&#1072;&#1073;&#1088;&#1080;&#1082;&#1080; &#8212; &#1087;&#1077;&#1088;&#1074;&#1099;&#1081; &#1072;&#1076;&#1088;&#1077;&#1089; &#1087;&#1086;&#1080;&#1089;&#1082;&#1072; endpoint implementation.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.3779" x="1479" y="1325.1387">N27: CI &#1085;&#1072;&#1093;&#1086;&#1076;&#1080;&#1090; 10 &#1079;&#1072;&#1088;&#1077;&#1075;&#1080;&#1089;&#1090;&#1088;&#1080;&#1088;&#1086;&#1074;&#1072;&#1085;&#1085;&#1099;&#1093; factories &#1095;&#1077;&#1088;&#1077;&#1079; AST</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="356.4907" x="1479" y="1340.0874">&#1080; &#1087;&#1088;&#1086;&#1074;&#1077;&#1088;&#1103;&#1077;&#1090; transformResponse &#1091; &#1082;&#1072;&#1078;&#1076;&#1086;&#1075;&#1086; domain endpoint.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="430.6313" x="1479" y="1355.0361">Private attachment response keeps JSON MFA errors for baseApi step-up;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="325.876" x="1479" y="1369.9849">successful image response remains a Blob / object URL.</text></g><g class="entity" data-qualified-name="GMN59" data-source-line="80" id="ent0060"><path d="M1473,880.0986 L1473,941.8936 A4,4 0 0 0 1477,945.8936 L1798.5469,945.8936 A4,4 0 0 0 1802.5469,941.8936 L1802.5469,886.0986 L1792.5469,876.0986 L1572.8881,876.0986 L663.7416,892.4823 L1564.8881,876.0986 L1477,876.0986 A4,4 0 0 0 1473,880.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1792.5469,876.0986 L1792.5469,884.0986 A2,2 0 0 0 1794.5469,886.0986 L1802.5469,886.0986 L1792.5469,876.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="308.5469" x="1479" y="893.2925">N23: client/owner request screens read cursor pages.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.2305" x="1479" y="908.2412">Only requested pages are kept in the screen state;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="182.8442" x="1479" y="923.1899">older requests load on demand.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="302.0278" x="1479" y="938.1387">Counts are marked partial while more pages remain.</text></g><g class="entity" data-qualified-name="GMN62" data-source-line="86" id="ent0063"><path d="M2021,269.0986 L2021,288.5986 L2003.2168,292.5986 L2021,296.5986 L2021,315.9448 A4,4 0 0 0 2025,319.9448 L2458.6909,319.9448 A4,4 0 0 0 2462.6909,315.9448 L2462.6909,275.0986 L2452.6909,265.0986 L2025,265.0986 A4,4 0 0 0 2021,269.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2452.6909,265.0986 L2452.6909,273.0986 A2,2 0 0 0 2454.6909,275.0986 L2462.6909,275.0986 L2452.6909,265.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="228.3252" x="2027" y="282.2925">Vite &#8212; compatibility/development entry.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="314.5454" x="2027" y="297.2412">&#1056;&#1077;&#1072;&#1083;&#1100;&#1085;&#1099;&#1081; production graph &#1080;&#1089;&#1082;&#1083;&#1102;&#1095;&#1072;&#1077;&#1090; MSW fixtures.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="420.6909" x="2027" y="312.1899">&#1055;&#1088;&#1080; &#1086;&#1090;&#1082;&#1072;&#1079;&#1077; localStorage &#1103;&#1079;&#1099;&#1082; &#1080; &#1090;&#1077;&#1084;&#1072; &#1080;&#1089;&#1087;&#1086;&#1083;&#1100;&#1079;&#1091;&#1102;&#1090; &#1085;&#1072;&#1089;&#1090;&#1088;&#1086;&#1081;&#1082;&#1080; &#1073;&#1088;&#1072;&#1091;&#1079;&#1077;&#1088;&#1072;.</text></g><g class="entity" data-qualified-name="GMN65" data-source-line="91" id="ent0066"><path d="M971.5,480.0986 L971.5,507.0986 L938.6455,511.0986 L971.5,515.0986 L971.5,541.8936 A4,4 0 0 0 975.5,545.8936 L1382.4102,545.8936 A4,4 0 0 0 1386.4102,541.8936 L1386.4102,486.0986 L1376.4102,476.0986 L975.5,476.0986 A4,4 0 0 0 971.5,480.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1376.4102,476.0986 L1376.4102,484.0986 A2,2 0 0 0 1378.4102,486.0986 L1386.4102,486.0986 L1376.4102,476.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="264.7163" x="977.5" y="493.2925">N34: SEO lifecycle &#1078;&#1080;&#1074;&#1105;&#1090; &#1074;&#1099;&#1096;&#1077; &#1074;&#1089;&#1077;&#1093; layouts.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="366.2725" x="977.5" y="508.2412">Auth SSR &#1080; client navigation &#1080;&#1089;&#1087;&#1086;&#1083;&#1100;&#1079;&#1091;&#1102;&#1090; &#1086;&#1073;&#1097;&#1080;&#1077; copy/noindex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6016" x="977.5" y="523.1899">provider-specific metadata &#1089;&#1086;&#1093;&#1088;&#1072;&#1085;&#1103;&#1077;&#1090;&#1089;&#1103; &#1087;&#1086;&#1089;&#1083;&#1077; hydration.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="393.9102" x="977.5" y="538.1387">&#1055;&#1088;&#1103;&#1084;&#1086;&#1081; URL &#1089; lang=en &#1080;&#1083;&#1080; lang=ru &#1079;&#1072;&#1076;&#1072;&#1105;&#1090; SSR &#1103;&#1079;&#1099;&#1082; &#1095;&#1077;&#1088;&#1077;&#1079; proxy.</text></g><g class="entity" data-qualified-name="GMN68" data-source-line="97" id="ent0069"><path d="M1473.5,1004.0986 L1473.5,1080.8423 A4,4 0 0 0 1477.5,1084.8423 L1818.5342,1084.8423 A4,4 0 0 0 1822.5342,1080.8423 L1822.5342,1010.0986 L1812.5342,1000.0986 L1556.7415,1000.0986 L694.8207,1017.8926 L1548.7415,1000.0986 L1477.5,1000.0986 A4,4 0 0 0 1473.5,1004.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1812.5342,1000.0986 L1812.5342,1008.0986 A2,2 0 0 0 1814.5342,1010.0986 L1822.5342,1010.0986 L1812.5342,1000.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="328.0342" x="1479.5" y="1017.2925">Admin CSV transport keeps 403 JSON error codes intact</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="319.395" x="1479.5" y="1032.2412">for the shared MFA step-up dialog; 200 remains a Blob.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="299.5078" x="1479.5" y="1047.1899">N33: parsing/timeout/5xx &#1080; SyntaxError &#1085;&#1077; &#1074;&#1099;&#1074;&#1086;&#1076;&#1103;&#1090;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="324.1621" x="1479.5" y="1062.1387">raw response &#1074; UI. &#1051;&#1086;&#1082;&#1072;&#1083;&#1080;&#1079;&#1086;&#1074;&#1072;&#1085;&#1085;&#1086;&#1077; &#1089;&#1086;&#1086;&#1073;&#1097;&#1077;&#1085;&#1080;&#1077; &#1080; retry</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="272.7397" x="1479.5" y="1077.0874">&#1089;&#1086;&#1093;&#1088;&#1072;&#1085;&#1103;&#1102;&#1090; &#1087;&#1086;&#1085;&#1103;&#1090;&#1085;&#1099;&#1081; &#1089;&#1094;&#1077;&#1085;&#1072;&#1088;&#1080;&#1081; &#1087;&#1088;&#1080; &#1089;&#1073;&#1086;&#1077; API.</text></g><g class="entity" data-qualified-name="GMN71" data-source-line="104" id="ent0072"><path d="M973.5,721.0986 L973.5,782.8936 A4,4 0 0 0 977.5,786.8936 L1376.0947,786.8936 A4,4 0 0 0 1380.0947,782.8936 L1380.0947,727.0986 L1370.0947,717.0986 L1116.5776,717.0986 L398.3398,726.9657 L1108.5776,717.0986 L977.5,717.0986 A4,4 0 0 0 973.5,721.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1370.0947,717.0986 L1370.0947,725.0986 A2,2 0 0 0 1372.0947,727.0986 L1380.0947,727.0986 L1370.0947,717.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="349.959" x="979.5" y="734.2925">&#1055;&#1088;&#1080; &#1089;&#1084;&#1077;&#1085;&#1077; &#1087;&#1086;&#1083;&#1100;&#1079;&#1086;&#1074;&#1072;&#1090;&#1077;&#1083;&#1103; &#1080;&#1083;&#1080; &#1079;&#1072;&#1103;&#1074;&#1082;&#1080; &#1076;&#1086;&#1095;&#1077;&#1088;&#1085;&#1080;&#1081; &#1082;&#1086;&#1084;&#1087;&#1086;&#1085;&#1077;&#1085;&#1090;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="322.3403" x="979.5" y="749.2412">&#1084;&#1086;&#1085;&#1090;&#1080;&#1088;&#1091;&#1077;&#1090;&#1089;&#1103; &#1079;&#1072;&#1085;&#1086;&#1074;&#1086;: &#1095;&#1077;&#1088;&#1085;&#1086;&#1074;&#1080;&#1082;, retry key, offer, cursor,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="385.5947" x="979.5" y="764.1899">preview &#1080; &#1086;&#1090;&#1082;&#1088;&#1099;&#1090;&#1099;&#1077; &#1076;&#1077;&#1081;&#1089;&#1090;&#1074;&#1080;&#1103; &#1085;&#1077; &#1087;&#1077;&#1088;&#1077;&#1093;&#1086;&#1076;&#1103;&#1090; &#1082; &#1076;&#1088;&#1091;&#1075;&#1086;&#1084;&#1091; &#1072;&#1076;&#1088;&#1077;&#1089;&#1072;&#1090;&#1091;.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.2559" x="979.5" y="779.1387">&#1057;&#1077;&#1088;&#1074;&#1077;&#1088;&#1085;&#1072;&#1103; &#1072;&#1074;&#1090;&#1086;&#1088;&#1080;&#1079;&#1072;&#1094;&#1080;&#1103; &#1087;&#1088;&#1086;&#1074;&#1077;&#1088;&#1103;&#1077;&#1090;&#1089;&#1103; &#1086;&#1090;&#1076;&#1077;&#1083;&#1100;&#1085;&#1086;.</text></g><g class="entity" data-qualified-name="GMN74" data-source-line="110" id="ent0075"><path d="M1857.5,691.0986 L1857.5,812.6885 A4,4 0 0 0 1861.5,816.6885 L2222.8149,816.6885 A4,4 0 0 0 2226.8149,812.6885 L2226.8149,697.0986 L2216.8149,687.0986 L1924.6156,687.0986 L859.7293,726.9014 L1916.6156,687.0986 L1861.5,687.0986 A4,4 0 0 0 1857.5,691.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2216.8149,687.0986 L2216.8149,695.0986 A2,2 0 0 0 2218.8149,697.0986 L2226.8149,697.0986 L2216.8149,687.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="293.814" x="1863.5" y="704.2925">URL date/time &#1080;&#1084;&#1077;&#1077;&#1090; &#1087;&#1088;&#1080;&#1086;&#1088;&#1080;&#1090;&#1077;&#1090; &#1085;&#1072;&#1076; &#1095;&#1077;&#1088;&#1085;&#1086;&#1074;&#1080;&#1082;&#1086;&#1084;.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="342.3799" x="1863.5" y="719.2412">&#1057;&#1086;&#1093;&#1088;&#1072;&#1085;&#1105;&#1085;&#1085;&#1099;&#1081; slot &#1074;&#1086;&#1089;&#1089;&#1090;&#1072;&#1085;&#1072;&#1074;&#1083;&#1080;&#1074;&#1072;&#1077;&#1090;&#1089;&#1103; &#1085;&#1072; &#1080;&#1089;&#1093;&#1086;&#1076;&#1085;&#1091;&#1102; &#1076;&#1072;&#1090;&#1091;;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="327.5771" x="1863.5" y="734.1899">&#1080;&#1089;&#1095;&#1077;&#1079;&#1085;&#1091;&#1074;&#1096;&#1080;&#1081; slot &#1090;&#1088;&#1077;&#1073;&#1091;&#1077;&#1090; &#1085;&#1086;&#1074;&#1086;&#1075;&#1086; &#1074;&#1099;&#1073;&#1086;&#1088;&#1072; &#1076;&#1086; &#1086;&#1090;&#1087;&#1088;&#1072;&#1074;&#1082;&#1080;.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="338.2158" x="1863.5" y="749.1387">Request page aborts pending create/attachment mutations</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="311.4541" x="1863.5" y="764.0874">when navigation, logout or context switch unmounts it.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="320.125" x="1863.5" y="779.0361">Late FileReader completion cannot start an attachment.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="330.2178" x="1863.5" y="793.9849">Route id masks a stale cached provider profile; submitted</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="348.3149" x="1863.5" y="808.9336">request, step and summary state belong to one context only.</text></g><g class="entity" data-qualified-name="GMN77" data-source-line="120" id="ent0078"><path d="M1399,721.0986 L1399,782.8936 A4,4 0 0 0 1403,786.8936 L1835.1421,786.8936 A4,4 0 0 0 1839.1421,782.8936 L1839.1421,727.0986 L1829.1421,717.0986 L1552.3252,717.0986 L615.7046,726.9953 L1544.3252,717.0986 L140