2;&#1097;&#1077;&#1077; React application tree</text></g><!--cluster ??????--><g class="cluster" data-qualified-name="......" data-source-line="20" id="ent0016"><rect fill="none" height="470.5" rx="4" ry="4" style="stroke:#181818;stroke-width:1;" width="494" x="760" y="781.0986"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="50.5273" x="981.7363" y="795.2925">&#1044;&#1072;&#1085;&#1085;&#1099;&#1077;</text></g><!--entity Backend--><g class="entity" data-qualified-name="Backend" data-source-line="27" id="ent0022"><rect fill="#EAF1FB" height="34.9487" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="175.8159" x="1732" y="1201.0986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="155.8159" x="1742" y="1223.2925">Backend &#1095;&#1077;&#1088;&#1077;&#1079; /api rewrite</text></g><!--entity Mock--><g class="entity" data-qualified-name="Mock" data-source-line="28" id="ent0023"><rect fill="#EAF1FB" height="49.8975" rx="4" ry="4" style="stroke:#6585B5;stroke-width:0.5;" width="166.3008" x="1926" y="1193.5986"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="146.3008" x="1936" y="1215.7925">MSW browser + handlers</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="122.0908" x="1936" y="1230.7412">&#1090;&#1086;&#1083;&#1100;&#1082;&#1086; mock runtime</text></g><g class="entity" data-qualified-name="GMN48" data-source-line="54" id="ent0049"><path d="M2110,1165.0986 L2110,1214.5986 L2092.2568,1218.5986 L2110,1222.5986 L2110,1271.7397 A4,4 0 0 0 2114,1275.7397 L2494.0913,1275.7397 A4,4 0 0 0 2498.0913,1271.7397 L2498.0913,1171.0986 L2488.0913,1161.0986 L2114,1161.0986 A4,4 0 0 0 2110,1165.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M2488.0913,1161.0986 L2488.0913,1169.0986 A2,2 0 0 0 2490.0913,1171.0986 L2498.0913,1171.0986 L2488.0913,1161.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="367.0913" x="2116" y="1178.2925">Super-admin private request chats stay out of the subject index.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="364.1714" x="2116" y="1193.2412">Direct emergency read resolves the thread by ID with a reason;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="283.2705" x="2116" y="1208.1899">report parties are denied even after case closure.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="299.8569" x="2116" y="1223.1387">The request-to-chat shortcut rejects privileged roles.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="359.125" x="2116" y="1238.0874">Participant block creation reuses only an active ordinary block;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="355.5259" x="2116" y="1253.0361">a report sanction keeps its case link and appeal-only removal.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="307.8042" x="2116" y="1267.9849">Mock behavior is a UI contract, not security evidence.</text></g><g class="entity" data-qualified-name="GMN51" data-source-line="63" id="ent0052"><path d="M1262,1165.0986 L1262,1271.7397 A4,4 0 0 0 1266,1275.7397 L1709.6313,1275.7397 A4,4 0 0 0 1713.6313,1271.7397 L1713.6313,1171.0986 L1703.6313,1161.0986 L1370.1178,1161.0986 L954.1629,1105.34 L1362.1178,1161.0986 L1266,1161.0986 A4,4 0 0 0 1262,1165.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1703.6313,1161.0986 L1703.6313,1169.0986 A2,2 0 0 0 1705.6313,1171.0986 L1713.6313,1171.0986 L1703.6313,1161.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="275.2979" x="1268" y="1178.2925">catalog / providers / requests / chat / workspace</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="332.3823" x="1268" y="1193.2412">resources / reviews / bonuses / governance / marketplace</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="350.0542" x="1268" y="1208.1899">&#1060;&#1072;&#1073;&#1088;&#1080;&#1082;&#1080; &#8212; &#1087;&#1077;&#1088;&#1074;&#1099;&#1081; &#1072;&#1076;&#1088;&#1077;&#1089; &#1087;&#1086;&#1080;&#1089;&#1082;&#1072; endpoint implementation.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="363.3779" x="1268" y="1223.1387">N27: CI &#1085;&#1072;&#1093;&#1086;&#1076;&#1080;&#1090; 10 &#1079;&#1072;&#1088;&#1077;&#1075;&#1080;&#1089;&#1090;&#1088;&#1080;&#1088;&#1086;&#1074;&#1072;&#1085;&#1085;&#1099;&#1093; factories &#1095;&#1077;&#1088;&#1077;&#1079; AST</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="356.4907" x="1268" y="1238.0874">&#1080; &#1087;&#1088;&#1086;&#1074;&#1077;&#1088;&#1103;&#1077;&#1090; transformResponse &#1091; &#1082;&#1072;&#1078;&#1076;&#1086;&#1075;&#1086; domain endpoint.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="430.6313" x="1268" y="1253.0361">Private attachment response keeps JSON MFA errors for baseApi step-up;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="325.876" x="1268" y="1267.9849">successful image response remains a Blob / object URL.</text></g><g class="entity" data-qualified-name="GMN54" data-source-line="72" id="ent0055"><path d="M1262,800.0986 L1262,861.8936 A4,4 0 0 0 1266,865.8936 L1587.5469,865.8936 A4,4 0 0 0 1591.5469,861.8936 L1591.5469,806.0986 L1581.5469,796.0986 L1361.8881,796.0986 L614.4794,805.9755 L1353.8881,796.0986 L1266,796.0986 A4,4 0 0 0 1262,800.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1581.5469,796.0986 L1581.5469,804.0986 A2,2 0 0 0 1583.5469,806.0986 L1591.5469,806.0986 L1581.5469,796.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="308.5469" x="1268" y="813.2925">N23: client/owner request screens read cursor pages.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="291.2305" x="1268" y="828.2412">Only requested pages are kept in the screen state;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="182.8442" x="1268" y="843.1899">older requests load on demand.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="302.0278" x="1268" y="858.1387">Counts are marked partial while more pages remain.</text></g><g class="entity" data-qualified-name="GMN57" data-source-line="78" id="ent0058"><path d="M1597,274.0986 L1597,286.0986 L1579.1406,290.0986 L1597,294.0986 L1597,305.9961 A4,4 0 0 0 1601,309.9961 L1928.5454,309.9961 A4,4 0 0 0 1932.5454,305.9961 L1932.5454,280.0986 L1922.5454,270.0986 L1601,270.0986 A4,4 0 0 0 1597,274.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1922.5454,270.0986 L1922.5454,278.0986 A2,2 0 0 0 1924.5454,280.0986 L1932.5454,280.0986 L1922.5454,270.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="228.3252" x="1603" y="287.2925">Vite &#8212; compatibility/development entry.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="314.5454" x="1603" y="302.2412">&#1056;&#1077;&#1072;&#1083;&#1100;&#1085;&#1099;&#1081; production graph &#1080;&#1089;&#1082;&#1083;&#1102;&#1095;&#1072;&#1077;&#1090; MSW fixtures.</text></g><g class="entity" data-qualified-name="GMN60" data-source-line="82" id="ent0061"><path d="M761.5,475.0986 L761.5,521.9448 A4,4 0 0 0 765.5,525.9448 L1144.7725,525.9448 A4,4 0 0 0 1148.7725,521.9448 L1148.7725,481.0986 L1138.7725,471.0986 L873.9566,471.0986 L435.5046,473.5372 L865.9566,471.0986 L765.5,471.0986 A4,4 0 0 0 761.5,475.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1138.7725,471.0986 L1138.7725,479.0986 A2,2 0 0 0 1140.7725,481.0986 L1148.7725,481.0986 L1138.7725,471.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="264.7163" x="767.5" y="488.2925">N34: SEO lifecycle &#1078;&#1080;&#1074;&#1105;&#1090; &#1074;&#1099;&#1096;&#1077; &#1074;&#1089;&#1077;&#1093; layouts.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="366.2725" x="767.5" y="503.2412">Auth SSR &#1080; client navigation &#1080;&#1089;&#1087;&#1086;&#1083;&#1100;&#1079;&#1091;&#1102;&#1090; &#1086;&#1073;&#1097;&#1080;&#1077; copy/noindex;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="331.6016" x="767.5" y="518.1899">provider-specific metadata &#1089;&#1086;&#1093;&#1088;&#1072;&#1085;&#1103;&#1077;&#1090;&#1089;&#1103; &#1087;&#1086;&#1089;&#1083;&#1077; hydration.</text></g><g class="entity" data-qualified-name="GMN63" data-source-line="87" id="ent0064"><path d="M1262.5,924.0986 L1262.5,1000.8423 A4,4 0 0 0 1266.5,1004.8423 L1607.5342,1004.8423 A4,4 0 0 0 1611.5342,1000.8423 L1611.5342,930.0986 L1601.5342,920.0986 L1345.7415,920.0986 L675.8851,937.5778 L1337.7415,920.0986 L1266.5,920.0986 A4,4 0 0 0 1262.5,924.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1601.5342,920.0986 L1601.5342,928.0986 A2,2 0 0 0 1603.5342,930.0986 L1611.5342,930.0986 L1601.5342,920.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="328.0342" x="1268.5" y="937.2925">Admin CSV transport keeps 403 JSON error codes intact</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="319.395" x="1268.5" y="952.2412">for the shared MFA step-up dialog; 200 remains a Blob.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="299.5078" x="1268.5" y="967.1899">N33: parsing/timeout/5xx &#1080; SyntaxError &#1085;&#1077; &#1074;&#1099;&#1074;&#1086;&#1076;&#1103;&#1090;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="324.1621" x="1268.5" y="982.1387">raw response &#1074; UI. &#1051;&#1086;&#1082;&#1072;&#1083;&#1080;&#1079;&#1086;&#1074;&#1072;&#1085;&#1085;&#1086;&#1077; &#1089;&#1086;&#1086;&#1073;&#1097;&#1077;&#1085;&#1080;&#1077; &#1080; retry</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="272.7397" x="1268.5" y="997.0874">&#1089;&#1086;&#1093;&#1088;&#1072;&#1085;&#1103;&#1102;&#1090; &#1087;&#1086;&#1085;&#1103;&#1090;&#1085;&#1099;&#1081; &#1089;&#1094;&#1077;&#1085;&#1072;&#1088;&#1080;&#1081; &#1087;&#1088;&#1080; &#1089;&#1073;&#1086;&#1077; API.</text></g><g class="entity" data-qualified-name="GMN66" data-source-line="94" id="ent0067"><path d="M1143.5,671.0986 L1143.5,732.8936 A4,4 0 0 0 1147.5,736.8936 L1546.0947,736.8936 A4,4 0 0 0 1550.0947,732.8936 L1550.0947,677.0986 L1540.0947,667.0986 L1248.0468,667.0986 L663.7924,677.0181 L1240.0468,667.0986 L1147.5,667.0986 A4,4 0 0 0 1143.5,671.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><path d="M1540.0947,667.0986 L1540.0947,675.0986 A2,2 0 0 0 1542.0947,677.0986 L1550.0947,677.0986 L1540.0947,667.0986" fill="#FFF7DE" style="stroke:#C8A552;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="349.959" x="114